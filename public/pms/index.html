nance** | 02, 06 | 09, 15, 20, 22 | 13, 23 |\n\n## Tools on this page\n\n- **Search** (top, or press `/`): searches inside every doc and jumps straight to the section\n- **Language**: switch between বাংলা and English at any time (top of the sidebar); the guide remembers your choice\n- **Diagrams:** zoom (+/−), reset, **fullscreen**, SVG/PNG download above every diagram. In fullscreen: mouse wheel/pinch to zoom, drag to pan, keyboard `+` `−` `0` `Esc`\n- **Wide tables:** open them fullscreen\n- **Contents:** each doc's section list (right side on large screens), highlighted as you read\n- **Glossary tooltips:** hover/tap dotted-underlined words to see the definition; the full list is on the Glossary page\n- **Code:** copy button and syntax colours\n- **Quizzes:** at the end of every doc; scores are saved\n- **Flashcards & glossary list:** practise terms (sidebar → Practice)\n- **Progress:** mark docs as read — ✓ in the sidebar, percentage at the top\n- **Notes:** your own notes per doc (stored in this browser only)\n- **Print/PDF:** one doc, or \"All docs on one page\" then the browser's Print → Save as PDF\n- **Font size and theme:** at the bottom of the sidebar\n\n## Keyboard shortcuts\n\n| Key | Action |\n|---|---|\n| `/` or `Ctrl+K` | Search |\n| `←` / `→` | Previous / next doc |\n| `Esc` | Close search/fullscreen |\n| `?` | Shortcut help |\n\n## Verification marks\n✔ = public source found · ◐ = partial/known, verify yourself · ✖ = not verified. Laws, taxes and vendor claims change over time — check official sources before deciding (doc 28).\n"}, "1": {"n": 1, "title": "০১ — PMS ফান্ডামেন্টালস (PMS Fundamentals)", "md": "# ০১ — PMS ফান্ডামেন্টালস (PMS Fundamentals)\n\n> লক্ষ্য: PMS কী, কেন আছে, হোটেলের ভেতরে কীভাবে কাজ করে — বুঝে যাওয়া। পরের সব ডকের ভিত্তি।\n> নোট: কোড, API, টেবিল/ফিল্ড নাম ইংরেজিতে রাখা হয়েছে।\n\n---\n\n## ১. PMS কী?\n\n**Property Management System (PMS)** = হোটেলের দৈনন্দিন অপারেশন চালানোর মূল সফটওয়্যার। রুম, গেস্ট, বুকিং, বিল, হাউসকিপিং — সব এক জায়গায় ট্র্যাক করে।\n\nসহজ কথায়: **হোটেলের \"মস্তিষ্ক\" এবং \"খাতা\"**। রুম খালি আছে কি না, কে কোন রুমে, কত বিল বাকি — PMS জানে।\n\n### কেন আছে (Why it exists)\n\nPMS না থাকলে (খাতা/এক্সেল):\n\n- একই রুম দুইজনকে বিক্রি (double booking)\n- বিল ভুল, টাকা হারানো, চুরি ধরা কঠিন\n- হাউসকিপিং জানে না কোন রুম পরিষ্কার করবে\n- ম্যানেজার জানে না আজ কত আয় হলো\n- অডিট/ট্যাক্স রিপোর্ট বানাতে দিন লাগে\n\nPMS এগুলো ঠিক করে: **একটাই সত্য উৎস (single source of truth)**।\n\n### স্টাফ কীভাবে ব্যবহার করে\n\n| ভূমিকা | PMS-এ কী করে |\n|---|---|\n| Receptionist | বুকিং, check-in, check-out, বিল |\n| Reservation agent | বুকিং নেয়, বদলায়, ক্যানসেল করে |\n| Housekeeping supervisor | রুমের স্ট্যাটাস, কাজ বণ্টন |\n| Cashier / Accountant | পেমেন্ট, রিফান্ড, night audit |\n| Revenue manager | রেট, availability, restriction |\n| GM / Owner | রিপোর্ট, occupancy, revenue |\n| Maintenance | রুম অচল (out of order) মার্ক, কাজের টিকেট |\n\n---\n\n## ২. PMS কীভাবে কাজ করে (বড় ছবি)\n\nPMS তিনটি জিনিস সামলায়:\n\n1. **Inventory** — কোন রাতে কয়টা রুম বিক্রির জন্য আছে\n2. **Guest + Booking** — কে, কখন, কোন রুম, কত দামে\n3. **Money (Folio/Ledger)** — কী চার্জ হলো, কী পেমেন্ট এলো\n\n```mermaid\nflowchart LR\n    G[Guest / OTA / Walk-in] --> R[Reservation]\n    R --> I[Inventory কমে]\n    R --> CI[Check-in]\n    CI --> F[Folio খোলে]\n    F --> C[Charges: Room, Food, Laundry]\n    C --> CO[Check-out]\n    CO --> P[Payment + Invoice]\n    P --> NA[Night Audit]\n    NA --> RP[Reports / Ledger]\n```\n\n### PMS ইকোসিস্টেম (আশেপাশের সিস্টেম)\n\nPMS একা থাকে না। চারপাশে অনেক সিস্টেম:\n\n```mermaid\nflowchart TB\n    PMS((PMS))\n    BE[Booking Engine<br/>নিজের ওয়েবসাইট] <--> PMS\n    CM[Channel Manager] <--> PMS\n    CM <--> OTA[OTA: Booking.com, Expedia, Agoda]\n    CM <--> GDS[GDS: Sabre, Amadeus, Travelport]\n    POS[POS: Restaurant, Bar, Spa] --> PMS\n    PG[Payment Gateway / MFS] <--> PMS\n    ACC[Accounting: Tally, QuickBooks, Xero] <-- PMS\n    RMS[Revenue Management System] <--> PMS\n    LOCK[Door Lock System] <--> PMS\n    CRM[CRM / Email / SMS] <--> PMS\n    PBX[Telephone / PBX] --> PMS\n```\n\n| সিস্টেম | কাজ |\n|---|---|\n| **Booking Engine (BE)** | হোটেলের নিজের সাইটে সরাসরি বুকিং |\n| **Channel Manager (CM)** | একসাথে সব OTA-তে রেট/availability পাঠায়, বুকিং আনে |\n| **OTA** | Online Travel Agency — Booking.com, Agoda ইত্যাদি। কমিশন নেয় |\n| **GDS** | Global Distribution System — ট্রাভেল এজেন্ট/কর্পোরেট বুকিং চ্যানেল |\n| **POS** | Point of Sale — রেস্টুরেন্ট বিল রুমে পোস্ট করে |\n| **RMS** | Revenue Management System — দাম অপ্টিমাইজ করে |\n| **Payment Gateway** | কার্ড/MFS পেমেন্ট |\n| **Door Lock** | check-in হলে কী কার্ড বানায় |\n\n---\n\n## ৩. মূল ধারণা (Core Concepts)\n\n### ৩.১ Property\nএকটি হোটেল/রিসোর্ট = একটি property। Chain হলে অনেক property।\n**Multi-property**: এক PMS-এ অনেক হোটেল (বিস্তারিত ডক ১৪, ১২)।\n\n### ৩.২ Room Type বনাম Room\n- **Room Type**: ক্যাটাগরি (Deluxe King, Standard Twin)। **বিক্রি হয় এটাই।**\n- **Room**: ফিজিক্যাল রুম (রুম 301)। **check-in-এ বরাদ্দ হয়।**\n\nবুকিংয়ের সময় সাধারণত Room Type বিক্রি হয়, রুম নম্বর পরে (late assignment)।\n\n### ৩.৩ Rate Plan\nএকই room type-এর ভিন্ন দাম/শর্ত: Bed & Breakfast, Non-refundable, Corporate, Weekend। (ডক ০৬)\n\n### ৩.৪ Reservation (Booking)\nগেস্ট এবং থাকার তারিখ, room type, রেট, শর্ত — এর চুক্তি। (ডক ০৪)\n\n### ৩.৫ Stay / Folio\n- **Stay**: গেস্ট আসলেই হোটেলে আছে (check-in হয়েছে)।\n- **Folio**: গেস্টের বিলের খাতা। চার্জ (debit) আর পেমেন্ট (credit) জমা হয়। (ডক ০৭, ০৯)\n\n### ৩.৬ Business Date (খুব গুরুত্বপূর্ণ)\n**ক্যালেন্ডারের তারিখ ≠ হোটেলের Business Date।**\n\nরাত ২টায় ক্যালেন্ডারে নতুন দিন, কিন্তু night audit চালানো পর্যন্ত হোটেলের business date আগের দিনই থাকে। রাত ২টার পেমেন্ট আগের দিনের হিসাবে যায়।\n\n> ইঞ্জিনিয়ার সতর্কতা: `NOW()` দিয়ে \"আজকের তারিখ\" ধরলে ভুল। সবসময় `property.business_date` ব্যবহার করো।\n\n### ৩.৭ Night Audit\nদিন শেষে সিস্টেম বন্ধ করা: রুম চার্জ পোস্ট, no-show প্রসেস, ব্যালেন্স যাচাই, business date আগানো। (ডক ০৯)\n\n### ৩.৮ Posting\nFolio-তে চার্জ/পেমেন্ট এন্ট্রি করাকে \"posting\" বলে। Ledger append-only: ভুল হলে মুছো না, **reversal/adjustment** দাও।\n\n### ৩.৯ Inventory ও Availability\n- **Inventory**: মোট বিক্রয়যোগ্য রুম\n- **Availability** = Inventory − বুকড − blocked − out-of-inventory (ডক ০৫)\n\n---\n\n## ৪. মূল টার্মিনোলজি (দ্রুত তালিকা)\n\n| টার্ম | অর্থ |\n|---|---|\n| Arrival / Departure | আগমন / প্রস্থান |\n| ADR | Average Daily Rate = রুম রেভিনিউ ÷ বিক্রিত রুম |\n| Occupancy | বিক্রিত রুম ÷ মোট বিক্রয়যোগ্য রুম |\n| RevPAR | Revenue Per Available Room = রুম রেভিনিউ ÷ মোট রুম |\n| Walk-in | বুকিং ছাড়া সরাসরি আসা |\n| No-show | বুকিং ছিল, আসেনি |\n| Overbooking | ইচ্ছাকৃতভাবে ক্যাপাসিটির বেশি বিক্রি |\n| Folio | গেস্ট বিল |\n| City Ledger / AR | ক্রেডিটে থাকা কোম্পানির বিল |\n| Pax | গেস্ট সংখ্যা |\n| BAR | Best Available Rate |\n| Rack Rate | সাধারণ/প্রকাশিত রেট (ছাড়ের আগে) |\n| Comp | বিনামূল্যে রুম |\n| OOO | Out of Order — মেরামতে, ইনভেন্টরি থেকে বাদ |\n| OOS | Out of Service — সাময়িক অনুপলব্ধ |\n| Hold / Block | রুম আটকে রাখা |\n\nপূর্ণ গ্লসারি: \"গ্লসারি\" পাতা (সাইডবার → অনুশীলন)।\n\n---\n\n## ৫. PMS-এর প্রধান মডিউল\n\n```mermaid\nmindmap\n  root((PMS))\n    Front Office\n      Check-in/out\n      Room assignment\n      Guest registration\n    Reservations\n      Booking\n      Group\n      Waitlist\n    Rooms\n      Types\n      Inventory\n      Status\n    Rates\n      Plans\n      Restrictions\n      Taxes\n    Folio & Billing\n      Charges\n      Payments\n      Invoice\n    Housekeeping\n      Tasks\n      Inspection\n    Maintenance\n    Night Audit\n    Reports\n    Integrations\n    Admin\n      Users\n      Roles\n      Audit log\n```\n\n---\n\n## ৬. উদাহরণ দৃশ্য (Example Scenario)\n\n**হোটেল সূর্যোদয়, ঢাকা।** ৫০ রুম। Deluxe ২০টি।\n\n১. রাহিম ১০ তারিখ ১২-১৪ তারিখের জন্য Deluxe বুক করলেন, Booking.com থেকে।\n২. Channel Manager বুকিং আনল → PMS-এ Reservation তৈরি → Deluxe availability ১২, ১৩ রাতে ১ কমল → CM সব OTA-তে নতুন availability পাঠাল।\n৩. ১২ তারিখ রাহিম এলেন। Receptionist রুম ৩০২ বরাদ্দ করল, ID নিল, check-in করল। Folio খুলল।\n৪. রেস্টুরেন্টে খাবার → POS রুম ৩০২ folio-তে পোস্ট করল।\n৫. রাতে night audit: রুম চার্জ + ট্যাক্স folio-তে পোস্ট।\n৬. ১৪ তারিখ check-out: ফাইনাল বিল, পেমেন্ট, invoice, রুম \"Dirty\" → হাউসকিপিং টাস্ক তৈরি।\n\n---\n\n## ৭. গুরুত্বপূর্ণ এজ কেস (শুরুতেই জানো)\n\n- দুই রিসেপশনিস্ট একই সময়ে একই শেষ রুম বিক্রি করলে → **concurrency control** (ডক ০৫)।\n- Check-out-এর পর folio বদলানো → অনুমতি লাগবে, audit log।\n- Business date ও server time আলাদা timezone-এ।\n- ইন্টারনেট গেলে? Offline mode কতটুকু চলবে (ডক ০২)।\n- গেস্ট প্রোফাইল ডুপ্লিকেট (একই মানুষের ৩টি প্রোফাইল)।\n\n---\n\n## ৮. ডাটাবেস এনটিটি (হাই-লেভেল)\n\n`property`, `room_type`, `room`, `rate_plan`, `reservation`, `reservation_room` (stay), `guest`, `folio`, `folio_line` (charge/payment), `housekeeping_task`, `user`, `role`, `audit_log`, `night_audit_run`।\n\nবিস্তারিত স্কিমা: ডক ১২।\n\n## ৯. মূল API অপারেশন (হাই-লেভেল)\n\n```\nGET    /properties/{id}/availability?from=&to=&adults=\nPOST   /reservations\nPATCH  /reservations/{id}\nPOST   /reservations/{id}/check-in\nPOST   /reservations/{id}/check-out\nPOST   /folios/{id}/charges\nPOST   /folios/{id}/payments\nPOST   /night-audit/run\n```\n\n## ১০. ফ্রন্টএন্ড স্ক্রিন (হাই-লেভেল)\n\nDashboard, Reservation Calendar (Tape Chart), Reservation Form, Arrivals/Departures list, In-house list, Room Rack (স্ট্যাটাস বোর্ড), Folio screen, Housekeeping board, Reports, Settings।\n\n---\n\n## ১১. আধুনিক PMS কীভাবে বানায়\n\n- **Cloud, multi-tenant, web-based** (পুরনো ডেস্কটপ/অন-প্রেম সার্ভার নয়)\n- **API-first**: সব ফিচার API দিয়ে, তৃতীয় পক্ষ ইন্টিগ্রেশন সহজ\n- **Event-driven**: `reservation.created`, `guest.checked_in` ইত্যাদি ইভেন্ট → webhook/queue\n- **Append-only ledger**, সম্পূর্ণ audit trail\n- মোবাইল-ফ্রেন্ডলি (হাউসকিপিং অ্যাপ, ট্যাবলেট check-in)\n\n## ১২. সাধারণ ভুল (Beginner Pitfalls)\n\n1. Room type আর room গুলিয়ে ফেলা\n2. `NOW()` দিয়ে business date ধরা\n3. Folio-র টাকা mutable রাখা (UPDATE/DELETE করা)\n4. Availability সংরক্ষিত কাউন্টার হিসেবে রাখা ও sync না রাখা\n5. Timezone ভুল (UTC বনাম property local)\n6. গেস্ট ডেটা (ID, ফোন) সুরক্ষা না করা\n", "title_en": "01 — PMS Fundamentals", "md_en": "# 01 — PMS Fundamentals\n\n> Goal: understand what a PMS is, why it exists and how it works inside a hotel. Every later doc builds on this.\n> Note: code, API, table and field names are kept in English.\n\n---\n\n## 1. What is a PMS?\n\n**Property Management System (PMS)** = the core software that runs a hotel's daily operations. Rooms, guests, bookings, bills, housekeeping — all tracked in one place.\n\nIn plain words: **the hotel's \"brain\" and \"ledger book\"**. Is a room free? Who is in which room? How much is owed? The PMS knows.\n\n### Why it exists\n\nWithout a PMS (paper register / Excel):\n\n- The same room gets sold to two people (double booking)\n- Bills are wrong, money leaks, theft is hard to catch\n- Housekeeping does not know which rooms to clean\n- The manager does not know today's revenue\n- Audit and tax reports take days\n\nA PMS fixes this with **one single source of truth**.\n\n### How staff use it\n\n| Role | What they do in the PMS |\n|---|---|\n| Receptionist | Bookings, check-in, check-out, billing |\n| Reservation agent | Takes, modifies and cancels bookings |\n| Housekeeping supervisor | Room status, task assignment |\n| Cashier / Accountant | Payments, refunds, night audit |\n| Revenue manager | Rates, availability, restrictions |\n| GM / Owner | Reports, occupancy, revenue |\n| Maintenance | Marks rooms out of order, work tickets |\n\n---\n\n## 2. How a PMS works (big picture)\n\nA PMS manages three things:\n\n1. **Inventory** — how many rooms are for sale on each night\n2. **Guest + Booking** — who, when, which room, at what price\n3. **Money (Folio/Ledger)** — what was charged, what was paid\n\n```mermaid\nflowchart LR\n    G[Guest / OTA / Walk-in] --> R[Reservation]\n    R --> I[Inventory decreases]\n    R --> CI[Check-in]\n    CI --> F[Folio opens]\n    F --> C[Charges: Room, Food, Laundry]\n    C --> CO[Check-out]\n    CO --> P[Payment + Invoice]\n    P --> NA[Night Audit]\n    NA --> RP[Reports / Ledger]\n```\n\n### The PMS ecosystem (surrounding systems)\n\nA PMS never works alone:\n\n```mermaid\nflowchart TB\n    PMS((PMS))\n    BE[Booking Engine<br/>hotel website] <--> PMS\n    CM[Channel Manager] <--> PMS\n    CM <--> OTA[OTA: Booking.com, Expedia, Agoda]\n    CM <--> GDS[GDS: Sabre, Amadeus, Travelport]\n    POS[POS: Restaurant, Bar, Spa] --> PMS\n    PG[Payment Gateway / MFS] <--> PMS\n    ACC[Accounting: Tally, QuickBooks, Xero] <-- PMS\n    RMS[Revenue Management System] <--> PMS\n    LOCK[Door Lock System] <--> PMS\n    CRM[CRM / Email / SMS] <--> PMS\n    PBX[Telephone / PBX] --> PMS\n```\n\n| System | Job |\n|---|---|\n| **Booking Engine (BE)** | Direct bookings on the hotel's own website |\n| **Channel Manager (CM)** | Pushes rates/availability to all OTAs at once, pulls bookings in |\n| **OTA** | Online Travel Agency — Booking.com, Agoda etc. Charges commission |\n| **GDS** | Global Distribution System — travel agent / corporate booking channel |\n| **POS** | Point of Sale — posts restaurant bills to the room |\n| **RMS** | Revenue Management System — optimises prices |\n| **Payment Gateway** | Card / mobile-wallet (MFS) payments |\n| **Door Lock** | Encodes key cards at check-in |\n\n---\n\n## 3. Core concepts\n\n### 3.1 Property\nOne hotel/resort = one property. A chain has many properties.\n**Multi-property**: many hotels in one PMS (details in docs 12 and 13).\n\n### 3.2 Room Type vs Room\n- **Room Type**: a category (Deluxe King, Standard Twin). **This is what gets sold.**\n- **Room**: a physical room (room 301). **Assigned at check-in.**\n\nAt booking time a room type is usually sold; the room number comes later (late assignment).\n\n### 3.3 Rate Plan\nDifferent prices/conditions for the same room type: Bed & Breakfast, Non-refundable, Corporate, Weekend. (Doc 06)\n\n### 3.4 Reservation (Booking)\nThe agreement between the guest and the hotel: dates, room type, rate and conditions. (Doc 04)\n\n### 3.5 Stay / Folio\n- **Stay**: the guest is actually in the hotel (checked in).\n- **Folio**: the guest's bill. Charges (debits) and payments (credits) accumulate on it. (Docs 07, 09)\n\n### 3.6 Business Date (very important)\n**Calendar date ≠ hotel business date.**\n\nAt 2 a.m. the calendar shows a new day, but the hotel's business date stays on the previous day until night audit runs. A payment taken at 2 a.m. belongs to the previous day.\n\n> Engineer warning: using `NOW()` as \"today\" is wrong. Always use `property.business_date`.\n\n### 3.7 Night Audit\nClosing the day: post room charges, process no-shows, verify balances, roll the business date forward. (Doc 09)\n\n### 3.8 Posting\nEntering a charge or payment on a folio is called \"posting\". The ledger is append-only: never delete a mistake — post a **reversal/adjustment**.\n\n### 3.9 Inventory and Availability\n- **Inventory**: total sellable rooms\n- **Availability** = Inventory − booked − blocked − out-of-inventory (Doc 05)\n\n---\n\n## 4. Key terminology (quick list)\n\n| Term | Meaning |\n|---|---|\n| Arrival / Departure | Guest coming in / leaving |\n| ADR | Average Daily Rate = room revenue ÷ rooms sold |\n| Occupancy | Rooms sold ÷ total sellable rooms |\n| RevPAR | Revenue Per Available Room = room revenue ÷ available rooms |\n| Walk-in | Guest who arrives without a booking |\n| No-show | Had a booking, did not arrive |\n| Overbooking | Deliberately selling more than capacity |\n| Folio | Guest bill |\n| City Ledger / AR | Company bills on credit |\n| Pax | Number of guests |\n| BAR | Best Available Rate |\n| Rack Rate | Standard published rate (before discounts) |\n| Comp | Complimentary (free) room |\n| OOO | Out of Order — under repair, removed from inventory |\n| OOS | Out of Service — temporarily unavailable |\n| Hold / Block | Rooms held back |\n\nFull glossary: the Glossary page (sidebar → Practice).\n\n---\n\n## 5. Main PMS modules\n\n```mermaid\nmindmap\n  root((PMS))\n    Front Office\n      Check-in/out\n      Room assignment\n      Guest registration\n    Reservations\n      Booking\n      Group\n      Waitlist\n    Rooms\n      Types\n      Inventory\n      Status\n    Rates\n      Plans\n      Restrictions\n      Taxes\n    Folio & Billing\n      Charges\n      Payments\n      Invoice\n    Housekeeping\n      Tasks\n      Inspection\n    Maintenance\n    Night Audit\n    Reports\n    Integrations\n    Admin\n      Users\n      Roles\n      Audit log\n```\n\n---\n\n## 6. Example scenario\n\n**Hotel Surjodoy, Dhaka.** 50 rooms, 20 of them Deluxe.\n\n1. On the 10th, Rahim books a Deluxe for the 12th–14th through Booking.com.\n2. The channel manager brings the booking in → a reservation is created in the PMS → Deluxe availability drops by 1 for the nights of the 12th and 13th → the CM pushes the new availability to every OTA.\n3. On the 12th Rahim arrives. The receptionist assigns room 302, takes his ID, checks him in. A folio opens.\n4. He eats at the restaurant → the POS posts the bill to room 302's folio.\n5. At night, night audit posts room charge + tax to the folio.\n6. Check-out on the 14th: final bill, payment, invoice, room becomes \"Dirty\" → a housekeeping task is created.\n\n---\n\n## 7. Important edge cases (know them early)\n\n- Two receptionists sell the same last room at the same moment → **concurrency control** (doc 05).\n- Changing a folio after check-out → needs permission and an audit log.\n- Business date and server time in different time zones.\n- Internet goes down? How much works offline (doc 02)?\n- Duplicate guest profiles (three profiles for the same person).\n\n---\n\n## 8. Database entities (high level)\n\n`property`, `room_type`, `room`, `rate_plan`, `reservation`, `reservation_room` (stay), `guest`, `folio`, `folio_line` (charge/payment), `housekeeping_task`, `user`, `role`, `audit_log`, `night_audit_run`.\n\nDetailed schema: doc 12.\n\n## 9. Main API operations (high level)\n\n```\nGET    /properties/{id}/availability?from=&to=&adults=\nPOST   /reservations\nPATCH  /reservations/{id}\nPOST   /reservations/{id}/check-in\nPOST   /reservations/{id}/check-out\nPOST   /folios/{id}/charges\nPOST   /folios/{id}/payments\nPOST   /night-audit/run\n```\n\n## 10. Front-end screens (high level)\n\nDashboard, Reservation Calendar (Tape Chart), Reservation Form, Arrivals/Departures list, In-house list, Room Rack (status board), Folio screen, Housekeeping board, Reports, Settings.\n\n---\n\n## 11. How modern PMSs are built\n\n- **Cloud, multi-tenant, web-based** (not old desktop / on-premise servers)\n- **API-first**: every feature available through an API, easy third-party integration\n- **Event-driven**: events such as `reservation.created`, `guest.checked_in` → webhooks/queues\n- **Append-only ledger** with a complete audit trail\n- Mobile-friendly (housekeeping app, tablet check-in)\n\n## 12. Common beginner pitfalls\n\n1. Mixing up room type and room\n2. Using `NOW()` as the business date\n3. Keeping folio amounts mutable (UPDATE/DELETE)\n4. Storing availability as a counter and letting it drift out of sync\n5. Time zone mistakes (UTC vs property local time)\n6. Not protecting guest data (ID, phone)\n"}, "2": {"n": 2, "title": "০২ — হোটেল ব্যবসায়িক ওয়ার্কফ্লো (Hotel Business Workflows)", "md": "# ০২ — হোটেল ব্যবসায়িক ওয়ার্কফ্লো (Hotel Business Workflows)\n\n> লক্ষ্য: হোটেল আসলে কীভাবে চলে বোঝা। ইঞ্জিনিয়ার ব্যবসা না বুঝলে ভুল সিস্টেম বানায়।\n\n---\n\n## ১. হোটেলের বিভাগ (Departments)\n\n```mermaid\nflowchart TB\n    GM[General Manager]\n    GM --> FO[Front Office]\n    GM --> HK[Housekeeping]\n    GM --> FB[Food & Beverage]\n    GM --> ENG[Maintenance / Engineering]\n    GM --> SM[Sales & Marketing]\n    GM --> RM[Revenue Management]\n    GM --> ACC[Accounts / Finance]\n    GM --> HR[HR]\n    GM --> SEC[Security]\n```\n\n| বিভাগ | PMS-এ প্রধান কাজ |\n|---|---|\n| Front Office | বুকিং, check-in/out, গেস্ট সার্ভিস, ক্যাশিয়ার |\n| Housekeeping | রুম পরিষ্কার, স্ট্যাটাস আপডেট, lost & found |\n| F&B | POS, রুম সার্ভিস, বিল রুমে পোস্ট |\n| Maintenance | মেরামত টিকেট, OOO |\n| Sales | কর্পোরেট/গ্রুপ কন্ট্রাক্ট, allotment |\n| Revenue Mgmt | রেট, restriction, forecast |\n| Accounts | ledger, AR, রিকনসিলিয়েশন, ট্যাক্স |\n\n---\n\n## ২. আয়ের উৎস (Revenue Streams)\n\n- **রুম রেভিনিউ** (প্রধান)\n- F&B (রেস্টুরেন্ট, ব্যাংকোয়েট, রুম সার্ভিস)\n- ইভেন্ট/কনফারেন্স হল ভাড়া\n- স্পা, জিম, পুল\n- লন্ড্রি, ট্রান্সপোর্ট, ট্যুর\n- মিনিবার, ফোন\n- No-show / cancellation ফি\n\nPMS-এ প্রতিটি আয়ের জন্য **charge code / department / revenue group** থাকে, যাতে রিপোর্টে আলাদা করা যায়।\n\n---\n\n## ৩. মূল KPI (সূত্রসহ)\n\n```\nOccupancy %   = (বিক্রিত রুম রাত ÷ মোট বিক্রয়যোগ্য রুম রাত) × 100\nADR           = রুম রেভিনিউ ÷ বিক্রিত রুম রাত\nRevPAR        = রুম রেভিনিউ ÷ মোট বিক্রয়যোগ্য রুম রাত\n              = Occupancy × ADR\nGOPPAR        = Gross Operating Profit ÷ available rooms\n```\n\n**উদাহরণ:** ৫০ রুম, আজ ৩০টি বিক্রি, রুম রেভিনিউ ৯০,০০০ টাকা।\n- Occupancy = ৩০/৫০ = ৬০%\n- ADR = ৯০,০০০/৩০ = ৩,০০০\n- RevPAR = ৯০,০০০/৫০ = ১,৮০০ (অথবা ৬০% × ৩,০০০)\n\n> এজ কেস: OOO রুম হর (denominator) থেকে বাদ যাবে কি না — হোটেল/স্ট্যান্ডার্ড অনুযায়ী ঠিক করো এবং কনফিগারযোগ্য রাখো। Comp রুম, house-use রুম আলাদা ট্র্যাক করো।\n\n---\n\n## ৪. গেস্ট লাইফসাইকেল\n\n```mermaid\nflowchart LR\n    A[Discover<br/>খোঁজা] --> B[Book<br/>বুকিং]\n    B --> C[Pre-arrival<br/>কনফার্মেশন, ডিপোজিট]\n    C --> D[Arrival<br/>Check-in]\n    D --> E[In-house<br/>থাকা, সার্ভিস, চার্জ]\n    E --> F[Departure<br/>Check-out, পেমেন্ট]\n    F --> G[Post-stay<br/>রিভিউ, ফলোআপ]\n    G -.রিপিট.-> A\n```\n\nপ্রতিটি ধাপের PMS কাজ:\n\n| ধাপ | কী ঘটে | PMS ডেটা |\n|---|---|---|\n| Book | রুম/রেট সিলেক্ট, গেস্ট তথ্য | reservation, guest |\n| Pre-arrival | কনফার্মেশন ইমেইল/SMS, ডিপোজিট | notification, payment |\n| Arrival | ID যাচাই, রুম বরাদ্দ, কী | registration, stay, folio |\n| In-house | charge পোস্ট, রুম মুভ, সার্ভিস রিকোয়েস্ট | folio_line, task |\n| Departure | বিল, পেমেন্ট, invoice | invoice, payment |\n| Post-stay | feedback, loyalty | guest history |\n\n---\n\n## ৫. একটি দিনের প্রবাহ (Typical Day)\n\n| সময় (আনুমানিক) | কাজ |\n|---|---|\n| সকাল | Departures প্রসেস, check-out, রুম Dirty হয় |\n| সকাল-দুপুর | Housekeeping রুম পরিষ্কার → Inspected → Clean |\n| দুপুর | Check-in শুরু (স্ট্যান্ডার্ড ১২-২টা), early check-in রিকোয়েস্ট |\n| বিকেল | Arrivals বাড়ে, রুম assign, upgrade সিদ্ধান্ত |\n| সন্ধ্যা | F&B চার্জ পোস্ট, ম্যানেজার রিপোর্ট |\n| রাত | Night audit, no-show প্রসেস, রুম চার্জ পোস্ট |\n\n**Shift handover:** ক্যাশিয়ার শিফট বদলে ক্যাশ গুনে (cashier shift close) রিপোর্ট দেয়। PMS-এ `cashier_shift` টেবিল দরকার: opening balance, collections, closing, variance।\n\n---\n\n## ৬. বুকিং উৎস ও চ্যানেল\n\n```mermaid\nflowchart LR\n    DIRECT[Direct: ফোন, ওয়াক-ইন, ওয়েবসাইট] --> PMS\n    OTA[OTA] --> PMS\n    GDS[GDS / Travel Agent] --> PMS\n    CORP[Corporate Contract] --> PMS\n    GROUP[Group / Event] --> PMS\n```\n\nপ্রতিটি বুকিংয়ে **source / channel / market segment** রাখো — কমিশন ও রিপোর্টের জন্য।\n\n- **Source**: কোথা থেকে (Booking.com, Walk-in)\n- **Market segment**: কোন ধরনের গেস্ট (Corporate, Leisure, Group, Government)\n- **Channel**: কোন পথ (Direct, OTA, GDS)\n\n---\n\n## ৭. ব্যবসায়িক নিয়ম যেগুলো PMS-এ কনফিগার হয়\n\n- Check-in / check-out সময় (যেমন ১৪:০০ / ১২:০০)\n- ক্যানসেল নীতি (কত ঘণ্টা আগে ফ্রি)\n- ডিপোজিট নীতি (প্রথম রাত, ১০০%, ইত্যাদি)\n- Child policy (বয়স, extra bed ফি)\n- Overbooking সীমা\n- Minimum stay, closed-to-arrival\n- ট্যাক্স ও সার্ভিস চার্জ নিয়ম\n- ইউজার অনুমতি (কে রিফান্ড/ডিসকাউন্ট দিতে পারে)\n\n> নীতি: **হার্ডকোড নয়, কনফিগারযোগ্য।** প্রতি property-র নিয়ম আলাদা।\n\n---\n\n## ৮. Offline / Online অপারেশনাল বিবেচনা\n\nবাংলাদেশসহ অনেক জায়গায় ইন্টারনেট/বিদ্যুৎ অস্থির হতে পারে। তাই:\n\n| পরিস্থিতি | ঝুঁকি | সমাধান |\n|---|---|---|\n| ইন্টারনেট নেই (cloud PMS) | কাজ বন্ধ | ব্যাকআপ ডেটা কানেকশন, offline-capable PWA, স্থানীয় read-only ক্যাশ |\n| বিদ্যুৎ নেই | সিস্টেম বন্ধ | UPS/জেনারেটর, কী কার্ড মেশিনের ব্যাকআপ |\n| OTA sync বিলম্ব | overbooking | availability push retry, stop-sell নিরাপত্তা বাফার |\n| ডাউনটাইমে পেপার ফর্ম | পরে ডেটা এন্ট্রি | \"downtime report\" প্রিন্ট: arrivals, in-house, departures |\n\n**ডাউনটাইম প্রস্তুতি (Contingency):**\n- প্রতিদিন (বা প্রতি কয়েক ঘণ্টা) in-house ও arrivals লিস্ট PDF/প্রিন্ট\n- পেপার registration card ও manual folio\n- পুনরায় অনলাইনে এলে ব্যাক-এন্ট্রি, backdated posting-এর জন্য অনুমতি ও audit log\n\n**ইঞ্জিনিয়ারিং ট্রেডঅফ:**\n- **Fully online**: সহজ, কিন্তু নেটওয়ার্ক নির্ভর\n- **Offline-first (local sync)**: জটিল (conflict resolution), কিন্তু টেকসই\n- মাঝামাঝি: ক্রিটিক্যাল রিড (in-house list) ক্যাশ, রাইট অনলাইনে কিউ\n\n---\n\n## ৯. Night Audit — সংক্ষিপ্ত ধারণা\n\n(বিস্তারিত ডক ০৯)\n- সব in-house রুমে রাতের চার্জ পোস্ট\n- No-show চিহ্নিত\n- ক্যাশিয়ার শিফট বন্ধ\n- ব্যালেন্স চেক (debit = credit)\n- Business date +১\n- ডেইলি রিপোর্ট জেনারেট\n\n```mermaid\nflowchart TD\n    S[Start Night Audit] --> V[Pre-checks: অসম্পূর্ণ check-in/out?]\n    V --> P[Post room & tax]\n    P --> N[Process no-shows]\n    N --> B[Balance check]\n    B --> R[Generate reports]\n    R --> D[Roll business date]\n    D --> E[Done]\n```\n\n---\n\n## ১০. সাধারণ ব্যবসায়িক ভুল (Pitfalls)\n\n1. **একই রেট সবার জন্য** — segment/channel অনুযায়ী পার্থক্য না রাখা\n2. **ডিপোজিট ট্র্যাক না করা** → রিফান্ড বিবাদ\n3. **Walk-in-কে সিস্টেমে না তোলা** → ইনভেন্টরি ভুল\n4. **Night audit বাদ দেওয়া/দেরি** → ভুল রিপোর্ট\n5. **House-use/comp আলাদা না করা** → ADR বিকৃত\n6. **কমিশন হিসাব ভুল** → OTA ইনভয়েসে অমিল\n7. **রুম স্ট্যাটাস আপডেট না করা** → Dirty রুমে গেস্ট\n\n---\n\n## ১১. সারসংক্ষেপ\n\n| ধারণা | মনে রাখো |\n|---|---|\n| Business date | night audit দিয়ে বদলায় |\n| Folio | append-only, reversal দিয়ে সংশোধন |\n| Source/Segment | রিপোর্ট ও কমিশনের জন্য আবশ্যক |\n| Config | নিয়ম কনফিগারযোগ্য |\n| Offline plan | ডাউনটাইম প্রস্তুতি রাখো |\n\n---\n\n## অতিরিক্ত: হোটেলের সম্পূরক ব্যবসায়িক বিভাগ ও PMS মডিউল\n\nএকটি আধুনিক PMS শুধু রুম নয়, পুরো প্রপার্টি চালায়। কোর PMS-এর পাশে সাধারণত এই **অ্যাড-অন মডিউলগুলো** থাকে:\n\n| মডিউল | কী করে | কোথায় বিস্তারিত |\n|---|---|---|\n| Restaurant / Bar POS | টেবিল, অর্ডার, KOT, বিল, রুমে চার্জ | ডক ০৯ |\n| Spa & Wellness | থেরাপিস্ট/কক্ষ শিডিউল, প্যাকেজ | ডক ০৫, ০৯ |\n| Events & Venues | কনফারেন্স/ব্যাংকোয়েট হল, BEO | ডক ০৪ |\n| Guest Activities / Tour desk | ট্যুর, পিকআপ বিক্রয় ও বিলিং | ডক ০৯ |\n| Staff & Rosters | শিফট, উপস্থিতি, ছুটি | ডক ০৮ |\n| Inventory & Purchasing | স্টোর, সাপ্লায়ার, রিঅর্ডার | ডক ০৮ |\n| Guest CRM & Campaigns | সেগমেন্ট, বার্তা, লয়ালটি | ডক ০৭ |\n| Owner reports | দৈনিক ইমেইল, KPI | ডক ১৫ |\n\n**প্রপার্টির ধরন অনুযায়ী পার্থক্য:** হোটেল, রিসোর্ট, গেস্ট হাউস, সার্ভিসড অ্যাপার্টমেন্ট, হোস্টেল (বেড-ভিত্তিক), ভ্যাকেশন রেন্টাল (ইউনিট-ভিত্তিক)। UI-র শব্দ (room/unit/bed) ও ইনভেন্টরি একক বদলায় — `property.type` দিয়ে (ডক ০৫, ১২)।\n\n**মডিউল চালু/বন্ধ:** SaaS-এ প্ল্যান অনুযায়ী প্রতি প্রপার্টিতে কোন মডিউল সক্রিয় — entitlement সার্ভিস (ডক ১৩)।\n", "title_en": "02 — Hotel Business Workflows", "md_en": "# 02 — Hotel Business Workflows\n\n> Goal: understand how a hotel actually runs. Engineers who do not understand the business build the wrong system.\n\n---\n\n## 1. Hotel departments\n\n```mermaid\nflowchart TB\n    GM[General Manager]\n    GM --> FO[Front Office]\n    GM --> HK[Housekeeping]\n    GM --> FB[Food & Beverage]\n    GM --> ENG[Maintenance / Engineering]\n    GM --> SM[Sales & Marketing]\n    GM --> RM[Revenue Management]\n    GM --> ACC[Accounts / Finance]\n    GM --> HR[HR]\n    GM --> SEC[Security]\n```\n\n| Department | Main work in the PMS |\n|---|---|\n| Front Office | Bookings, check-in/out, guest service, cashiering |\n| Housekeeping | Cleaning rooms, status updates, lost & found |\n| F&B | POS, room service, posting bills to rooms |\n| Maintenance | Repair tickets, OOO |\n| Sales | Corporate/group contracts, allotments |\n| Revenue Mgmt | Rates, restrictions, forecasts |\n| Accounts | Ledger, AR, reconciliation, tax |\n\n---\n\n## 2. Revenue streams\n\n- **Room revenue** (the main one)\n- F&B (restaurant, banquets, room service)\n- Event / conference hall rental\n- Spa, gym, pool\n- Laundry, transport, tours\n- Minibar, phone\n- No-show / cancellation fees\n\nEach revenue type has a **charge code / department / revenue group** in the PMS so that reports can separate them.\n\n---\n\n## 3. Key KPIs (with formulas)\n\n```\nOccupancy %   = (room nights sold ÷ total sellable room nights) × 100\nADR           = room revenue ÷ room nights sold\nRevPAR        = room revenue ÷ total sellable room nights\n              = Occupancy × ADR\nGOPPAR        = Gross Operating Profit ÷ available rooms\n```\n\n**Example:** 50 rooms, 30 sold today, room revenue BDT 90,000.\n- Occupancy = 30/50 = 60%\n- ADR = 90,000/30 = 3,000\n- RevPAR = 90,000/50 = 1,800 (or 60% × 3,000)\n\n> Edge case: whether OOO rooms are removed from the denominator depends on the hotel/standard — decide and keep it configurable. Track comp and house-use rooms separately.\n\n---\n\n## 4. Guest lifecycle\n\n```mermaid\nflowchart LR\n    A[Discover] --> B[Book]\n    B --> C[Pre-arrival<br/>confirmation, deposit]\n    C --> D[Arrival<br/>check-in]\n    D --> E[In-house<br/>stay, services, charges]\n    E --> F[Departure<br/>check-out, payment]\n    F --> G[Post-stay<br/>review, follow-up]\n    G -.repeat.-> A\n```\n\nPMS work at each stage:\n\n| Stage | What happens | PMS data |\n|---|---|---|\n| Book | Room/rate selection, guest details | reservation, guest |\n| Pre-arrival | Confirmation email/SMS, deposit | notification, payment |\n| Arrival | ID check, room assignment, key | registration, stay, folio |\n| In-house | Charge posting, room moves, service requests | folio_line, task |\n| Departure | Bill, payment, invoice | invoice, payment |\n| Post-stay | Feedback, loyalty | guest history |\n\n---\n\n## 5. A typical day\n\n| Time (approx.) | Work |\n|---|---|\n| Morning | Process departures, check-outs, rooms become Dirty |\n| Late morning | Housekeeping cleans → Inspected → Clean |\n| Noon | Check-ins begin (standard 12–2 pm), early check-in requests |\n| Afternoon | Arrivals peak, room assignment, upgrade decisions |\n| Evening | F&B charges posted, manager reports |\n| Night | Night audit, no-show processing, room charges posted |\n\n**Shift handover:** at shift change the cashier counts cash and reports (cashier shift close). The PMS needs a `cashier_shift` table: opening balance, collections, closing, variance.\n\n---\n\n## 6. Booking sources and channels\n\n```mermaid\nflowchart LR\n    DIRECT[Direct: phone, walk-in, website] --> PMS\n    OTA[OTA] --> PMS\n    GDS[GDS / Travel Agent] --> PMS\n    CORP[Corporate Contract] --> PMS\n    GROUP[Group / Event] --> PMS\n```\n\nStore **source / channel / market segment** on every booking — needed for commission and reporting.\n\n- **Source**: where it came from (Booking.com, Walk-in)\n- **Market segment**: what kind of guest (Corporate, Leisure, Group, Government)\n- **Channel**: which path (Direct, OTA, GDS)\n\n---\n\n## 7. Business rules configured in a PMS\n\n- Check-in / check-out times (e.g. 14:00 / 12:00)\n- Cancellation policy (free until how many hours before)\n- Deposit policy (first night, 100% etc.)\n- Child policy (age, extra-bed fee)\n- Overbooking limit\n- Minimum stay, closed-to-arrival\n- Tax and service charge rules\n- User permissions (who may give refunds/discounts)\n\n> Principle: **configurable, not hard-coded.** Every property's rules differ.\n\n---\n\n## 8. Offline / online operational considerations\n\nIn Bangladesh and many other places, internet and power can be unstable. So:\n\n| Situation | Risk | Solution |\n|---|---|---|\n| No internet (cloud PMS) | Work stops | Backup data connection, offline-capable PWA, local read-only cache |\n| No power | System down | UPS/generator, backup for the key-card encoder |\n| OTA sync delay | Overbooking | Availability push retry, stop-sell safety buffer |\n| Paper forms during downtime | Re-entry later | Printable \"downtime report\": arrivals, in-house, departures |\n\n**Downtime preparation (contingency):**\n- Daily (or every few hours) PDF/print of in-house and arrivals lists\n- Paper registration cards and manual folios\n- After coming back online: back-entry, with permission and audit log for backdated posting\n\n**Engineering trade-offs:**\n- **Fully online**: simple, but network-dependent\n- **Offline-first (local sync)**: complex (conflict resolution) but resilient\n- Middle ground: cache critical reads (in-house list), queue writes until online\n\n---\n\n## 9. Night audit — short version\n\n(Details in doc 09)\n- Post the night's charge for every in-house room\n- Mark no-shows\n- Close cashier shifts\n- Balance check (debits = credits)\n- Business date + 1\n- Generate daily reports\n\n```mermaid\nflowchart TD\n    S[Start Night Audit] --> V[Pre-checks: unfinished check-ins/outs?]\n    V --> P[Post room & tax]\n    P --> N[Process no-shows]\n    N --> B[Balance check]\n    B --> R[Generate reports]\n    R --> D[Roll business date]\n    D --> E[Done]\n```\n\n---\n\n## 10. Common business pitfalls\n\n1. **One rate for everyone** — no difference by segment/channel\n2. **Deposits not tracked** → refund disputes\n3. **Walk-ins not entered** → wrong inventory\n4. **Skipping or delaying night audit** → wrong reports\n5. **House-use/comp not separated** → distorted ADR\n6. **Wrong commission calculation** → mismatch with OTA invoices\n7. **Room status not updated** → guest sent to a dirty room\n\n---\n\n## 11. Summary\n\n| Concept | Remember |\n|---|---|\n| Business date | Changes with night audit |\n| Folio | Append-only, corrected by reversal |\n| Source/Segment | Required for reports and commission |\n| Config | Rules are configurable |\n| Offline plan | Be ready for downtime |\n\n---\n\n## Extra: supporting departments and PMS modules\n\nA modern PMS runs the whole property, not only rooms. Typical add-on modules alongside the core PMS:\n\n| Module | What it does | Details |\n|---|---|---|\n| Restaurant / Bar POS | Tables, orders, KOT, bills, charge to room | Doc 09 |\n| Spa & Wellness | Therapist/room schedules, packages | Docs 05, 09 |\n| Events & Venues | Conference/banquet halls, BEO | Doc 04 |\n| Guest Activities / Tour desk | Selling and billing tours, pickups | Doc 09 |\n| Staff & Rosters | Shifts, attendance, leave | Doc 08 |\n| Inventory & Purchasing | Store, suppliers, reorder | Doc 08 |\n| Guest CRM & Campaigns | Segments, messages, loyalty | Doc 07 |\n| Owner reports | Daily email, KPIs | Doc 15 |\n\n**Differences by property type:** hotel, resort, guest house, serviced apartment, hostel (bed-based), vacation rental (unit-based). UI wording (room/unit/bed) and the inventory unit change — driven by `property.type` (docs 05, 12).\n\n**Turning modules on/off:** in SaaS, which modules are active per property depends on the plan — an entitlement service (doc 13).\n"}, "3": {"n": 3, "title": "০৩ — ফ্রন্ট অফিস (Front Office)", "md": "# ০৩ — ফ্রন্ট অফিস (Front Office)\n\n> Front office = হোটেলের সামনের ডেস্ক। গেস্টের সাথে প্রথম ও শেষ যোগাযোগ। PMS-এর সবচেয়ে ব্যস্ত মডিউল।\n\n---\n\n## ১. ফ্রন্ট অফিসের কাজ\n\n- Arrivals / Departures ম্যানেজ\n- Check-in, check-out\n- Walk-in বুকিং\n- Room assignment, room move, upgrade\n- Early check-in, late check-out\n- গেস্ট রেজিস্ট্রেশন ও ID যাচাই\n- Key card ইস্যু\n- Folio দেখা, পেমেন্ট নেওয়া\n- গেস্ট রিকোয়েস্ট, কমপ্লেইন, মেসেজ\n- Shift handover, cashier close\n\n---\n\n## ২. Reservation / Stay স্ট্যাটাস\n\n```mermaid\nstateDiagram-v2\n    [*] --> Tentative\n    Tentative --> Confirmed\n    Confirmed --> CheckedIn: check-in\n    Confirmed --> Cancelled: cancel\n    Confirmed --> NoShow: না এলে (night audit)\n    CheckedIn --> CheckedOut: check-out\n    CheckedIn --> CheckedIn: room move\n    Cancelled --> [*]\n    NoShow --> [*]\n    CheckedOut --> [*]\n```\n\n(বিস্তারিত ডক ০৪)\n\n---\n\n## ৩. Check-in\n\n### মানে\nগেস্ট হোটেলে পৌঁছে আনুষ্ঠানিকভাবে থাকা শুরু। সিস্টেমে reservation → stay-এ রূপান্তর।\n\n### কেন দরকার\n- আইনি রেজিস্ট্রেশন (ID, জাতীয়তা)\n- রুম বরাদ্দ, কী ইস্যু\n- Folio খোলা, ডিপোজিট/authorization\n- রুম ইনভেন্টরিতে \"Occupied\" মার্ক\n\n### স্টাফ ওয়ার্কফ্লো\n\n```mermaid\nflowchart TD\n    A[Arrival list থেকে booking খোঁজো] --> B{রুম ready?<br/>Clean/Inspected}\n    B -- না --> B1[অপেক্ষা / রুম বদল / early check-in ফি]\n    B1 --> B\n    B -- হ্যাঁ --> C[Room assign]\n    C --> D[ID scan / যাচাই, রেজিস্ট্রেশন কার্ড]\n    D --> E[Payment method / deposit / pre-auth]\n    E --> F[Folio খোলো, rate confirm]\n    F --> G[Key card ইস্যু]\n    G --> H[Status = CheckedIn, room = Occupied]\n```\n\n### ধাপ (বিস্তারিত)\n1. Arrivals লিস্টে নাম/কনফার্মেশন নম্বর খোঁজা\n2. বুকিং ভেরিফাই: তারিখ, room type, রেট, pax\n3. রুম বরাদ্দ (আগে থেকে না থাকলে)\n4. গেস্ট প্রোফাইল আপডেট: ফোন, ইমেইল, ঠিকানা, ID\n5. ID স্ক্যান / ফটো (জাতীয় ID, পাসপোর্ট, ভিসা বিদেশির জন্য)\n6. রেজিস্ট্রেশন কার্ডে স্বাক্ষর (ডিজিটাল সিগনেচার প্যাড বা কাগজ)\n7. পেমেন্ট গ্যারান্টি: ক্যাশ ডিপোজিট / কার্ড pre-authorization / কোম্পানি বিল\n8. Key card এনকোড\n9. Check-in কনফার্ম → ইভেন্ট `guest.checked_in`\n\n### উদাহরণ\nরাহিম ১২ তারিখ ১৫:০০-এ এলেন। Deluxe বুক ছিল। রুম ৩০২ Inspected আছে। ID স্ক্যান, ১,০০০ টাকা ক্যাশ ডিপোজিট নেওয়া হলো (folio-তে payment হিসেবে)। Key কার্ড দেওয়া হলো।\n\n### এজ কেস\n| পরিস্থিতি | করণীয় |\n|---|---|\n| রুম Dirty / ready না | অপেক্ষা, বা Inspected রুম, বা হাউসকিপিং priority |\n| গেস্ট সময়ের আগে এলো | Early check-in (ফি/অনুমতি) |\n| ID নেই | নীতি অনুযায়ী প্রত্যাখ্যান/ম্যানেজার অনুমতি, log |\n| নাম ভুল/ভিন্ন | বুকিং সংশোধন, audit |\n| একাধিক রুম বুকিং | প্রতিটি রুমে আলাদা check-in, share folio বিকল্প |\n| গ্রুপ | Group check-in (bulk), rooming list |\n| ডিপোজিট কম | ম্যানেজার override |\n| অন্য গেস্ট (extra pax) | extra person charge, প্রোফাইল |\n| ভুল রুমে check-in | room move (audit সহ) |\n\n### DB এনটিটি\n`reservation`, `reservation_room` (বা `stay`), `guest`, `registration_card`, `guest_document`, `folio`, `payment`, `room`, `key_issue_log`, `audit_log`\n\n### API\n```\nPOST /reservations/{id}/check-in\nbody: { \"room_id\": \"...\", \"documents\": [...], \"payment\": {...}, \"pax\": {...} }\nPOST /stays/{id}/keys            // key card\nGET  /arrivals?date=&status=\n```\n\n### স্ক্রিন\n- Arrivals list (ফিল্টার, সার্চ)\n- Check-in wizard: গেস্ট → রুম → ডকুমেন্ট → পেমেন্ট → key\n- Registration card প্রিন্ট\n\n### আধুনিক PMS\n- ID OCR স্ক্যান, মোবাইল/কিওস্ক self check-in, digital key (মোবাইল), pre-arrival online check-in\n\n---\n\n## ৪. Check-out\n\n### মানে\nগেস্টের থাকা শেষ। বিল নিষ্পত্তি, রুম ছাড়া।\n\n### ওয়ার্কফ্লো\n```mermaid\nflowchart TD\n    A[Departures list] --> B[Folio রিভিউ]\n    B --> C{সব চার্জ পোস্ট?<br/>মিনিবার, লন্ড্রি}\n    C -- না --> C1[Minibar check, late POS posts]\n    C1 --> B\n    C -- হ্যাঁ --> D[ব্যালেন্স = 0 করো: পেমেন্ট / refund / city ledger]\n    D --> E[Invoice ইস্যু]\n    E --> F[Key কার্ড বাতিল]\n    F --> G[Status=CheckedOut, room=Dirty]\n    G --> H[Housekeeping task তৈরি]\n    H --> I[Post-stay email/feedback]\n```\n\n### নিয়ম\n- Folio ব্যালেন্স **শূন্য** না হলে check-out সাধারণত ব্লক (ম্যানেজার override সহ ব্যতিক্রম, বা city ledger-এ স্থানান্তর)\n- Check-out-এর পর folio **locked**; সংশোধনে অনুমতি + audit\n\n### এজ কেস\n| পরিস্থিতি | সমাধান |\n|---|---|\n| গেস্ট চলে গেছে (skipper) | Express check-out, বকেয়া ব্যালেন্স → collections/write-off |\n| বিল ভাগ (কোম্পানি + নিজে) | Split folio / routing |\n| পেমেন্ট ব্যর্থ | বিকল্প পদ্ধতি, partial, ম্যানেজার |\n| Late check-out | ফি/চার্জ, room availability চেক |\n| ভুল চার্জ পরে ধরা পড়ল | adjustment/reversal, পুনরায় invoice, credit note |\n| Early departure (কম থাকা) | Early departure ফি নীতি, রুম রিলিজ |\n| Extend stay | নতুন তারিখে availability চেক |\n\n### DB / API\n```\nPOST /stays/{id}/check-out\nPOST /folios/{id}/settle\nPOST /folios/{id}/invoice\nGET  /departures?date=\n```\nএনটিটি: `folio`, `folio_line`, `invoice`, `payment`, `housekeeping_task`\n\n### স্ক্রিন\nDepartures list, Folio settlement, Invoice preview/print, Express check-out\n\n---\n\n## ৫. Walk-in বুকিং\n\nবুকিং ছাড়া আসা গেস্ট।\n\n### ওয়ার্কফ্লো\n1. Availability চেক (আজকের রাত)\n2. Room type + rate (সাধারণত rack/BAR) দেখানো\n3. গেস্ট তথ্য নেওয়া\n4. দ্রুত reservation তৈরি → সাথে সাথে check-in (one-step)\n5. পেমেন্ট/ডিপোজিট\n\n> Walk-in-কে **অবশ্যই** reservation হিসেবে রেকর্ড করো (reporting, ইনভেন্টরি, চ্যানেল sync)।\n\n### এজ কেস\n- রুম নেই → নিকটবর্তী হোটেলে রেফার (walk নীতি), waitlist\n- কাছের রুম টাইপ upgrade/downgrade\n- স্থানীয় বনাম বিদেশি গেস্ট — ভিন্ন ডকুমেন্ট নিয়ম\n- দর কষাকষি: ডিসকাউন্ট অনুমতি ম্যানেজার লেভেল\n\nAPI: `POST /reservations?mode=walk_in` অথবা `POST /walk-ins` (reservation + check-in একসাথে)\n\n---\n\n## ৬. Room Assignment\n\n- **Pre-assign**: আগেই রুম ঠিক (VIP, ফিক্সড)\n- **Late assign**: আগমনের দিন (সাধারণ)\n- ম্যাচিং: room type, বিছানা, floor, smoking, view, accessibility, adjacent/connecting রুম (পরিবার)\n\n**এজ কেস:** Connecting রুম, গ্রুপকে একই floor, VIP-কে পছন্দের রুম, রুম-টাইপ পুরোপুরি ভর্তি।\n\n---\n\n## ৭. Room Move (রুম বদল)\n\n### কেন\nAC নষ্ট, গোলমাল, গেস্ট অনুরোধ, upgrade, রুম অচল।\n\n### ওয়ার্কফ্লো\n```mermaid\nsequenceDiagram\n    participant FD as Front Desk\n    participant PMS\n    participant HK as Housekeeping\n    FD->>PMS: Move stay 302 → 405 (reason)\n    PMS->>PMS: নতুন রুম available? rate একই?\n    PMS->>PMS: stay_room_assignment: 302 end, 405 start\n    PMS->>HK: 302 = Dirty task, 405 = Occupied\n    PMS->>PMS: audit_log (who, why)\n```\n\n### বিশেষ নিয়ম\n- রেট একই থাকবে নাকি নতুন room type-এর হবে — স্পষ্ট নীতি\n- ইতিহাস রাখো: `stay_room_assignment` (from_date, to_date, room_id)। শুধু `reservation.room_id` বদলালে অতীতের রাত কোন রুমে ছিল হারিয়ে যায়।\n- Room move-এ folio একই থাকে\n\nAPI: `POST /stays/{id}/room-move { \"to_room_id\", \"reason\", \"rate_action\": \"keep|reprice\" }`\n\n---\n\n## ৮. Upgrade / Downgrade\n\n- **Complimentary upgrade**: হোটেল দেয় (উচ্চ টাইপ খালি থাকলে, loyalty)\n- **Paid upgrade**: গেস্ট বাড়তি দেয়\n- **Downgrade**: নিচু টাইপে (রিফান্ড/ক্রেডিট দাও!)\n\n**এজ কেস:** Rate plan নতুন টাইপে প্রযোজ্য কি না; OTA বুকিং-এ চ্যানেল রেট বনাম আসল রুম; মূল টাইপের inventory ফিরে আসে কি না; কমিশন কোন রেটে।\n\n---\n\n## ৯. Early Check-in / Late Check-out\n\n| | Early check-in | Late check-out |\n|---|---|---|\n| মানে | স্ট্যান্ডার্ড সময়ের আগে ঢোকা | স্ট্যান্ডার্ডের পরে বের হওয়া |\n| শর্ত | আগের রাতের রুম খালি/ready | পরের গেস্ট না থাকা বা অন্য রুম |\n| চার্জ | ফ্রি/আংশিক/পূর্ণ আগের রাত | ঘণ্টা-ভিত্তিক বা অর্ধদিন/পূর্ণ দিন |\n\n**ইমপ্লিমেন্টেশন বিকল্প:**\n1. **ফি পোস্ট** (flat বা % of rate) — সহজ\n2. **আগের রাত বুক** (guaranteed early) — inventory সঠিক\n3. **Day-use** রুম — আলাদা প্রোডাক্ট\n\n**এজ কেস:** Late check-out করলে ওই রুম পরের বুকিংয়ে বরাদ্দ ছিল; সময়-সীমার পরে স্বয়ংক্রিয় ফি; night audit-এ late checkout চার্জ।\n\n---\n\n## ১০. গেস্ট রেজিস্ট্রেশন ও ডকুমেন্ট\n\nপ্রয়োজনীয় ফিল্ড:\n- পূর্ণ নাম, লিঙ্গ, জন্মতারিখ\n- জাতীয়তা\n- ID টাইপ ও নম্বর (NID / পাসপোর্ট / ড্রাইভিং লাইসেন্স)\n- বিদেশি: পাসপোর্ট, ভিসা, প্রবেশের তারিখ\n- ফোন, ইমেইল, ঠিকানা\n- আগমন/প্রস্থানের উদ্দেশ্য, পরবর্তী গন্তব্য (নিয়মে থাকলে)\n- সহযাত্রী\n\n> বাংলাদেশের নির্দিষ্ট আইনি রেজিস্ট্রেশন/পুলিশ রিপোর্টিং নিয়ম ডক ১৬-তে আলাদাভাবে আলোচনা করা হয়েছে।\n\n**সুরক্ষা:** ID ছবি এনক্রিপ্টেড সংরক্ষণ, অ্যাক্সেস লগ, নির্দিষ্ট সময় পরে মুছে ফেলার নীতি। (ডক ১৪)\n\nDB: `guest`, `guest_document` (type, number_encrypted, file_url, expiry), `registration_card`\n\n---\n\n## ১১. Key Card ও Door Lock ইন্টিগ্রেশন\n\n- Check-in → PMS লক সিস্টেমকে (Onity, Assa Abloy VingCard, Salto ইত্যাদি) বলে key encode\n- Room move → পুরনো key বাতিল\n- Check-out → key বাতিল\n- নিরাপত্তা: কে কখন key ইস্যু — log\n\nAPI প্যাটার্ন: লক ভেন্ডারের SDK/ইন্টারফেস; প্রায়ই লোকাল সার্ভার/ব্রিজ দরকার (ক্লাউড PMS হলেও)।\n\n---\n\n## ১২. Cashier ও Shift\n\n- শিফট শুরু: opening float\n- সব ক্যাশ/কার্ড পেমেন্ট ক্যাশিয়ারের শিফটে যুক্ত\n- শিফট শেষ: গোনা ক্যাশ বনাম সিস্টেম → variance রিপোর্ট\n- Night audit-এর আগে সব শিফট বন্ধ\n\nDB: `cashier_shift (id, user_id, opened_at, closed_at, opening_float, expected, counted, variance)`\n\n---\n\n## ১৩. Front Desk-এর অন্যান্য কাজ\n\n- **Guest message / wake-up call**\n- **Do Not Disturb**\n- **Lost & found**\n- **Guest request** (extra towel) → হাউসকিপিং/মেইনটেন্যান্সে টাস্ক\n- **VIP / Blacklist / Notes** — প্রোফাইল ফ্ল্যাগ (সংবেদনশীল তথ্য: অ্যাক্সেস নিয়ন্ত্রণ)\n\n---\n\n## ১৪. ফ্রন্ট অফিস ফ্রন্টএন্ড মডিউল (সারাংশ)\n\n```\n/front-office\n  /dashboard          // আজকের arrivals, departures, in-house, occupancy\n  /arrivals\n  /departures\n  /in-house\n  /walk-in\n  /room-rack          // রুম স্ট্যাটাস গ্রিড\n  /tape-chart         // ক্যালেন্ডার ভিউ (রুম × তারিখ)\n  /check-in/:id       // wizard\n  /check-out/:id\n  /guest/:id\n  /cashier\n```\n\n**Tape chart:** অনুভূমিক অক্ষে তারিখ, উল্লম্বে রুম; বুকিং বার ড্র্যাগ করে রুম/তারিখ বদল। জটিল UI — virtualization দরকার (শত রুম × ৩০+ দিন)।\n\n---\n\n## ১৫. সারসংক্ষেপ চেকলিস্ট (ইঞ্জিনিয়ার)\n\n- [ ] Check-in-এ room ready চেক ও অ্যাসাইন\n- [ ] ডকুমেন্ট ও ডিপোজিট সংরক্ষণ\n- [ ] Folio check-in-এ খোলা, check-out-এ lock\n- [ ] Room move ইতিহাস সংরক্ষিত\n- [ ] Early/late ফি কনফিগারযোগ্য\n- [ ] Walk-in সবসময় reservation\n- [ ] সব অ্যাকশনে audit log\n- [ ] Concurrency: একই রুম দুবার assign না\n", "title_en": "03 — Front Office", "md_en": "# 03 — Front Office\n\n> Front office = the hotel's front desk. The guest's first and last point of contact. The busiest PMS module.\n\n---\n\n## 1. Front office responsibilities\n\n- Managing arrivals / departures\n- Check-in, check-out\n- Walk-in bookings\n- Room assignment, room moves, upgrades\n- Early check-in, late check-out\n- Guest registration and ID verification\n- Key card issue\n- Viewing folios, taking payments\n- Guest requests, complaints, messages\n- Shift handover, cashier close\n\n---\n\n## 2. Reservation / stay status\n\n```mermaid\nstateDiagram-v2\n    [*] --> Tentative\n    Tentative --> Confirmed\n    Confirmed --> CheckedIn: check-in\n    Confirmed --> Cancelled: cancel\n    Confirmed --> NoShow: did not arrive (night audit)\n    CheckedIn --> CheckedOut: check-out\n    CheckedIn --> CheckedIn: room move\n    Cancelled --> [*]\n    NoShow --> [*]\n    CheckedOut --> [*]\n```\n\n(Details in doc 04)\n\n---\n\n## 3. Check-in\n\n### Meaning\nThe guest arrives and formally starts the stay. In the system, the reservation becomes a stay.\n\n### Why it matters\n- Legal registration (ID, nationality)\n- Room assignment, key issue\n- Folio opened, deposit/authorisation taken\n- Room marked \"Occupied\"\n\n### Staff workflow\n\n```mermaid\nflowchart TD\n    A[Find booking in arrivals list] --> B{Room ready?<br/>Clean/Inspected}\n    B -- No --> B1[Wait / change room / early check-in fee]\n    B1 --> B\n    B -- Yes --> C[Assign room]\n    C --> D[Scan/verify ID, registration card]\n    D --> E[Payment method / deposit / pre-auth]\n    E --> F[Open folio, confirm rate]\n    F --> G[Issue key card]\n    G --> H[Status = CheckedIn, room = Occupied]\n```\n\n### Steps (detailed)\n1. Find the name/confirmation number in the arrivals list\n2. Verify the booking: dates, room type, rate, pax\n3. Assign a room (if not already assigned)\n4. Update the guest profile: phone, email, address, ID\n5. Scan/photograph ID (national ID, passport, visa for foreigners)\n6. Signature on the registration card (digital pad or paper)\n7. Payment guarantee: cash deposit / card pre-authorisation / company bill\n8. Encode key card\n9. Confirm check-in → event `guest.checked_in`\n\n### Example\nRahim arrives on the 12th at 15:00 with a Deluxe booking. Room 302 is Inspected. ID is scanned, a BDT 1,000 cash deposit is taken (posted as a payment on the folio) and the key card is handed over.\n\n### Edge cases\n| Situation | Action |\n|---|---|\n| Room dirty / not ready | Wait, give another inspected room, or prioritise housekeeping |\n| Guest arrives early | Early check-in (fee/approval) |\n| No ID | Refuse or manager approval per policy, logged |\n| Wrong/different name | Correct the booking, audited |\n| Multi-room booking | Separate check-in per room, shared folio option |\n| Group | Bulk group check-in, rooming list |\n| Deposit too low | Manager override |\n| Extra guest (extra pax) | Extra person charge, profile |\n| Checked into the wrong room | Room move (audited) |\n\n### DB entities\n`reservation`, `reservation_room` (or `stay`), `guest`, `registration_card`, `guest_document`, `folio`, `payment`, `room`, `key_issue_log`, `audit_log`\n\n### API\n```\nPOST /reservations/{id}/check-in\nbody: { \"room_id\": \"...\", \"documents\": [...], \"payment\": {...}, \"pax\": {...} }\nPOST /stays/{id}/keys            // key card\nGET  /arrivals?date=&status=\n```\n\n### Screens\n- Arrivals list (filters, search)\n- Check-in wizard: guest → room → documents → payment → key\n- Registration card print\n\n### Modern PMS\n- ID OCR scanning, mobile/kiosk self check-in, mobile digital key, pre-arrival online check-in\n\n---\n\n## 4. Check-out\n\n### Meaning\nThe stay ends. The bill is settled and the room is released.\n\n### Workflow\n```mermaid\nflowchart TD\n    A[Departures list] --> B[Review folio]\n    B --> C{All charges posted?<br/>minibar, laundry}\n    C -- No --> C1[Minibar check, late POS posts]\n    C1 --> B\n    C -- Yes --> D[Bring balance to 0: payment / refund / city ledger]\n    D --> E[Issue invoice]\n    E --> F[Cancel key card]\n    F --> G[Status=CheckedOut, room=Dirty]\n    G --> H[Create housekeeping task]\n    H --> I[Post-stay email/feedback]\n```\n\n### Rules\n- Check-out is normally blocked unless the folio balance is **zero** (exceptions via manager override or transfer to city ledger)\n- After check-out the folio is **locked**; corrections need permission + audit\n\n### Edge cases\n| Situation | Solution |\n|---|---|\n| Guest left without paying (skipper) | Express check-out, outstanding balance → collections/write-off |\n| Split bill (company + guest) | Split folio / routing |\n| Payment fails | Other method, partial payment, manager |\n| Late check-out | Fee/charge, check room availability |\n| Wrong charge found later | Adjustment/reversal, re-issue invoice, credit note |\n| Early departure | Early departure fee policy, release the room |\n| Extend stay | Check availability for the new dates |\n\n### DB / API\n```\nPOST /stays/{id}/check-out\nPOST /folios/{id}/settle\nPOST /folios/{id}/invoice\nGET  /departures?date=\n```\nEntities: `folio`, `folio_line`, `invoice`, `payment`, `housekeeping_task`\n\n### Screens\nDepartures list, folio settlement, invoice preview/print, express check-out\n\n---\n\n## 5. Walk-in bookings\n\nA guest who arrives without a booking.\n\n### Workflow\n1. Check availability (tonight)\n2. Show room type + rate (usually rack/BAR)\n3. Take guest details\n4. Create a quick reservation → check in immediately (one step)\n5. Payment/deposit\n\n> A walk-in **must** be recorded as a reservation (reporting, inventory, channel sync).\n\n### Edge cases\n- No rooms → refer to a nearby hotel (walk policy), waitlist\n- Upgrade/downgrade to a nearby room type\n- Local vs foreign guest — different document rules\n- Bargaining: discount permission at manager level\n\nAPI: `POST /reservations?mode=walk_in` or `POST /walk-ins` (reservation + check-in together)\n\n---\n\n## 6. Room assignment\n\n- **Pre-assign**: room fixed in advance (VIP, fixed requests)\n- **Late assign**: on the arrival day (usual)\n- Matching: room type, beds, floor, smoking, view, accessibility, adjacent/connecting rooms (families)\n\n**Edge cases:** connecting rooms, keeping a group on the same floor, preferred rooms for VIPs, a room type completely full.\n\n---\n\n## 7. Room move\n\n### Why\nBroken AC, noise, guest request, upgrade, room out of order.\n\n### Workflow\n```mermaid\nsequenceDiagram\n    participant FD as Front Desk\n    participant PMS\n    participant HK as Housekeeping\n    FD->>PMS: Move stay 302 → 405 (reason)\n    PMS->>PMS: New room available? Same rate?\n    PMS->>PMS: stay_room_assignment: 302 ends, 405 starts\n    PMS->>HK: 302 = Dirty task, 405 = Occupied\n    PMS->>PMS: audit_log (who, why)\n```\n\n### Special rules\n- Does the rate stay the same or follow the new room type? — have a clear policy\n- Keep history: `stay_room_assignment` (from_date, to_date, room_id). Changing only `reservation.room_id` loses which room past nights were in.\n- The folio stays the same on a room move\n\nAPI: `POST /stays/{id}/room-move { \"to_room_id\", \"reason\", \"rate_action\": \"keep|reprice\" }`\n\n---\n\n## 8. Upgrade / downgrade\n\n- **Complimentary upgrade**: given by the hotel (higher type free, loyalty)\n- **Paid upgrade**: guest pays extra\n- **Downgrade**: lower type (give a refund/credit!)\n\n**Edge cases:** whether the rate plan applies to the new type; OTA channel rate vs actual room; whether the original type's inventory is released; which rate commission is based on.\n\n---\n\n## 9. Early check-in / late check-out\n\n| | Early check-in | Late check-out |\n|---|---|---|\n| Meaning | Entering before standard time | Leaving after standard time |\n| Condition | Room free/ready from the previous night | No next guest, or another room |\n| Charge | Free / partial / full previous night | Hourly, half day or full day |\n\n**Implementation options:**\n1. **Post a fee** (flat or % of rate) — simple\n2. **Book the previous night** (guaranteed early) — inventory stays correct\n3. **Day-use** room — separate product\n\n**Edge cases:** the late-check-out room was already assigned to the next booking; automatic fee after the time limit; late check-out charge in night audit.\n\n---\n\n## 10. Guest registration and documents\n\nRequired fields:\n- Full name, gender, date of birth\n- Nationality\n- ID type and number (NID / passport / driving licence)\n- Foreigners: passport, visa, date of entry\n- Phone, email, address\n- Purpose of visit, next destination (if required)\n- Companions\n\n> Bangladesh-specific legal registration and police reporting rules are covered separately in doc 16.\n\n**Security:** store ID images encrypted, log access, delete after a defined period. (Doc 14)\n\nDB: `guest`, `guest_document` (type, number_encrypted, file_url, expiry), `registration_card`\n\n---\n\n## 11. Key card and door lock integration\n\n- Check-in → the PMS tells the lock system (Onity, Assa Abloy VingCard, Salto etc.) to encode a key\n- Room move → old key cancelled\n- Check-out → key cancelled\n- Security: log who issued which key and when\n\nAPI pattern: the lock vendor's SDK/interface; often a local server/bridge is needed (even with a cloud PMS).\n\n---\n\n## 12. Cashier and shifts\n\n- Shift start: opening float\n- Every cash/card payment is linked to the cashier's shift\n- Shift end: counted cash vs system → variance report\n- All shifts closed before night audit\n\nDB: `cashier_shift (id, user_id, opened_at, closed_at, opening_float, expected, counted, variance)`\n\n---\n\n## 13. Other front desk work\n\n- **Guest messages / wake-up calls**\n- **Do Not Disturb**\n- **Lost & found**\n- **Guest requests** (extra towel) → housekeeping/maintenance task\n- **VIP / blacklist / notes** — profile flags (sensitive: access-controlled)\n\n---\n\n## 14. Front office front-end modules (summary)\n\n```\n/front-office\n  /dashboard          // today's arrivals, departures, in-house, occupancy\n  /arrivals\n  /departures\n  /in-house\n  /walk-in\n  /room-rack          // room status grid\n  /tape-chart         // calendar view (rooms × dates)\n  /check-in/:id       // wizard\n  /check-out/:id\n  /guest/:id\n  /cashier\n```\n\n**Tape chart:** dates on the horizontal axis, rooms on the vertical; drag a booking bar to change room/dates. Complex UI — needs virtualisation (hundreds of rooms × 30+ days).\n\n---\n\n## 15. Summary checklist (engineer)\n\n- [ ] Room-ready check and assignment at check-in\n- [ ] Documents and deposit stored\n- [ ] Folio opened at check-in, locked at check-out\n- [ ] Room move history kept\n- [ ] Early/late fees configurable\n- [ ] Walk-ins always become reservations\n- [ ] Audit log for every action\n- [ ] Concurrency: the same room is never assigned twice\n"}, "4": {"n": 4, "title": "০৪ — রিজার্ভেশন (Reservations)", "md": "# ০৪ — রিজার্ভেশন (Reservations)\n\n> Reservation = PMS-এর কেন্দ্রীয় এনটিটি। ইনভেন্টরি, রেট, গেস্ট, ফোলিও — সব এর সাথে যুক্ত।\n\n---\n\n## ১. Reservation কী\n\nগেস্টের সাথে হোটেলের চুক্তি: **কে, কখন থেকে কখন, কোন room type, কত রেটে, কী শর্তে।**\n\n### কেন আলাদা এনটিটি\n- বুকিং হয় আগে, থাকা হয় পরে\n- বদলানো, বাতিল, না আসা — সব বুকিং লাইফসাইকেলের অংশ\n- ইনভেন্টরি আটকে রাখে\n\n---\n\n## ২. লাইফসাইকেল\n\n```mermaid\nstateDiagram-v2\n    [*] --> Inquiry: অনুসন্ধান\n    Inquiry --> Tentative: Option / hold\n    Tentative --> Confirmed: কনফার্ম / ডিপোজিট\n    Tentative --> Expired: hold মেয়াদ শেষ\n    [*] --> Confirmed: সরাসরি / OTA\n    Confirmed --> Modified: তারিখ/টাইপ বদল\n    Modified --> Confirmed\n    Confirmed --> Cancelled\n    Confirmed --> NoShow\n    Confirmed --> CheckedIn\n    CheckedIn --> CheckedOut\n    Cancelled --> [*]\n    NoShow --> [*]\n    Expired --> [*]\n    CheckedOut --> [*]\n```\n\n| স্ট্যাটাস | মানে | ইনভেন্টরি |\n|---|---|---|\n| Inquiry | শুধু জিজ্ঞাসা | আটকায় না |\n| Tentative / Option | সাময়িক hold | আটকায় (মেয়াদসহ) |\n| Confirmed | নিশ্চিত | আটকায় |\n| CheckedIn | আছে | আটকায় |\n| CheckedOut | শেষ | মুক্ত (ভবিষ্যৎ রাত) |\n| Cancelled | বাতিল | মুক্ত |\n| NoShow | আসেনি | মুক্ত (বা ফি সহ) |\n| Waitlist | অপেক্ষা | আটকায় না |\n\n> ইঞ্জিনিয়ার: স্ট্যাটাস বদল **state machine** দিয়ে, বৈধ ট্রানজিশন enforce করো। যেকোনো স্ট্যাটাস → যেকোনো স্ট্যাটাস নয়।\n\n---\n\n## ৩. বুকিং তৈরি — ওয়ার্কফ্লো\n\n```mermaid\nsequenceDiagram\n    participant U as Agent/Guest\n    participant API\n    participant INV as Inventory\n    participant RATE as Rates\n    participant DB\n    U->>API: search(from,to,pax)\n    API->>INV: availability?\n    API->>RATE: rates & restrictions\n    API-->>U: অপশন + দাম\n    U->>API: create reservation (type, plan, guest)\n    API->>INV: ইনভেন্টরি লক / ডিক্রিমেন্ট (atomic)\n    API->>RATE: রেট স্ন্যাপশট\n    API->>DB: reservation + nightly rates + guest\n    API-->>U: confirmation_number\n    API-)Notif: confirmation email/SMS\n    API-)CM: availability update (channel manager)\n```\n\n### ধাপ\n1. তারিখ, pax (adult/child), room type সিলেক্ট\n2. Availability + restrictions (min stay, CTA/CTD) যাচাই\n3. রেট প্ল্যান, রেট হিসাব (রাত-ভিত্তিক)\n4. গেস্ট খোঁজো/তৈরি (ডুপ্লিকেট এড়াতে)\n5. পেমেন্ট গ্যারান্টি/ডিপোজিট\n6. ইনভেন্টরি atomic আটকানো\n7. কনফার্মেশন নম্বর, নোটিফিকেশন\n8. Channel manager sync\n\n### কনফার্মেশন নম্বর\n- মানুষ-পাঠযোগ্য (যেমন `SR-240512-7KQ3`), অনন্য, ধারাবাহিক নয় (যাতে কেউ অনুমান করে বের করতে না পারে)\n- OTA-র নিজস্ব রেফারেন্স (`external_ref`) আলাদা সংরক্ষণ\n\n---\n\n## ৪. রেট স্ন্যাপশট (গুরুত্বপূর্ণ)\n\nবুকিংয়ের সময়ের রেট **বুকিংয়ে কপি করে রাখো** (`reservation_night`)। পরে রেট কার্ড বদলালে পুরনো বুকিংয়ের দাম বদলাবে না।\n\n```\nreservation_night:\n  reservation_id, stay_date, room_type_id,\n  rate_plan_id, base_amount, tax_amount, fee_amount,\n  discount_amount, currency, extras_json\n```\n\n---\n\n## ৫. Reservation মডিফিকেশন\n\n| পরিবর্তন | প্রভাব |\n|---|---|\n| তারিখ বদল | availability পুনঃচেক, রেট পুনর্গণনা, নীতি |\n| room type বদল | ইনভেন্টরি সরানো, রেট |\n| pax বদল | extra person charge |\n| গেস্ট নাম বদল | OTA নিয়ম, অডিট |\n| রেট প্ল্যান বদল | নীতি/non-refundable সীমা |\n| দৈর্ঘ্য কমানো/বাড়ানো | early departure/extension |\n\n**নিয়ম:** মডিফিকেশন = পুরনো ইনভেন্টরি মুক্ত + নতুন আটকানো, **একই ট্রানজ্যাকশনে**। ব্যর্থ হলে পুরনোটা অক্ষত।\n\n**ভার্সনিং:** `reservation_history` / `revision` — প্রতি পরিবর্তনে snapshot, কে করল।\n\nAPI:\n```\nPATCH /reservations/{id}\nbody: { \"arrival\": \"...\", \"departure\": \"...\", \"room_type_id\": \"...\", \"version\": 7 }\n```\n`version` (optimistic locking) — একসাথে দুজন এডিট করলে একজন কনফ্লিক্ট পাবে।\n\n---\n\n## ৬. ক্যানসেলেশন (Cancellation)\n\n### নীতি (Policy) ধরন\n- **Free cancellation** — X ঘণ্টা/দিন আগে পর্যন্ত\n- **Penalty** — প্রথম রাতের চার্জ / % / ফিক্সড\n- **Non-refundable** — পুরোটা চার্জ\n- নীতি **রেট প্ল্যানের সাথে যুক্ত**, এবং বুকিংয়ের সময়ের নীতি **স্ন্যাপশট করা**\n\n### ওয়ার্কফ্লো\n```mermaid\nflowchart TD\n    A[Cancel request] --> B[নীতি লোড: বুকিংয়ের স্ন্যাপশট]\n    B --> C{ডেডলাইনের আগে?}\n    C -- হ্যাঁ --> D[ফি = 0]\n    C -- না --> E[ফি হিসাব]\n    D --> F[ইনভেন্টরি মুক্ত]\n    E --> F\n    F --> G{ডিপোজিট আছে?}\n    G -- হ্যাঁ --> H[ফি কেটে refund / ফি রাখা]\n    G -- না --> I{ফি > 0?}\n    I -- হ্যাঁ --> J[কার্ড চার্জ / ইনভয়েস]\n    I -- না --> K[শেষ]\n    H --> K\n    J --> K\n    K --> L[কনফার্মেশন, CM sync, audit]\n```\n\n### এজ কেস\n- **টাইমজোন**: ক্যানসেলের ডেডলাইন property-র local সময়ে গণনা\n- আংশিক ক্যানসেল (মাল্টি-রুম বুকিংয়ে একটি রুম)\n- OTA থেকে ক্যানসেল (CM মারফত) বনাম হোটেল থেকে\n- ক্যানসেল পর্যাপ্ত সময়ের পরে, কিন্তু ম্যানেজার ফি মওকুফ → override + কারণ\n- ক্যানসেল পুনরুদ্ধার (undo/reinstate): ইনভেন্টরি আবার আছে কি?\n- ফোর্স মেজর (ঝড়, হরতাল, ফ্লাইট বাতিল) নীতি\n\nAPI:\n```\nPOST /reservations/{id}/cancel\nbody: { \"reason\": \"guest_request\", \"waive_fee\": false }\nPOST /reservations/{id}/reinstate\n```\n\n---\n\n## ৭. No-Show\n\n### মানে\nগেস্ট আসেনি, জানায়ও নি।\n\n### প্রক্রিয়া\n- Night audit-এ (বা নির্ধারিত cut-off সময়ের পর), যেসব Confirmed বুকিংয়ের আগমন আজ এবং check-in হয়নি → NoShow প্রস্তাব/অটো\n- নীতি অনুযায়ী ফি চার্জ (প্রায়ই প্রথম রাত)\n- ইনভেন্টরি মুক্ত (বাকি রাতগুলো)\n- OTA-কে no-show রিপোর্ট (কিছু OTA নিয়ম: নির্দিষ্ট সময়ের মধ্যে জানাতে হয়, কমিশন/ভার্চুয়াল কার্ড চার্জ সংশ্লিষ্ট)\n- গ্যারান্টিহীন বুকিং (6 PM release) → সময় পেরোলে অটো বাতিল\n\n**এজ কেস:** দেরিতে আসা (late arrival notice) — রুম ধরে রাখা; no-show হওয়ার পর গেস্ট এলে reinstate; অন্য গেস্টকে রুম বিক্রি হয়ে গেছে।\n\n---\n\n## ৮. Overbooking\n\n### মানে ও কেন\nইচ্ছাকৃতভাবে ক্যাপাসিটির বেশি বিক্রি, কারণ ক্যানসেল/no-show ঘটে। রেভিনিউ ম্যানেজমেন্ট কৌশল।\n\n### ঝুঁকি ও নিয়ন্ত্রণ\n- `overbooking_limit` প্রতি room type/তারিখ/property (বা %)\n- এমন হলে **walk (relocate)**: গেস্টকে সমমানের/ভালো অন্য হোটেলে পাঠানো, খরচ হোটেলের\n- Upgrade: উঁচু room type খালি থাকলে সেখানে পাঠানো\n\n```mermaid\nflowchart TD\n    A[Arrivals আজ] --> B{রুম < Arrivals?}\n    B -- না --> OK[স্বাভাবিক]\n    B -- হ্যাঁ --> C[Upgrade সম্ভব?]\n    C -- হ্যাঁ --> D[Comp upgrade]\n    C -- না --> E[Walk: partner হোটেল, ট্রান্সপোর্ট, প্রথম রাত বিল হোটেলের]\n    E --> F[গেস্টকে জানাও, ক্ষতিপূরণ]\n```\n\n### ইঞ্জিনিয়ারিং\n- Availability হিসাবে `physical_capacity + overbooking_allowance − booked`\n- অনিচ্ছাকৃত overbooking (race condition, sync delay) ≠ ইচ্ছাকৃত: দুটো আলাদা সমস্যা\n- Overbooking রিপোর্ট ও সতর্কতা ড্যাশবোর্ড\n\n**ব্যবসায়িক সাবধানতা:** OTA-র কিছু নীতিতে ওভারবুকিংয়ের জন্য জরিমানা/র‍্যাঙ্কিং ক্ষতি। অতিরিক্ত করলে সুনাম ক্ষতি।\n\n---\n\n## ৯. ডিপোজিট ও অগ্রিম পেমেন্ট\n\n| ধরন | উদাহরণ |\n|---|---|\n| Deposit | প্রথম রাতের ২৫%/ফিক্সড |\n| Prepayment | বুকিংয়ের সময় সম্পূর্ণ |\n| Pre-authorization | কার্ডে hold, চার্জ নয় |\n| Guarantee | কার্ড/কোম্পানি লেটার দিয়ে গ্যারান্টি |\n\n- ডিপোজিট **folio-তে নয়**, প্রথমে `reservation_deposit` / বুকিং-লেভেল payment হিসেবে; check-in-এ folio-তে **transfer**\n- অ্যাডভান্স রসিদ (receipt) ইস্যু\n- ক্যানসেলে নীতি অনুযায়ী ফেরত/বাজেয়াপ্ত\n- হিসাবে: ডিপোজিট = **liability** (অগ্রিম প্রাপ্তি), রেভিনিউ নয় যতক্ষণ না stay হয়\n\n(বিস্তারিত ডক ০৯)\n\n---\n\n## ১০. গ্রুপ বুকিং\n\n### বৈশিষ্ট্য\n- অনেক রুম, একই তারিখ/ইভেন্ট (বিয়ে, কনফারেন্স, ট্যুর)\n- **Room block / allotment**: আগেই রুম আটকে, পরে নাম বসানো\n- **Rooming list**: কোন গেস্ট কোন রুমে\n- **Cut-off date**: এর পর unused রুম ছেড়ে দেওয়া (release)\n- **Master folio** (গ্রুপ বিল) + individual folio (নিজস্ব খরচ)\n- গ্রুপ রেট, কমপ্লিমেন্টারি রুম (যেমন ২০টিতে ১টি ফ্রি)\n\n```mermaid\nflowchart LR\n    S[Sales: কন্ট্রাক্ট] --> B[Block তৈরি: 30 Deluxe, 3–5 Jun]\n    B --> P[Pickup ট্র্যাক: কতটা নাম বসলো]\n    P --> C{Cut-off}\n    C --> R[অবশিষ্ট release]\n    P --> RL[Rooming list]\n    RL --> CI[Group check-in]\n    CI --> F[Master folio + guest folios]\n```\n\nDB: `group_block`, `group_block_night` (room_type, qty, picked_up), `reservation.group_id`, `folio.type='master'`\n\n**এজ কেস:** পিকআপ কম; attrition clause (কম ব্যবহারে জরিমানা); রুম নাম পরিবর্তন; ডিপোজিট শিডিউল; late list।\n\n---\n\n## ১১. কর্পোরেট বুকিং\n\n- কোম্পানির সাথে চুক্তি: **negotiated rate**, বছরের জন্য\n- বুকিংয়ে company/account কোড\n- বিল: কোম্পানিকে (**direct bill / city ledger**) বা গেস্ট নিজে\n- নির্দিষ্ট চার্জ কোম্পানির (রুম+ট্যাক্স), অন্যান্য গেস্টের (মিনিবার) → **folio routing**\n- ক্রেডিট লিমিট, পেমেন্ট টার্ম (Net 30)\n\nDB: `company_account`, `company_rate_agreement`, `ar_account`, `routing_rule`\n\n**এজ কেস:** চুক্তি রেট মেয়াদোত্তীর্ণ; কোম্পানির ক্রেডিট লিমিট ছাড়ানো; PO নম্বর বাধ্যতামূলক; একাধিক কর্মচারী একই রুম শেয়ার।\n\n---\n\n## ১২. মাল্টি-রুম বুকিং\n\nএক reservation (বা এক `booking` কন্টেইনারে) একাধিক রুম।\n- মডেল: `booking` (1) → `reservation_room` / `reservation` (N)\n- প্রতিটি রুমের আলাদা pax/রেট/স্ট্যাটাস সম্ভব\n- একজনের check-in, অন্যজনের ক্যানসেল আলাদা\n\n> মডেলিং সিদ্ধান্ত গুরুত্বপূর্ণ: \"booking\" (গ্রাহকের অর্ডার) vs \"reservation/stay\" (প্রতি রুম)। OTA-গুলো সাধারণত এই কাঠামো ব্যবহার করে। ডক ১২-তে স্কিমা।\n\n---\n\n## ১৩. Waitlist ও Option\n\n- **Waitlist**: সোল্ড-আউট তারিখে অপেক্ষা; রুম খালি হলে নোটিফাই/কনভার্ট\n- **Option / Tentative hold**: নির্দিষ্ট সময় পর্যন্ত (`expires_at`) আটকে; পরে কনফার্ম না হলে অটো রিলিজ (scheduled job)\n\n---\n\n## ১৪. ডুপ্লিকেট ও গেস্ট ম্যাচিং\n\nবুকিংয়ের সময় গেস্ট প্রোফাইল ম্যাচ: ইমেইল/ফোন/নাম+জন্মতারিখ। ডুপ্লিকেট হলে **merge** (হিস্ট্রি সংরক্ষণ)। (ডক ০৭)\n\n---\n\n## ১৫. API সারাংশ\n\n```\nGET    /availability?property_id=&from=&to=&adults=&children=\nPOST   /quotes                       // রেট কোট (বুকিং না করে)\nPOST   /bookings                     // নতুন বুকিং (idempotency-key সহ)\nGET    /reservations/{id}\nPATCH  /reservations/{id}\nPOST   /reservations/{id}/cancel\nPOST   /reservations/{id}/reinstate\nPOST   /reservations/{id}/no-show\nPOST   /reservations/{id}/confirm\nPOST   /reservations/{id}/deposits\nGET    /reservations?arrival=&status=&q=\nPOST   /groups  /groups/{id}/rooming-list  /groups/{id}/release\n```\n\n**Idempotency:** `Idempotency-Key` হেডার। নেটওয়ার্ক retry-তে ডাবল বুকিং না হয়।\n\nইভেন্ট: `reservation.created`, `.modified`, `.cancelled`, `.no_show`, `.checked_in`, `.checked_out`\n\n---\n\n## ১৬. ডাটাবেস (সংক্ষিপ্ত)\n\n```mermaid\nerDiagram\n    BOOKING ||--|{ RESERVATION : contains\n    GUEST ||--o{ BOOKING : makes\n    RESERVATION ||--|{ RESERVATION_NIGHT : \"প্রতি রাত\"\n    RESERVATION }o--|| ROOM_TYPE : books\n    RESERVATION }o--o| ROOM : \"assigned (late)\"\n    RESERVATION }o--|| RATE_PLAN : uses\n    RESERVATION ||--o{ RESERVATION_GUEST : \"pax\"\n    RESERVATION ||--o{ RESERVATION_HISTORY : revisions\n    BOOKING ||--o{ DEPOSIT : \"অগ্রিম\"\n    GROUP_BLOCK ||--o{ RESERVATION : includes\n```\n\nগুরুত্বপূর্ণ ফিল্ড (reservation):\n`id, property_id, booking_id, confirmation_no, external_ref, source, channel, market_segment, status, arrival_date, departure_date, adults, children, room_type_id, room_id, rate_plan_id, company_id, group_id, guarantee_type, cancellation_policy_snapshot, total_amount, currency, notes, created_by, version, created_at, updated_at`\n\n---\n\n## ১৭. ফ্রন্টএন্ড স্ক্রিন\n\n- **Availability search** (তারিখ, pax) → ফলাফল কার্ড\n- **Reservation form** (গেস্ট, রেট, ডিপোজিট, নোট)\n- **Reservation details** (ট্যাব: Overview, Guests, Rates, Folio, History, Notes)\n- **Reservation list** + ফিল্টার\n- **Tape chart** (রুম×তারিখ)\n- **Group block manager**, rooming list ইম্পোর্ট (CSV)\n- **Cancellation dialog** (ফি প্রিভিউ)\n\n---\n\n## ১৮. সাধারণ ভুল\n\n1. রেট স্ন্যাপশট না রাখা\n2. ক্যানসেল নীতি বুকিংয়ের সময়ের না নিয়ে বর্তমান নীতি প্রয়োগ\n3. ইনভেন্টরি আপডেট ও বুকিং **আলাদা ট্রানজ্যাকশন** → অসঙ্গতি\n4. টাইমজোন ভুলে ক্যানসেল ডেডলাইন\n5. Idempotency নেই → ডাবল বুকিং\n6. ডিপোজিটকে রেভিনিউ গণ্য\n7. OTA বুকিং এডিটযোগ্য করা (অনুমতি নেই এমন ফিল্ড)\n\n---\n\n## ১৯. ইভেন্ট ও ভেন্যু বুকিং (Events & Venues)\n\n### কেন আলাদা\nগ্রুপ **রুম** বুকিং ও **হল/ভেন্যু** বুকিং ভিন্ন: ভেন্যু বিক্রি হয় **সময়-স্লটে** (সকাল, বিকেল, পূর্ণ দিন), রাতে নয়। ক্যাপাসিটি রুমের মতো \"সংখ্যা\" নয়, \"একটি ভেন্যুর একটি সময়\"।\n\n### মডেল\n```sql\nvenue(id, property_id, name, capacity_theatre, capacity_banquet, capacity_classroom, active)\nvenue_booking(id, venue_id, group_id NULL, company_id NULL, event_name, event_type,\n  start_at, end_at, setup_style, expected_pax, status, deposit_required, total_amount)\nvenue_booking_item(venue_booking_id, item_type /*hall|catering|av|decor*/, description, qty, unit_amount)\nEXCLUDE USING gist (venue_id WITH =, tstzrange(start_at,end_at) WITH &&)   -- একই হলে ওভারল্যাপ নয়\n```\n\n### ওয়ার্কফ্লো\nInquiry → Tentative hold (মেয়াদসহ) → কোট (হল+খাবার+AV) → কন্ট্রাক্ট/ডিপোজিট → **BEO** (Banquet Event Order — রান্নাঘর, সেটআপ, AV টিমের নির্দেশনা) → ইভেন্ট → ফাইনাল ইনভয়েস → ফোলিও (master folio-তে)।\n\n**এজ কেস:** সেটআপ/টিয়ারডাউন বাফার সময়, একই হলে পরপর ইভেন্ট, হল ভাগ করা (partition), ক্যাটারিং আইটেমে VAT/সার্ভিস চার্জ ভিন্ন, অতিথি সংখ্যা কমে যাওয়া (guarantee number)।\n\n**API:** `GET /v1/venues/availability?from=&to=`, `POST /v1/venue-bookings`, `GET /v1/venue-bookings/{id}/beo`\n**স্ক্রিন:** ভেন্যু ক্যালেন্ডার (সময়-স্লট গ্রিড), ইভেন্ট ফর্ম, BEO প্রিন্ট।\n", "title_en": "04 — Reservations", "md_en": "# 04 — Reservations\n\n> The reservation is the central PMS entity. Inventory, rates, guests and folios all connect to it.\n\n---\n\n## 1. What is a reservation\n\nThe agreement between guest and hotel: **who, from when to when, which room type, at what rate, under which conditions.**\n\n### Why a separate entity\n- Booking happens first, the stay happens later\n- Changes, cancellations and no-shows are all part of the booking lifecycle\n- It holds inventory\n\n---\n\n## 2. Lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Inquiry: enquiry\n    Inquiry --> Tentative: option / hold\n    Tentative --> Confirmed: confirm / deposit\n    Tentative --> Expired: hold expired\n    [*] --> Confirmed: direct / OTA\n    Confirmed --> Modified: change dates/type\n    Modified --> Confirmed\n    Confirmed --> Cancelled\n    Confirmed --> NoShow\n    Confirmed --> CheckedIn\n    CheckedIn --> CheckedOut\n    Cancelled --> [*]\n    NoShow --> [*]\n    Expired --> [*]\n    CheckedOut --> [*]\n```\n\n| Status | Meaning | Inventory |\n|---|---|---|\n| Inquiry | Just asking | Not held |\n| Tentative / Option | Temporary hold | Held (with expiry) |\n| Confirmed | Confirmed | Held |\n| CheckedIn | In house | Held |\n| CheckedOut | Finished | Released (future nights) |\n| Cancelled | Cancelled | Released |\n| NoShow | Did not arrive | Released (or with fee) |\n| Waitlist | Waiting | Not held |\n\n> Engineer: change statuses through a **state machine** that enforces valid transitions. Not \"any status → any status\".\n\n---\n\n## 3. Creating a booking — workflow\n\n```mermaid\nsequenceDiagram\n    participant U as Agent/Guest\n    participant API\n    participant INV as Inventory\n    participant RATE as Rates\n    participant DB\n    U->>API: search(from,to,pax)\n    API->>INV: availability?\n    API->>RATE: rates & restrictions\n    API-->>U: options + prices\n    U->>API: create reservation (type, plan, guest)\n    API->>INV: lock / decrement inventory (atomic)\n    API->>RATE: rate snapshot\n    API->>DB: reservation + nightly rates + guest\n    API-->>U: confirmation_number\n    API-)Notif: confirmation email/SMS\n    API-)CM: availability update (channel manager)\n```\n\n### Steps\n1. Select dates, pax (adults/children), room type\n2. Check availability + restrictions (min stay, CTA/CTD)\n3. Rate plan, rate calculation (per night)\n4. Find/create the guest (avoid duplicates)\n5. Payment guarantee/deposit\n6. Hold inventory atomically\n7. Confirmation number, notification\n8. Channel manager sync\n\n### Confirmation number\n- Human-readable (e.g. `SR-240512-7KQ3`), unique, not sequential (so it cannot be guessed)\n- Store the OTA's own reference (`external_ref`) separately\n\n---\n\n## 4. Rate snapshot (important)\n\n**Copy the rate at booking time into the booking** (`reservation_night`). If the rate card changes later, the old booking's price must not change.\n\n```\nreservation_night:\n  reservation_id, stay_date, room_type_id,\n  rate_plan_id, base_amount, tax_amount, fee_amount,\n  discount_amount, currency, extras_json\n```\n\n---\n\n## 5. Modifying a reservation\n\n| Change | Effect |\n|---|---|\n| Dates | Re-check availability, recalculate rate, policy |\n| Room type | Move inventory, rate |\n| Pax | Extra person charge |\n| Guest name | OTA rules, audit |\n| Rate plan | Policy / non-refundable limits |\n| Shorten / extend | Early departure / extension |\n\n**Rule:** a modification = release old inventory + hold new inventory **in the same transaction**. If it fails, the old booking stays intact.\n\n**Versioning:** `reservation_history` / `revision` — a snapshot on every change, with who made it.\n\nAPI:\n```\nPATCH /reservations/{id}\nbody: { \"arrival\": \"...\", \"departure\": \"...\", \"room_type_id\": \"...\", \"version\": 7 }\n```\n`version` (optimistic locking) — if two people edit at once, one gets a conflict.\n\n---\n\n## 6. Cancellation\n\n### Policy types\n- **Free cancellation** — until X hours/days before\n- **Penalty** — first night / % / fixed amount\n- **Non-refundable** — full charge\n- The policy is **attached to the rate plan**, and the policy at booking time is **snapshotted**\n\n### Workflow\n```mermaid\nflowchart TD\n    A[Cancel request] --> B[Load policy: booking snapshot]\n    B --> C{Before deadline?}\n    C -- Yes --> D[Fee = 0]\n    C -- No --> E[Calculate fee]\n    D --> F[Release inventory]\n    E --> F\n    F --> G{Deposit held?}\n    G -- Yes --> H[Refund minus fee / keep fee]\n    G -- No --> I{Fee > 0?}\n    I -- Yes --> J[Charge card / invoice]\n    I -- No --> K[Done]\n    H --> K\n    J --> K\n    K --> L[Confirmation, CM sync, audit]\n```\n\n### Edge cases\n- **Time zone**: the cancellation deadline is calculated in property local time\n- Partial cancellation (one room in a multi-room booking)\n- Cancelled from the OTA (via CM) vs by the hotel\n- Late cancellation where the manager waives the fee → override + reason\n- Reinstating a cancellation: is inventory still available?\n- Force majeure policy (storm, strike, cancelled flights)\n\nAPI:\n```\nPOST /reservations/{id}/cancel\nbody: { \"reason\": \"guest_request\", \"waive_fee\": false }\nPOST /reservations/{id}/reinstate\n```\n\n---\n\n## 7. No-show\n\n### Meaning\nThe guest did not arrive and did not tell the hotel.\n\n### Process\n- In night audit (or after a set cut-off), confirmed bookings arriving today that did not check in → no-show (suggested or automatic)\n- Fee per policy (often the first night)\n- Release inventory for the remaining nights\n- Report the no-show to the OTA (some OTAs require it within a set time; affects commission / virtual card charging)\n- Non-guaranteed bookings (6 PM release) → auto-cancel after the time passes\n\n**Edge cases:** late arrival notice — hold the room; guest turns up after being marked no-show → reinstate; the room was already sold to someone else.\n\n---\n\n## 8. Overbooking\n\n### Meaning and why\nDeliberately selling more than capacity because cancellations and no-shows happen. A revenue management tactic.\n\n### Risk and control\n- `overbooking_limit` per room type/date/property (or %)\n- If everyone arrives → **walk (relocate)**: send the guest to an equal or better hotel at the hotel's cost\n- Upgrade: move them to a higher room type if one is free\n\n```mermaid\nflowchart TD\n    A[Today's arrivals] --> B{Rooms < arrivals?}\n    B -- No --> OK[Normal]\n    B -- Yes --> C[Upgrade possible?]\n    C -- Yes --> D[Comp upgrade]\n    C -- No --> E[Walk: partner hotel, transport, first night paid by hotel]\n    E --> F[Inform guest, compensation]\n```\n\n### Engineering\n- Availability = `physical_capacity + overbooking_allowance − booked`\n- Accidental overbooking (race condition, sync delay) ≠ deliberate overbooking: two separate problems\n- Overbooking report and alert dashboard\n\n**Business caution:** some OTA policies penalise overbooking (fines/ranking). Overdoing it damages reputation.\n\n---\n\n## 9. Deposits and prepayment\n\n| Type | Example |\n|---|---|\n| Deposit | 25% of first night / fixed amount |\n| Prepayment | Full amount at booking |\n| Pre-authorisation | Hold on the card, not a charge |\n| Guarantee | Card or company letter as guarantee |\n\n- A deposit is **not on the folio** at first; it sits as a `reservation_deposit` / booking-level payment and is **transferred** to the folio at check-in\n- Issue an advance receipt\n- On cancellation, refund or forfeit per policy\n- Accounting: a deposit is a **liability** (advance received), not revenue until the stay happens\n\n(Details in doc 09)\n\n---\n\n## 10. Group bookings\n\n### Characteristics\n- Many rooms, same dates/event (wedding, conference, tour)\n- **Room block / allotment**: rooms held in advance, names added later\n- **Rooming list**: which guest in which room\n- **Cut-off date**: unused rooms released after this date\n- **Master folio** (group bill) + individual folios (personal spending)\n- Group rate, complimentary rooms (e.g. 1 free per 20)\n\n```mermaid\nflowchart LR\n    S[Sales: contract] --> B[Create block: 30 Deluxe, 3–5 Jun]\n    B --> P[Track pickup: how many names added]\n    P --> C{Cut-off}\n    C --> R[Release the rest]\n    P --> RL[Rooming list]\n    RL --> CI[Group check-in]\n    CI --> F[Master folio + guest folios]\n```\n\nDB: `group_block`, `group_block_night` (room_type, qty, picked_up), `reservation.group_id`, `folio.type='master'`\n\n**Edge cases:** low pickup; attrition clause (penalty for under-use); room name changes; deposit schedule; late rooming lists.\n\n---\n\n## 11. Corporate bookings\n\n- Contract with a company: **negotiated rate** for the year\n- Company/account code on the booking\n- Billing: to the company (**direct bill / city ledger**) or the guest pays\n- Some charges to the company (room + tax), others to the guest (minibar) → **folio routing**\n- Credit limit, payment terms (Net 30)\n\nDB: `company_account`, `company_rate_agreement`, `ar_account`, `routing_rule`\n\n**Edge cases:** expired contract rate; credit limit exceeded; mandatory PO number; several employees sharing one room.\n\n---\n\n## 12. Multi-room bookings\n\nOne reservation (or one `booking` container) with several rooms.\n- Model: `booking` (1) → `reservation_room` / `reservation` (N)\n- Each room may have its own pax/rate/status\n- One room can check in while another is cancelled\n\n> This modelling choice matters: \"booking\" (the customer's order) vs \"reservation/stay\" (per room). OTAs usually use this structure. Schema in doc 12.\n\n---\n\n## 13. Waitlist and options\n\n- **Waitlist**: waiting for a sold-out date; notify/convert when a room frees up\n- **Option / tentative hold**: held until `expires_at`; auto-released by a scheduled job if not confirmed\n\n---\n\n## 14. Duplicates and guest matching\n\nMatch guest profiles at booking time: email / phone / name + date of birth. If duplicated, **merge** (keeping history). (Doc 07)\n\n---\n\n## 15. API summary\n\n```\nGET    /availability?property_id=&from=&to=&adults=&children=\nPOST   /quotes                       // rate quote (without booking)\nPOST   /bookings                     // new booking (with idempotency key)\nGET    /reservations/{id}\nPATCH  /reservations/{id}\nPOST   /reservations/{id}/cancel\nPOST   /reservations/{id}/reinstate\nPOST   /reservations/{id}/no-show\nPOST   /reservations/{id}/confirm\nPOST   /reservations/{id}/deposits\nGET    /reservations?arrival=&status=&q=\nPOST   /groups  /groups/{id}/rooming-list  /groups/{id}/release\n```\n\n**Idempotency:** `Idempotency-Key` header, so network retries do not create double bookings.\n\nEve
