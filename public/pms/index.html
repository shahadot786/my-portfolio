ngs\n        events/           venues calendar, beo\n        staff/            roster, attendance\n        stock/            items, movements, purchase-orders\n        channels/         connections, mappings, sync status, unmapped queue\n        reports/          center, viewer, scheduler\n        settings/         property, policies, users-roles, integrations, onboarding, entitlements\n  hk-mobile-pwa/          মোবাইল-প্রথম: আমার রুম, Start/Done, মিনিবার, ছবি, offline কিউ\n  booking-engine/         পাবলিক: সার্চ → রুম → চেকআউট → পেমেন্ট → কনফার্মেশন (bn/en, মোবাইল)\n```\n**নীতি:** মডিউল-ভিত্তিক ফোল্ডার (feature-sliced); প্রতিটি মডিউল নিজের api/hooks/components/routes; entitlement ও permission গার্ড রাউটে; tape chart ও বড় তালিকায় virtualization; অপ্টিমিস্টিক UI শুধু নিরাপদ অপারেশনে (পেমেন্ট/ইনভেন্টরিতে নয়); সার্ভার-স্টেট ক্যাশ (React Query ধরনের)।\n", "title_en": "13 — PMS Architecture", "md_en": "# 13 — PMS Architecture\n\n---\n\n## 1. Legacy PMS architecture\n\n```mermaid\nflowchart LR\n    C1[Desktop client] --> S[On-premise server]\n    C2[Desktop client] --> S\n    S --> DB[(Local DB: SQL Server / Access / Firebird)]\n    S --> I1[Interface server: POS, PBX, Lock]\n    I1 --> X[Serial / TCP / file interfaces]\n    S --> BK[Manual backup]\n```\n**Characteristics:** server inside the hotel, desktop clients, interfaces (RS-232/TCP/files), self-managed upgrades and backups.\n**Pros:** works without internet, local devices are easy.\n**Cons:** hard to update, hard remote access/reporting, weak OTA/API integration, risk of data loss, complex multi-property.\nMany older desktop installations likely still exist in Bangladesh — so a migration path matters.\n\n## 2. Modern cloud PMS\n\n```mermaid\nflowchart TB\n    subgraph Clients\n      W[Web app - staff]\n      M[Mobile HK / PWA]\n      BE[Booking engine - guest]\n      P[Partner API clients]\n    end\n    CDN[CDN / WAF] --> GW[API Gateway: authN, rate limit]\n    W --> CDN\n    M --> CDN\n    BE --> CDN\n    P --> GW\n    CDN --> GW\n    GW --> AUTH[Auth / IAM]\n    GW --> APP\n    subgraph APP[Core Services]\n      RES[Reservation]\n      INV[Inventory & Rates]\n      FOL[Folio & Billing]\n      GST[Guest]\n      HK[Housekeeping/Maint.]\n      FO[Front Office]\n      RPT[Reporting]\n      NOTIF[Notification]\n    end\n    APP --> PG[(PostgreSQL primary)]\n    PG --> RR[(Read replicas)]\n    APP --> CACHE[(Redis)]\n    APP --> BUS[[Event bus / Queue]]\n    BUS --> WRK[Workers: night audit, sync, webhooks]\n    WRK --> CM[Channel adapters]\n    WRK --> PGW[Payment adapters]\n    WRK --> MSG[SMS/Email/WhatsApp]\n    PG --> DWH[(Analytics / Warehouse)]\n    APP --> OBJ[(Object storage: IDs, files)]\n```\n\n### Recommendation: start with a **modular monolith**\n- One deployment, but clear module boundaries (Reservation, Inventory, Folio, Guest, HK…)\n- ACID transactions across inventory + booking + folio stay simple\n- Extract services later under real load (channel sync, notifications and reporting are the first candidates)\n- **Microservices from day one = distributed transaction complexity** (inventory ↔ reservation)\n\n## 3. Multi-tenancy\n\n| Model | Explanation | Comment |\n|---|---|---|\n| Shared DB + `org_id` + RLS | All tenants in the same tables | Cheap, scalable; isolation enforced in code/DB |\n| Schema-per-tenant | One schema per tenant | Medium, complex migrations |\n| DB-per-tenant | Separate DB | Large/enterprise, expensive |\n\n**Recommendation:** start with shared + RLS; offer separate DBs for large chains. Tenant context on every query (middleware); make tenant-less queries fail in tests.\n**Noisy neighbours:** rate limits, query timeouts, background job quotas.\n\n## 4. Scaling considerations\n- Most load is **reads** (availability search, tape chart) → read replicas, caching (carefully — stale availability is dangerous)\n- **Write hotspots**: `room_inventory` rows (many bookings on the same night) → short transactions, ordered locks\n- **Night audit**: a separate job per property, in parallel, scheduled by time zone\n- **Search**: availability = derived/materialised; short-TTL Redis cache if needed\n- **Reports**: no heavy queries on the production DB — replica/warehouse\n- **Tape chart**: virtualised UI, paged/windowed API\n\n## 5. Event-driven\n- **Domain events** → outbox → broker (Kafka/RabbitMQ/SQS/Postgres-based) → consumers\n- Consumers: CM sync, webhooks, notifications, analytics, HK task generation\n- **At-least-once delivery** → consumers must be idempotent\n- **Real-time UI**: WebSocket/SSE (room status, new bookings)\n\n```mermaid\nflowchart LR\n    CMD[Command: Check-out] --> TX[(DB tx: reservation, room, outbox)]\n    TX --> OB[Outbox relay]\n    OB --> BUS[[Bus]]\n    BUS --> H1[HK: create task]\n    BUS --> H2[Notif: post-stay mail]\n    BUS --> H3[Channel: inventory push]\n    BUS --> H4[Webhook: partner]\n    BUS --> H5[UI push: room board]\n```\n\n## 6. Offline / cloud limits\n- Browser PWA: cache critical reads (in-house, arrivals), queue writes (limited operations)\n- Full offline-first = complex conflict resolution; a business decision: which work runs offline (check-in copy, viewing folios) and which does not (payment gateways, selling inventory)\n- Local **bridge agent**: locks/printers/card terminals, with retries\n- Generate the downtime report (doc 02) automatically\n\n## 7. Deployment and operations\n- Containers + orchestration (Kubernetes/ECS), or start with simple VMs\n- **IaC** (Terraform), CI/CD, blue-green/canary\n- Database migrations: backward-compatible (expand → migrate → contract)\n- **Backups**: PITR (point-in-time recovery), restore drills; RPO/RTO targets\n- **Monitoring**: metrics (latency, errors), logs, traces, alerts (night audit failure, sync lag, payment failures)\n- **Region/latency**: nearest region for Bangladeshi users; check data residency/legal requirements\n\n## 8. Technology stack (examples, not requirements)\n| Layer | Options |\n|---|---|\n| Backend | Node.js/TypeScript (NestJS), Java/Kotlin (Spring), Go, Python (Django), PHP (Laravel — common in BD) |\n| DB | PostgreSQL (range/exclusion constraints, jsonb, RLS) |\n| Cache/Queue | Redis, RabbitMQ/Kafka/SQS |\n| Frontend | React/Next.js, Vue; calendar/tape chart: virtualisation |\n| Mobile | PWA or React Native/Flutter |\n| Infra | AWS/GCP/Azure or local cloud |\n\n## 9. Hard technical challenges\n1. **Inventory concurrency** and channel sync latency\n2. **Time zones / business date**\n3. **Rate engine** complexity and performance\n4. **Folio accuracy** (rounding, tax, routing)\n5. Keeping **reports/audit** correct\n6. **Integration fragility** (third-party changes)\n7. **Data migration** from old PMSs/Excel\n8. **UI performance** (tape chart)\n9. **Offline tolerance**\n\n---\n\n## 10. SaaS platform layer: entitlements, onboarding, sandbox, import\n\n### 10.1 Module entitlements / feature flags\nWhich modules are on for which property, by plan (POS, Spa, Events, API access, channels).\n```sql\nplan(id, code, name, price_model)\nplan_module(plan_id, module_code, limits jsonb)        -- e.g. max_rooms, api_calls\nmodule_entitlement(org_id, property_id NULL, module_code, enabled, valid_from, valid_to, source)\n```\n- **Where enforced:** API gateway/middleware (403 `module.not_enabled`), hidden UI menus, skipped background jobs\n- **Cache**: short-TTL entitlements; invalidate immediately on upgrade\n- **Downgrade**: never delete data — read-only/hidden; handle limit overruns (too many rooms)\n\n### 10.2 Onboarding wizard\nSteps: property details → room types → bulk rooms → amenities → rates and season templates → tax/service charge → policies → payment methods → staff/roles → go-live checklist.\n```sql\nonboarding_progress(property_id, step_code, status, completed_at, data jsonb)\n```\nEvery step resumable, validated (no rooms without room types), \"do later\" allowed, and a final readiness report (which config is missing).\n\n### 10.3 Sandbox / test mode\n- A separate `mode='test'` property/data for training and trials; simulated payments (gateway sandbox), channels and SMS disabled or dummy\n- Isolated from live reports, tax exports and invoice number sequences\n- Clear/copy policy when converting test → live\n- A clear UI banner (so nobody mistakes it for live)\n\n### 10.4 Data import / export\n- **Import:** CSV/Excel templates (rooms, guests, future bookings, deposit balances) → `import_job` → validation (per-row error report) → dry run → commit\n```sql\nimport_job(id, property_id, type, status, file_ref, stats jsonb, created_by)\nimport_row(job_id, row_no, status, error, entity_id)\n```\n- **Export:** customers own their data (guests, bookings, folios, invoices); CSV/JSON; reduces lock-in fear, builds trust\n\n## 11. Recommended cloud PMS architecture (summary)\n\n```mermaid\nflowchart TB\n    subgraph Edge\n      CDN[CDN + WAF]\n    end\n    subgraph Apps\n      WEB[Staff Web App - React]\n      PWA[Mobile PWA: HK, Maintenance, Staff]\n      BE[Booking Engine - public]\n    end\n    CDN --> WEB & PWA & BE\n    CDN --> GW[API Gateway: authN/Z, rate limit, entitlements]\n    GW --> MONO[Modular Monolith]\n    subgraph MONO[Modular Monolith - one deployment]\n      CORE[Core: property, room, inventory, rate, reservation, guest]\n      LED[Ledger: folio, payment, invoice, night audit]\n      OPS[Ops: HK, maintenance, staff, stock]\n      ADD[Add-ons: POS, spa, venue, CRM]\n      PLAT[Platform: org, user, role, plan, entitlement, onboarding]\n    end\n    MONO --> PG[(PostgreSQL + RLS)]\n    PG --> REP[(Read replica / Warehouse)]\n    MONO --> RD[(Redis: cache, locks, rate limit)]\n    MONO --> OBX[Outbox] --> BUS[[Queue / Event bus]]\n    BUS --> W1[Channel sync workers]\n    BUS --> W2[Webhook workers]\n    BUS --> W3[Notification workers: SMS/WhatsApp/Email]\n    BUS --> W4[Night audit / schedulers]\n    BUS --> W5[Report & export workers]\n    W1 --> OTA[(OTA / iCal / CM)]\n    W3 --> MSG[(Providers)]\n    MONO --> PGW[Payment adapters: bKash, SSLCommerz, cards]\n    MONO --> OBJ[(Object storage: IDs, files)]\n    MONO --> OBS[Observability: logs, metrics, traces]\n```\n\n**Decision summary:**\n| Topic | Recommendation |\n|---|---|\n| Starting architecture | Modular monolith + worker processes |\n| DB | PostgreSQL (exclusion constraints, jsonb, RLS, partitioning) |\n| Tenancy | Shared DB + `org_id` + RLS; separate DB option for large chains |\n| Inventory | Materialised per-date counters + reconciliation + conditional update |\n| Events | Transactional outbox → queue; idempotent consumers |\n| Real time | SSE/WebSocket (room board, new bookings) |\n| Offline | PWA cache + write queue (limited operations); local bridge (locks, printers) |\n| Security | MFA, RBAC + limits, field encryption, audit, signed webhooks |\n| Observability | Alerts on night audit failure, sync lag, payment failure |\n| Deployment | Containers, IaC, blue-green/canary, PITR backups + restore drills |\n\n## 12. Recommended front-end module structure (summary)\n\n```\napps/\n  staff-web/              (React/Next.js)\n    src/\n      app/                routing, layout, providers (auth, tenant, i18n, theme)\n      shared/             ui kit, api client (generated from OpenAPI), hooks, utils, i18n (bn/en), formatters (BDT, lakh/crore, date)\n      modules/\n        dashboard/\n        front-office/     arrivals, departures, in-house, walk-in, check-in, check-out, room-rack\n        reservations/     search, form, details, tape-chart, groups, waitlist\n        rooms-inventory/  room-types, rooms, availability-calendar, ooo\n        rates/            rate-plans, rate-calendar, restrictions, rules, promos, taxes, quote-simulator\n        guests/           profiles, documents, merge, crm (segments, campaigns, loyalty)\n        folio/            folio-view, post-charge, payment, split/transfer, invoice, credit-note\n        housekeeping/     board, assignments, inspections, lost-found\n        maintenance/      work-orders, preventive\n        cashier-audit/    shifts, night-audit wizard, reconciliation\n        pos/              outlets, tables, orders, menu, kot\n        spa-activities/   resources calendar, bookings\n        events/           venues calendar, beo\n        staff/            roster, attendance\n        stock/            items, movements, purchase-orders\n        channels/         connections, mappings, sync status, unmapped queue\n        reports/          center, viewer, scheduler\n        settings/         property, policies, users-roles, integrations, onboarding, entitlements\n  hk-mobile-pwa/          mobile-first: my rooms, Start/Done, minibar, photos, offline queue\n  booking-engine/         public: search → room → checkout → payment → confirmation (bn/en, mobile)\n```\n**Principles:** module-based folders (feature-sliced); each module owns its api/hooks/components/routes; entitlement and permission guards on routes; virtualisation for the tape chart and large lists; optimistic UI only for safe operations (never payments/inventory); server-state caching (React Query style).\n"}, "14": {"n": 14, "title": "১৪ — সিকিউরিটি, রোল, অডিট, কমপ্লায়েন্স", "md": "# ১৪ — সিকিউরিটি, রোল, অডিট, কমপ্লায়েন্স\n\n---\n\n## ১. কেন PMS-এ নিরাপত্তা অতিরিক্ত গুরুত্বপূর্ণ\nPMS-এ থাকে: ID/পাসপোর্ট ছবি, ফোন, ঠিকানা, পেমেন্ট রেকর্ড, টাকা-সংক্রান্ত অনুমতি। ফাঁস বা অপব্যবহার = আইনি, আর্থিক, সুনামের ক্ষতি।\n\n## ২. অথেন্টিকেশন\n- পাসওয়ার্ড হ্যাশ: **Argon2id** বা bcrypt (কখনো প্লেইন/SHA নয়)\n- **MFA** (বিশেষত ম্যানেজার/অ্যাডমিন/অ্যাকাউন্টেন্ট)\n- সেশন: ছোট access token + refresh; ডিভাইস ট্র্যাক; লগ-আউট সব সেশন\n- SSO (Google/Microsoft/OIDC) এন্টারপ্রাইজে\n- ব্রুট-ফোর্স সুরক্ষা: লকআউট/ডিলে, CAPTCHA\n- API: OAuth2 client credentials / scoped API key; key rotate; সিক্রেট ভল্টে\n- ফ্রন্ট ডেস্কে শেয়ার্ড লগইন বন্ধ করো (অডিট অকার্যকর হয়) — ফাস্ট স্যুইচ PIN বিকল্প\n\n## ৩. অথোরাইজেশন (RBAC + ABAC)\n\n### সাধারণ রোল\n| রোল | কী পারে |\n|---|---|\n| Owner/Admin | সব, সেটিংস, ইউজার |\n| General Manager | রিপোর্ট, override, রিফান্ড অনুমোদন |\n| Front Desk Agent | বুকিং, check-in/out, পেমেন্ট নেওয়া |\n| Cashier | পেমেন্ট, শিফট বন্ধ |\n| Reservation Agent | বুকিং, রেট দেখা |\n| Revenue Manager | রেট/restriction এডিট |\n| Housekeeping Supervisor/Staff | HK স্ট্যাটাস |\n| Maintenance | work order |\n| Accountant | ledger, AR, এক্সপোর্ট, ট্যাক্স |\n| Night Auditor | night audit চালানো |\n| Read-only/Auditor | দেখা, রপ্তানি |\n\n### পারমিশন গ্রানুলারিটি (উদাহরণ কোড)\n```\nreservation.create|modify|cancel|reinstate\nfolio.post_charge|post_payment|adjust|transfer|void\npayment.refund (limit অনুযায়ী)\ndiscount.apply (সর্বোচ্চ % অনুযায়ী)\nrate.override\nnight_audit.run\nreport.view_financial\nguest.view_documents (সংবেদনশীল)\nuser.manage\n```\n**ABAC/সীমা**: refund ≤ X টাকা সুপারভাইজার ছাড়া; discount ≤ Y%; নির্দিষ্ট property-তে সীমিত; শুধু নিজের শিফটের ক্যাশ।\n**Maker-checker / দ্বৈত অনুমোদন**: বড় রিফান্ড, বন্ধ folio পুনঃখোলা, backdated posting।\n\n## ৪. অডিট লগ\n\n**কী লগ হবে:** লগইন/ব্যর্থ লগইন, রোল বদল, রিফান্ড/ভয়েড/অ্যাডজাস্টমেন্ট, রেট ওভাররাইড, ডিসকাউন্ট, check-out-এর পর পরিবর্তন, গেস্ট ডকুমেন্ট দেখা, রিপোর্ট এক্সপোর্ট, সেটিংস বদল, night audit, key ইস্যু।\n```\naudit_log(id, org_id, property_id, user_id, action, entity, entity_id,\n  before jsonb, after jsonb, reason, ip, user_agent, at)\n```\n**নিয়ম:** append-only, মুছা/এডিট নিষেধ (DB পারমিশন/হ্যাশ চেইন), পর্যাপ্ত retention, খোঁজা যায়, অস্বাভাবিক কার্যক্রম অ্যালার্ট (রাতে অনেক ভয়েড)।\n**\"কারণ\" বাধ্যতামূলক** সংবেদনশীল অ্যাকশনে।\n\n## ৫. ডেটা সুরক্ষা\n- **ট্রানজিটে**: TLS সর্বত্র; HSTS\n- **বিশ্রামে**: ডিস্ক এনক্রিপশন + ফিল্ড-লেভেল (ID নম্বর, কার্ড সম্পর্কিত); কী ম্যানেজমেন্ট (KMS)\n- **ফাইল**: ID ছবি প্রাইভেট স্টোরেজ, সাইনড URL (স্বল্পমেয়াদি)\n- **মাস্কিং**: UI-তে ID/ফোন আংশিক; \"দেখাও\" ক্লিক লগ হয়\n- **ব্যাকআপ** এনক্রিপ্টেড, রিস্টোর টেস্ট\n- **লগে সংবেদনশীল ডেটা নয়** (টোকেন, কার্ড, ID)\n\n## ৬. পেমেন্ট নিরাপত্তা\n- কার্ড নম্বর নিজের সার্ভারে নয় — gateway-hosted/tokenization (PCI DSS পরিধি ছোট)\n- Webhook সাইন যাচাই; সিক্রেট রোটেশন\n- (ডক ০৯)\n\n## ৭. আবেদনযোগ্য কমপ্লায়েন্স ধারণা\n| ক্ষেত্র | মন্তব্য |\n|---|---|\n| **গেস্ট নিবন্ধন/আইনি রিপোর্টিং** | দেশভিত্তিক; বাংলাদেশের প্রযোজ্য নিয়ম ডক ১৬-তে যাচাই করে |\n| **ডেটা গোপনীয়তা** | বাংলাদেশের ডেটা প্রোটেকশন আইন/অধ্যাদেশ পরিস্থিতি যাচাই করো; GDPR বিদেশি গেস্ট/ইইউ ক্লায়েন্টে প্রাসঙ্গিক হতে পারে |\n| **PCI DSS** | কার্ড ডেটা না রাখলে সীমিত |\n| **কর/ইনভয়েস** | অডিটযোগ্য, অপরিবর্তনীয় ইনভয়েস, ক্রমিক নম্বর |\n| **রিটেনশন** | কতদিন ফোলিও/ইনভয়েস/ID রাখবে — আইন + নীতি; মুছে ফেলার (erasure) অনুরোধ হ্যান্ডেল |\n\n> আইনি প্রয়োজন সময়ের সাথে বদলায় — আইনজীবী বা সংশ্লিষ্ট কর্তৃপক্ষ থেকে নিশ্চিত হও।\n\n## ৮. অ্যাপ নিরাপত্তা\n- ইনপুট ভ্যালিডেশন, প্যারামিটারাইজড কোয়েরি (SQLi), XSS/CSRF সুরক্ষা\n- IDOR প্রতিরোধ: প্রতিটি রিসোর্স অ্যাক্সেসে org/property চেক\n- রেট লিমিট, WAF, bot সুরক্ষা (booking engine)\n- নির্ভরতা স্ক্যান, সিক্রেট স্ক্যান\n- পেনিট্রেশন টেস্ট, ঘটনা-প্রতিক্রিয়া পরিকল্পনা\n- ফিজিক্যাল: রিসেপশন কম্পিউটার লক, স্ক্রিন প্রাইভেসি\n\n## ৯. অভ্যন্তরীণ জালিয়াতি প্রতিরোধ (হোটেল-নির্দিষ্ট)\n- ক্যাশ ভয়েড/ডিসকাউন্ট প্যাটার্ন রিপোর্ট\n- check-out-এর পর চার্জ মোছা/ফোলিও পুনঃখোলা অ্যালার্ট\n- no-show ফি মওকুফ ঘন ঘন\n- রুম \"comp\" অপব্যবহার\n- ক্যাশিয়ার ভেরিয়েন্স প্যাটার্ন\n- দিনের শেষে exception report\n\n## ১০. পিটফল\n1. শেয়ার্ড লগইন\n2. সবাই \"admin\"\n3. অডিট লগ এডিটযোগ্য\n4. ID ছবি পাবলিক URL-এ\n5. API key কোডে/লগে\n6. টেনেন্ট আইসোলেশনে ফাঁক\n7. ব্যাকআপ টেস্ট নয়\n\n---\n\n## ১১. অতিরিক্ত নিরাপত্তা বিবেচনা\n\n- **Sandbox আইসোলেশন:** test প্রপার্টির ডেটা কখনো লাইভ রিপোর্ট/চ্যানেল/SMS/ট্যাক্সে ঢুকবে না; টেস্ট ক্রেডেনশিয়াল আলাদা (ডক ১৩)\n- **Entitlement ভঙ্গ:** মডিউল বন্ধ থাকলে API-ও বন্ধ (UI লুকানো যথেষ্ট নয়)\n- **CRM/মার্কেটিং:** consent লগ, opt-out, রেট লিমিট/কোটা; গেস্ট ডেটা এক্সপোর্টে অনুমতি\n- **স্টাফ ডেটা:** ফোন/উপস্থিতি/বেতন-সংশ্লিষ্ট তথ্য সীমিত রোলে\n- **POS:** ভয়েড/ডিসকাউন্ট সীমা, ক্যাশ ড্রয়ার ইভেন্ট লগ, Z-রিপোর্ট অপরিবর্তনীয়\n- **পাবলিক API/booking engine:** bot প্রতিরোধ, ইনভেন্টরি scraping সীমা, প্রমো কোড brute-force রোধ\n", "title_en": "14 — Security, Roles, Audit & Compliance", "md_en": "# 14 — Security, Roles, Audit & Compliance\n\n---\n\n## 1. Why security matters even more in a PMS\nA PMS holds ID/passport images, phone numbers, addresses, payment records and money-related permissions. A leak or misuse = legal, financial and reputational damage.\n\n## 2. Authentication\n- Password hashing: **Argon2id** or bcrypt (never plain text/SHA)\n- **MFA** (especially managers/admins/accountants)\n- Sessions: short access token + refresh; device tracking; \"log out all sessions\"\n- SSO (Google/Microsoft/OIDC) for enterprises\n- Brute-force protection: lockout/delay, CAPTCHA\n- API: OAuth2 client credentials / scoped API keys; key rotation; secrets in a vault\n- No shared logins at the front desk (it breaks the audit trail) — offer fast PIN switching instead\n\n## 3. Authorisation (RBAC + ABAC)\n\n### Typical roles\n| Role | Can do |\n|---|---|\n| Owner/Admin | Everything, settings, users |\n| General Manager | Reports, overrides, refund approval |\n| Front Desk Agent | Bookings, check-in/out, taking payments |\n| Cashier | Payments, shift close |\n| Reservation Agent | Bookings, viewing rates |\n| Revenue Manager | Editing rates/restrictions |\n| Housekeeping Supervisor/Staff | HK status |\n| Maintenance | Work orders |\n| Accountant | Ledger, AR, exports, tax |\n| Night Auditor | Running night audit |\n| Read-only/Auditor | View, export |\n\n### Permission granularity (example codes)\n```\nreservation.create|modify|cancel|reinstate\nfolio.post_charge|post_payment|adjust|transfer|void\npayment.refund (by limit)\ndiscount.apply (by max %)\nrate.override\nnight_audit.run\nreport.view_financial\nguest.view_documents (sensitive)\nuser.manage\n```\n**ABAC/limits**: refunds ≤ X taka without a supervisor; discount ≤ Y%; restricted to specific properties; only cash from one's own shift.\n**Maker-checker / dual approval**: large refunds, reopening a closed folio, backdated posting.\n\n## 4. Audit log\n\n**What to log:** logins/failed logins, role changes, refunds/voids/adjustments, rate overrides, discounts, changes after check-out, viewing guest documents, report exports, settings changes, night audit, key issues.\n```\naudit_log(id, org_id, property_id, user_id, action, entity, entity_id,\n  before jsonb, after jsonb, reason, ip, user_agent, at)\n```\n**Rules:** append-only, no delete/edit (DB permissions/hash chain), sufficient retention, searchable, alerts on unusual activity (many voids at night).\n**A \"reason\" is mandatory** for sensitive actions.\n\n## 5. Data protection\n- **In transit**: TLS everywhere; HSTS\n- **At rest**: disk encryption + field-level encryption (ID numbers, card-related data); key management (KMS)\n- **Files**: ID images in private storage, short-lived signed URLs\n- **Masking**: partial ID/phone in the UI; clicking \"show\" is logged\n- **Backups** encrypted, restores tested\n- **No sensitive data in logs** (tokens, cards, IDs)\n\n## 6. Payment security\n- Never store card numbers on your servers — gateway-hosted/tokenisation (small PCI DSS scope)\n- Verify webhook signatures; rotate secrets\n- (Doc 09)\n\n## 7. Applicable compliance areas\n| Area | Comment |\n|---|---|\n| **Guest registration/legal reporting** | Country-specific; Bangladesh rules in doc 16 |\n| **Data privacy** | Check the current status of Bangladesh's data protection law/ordinance; GDPR may matter for foreign/EU guests and clients |\n| **PCI DSS** | Limited if you store no card data |\n| **Tax/invoices** | Auditable, immutable invoices, sequential numbers |\n| **Retention** | How long to keep folios/invoices/IDs — law + policy; handle erasure requests |\n\n> Legal requirements change — confirm with a lawyer or the relevant authority.\n\n## 8. Application security\n- Input validation, parameterised queries (SQLi), XSS/CSRF protection\n- Prevent IDOR: check org/property on every resource access\n- Rate limiting, WAF, bot protection (booking engine)\n- Dependency scanning, secret scanning\n- Penetration tests, incident response plan\n- Physical: lock reception computers, screen privacy\n\n## 9. Preventing internal fraud (hotel-specific)\n- Reports on cash void/discount patterns\n- Alerts on deleting charges / reopening folios after check-out\n- Frequent no-show fee waivers\n- Abuse of \"comp\" rooms\n- Cashier variance patterns\n- End-of-day exception report\n\n## 10. Pitfalls\n1. Shared logins\n2. Everyone is \"admin\"\n3. Editable audit log\n4. ID images on public URLs\n5. API keys in code/logs\n6. Gaps in tenant isolation\n7. Untested backups\n\n---\n\n## 11. Additional security considerations\n\n- **Sandbox isolation:** test property data never reaches live reports/channels/SMS/tax; separate test credentials (doc 13)\n- **Entitlement bypass:** when a module is off, its API is off too (hiding the UI is not enough)\n- **CRM/marketing:** consent log, opt-out, rate limits/quotas; permission to export guest data\n- **Staff data:** phone/attendance/pay-related data limited to certain roles\n- **POS:** void/discount limits, cash drawer event log, immutable Z-reports\n- **Public API/booking engine:** bot protection, limits on inventory scraping, promo code brute-force protection\n"}, "15": {"n": 15, "title": "১৫ — রিপোর্ট ও অ্যানালিটিক্স", "md": "# ১৫ — রিপোর্ট ও অ্যানালিটিক্স\n\n---\n\n## ১. রিপোর্ট কেন\nমালিক/ম্যানেজার সিদ্ধান্ত নেয় (দাম, স্টাফ, মার্কেটিং), অ্যাকাউন্টেন্ট হিসাব মেলায়, কর্তৃপক্ষ কর দেখে, অডিটর যাচাই করে।\n> মালিকেরা **শিডিউলড ইমেইল রিপোর্ট** (যেমন প্রতিদিন ভোরে owner report) প্রত্যাশা করেন — শুরু থেকেই পরিকল্পনা করো।\n\n## ২. রিপোর্ট ক্যাটাগরি\n\n### অপারেশনাল (দৈনিক)\n| রিপোর্ট | উদ্দেশ্য |\n|---|---|\n| Arrivals / Departures | আজ কে আসছে/যাচ্ছে |\n| In-house guest list | বর্তমান থাকা গেস্ট |\n| Room status / HK report | রুমের অবস্থা, কাজ |\n| No-show / Cancellation | হারানো বুকিং |\n| Expected occupancy (forecast) | ভবিষ্যৎ ৩০/৯০ দিন |\n| Downtime report | সিস্টেম বন্ধ থাকলে প্রিন্ট |\n| Maintenance / OOO list | |\n\n### আর্থিক\n| রিপোর্ট | উদ্দেশ্য |\n|---|---|\n| **Manager's daily report** | occupancy, ADR, RevPAR, revenue, payments |\n| Revenue by department / charge code | |\n| Payment / Cashier shift | নগদ, কার্ড, bKash আলাদা |\n| Deposits & advance ledger | দায় |\n| City ledger / AR aging | |\n| Tax / VAT report | মাসিক রিটার্নের ভিত্তি |\n| Commission report | OTA/এজেন্ট |\n| Trial balance / Night audit | |\n| Refund & void report | জালিয়াতি নজর |\n\n### ম্যানেজমেন্ট/স্ট্র্যাটেজিক\n| রিপোর্ট | উদ্দেশ্য |\n|---|---|\n| Pickup / Pace | একই সময়ে গতবারের তুলনা |\n| Channel / Source production | কোন চ্যানেল কত আয়, কমিশন |\n| Market segment | corporate, leisure, group |\n| ADR by room type/segment | |\n| Length of stay, Lead time | |\n| Guest nationality / repeat | |\n| Rate parity / comp set (বাহ্যিক ডেটা) | |\n| Cancellation rate by channel | |\n\n## ৩. KPI সংজ্ঞা (স্পষ্ট লিখে রাখো!)\n```\nOccupancy   = occupied_room_nights / available_room_nights\nADR         = room_revenue / occupied_room_nights\nRevPAR      = room_revenue / available_room_nights\nTRevPAR     = total_revenue / available_room_nights\nGOPPAR      = GOP / available_room_nights\nNet ADR     = (room_revenue − commission) / occupied_room_nights\nCancel %    = cancelled / total_bookings (সময়কাল অনুযায়ী)\n```\n**সংজ্ঞা-সিদ্ধান্ত (কনফিগযোগ্য):**\n- OOO রুম available থেকে বাদ?\n- comp/house-use occupied গণনা?\n- room revenue কি ট্যাক্স/সার্ভিস চার্জ ছাড়া? (সাধারণত হ্যাঁ — নেট)\n- day-use গণনা?\n- Group block unsold রুম?\n> একই রিপোর্ট দুই জায়গায় ভিন্ন সংখ্যা = বিশ্বাস নষ্ট। সংজ্ঞা এক জায়গায় লিখে সব রিপোর্টে একই ফাংশন।\n\n## ৪. ডেটা আর্কিটেকচার\n```mermaid\nflowchart LR\n    OLTP[(OLTP Postgres)] -->|CDC / ETL| DW[(Warehouse: facts + dims)]\n    DW --> BI[Dashboards / Scheduled reports]\n    OLTP --> RR[(Read replica - operational reports)]\n    RR --> OPS[Arrivals, In-house]\n    BI --> MAIL[Owner daily email 6am]\n```\n- **অপারেশনাল রিপোর্ট**: রিড রেপ্লিকা/সরাসরি, লাইভ\n- **বিশ্লেষণ**: nightly snapshot টেবিল\n- **ডেইলি স্ন্যাপশট টেবিল**: `daily_property_stats(property_id, business_date, rooms_available, rooms_sold, room_revenue, ...)` — night audit-এ পূরণ; ইতিহাস অপরিবর্তনীয় (পরে ডেটা বদলালেও পুরনো রিপোর্ট স্থির রাখে, বা পুনঃগণনা নীতি)\n- **Fact/Dimension**: `fact_room_night(date, property, room_type, rate_plan, channel, segment, rooms, revenue, ...)`, dims: date, channel, segment, guest_country\n\n## ৫. রিপোর্ট ইঞ্জিনিয়ারিং\n- প্যারামিটার: তারিখ/property/ফিল্টার; export: PDF, Excel/CSV; প্রিন্টযোগ্য\n- **শিডিউলড ডেলিভারি**: ইমেইল/WhatsApp/PDF, স্টাফ ও মালিক টাইমজোনে\n- **বিলম্বিত/ভারী** রিপোর্ট: অ্যাসিঙ্ক জব + ডাউনলোড লিংক\n- **অনুমতি**: আর্থিক রিপোর্ট শুধু নির্দিষ্ট রোল (ডক ১৪)\n- **বাংলা** লেবেল, সংখ্যা ফরম্যাট (লাখ/কোটি গ্রুপিং — ৳১১,৫২,০০০ বনাম ১,১৫২,০০০; কনফিগযোগ্য)\n- **সঠিকতা পরীক্ষা**: রিপোর্ট বনাম ledger মিলাও (night audit চেক)\n\n## ৬. API\n```\nGET  /v1/reports/{name}?property_id=&from=&to=&format=json|csv|pdf\nPOST /v1/reports/schedules   { report, cron, recipients, format }\nGET  /v1/dashboard/summary?date=\nGET  /v1/exports/{id}\n```\n\n## ৭. স্ক্রিন\nDashboard (আজকের KPI, arrivals, occupancy chart), Report center (খোঁজা, ফেভারিট), Report viewer (ফিল্টার, drill-down, export), Scheduler, Forecast/Pace চার্ট।\n\n## ৮. পিটফল\n1. KPI সংজ্ঞা অসঙ্গত\n2. লাইভ DB-তে ভারী কোয়েরি\n3. ঐতিহাসিক সংখ্যা বদলে যাওয়া (config বদলালে)\n4. টাইমজোন/business date ভুল\n5. কর রিপোর্ট ও ইনভয়েস অমিল\n6. রিপোর্টে রোল চেক নেই\n\n---\n\n## ৯. Owner Daily Report ও অ্যাড-অন রিপোর্ট\n\n### Owner Daily Report (শিডিউলড)\nপ্রতিদিন সকালে (যেমন ৬টা, property-local) ইমেইল/WhatsApp: গতকালের occupancy, ADR, RevPAR, রুম/F&B/স্পা রেভিনিউ, পেমেন্ট ভাগ (নগদ/কার্ড/MFS), আজকের arrivals/departures, আগামী ৭ দিনের forecast, ওভারডিউ AR, no-show/ক্যানসেল, অস্বাভাবিক ঘটনা (বড় রিফান্ড, ভয়েড)। ডেটা night audit-এর `daily_property_stats` স্ন্যাপশট থেকে।\n\n### অ্যাড-অন রিপোর্ট\n| মডিউল | রিপোর্ট |\n|---|---|\n| POS | আউটলেট বিক্রি, আইটেম মিক্স, ভয়েড/ডিসকাউন্ট, টেবিল টার্নওভার, Z-রিপোর্ট |\n| Spa/Activities | রিসোর্স ইউটিলাইজেশন, থেরাপিস্ট আয়/কমিশন, প্যাকেজ বিক্রি |\n| Events | ভেন্যু ইউটিলাইজেশন, BEO মূল্য, পাইপলাইন |\n| Staff | উপস্থিতি, ওভারটাইম, শিফট কভারেজ |\n| Stock | স্টক ভ্যালু, মুভমেন্ট, রিঅর্ডার, অপচয়, সাপ্লায়ার ব্যয় |\n| CRM | ক্যাম্পেইন পারফরম্যান্স, রিপিট রেট, লয়ালটি লায়াবিলিটি |\n| Channels | চ্যানেল প্রোডাকশন, কমিশন, ডাইরেক্ট শেয়ার, sync ব্যর্থতা |\n", "title_en": "15 — Reports & Analytics", "md_en": "# 15 — Reports & Analytics\n\n---\n\n## 1. Why reports\nOwners/managers make decisions (pricing, staffing, marketing), accountants reconcile, authorities check taxes, auditors verify.\n> Owners expect **scheduled email reports** (e.g. a daily owner report early every morning) — plan this from the start.\n\n## 2. Report categories\n\n### Operational (daily)\n| Report | Purpose |\n|---|---|\n| Arrivals / Departures | Who is coming/leaving today |\n| In-house guest list | Current guests |\n| Room status / HK report | Room states, tasks |\n| No-show / Cancellation | Lost bookings |\n| Expected occupancy (forecast) | Next 30/90 days |\n| Downtime report | Printed when the system is down |\n| Maintenance / OOO list | |\n\n### Financial\n| Report | Purpose |\n|---|---|\n| **Manager's daily report** | Occupancy, ADR, RevPAR, revenue, payments |\n| Revenue by department / charge code | |\n| Payment / Cashier shift | Cash, card, bKash separately |\n| Deposits & advance ledger | Liabilities |\n| City ledger / AR aging | |\n| Tax / VAT report | Basis for monthly returns |\n| Commission report | OTA/agents |\n| Trial balance / Night audit | |\n| Refund & void report | Fraud watch |\n\n### Management/strategic\n| Report | Purpose |\n|---|---|\n| Pickup / Pace | Comparison with the same point last time |\n| Channel / Source production | Revenue and commission per channel |\n| Market segment | Corporate, leisure, group |\n| ADR by room type/segment | |\n| Length of stay, lead time | |\n| Guest nationality / repeat | |\n| Rate parity / comp set (external data) | |\n| Cancellation rate by channel | |\n\n## 3. KPI definitions (write them down!)\n```\nOccupancy   = occupied_room_nights / available_room_nights\nADR         = room_revenue / occupied_room_nights\nRevPAR      = room_revenue / available_room_nights\nTRevPAR     = total_revenue / available_room_nights\nGOPPAR      = GOP / available_room_nights\nNet ADR     = (room_revenue − commission) / occupied_room_nights\nCancel %    = cancelled / total_bookings (per period)\n```\n**Definition decisions (configurable):**\n- Remove OOO rooms from available?\n- Count comp/house-use as occupied?\n- Is room revenue excluding tax/service charge? (usually yes — net)\n- Count day use?\n- Unsold group block rooms?\n> The same report showing different numbers in two places destroys trust. Define once and use the same function in every report.\n\n## 4. Data architecture\n```mermaid\nflowchart LR\n    OLTP[(OLTP Postgres)] -->|CDC / ETL| DW[(Warehouse: facts + dims)]\n    DW --> BI[Dashboards / Scheduled reports]\n    OLTP --> RR[(Read replica - operational reports)]\n    RR --> OPS[Arrivals, In-house]\n    BI --> MAIL[Owner daily email 6am]\n```\n- **Operational reports**: read replica/direct, live\n- **Analysis**: nightly snapshot tables\n- **Daily snapshot table**: `daily_property_stats(property_id, business_date, rooms_available, rooms_sold, room_revenue, ...)` — filled in night audit; history immutable (old reports stay stable even if data changes later, or follow a recalculation policy)\n- **Fact/dimension**: `fact_room_night(date, property, room_type, rate_plan, channel, segment, rooms, revenue, ...)`, dims: date, channel, segment, guest_country\n\n## 5. Report engineering\n- Parameters: date/property/filters; export: PDF, Excel/CSV; printable\n- **Scheduled delivery**: email/WhatsApp/PDF, in staff and owner time zones\n- **Slow/heavy** reports: async job + download link\n- **Permissions**: financial reports only for certain roles (doc 14)\n- **Bangla** labels, number formatting (lakh/crore grouping — ৳11,52,000 vs 1,152,000; configurable)\n- **Accuracy checks**: reconcile reports with the ledger (night audit check)\n\n## 6. API\n```\nGET  /v1/reports/{name}?property_id=&from=&to=&format=json|csv|pdf\nPOST /v1/reports/schedules   { report, cron, recipients, format }\nGET  /v1/dashboard/summary?date=\nGET  /v1/exports/{id}\n```\n\n## 7. Screens\nDashboard (today's KPIs, arrivals, occupancy chart), report centre (search, favourites), report viewer (filters, drill-down, export), scheduler, forecast/pace charts.\n\n## 8. Pitfalls\n1. Inconsistent KPI definitions\n2. Heavy queries on the live DB\n3. Historical numbers changing (when config changes)\n4. Time zone / business date mistakes\n5. Tax report and invoices disagree\n6. No role check on reports\n\n---\n\n## 9. Owner daily report and add-on reports\n\n### Owner daily report (scheduled)\nEvery morning (e.g. 6 am property-local) by email/WhatsApp: yesterday's occupancy, ADR, RevPAR, room/F&B/spa revenue, payment split (cash/card/MFS), today's arrivals/departures, next 7 days' forecast, overdue AR, no-shows/cancellations, unusual events (large refunds, voids). Data comes from the night audit `daily_property_stats` snapshot.\n\n### Add-on reports\n| Module | Reports |\n|---|---|\n| POS | Outlet sales, item mix, voids/discounts, table turnover, Z-report |\n| Spa/Activities | Resource utilisation, therapist revenue/commission, package sales |\n| Events | Venue utilisation, BEO value, pipeline |\n| Staff | Attendance, overtime, shift coverage |\n| Stock | Stock value, movements, reorders, waste, supplier spend |\n| CRM | Campaign performance, repeat rate, loyalty liability |\n| Channels | Channel production, commission, direct share, sync failures |\n"}, "16": {"n": 16, "title": "১৬ — বাংলাদেশ PMS", "md": "# ১৬ — বাংলাদেশ PMS\n\n> **যাচাই-স্তর চিহ্ন:** ✔ = প্রকাশ্য সূত্র পাওয়া গেছে · ◐ = আংশিক/পরস্পরবিরোধী · ✖ = পাইনি, যাচাই করতে হবে।\n> আইনি/কর বিষয়ে এটি পরামর্শ নয়। আইনজীবী বা VAT কনসালট্যান্ট থেকে নিশ্চিত করো।\n\n---\n\n## ১. বাংলাদেশের হোটেল বাজারের বৈশিষ্ট্য (প্রকৌশলীর চোখে)\n\n| বৈশিষ্ট্য | PMS-এ প্রভাব |\n|---|---|\n| অনেক ছোট/স্বাধীন হোটেল, গেস্ট হাউস | সস্তা, সহজ, মোবাইল-ফ্রেন্ডলি, দ্রুত সেটআপ |\n| খাতা/এক্সেল/WhatsApp-এ চলা প্রপার্টি | স্প্রেডশিট থেকে মাইগ্রেশন ফিচার |\n| নগদ + bKash/কার্ড মিশ্র পেমেন্ট | মাল্টি-মেথড, split payment |\n| স্থানীয় সিজন (ঈদ, পহেলা বৈশাখ, কক্সবাজার পিক) | ইভেন্ট-রেট রুল, minimum stay |\n| বাংলা স্টাফ/গেস্ট | বাংলা UI, SMS/ইনভয়েস |\n| বিদ্যুৎ/ইন্টারনেট অস্থির | offline সহনশীলতা, downtime রিপোর্ট |\n| চেইন/৫-তারকা + অনেক স্বাধীন | দুই স্তরের পণ্য: এন্টারপ্রাইজ বনাম লাইট |\n| OTA নির্ভরতা + কমিশন | direct booking engine মূল্যবান |\n\n## ২. আইনি কাঠামো\n\n### Hotel and Restaurant Act, 2014 ✔ (ওয়েব সারাংশ)\n- ২০১৪ সালের নভেম্বরে প্রকাশিত; আগের ১৯৮২ অধ্যাদেশ আপিল বিভাগের রায়ে অকার্যকর হয়।\n- হোটেল সংজ্ঞা: কমপক্ষে ১০ রুম (অন্যান্য সুবিধাসহ); রেস্তোরাঁ: ৩০+ জনকে খাবার দেওয়ার সক্ষমতা।\n- নিবন্ধন ও লাইসেন্স ছাড়া ব্যবসা অবৈধ; লাইসেন্স তিন বছরের, নবায়নযোগ্য; কন্ট্রোলার সাধারণত জেলা প্রশাসক (DC) বা অনুমোদিত ব্যক্তি।\n- মালিকানা বদলে কন্ট্রোলারকে জানাতে হয়; কিছু শর্তে গেস্টকে বের করে দেওয়ার বিধান আছে।\n- **PMS-এর প্রভাব:** property সেটিংসে `license_no`, `license_expiry`, রিমাইন্ডার; ১০ রুমের নিচের \"গেস্ট হাউস/লজ\" আলাদা শ্রেণি হতে পারে — আইনি শ্রেণিবিন্যাস যাচাই করো।\n\n### গেস্টের তথ্য পুলিশে জমা ◐\n- ২০২০ সালে ঢাকা মেট্রোপলিটন পুলিশের এক কর্মকর্তা বলেছেন, আইন অনুযায়ী আবাসিক হোটেলকে স্থানীয় ও বিদেশি সব গেস্টের নাম-ঠিকানা কাছের থানায় দিতে হবে, কিন্তু বাস্তবে প্রায়ই মানা হয় না (Dhaka Tribune, ফেব্রুয়ারি ২০২০)।\n- নির্দিষ্ট ফর্ম, সময়সীমা, ডিজিটাল চ্যানেল বা শাস্তি নিশ্চিত নয়। ✖\n- **PMS ডিজাইন (নিরাপদ ধরে নিয়ে):** `guest_registry_export` — তারিখ-ভিত্তিক গেস্ট তালিকা (নাম, ঠিকানা, ID টাইপ/নম্বর, জাতীয়তা, check-in/out, রুম) PDF/CSV এক্সপোর্ট; ফরম্যাট কনফিগযোগ্য, যাতে আইনি ফরম্যাট জানলে বদলানো যায়।\n- তুলনার জন্য: ভারতে foreigner-এর জন্য Form C ২৪ ঘণ্টার মধ্যে; থাইল্যান্ডে বিদেশি গেস্ট ২৪ ঘণ্টায় ইমিগ্রেশনে রিপোর্ট — এগুলো **বাংলাদেশের নিয়ম নয়**, শুধু বোঝার জন্য যে অনেক দেশে এই ধরনের প্রয়োজন আছে।\n- **বিদেশি গেস্ট:** পাসপোর্ট, ভিসা, প্রবেশের তথ্য সংগ্রহের ক্ষেত্র রাখো (ডক ০৩)।\n\n### VAT ও ট্যাক্স ◐\n- হোটেল-রেস্তোরাঁ VAT সম্পর্কে হার ও শর্ত পরস্পরবিরোধী সূত্রে পাওয়া গেছে; ২০২৫-এর জানুয়ারিতে ১৫% করে পরে ফেরানোর সংবাদ আছে।\n- BIN, ইনভয়েস, VDS (উৎসে ভ্যাট কর্তন) ও EFD সম্পর্কে একটি পরামর্শ-ব্লগ উল্লেখ করেছে; **সরকারি সূত্রে যাচাই হয়নি।**\n- বিস্তারিত ও PMS নকশা: ডক ০৬।\n- **সম্ভাব্য PMS প্রয়োজন (যাচাই সাপেক্ষে):** ইনভয়েসে BIN, ক্রমিক ইনভয়েস, VAT ও সার্ভিস চার্জ আলাদা লাইন, মাসিক রিটার্ন এক্সপোর্ট, VDS-যোগ্য কোম্পানির জন্য কর্তন ট্র্যাক, credit note।\n\n### তারকা-শ্রেণি ◐\n- একটি VAT তালিকা অনুযায়ী থ্রি-স্টার বা উচ্চতর হোটেল (পর্যটন মন্ত্রণালয়ের তালিকাভুক্ত) আলাদা শ্রেণি। `property.star_rating`, `property.tourism_listed` ফিল্ড রাখো যাতে ট্যাক্স রুল শ্রেণি অনুযায়ী প্রযোজ্য হয়।\n\n## ৩. পেমেন্ট ও ফিনান্স\n\n| উপায় | স্তর | মন্তব্য |\n|---|---|---|\n| bKash | ✔ | Tokenized Checkout: grant token → create → execute → status/refund, IPN (ডক ০৯) |\n| SSLCommerz | ✔ | session → hosted/easy checkout → IPN → validation API |\n| Nagad, Rocket, Upay, CellFin, ShurjoPay | ◐ | একটি ইউনিফাইড লাইব্রেরি তালিকায় দেখা (Laravel package); প্রতিটি অফিসিয়াল ডক আলাদা পড়ো |\n| Visa/Mastercard | ✔ | গেটওয়ে মাধ্যমে |\n| নগদ | — | ক্যাশিয়ার শিফট, ভেরিয়েন্স |\n| ব্যাংক ট্রান্সফার/চেক | — | corporate/AR |\n| কারেন্সি | — | BDT প্রধান; বিদেশি গেস্টে USD দেখানো/এক্সচেঞ্জ রেট স্ন্যাপশট |\n\n**পরামর্শ:** গেটওয়ে অ্যাডাপ্টার ইন্টারফেস (`createSession`, `verify`, `refund`, `parseWebhook`) বানাও যেন bKash/SSLCommerz/নতুন কেউ plug-in হয়।\n**সংখ্যা ফরম্যাট:** লাখ/কোটি গ্রুপিং (৳১১,৫২,০০০), বাংলা অঙ্ক বিকল্প।\n\n## ৪. স্থানীয় ইন্টিগ্রেশন ও যোগাযোগ\n- **SMS:** স্থানীয় SMS গেটওয়ে/মাস্কিং সেন্ডার আইডির নিয়ম (যাচাই করো); বাংলা (Unicode) SMS দৈর্ঘ্য ছোট — খরচ বাড়ে\n- **WhatsApp:** খুব জনপ্রিয়; Business API অনুমোদিত টেমপ্লেট\n- **ইমেইল:** ইনভয়েস, কনফার্মেশন\n- **NID/পাসপোর্ট যাচাই:** সরকারি NID যাচাই API-র প্রাপ্যতা/শর্ত ✖ অজানা — ডিজাইনে ম্যানুয়াল + OCR, ভবিষ্যতে যাচাই-প্লাগিন\n- **অ্যাকাউন্টিং:** Tally ও স্থানীয় সফটওয়্যারে এক্সপোর্ট (বাজার শেয়ার ✖ অজানা)\n- **ডোর লক, POS:** আন্তর্জাতিক ভেন্ডর + স্থানীয় ইন্টিগ্রেটর\n\n## ৫. বাংলাদেশে পাওয়া PMS পণ্য (প্রকাশ্য তালিকা থেকে)\n\n> সূত্রগুলো ভেন্ডর তালিকা/মার্কেটপ্লেস। বাজার শেয়ার, মান, গ্রাহক সংখ্যা **যাচাই করা হয়নি**।\n\n| পণ্য | উৎপত্তি/অবস্থা | সূত্র |\n|---|---|---|\n| **PEKHOM** | ঢাকা-ভিত্তিক; PMS + অনলাইন বুকিং + চ্যানেল ম্যানেজার (বিবরণ অনুযায়ী) | একটি স্টার্টআপ ডাটাবেস |\n| Oracle Opera, Hotelogix, HotelRunner, KWHotel ইত্যাদি | বাংলাদেশে প্রাপ্য বলে একটি সফটওয়্যার-তালিকা সাইটে তালিকাভুক্ত | softwaresuggest (তালিকা; স্থানীয় উপস্থিতি যাচাই হয়নি) |\n| স্থানীয়ভাবে তৈরি ক্লাউড PMS | কয়েকটি স্থানীয় স্টার্টআপ বাংলা/ইংরেজি, টাকায় মূল্য ও bKash/SSLCommerz দেয় | ভেন্ডর ওয়েবসাইট |\n| কাস্টম/ফ্রিল্যান্স সফটওয়্যার | ফ্রিল্যান্সার/এজেন্সি অল-ইন-ওয়ান (বুকিং ওয়েবসাইট, রেস্টুরেন্ট, HR) বিক্রি করে | ফ্রিল্যান্স মার্কেটপ্লেস |\n> আরও স্থানীয় ভেন্ডর থাকতে পারে যা এখানে নেই।\n\n## ৬. বাংলাদেশ-নির্দিষ্ট ফিচার চেকলিস্ট (প্রস্তাব)\n- [ ] বাংলা UI + বাংলা ইনভয়েস/ইমেইল/SMS\n- [ ] লাখ/কোটি ফরম্যাট\n- [ ] bKash, SSLCommerz, নগদ, কার্ড\n- [ ] ঈদ/বৈশাখ/পিক সিজন রেট টেমপ্লেট\n- [ ] কনফিগযোগ্য VAT/সার্ভিস চার্জ (তারিখ-ভিত্তিক)\n- [ ] BIN সহ ইনভয়েস, credit note\n- [ ] গেস্ট রেজিস্টার এক্সপোর্ট (পুলিশের জন্য কনফিগযোগ্য)\n- [ ] জাতীয় ID/পাসপোর্ট ক্যাপচার\n- [ ] স্প্রেডশিট ইম্পোর্ট\n- [ ] অফলাইন/ডাউনটাইম রিপোর্ট\n- [ ] লাইসেন্স মেয়াদ রিমাইন্ডার\n- [ ] স্থানীয় SMS/WhatsApp\n- [ ] মোবাইল-প্রথম হাউসকিপিং\n\n## ৭. স্থানীয় বাস্তবতার ঝুঁকি\n1. আইন ও VAT ঘন ঘন বদলায় → কনফিগ-চালিত\n2. কম প্রশিক্ষিত স্টাফ → সরল UI, প্রশিক্ষণ মোড\n3. ইন্টারনেট ব্যর্থতা\n4. গেটওয়ে ব্যর্থতা/বিলম্বিত সেটেলমেন্ট\n5. OTA অনুপ্রবেশ ও কমিশন চাপ\n6. ডেটা গোপনীয়তা আইন অনিশ্চয়তা (ডক ১৪)\n\n---\n\n## ৮. স্থানীয় অভিজ্ঞতা: বাংলা, Onboarding ও গেস্ট যোগাযোগ\n\n- **বাংলা প্রথম-শ্রেণি:** স্টাফ UI, গেস্ট ইনভয়েস, কনফার্মেশন ইমেইল/SMS/WhatsApp টেমপ্লেট (গেস্ট `language` অনুযায়ী); বাংলা ফন্ট (PDF-এও এম্বেড), বাংলা অঙ্ক ঐচ্ছিক, লাখ/কোটি ফরম্যাট\n- **Unicode SMS:** বাংলা বার্তা ছোট সীমায় বিভক্ত → খরচ বেশি; দৈর্ঘ্য প্রিভিউ দেখাও\n- **WhatsApp:** জনপ্রিয় চ্যানেল; টেমপ্লেট অনুমোদন, ২৪-ঘণ্টা উইন্ডো নিয়ম, opt-in\n- **স্প্রেডশিট থেকে মাইগ্রেশন:** এক্সেল/খাতা/WhatsApp-এ চলা প্রপার্টির জন্য CSV ইম্পোর্ট, সমান্তরাল রান (ডক ১৩, ১৯, ২৪)\n- **দ্রুত onboarding:** ফোনেই সেটআপ সম্ভব, বাল্ক রুম, স্থানীয় সিজন টেমপ্লেট (ডক ০৫, ০৬), bKash/SSLCommerz আগে-থেকে-কনফিগ\n- **Test mode:** স্টাফ প্রশিক্ষণ (ডক ১৩)\n- **ভিন্ন প্রপার্টি:** গেস্ট হাউস, সার্ভিসড অ্যাপার্টমেন্ট, হোস্টেল — প্রতিটির জন্য সরল ডিফল্ট\n- **মালিক-মুখী:** দৈনিক ইমেইল/WhatsApp রিপোর্ট — মালিক সাধারণত সবসময় সাইটে থাকেন না\n", "title_en": "16 — PMS in Bangladesh", "md_en": "# 16 — PMS in Bangladesh\n\n> **Verification marks:** ✔ = public source found · ◐ = partial/conflicting · ✖ = not found, must be verified.\n> This is not legal or tax advice. Confirm with a lawyer or VAT consultant.\n\n---\n\n## 1. Characteristics of the Bangladeshi hotel market (an engineer's view)\n\n| Characteristic | Impact on the PMS |\n|---|---|\n| Many small/independent hotels and guest houses | Cheap, simple, mobile-friendly, quick setup |\n| Properties run on paper registers/Excel/WhatsApp | Migration-from-spreadsheet features |\n| Mixed cash + bKash/card payments | Multiple methods, split payments |\n| Local seasons (Eid, Pohela Boishakh, Cox's Bazar peak) | Event rate rules, minimum stay |\n| Bangla-speaking staff/guests | Bangla UI, SMS, invoices |\n| Unstable power/internet | Offline tolerance, downtime reports |\n| Chains/5-star + many independents | Two product tiers: enterprise vs lite |\n| OTA dependence + commission | A direct booking engine is valuable |\n\n## 2. Legal framework\n\n### Hotel and Restaurant Act, 2014 ✔ (web summary)\n- Published in November 2014; the earlier 1982 ordinance had become ineffective after an Appellate Division ruling.\n- Definition of a hotel: at least 10 rooms (with other facilities); restaurant: capacity to serve 30+ people.\n- Operating without registration and licence is illegal; licences last three years and are renewable; the controller is usually the Deputy Commissioner (DC) or an authorised person.\n- Changes of ownership must be reported to the controller; there are provisions for evicting guests under certain conditions.\n- **PMS impact:** `license_no`, `license_expiry` and reminders in property settings; \"guest houses/lodges\" below 10 rooms may be a different class — verify the legal classification.\n\n### Submitting guest information to the police ◐\n- In 2020 a Dhaka Metropolitan Police officer said residential hotels are legally required to give the names and addresses of all local and foreign guests to the nearest police station, but this is often not followed in practice (Dhaka Tribune, February 2020).\n- The specific form, deadline, digital channel and penalties are not confirmed. ✖\n- **PMS design (safe assumption):** `guest_registry_export` — a date-based guest list (name, address, ID type/number, nationality, check-in/out, room) as PDF/CSV; configurable format so it can be changed once the legal format is known.\n- For comparison: India requires Form C for foreigners within 24 hours; Thailand requires reporting foreign guests to immigration within 24 hours — these are **not Bangladeshi rules**, only examples that many countries have such requirements.\n- **Foreign guests:** keep fields for passport, visa and entry details (doc 03).\n\n### VAT and tax ◐\n- Sources conflict on hotel/restaurant VAT rates and conditions; there was news in January 2025 of a rise to 15% followed by a reversal.\n- An advisory blog mentions BIN, invoices, VDS (VAT deducted at source) and EFDs; **not verified from government sources.**\n- Details and PMS design: doc 06.\n- **Likely PMS requirements (subject to verification):** BIN on invoices, sequential invoices, VAT and service charge on separate lines, monthly return export, tracking deductions for VDS-eligible companies, credit notes.\n\n### Star classification ◐\n- One VAT list treats three-star-and-above hotels (listed by the tourism ministry) as a separate class. Keep `property.star_rating` and `property.tourism_listed` so tax rules can apply by class.\n\n## 3. Payments and finance\n\n| Method | Level | Comment |\n|---|---|---|\n| bKash | ✔ | Tokenized Checkout: grant token → create → execute → status/refund, IPN (doc 09) |\n| SSLCommerz | ✔ | session → hosted/easy checkout → IPN → validation API |\n| Nagad, Rocket, Upay, CellFin, ShurjoPay | ◐ | Seen in a unified library list (Laravel package); read each official doc separately |\n| Visa/Mastercard | ✔ | Through a gateway |\n| Cash | — | Cashier shift, variance |\n| Bank transfer/cheque | — | Corporate/AR |\n| Currency | — | BDT primary; show USD for foreign guests / exchange-rate snapshot |\n\n**Advice:** build a gateway adapter interface (`createSession`, `verify`, `refund`, `parseWebhook`) so bKash/SSLCommerz/new gateways can plug in.\n**Number format:** lakh/crore grouping (৳11,52,000), optional Bangla digits.\n\n## 4. Local integrations and communication\n- **SMS:** local SMS gateways / masked sender ID rules (verify); Bangla (Unicode) SMS segments are shorter — higher cost\n- **WhatsApp:** very popular; Business API approved templates\n- **Email:** invoices, confirmations\n- **NID/passport verification:** availability/terms of a government NID verification API ✖ unknown — design for manual + OCR, with a verification plug-in later\n- **Accounting:** export to Tally and local software (market share ✖ unknown)\n- **Door locks, POS:** international vendors + local integrators\n\n## 5. PMS products found in Bangladesh (from public listings)\n\n> Sources are vendor lists/marketplaces. Market share, quality and customer counts are **not verified**.\n\n| Product | Origin/status | Source |\n|---|---|---|\n| **PEKHOM** | Dhaka-based; PMS + online booking + channel manager (per description) | A startup database |\n| Oracle Opera, Hotelogix, HotelRunner, KWHotel etc. | Listed as available in Bangladesh on a software-listing site | softwaresuggest (listing; local presence not verified) |\n| Locally built cloud PMSs | Several local startups offer Bangla/English, BDT pricing and bKash/SSLCommerz | Vendor websites |\n| Custom/freelance software | Freelancers/agencies sell all-in-one systems (booking website, restaurant, HR) | Freelance marketplaces |\n> There are likely more local vendors not covered here.\n\n## 6. Bangladesh-specific feature checklist (proposal)\n- [ ] Bangla UI + Bangla invoices/email/SMS\n- [ ] Lakh/crore format\n- [ ] bKash, SSLCommerz, cash, card\n- [ ] Eid/Boishakh/peak season rate templates\n- [ ] Configurable VAT/service charge (date-based)\n- [ ] Invoices with BIN, credit notes\n- [ ] Guest register export (configurable for the police)\n- [ ] National ID/passport capture\n- [ ] Spreadsheet import\n- [ ] Offline/downtime reports\n- [ ] Licence expiry reminders\n- [ ] Local SMS/WhatsApp\n- [ ] Mobile-first housekeeping\n\n## 7. Local risks\n1. Laws and VAT change often → config-driven\n2. Less-trained staff → simple UI, training mode\n3. Internet failures\n4. Gateway failures / delayed settlement\n5. OTA penetration and commission pressure\n6. Data privacy law uncertainty (doc 14)\n\n---\n\n## 8. Local experience: Bangla, onboarding and guest communication\n\n- **Bangla first-class:** staff UI, guest invoices, confirmation email/SMS/WhatsApp templates (by guest `language`); Bangla fonts (embedded in PDFs too), optional Bangla digits, lakh/crore format\n- **Unicode SMS:** Bangla messages split into shorter segments → higher cost; show a length preview\n- **WhatsApp:** a popular channel; template approval, 24-hour window rule, opt-in\n- **Migrating from spreadsheets:** CSV import and parallel running for properties on Excel/registers/WhatsApp (docs 13, 19, 24)\n- **Fast onboarding:** setup possible from a phone, bulk rooms, local season templates (docs 05, 06), bKash/SSLCommerz pre-configured\n- **Test mode:** for staff training (doc 13)\n- **Different properties:** guest houses, serviced apartments, hostels — simple defaults for each\n- **Owner-facing:** daily email/WhatsApp reports — owners are usually not always on site\n"}, "17": {"n": 17, "title": "১৭ — গ্লোবাল PMS", "md": "# ১৭ — গ্লোবাল PMS\n\n> ⚠️ সূত্র: রিভিউ/তুলনা সাইট (প্রায়ই অ্যাফিলিয়েট বা ভেন্ডর-প্রভাবিত; ভেন্ডরের নিজের ব্লগ নিজেকে সুবিধা দিতে পারে, প্রতিযোগীর তুলনা-পেজ নিরপেক্ষ না-ও হতে পারে)। র‍্যাঙ্কিং চূড়ান্ত সত্য নয়। প্রতিটি দাবি ভেন্ডরের অফিসিয়াল ডকে মিলিয়ে নাও (ডক ২৮)।\n\n---\n\n## ১. প্রধান বৈশ্বিক পণ্য\n\n| পণ্য | সাধারণত যে সেগমেন্ট | প্রকাশ্য সূত্রে যা বলা হয় |\n|---|---|---|\n| **Oracle OPERA Cloud** | বড় চেইন, জটিল গ্রুপ | এন্টারপ্রাইজ স্ট্যান্ডার্ড হিসেবে বর্ণিত; মূল্য সাধারণত \"যোগাযোগ করুন\" |\n| **Mews** | ক্লাউড-নেটিভ, ছোট থেকে বড় | খোলা API, ১,০০০+ মার্কেটপ্লেস অ্যাপের দাবি (রিভিউ সাইট), পেমেন্ট ও চেক-ইন অটোমেশন |\n| **Cloudbeds** | স্বাধীন/বুটিক | PMS + চ্যানেল ম্যানেজার + বুকিং ইঞ্জিন একসাথে; প্ল্যান নাম: Flex, One, Experience, Enterprise (একটি রিভিউ অনুযায়ী) |\n| **Apaleo** | API-ফার্স্ট, সার্ভিসড অ্যাপার্টমেন্ট/গ্রুপ | খোলা API, ২০০+ অ্যাপের স্টোর, নিজের ডেটা নিয়ন্ত্রণ (একটি প্রতিযোগীর তুলনা-পেজ অনুযায়ী) |\n| **Amadeus Cloud PMS, Protel Air** | ইউরোপ-কেন্দ্রিক/এন্টারপ্রাইজ | এক তুলনা-আর্টিকেলে উল্লেখ |\n| **Stayntouch** | ক্লাউড | খোলা API, রিমোট ইনস্টল (Hotel Tech Report বর্ণনা) |\n| **RMS Cloud, RoomRaccoon, Clock PMS+, Hotelogix, Little Hotelier, HotelKey** | বিভিন্ন | বিভিন্ন লিস্টে |\n\nআঞ্চলিক প্রবণতা (Hotel Tech Report-এর একটি পেজ): এশিয়া-প্যাসিফিকে Cloudbeds, ইউরোপে Mews, মধ্যপ্রাচ্যে HOTELTIME এগিয়ে (রিভিউ-ভিত্তিক র‍্যাঙ্কিং)।\n\n## ২. ওপেন-সোর্স PMS ✔ (GitHub সূত্র)\n\n| প্রকল্প | বিবরণ | সতর্কতা |\n|---|---|---|\n| **QloApps** | PHP; PMS + বুকিং ইঞ্জিন + ওয়েবসাইট; OSL-3.0 লাইসেন্স | স্ব-হোস্টেড = ব্যাকআপ, প্যাচ, মনিটরিং নিজের; ডিজাইন e-commerce (PrestaShop-ভিত্তিক) ঘেঁষা বলে জানা যায় — স্থাপত্য নিজে পরীক্ষা করো |\n| **OCA/pms (Odoo)** | মাঝারি প্রপার্টির জন্য; multi-property, multi-company; ইনভেন্টরি, রিজার্ভেশন, চেক-ইন, রেট ও availability প্ল্যান | Odoo-নির্ভর, অ্যাকাউন্টিং/ইনভয়েস কনফিগ লাগে |\n| **Minical** | ওপেন-সোর্স PMS, extension ম্যানেজমেন্ট | সক্রিয়তা/মান যাচাই করো |\n> শেখার জন্য ভালো: স্কিমা ও ফ্লো পড়ে নিজের ডিজাইনের সাথে তুলনা করো। প্রোডাকশনে নেওয়ার আগে নিরাপত্তা, লাইসেন্স, রক্ষণাবেক্ষণ মূল্যায়ন।\n\n## ৩. বৈশ্বিক সাধারণ প্যাটার্ন (সব পণ্যে মিল)\n\n```mermaid\nflowchart LR\n    A[Cloud-native, multi-tenant] --> B[Open API + Marketplace]\n    B --> C[Integrated payments]\n    C --> D[Mobile / contactless check-in]\n    D --> E[Channel manager + BE bundled or partnered]\n    E --> F[Revenue mgmt + reporting]\n    F --> G[Multi-property / chain controls]\n```\n1. **ক্লাউড-ফার্স্ট** ও ব্রাউজার/অ্যাপ\n2. **API-ফার্স্ট + অ্যাপ মার্কেটপ্লেস**\n3. **ইন্টিগ্রেটেড পেমেন্ট** (টোকেনাইজেশন, কার্ড-অন-ফাইল)\n4. **অটোমেশন**: স্বয়ংক্রিয় night audit, check-in, বার্তা\n5. **মোবাইল/কন্ট্যাক্টলেস**: ডিজিটাল কী, কিওস্ক, অনলাইন check-in\n6. **ডেটা মালিকানা ও এক্সপোর্ট**\n7. **মডুলার প্রাইসিং**: প্রপার্টি-সাইজ/মডিউল অনুযায়ী\n\n## ৪. শিল্প মানদণ্ড (সাধারণ জ্ঞান; অফিসিয়াল স্পেক যাচাই করো)\n- **OpenTravel Alliance (OTA) বার্তা** — travel/hotel XML ও পরবর্তীতে JSON স্পেক; অনেক CRS/CM/OTA ব্যবহার করে\n- **HTNG (Hotel Technology Next Generation)** — হোটেল সিস্টেম ইন্টারফেস মানদণ্ড\n- **PCI DSS** — কার্ড ডেটা\n- **GDPR/স্থানীয় গোপনীয়তা আইন** — গেস্ট ডেটা\n- **ISO 4217 (কারেন্সি), ISO 3166 (দেশ), ISO 8601 (সময়)**\n- **ডোর লক/POS/PBX ইন্টারফেস**: ভেন্ডর-নির্দিষ্ট ও HTNG প্রোফাইল\n\n## ৫. শিখার কৌশল\n- Mews/Apaleo-র অফিসিয়াল ডেভেলপার ডক পড়ো (পাবলিক API থাকলে) — রিসোর্স মডেল ও webhook ডিজাইন তুলনা\n- OPERA-র শব্দভাণ্ডার (reservation, profile, block, trace, routing instruction) জানো — চেইন-এ এটাই সাধারণ ভাষা\n- Cloudbeds-ধরনের all-in-one বনাম Apaleo-ধরনের modular — ব্যবসা-সিদ্ধান্ত\n", "title_en": "17 — Global PMS Landscape", "md_en": "# 17 — Global PMS Landscape\n\n> Sources: review/comparison sites (often affiliate- or vendor-influenced; a vendor's blog may favour itself, a competitor's comparison page may not be neutral). Rankings are not final truth. Check every claim against the vendor's official docs (doc 28).\n\n---\n\n## 1. Major global products\n\n| Product | Typical segment | What public sources say |\n|---|---|---|\n| **Oracle OPERA Cloud** | Large chains, complex groups | Described as the enterprise standard; pricing usually \"contact us\" |\n| **Mews** | Cloud-native, small to large | Open API, claims 1,000+ marketplace apps (review sites), payment and check-in automation |\n| **Cloudbeds** | Independent/boutique | PMS + channel manager + booking engine together; plans named Flex, One, Experience, Enterprise (per one review) |\n| **Apaleo** | API-first, serviced apartments/groups | Open API, store with 200+ apps, data ownership (per a competitor's comparison page) |\n| **Amadeus Cloud PMS, Protel Air** | Europe-centric/enterprise | Mentioned in one comparison article |\n| **Stayntouch** | Cloud | Open API, remote installation (Hotel Tech Report description) |\n| **RMS Cloud, RoomRaccoon, Clock PMS+, Hotelogix, Little Hotelier, HotelKey** | Various | In various lists |\n\nRegional trends (one Hotel Tech Report page): Cloudbeds leads in Asia-Pacific, Mews in Europe, HOTELTIME in the Middle East (review-based ranking).\n\n## 2. Open-source PMS ✔ (GitHub sources)\n\n| Project | Description | Caution |\n|---|---|---|\n| **QloApps** | PHP; PMS + booking engine + website; OSL-3.0 licence | Self-hosted = your own backups, patches, monitoring; e-commerce-leaning design (PrestaShop-based) — evaluate the architecture yourself |\n| **OCA/pms (Odoo)** | For mid-size properties; multi-property, multi-company; inventory, reservations, check-in, rate and availability plans | Depends on Odoo; needs accounting/invoice configuration |\n| **Minical** | Open-source PMS with extension management | Check activity/quality |\n> Good for learning: read the schema and flows and compare with your design. Before production use, evaluate security, licence and maintenance.\n\n## 3. Common global patterns (shared by all products)\n\n```mermaid\nflowchart LR\n    A[Cloud-native, multi-tenant] --> B[Open API + Marketplace]\n    B --> C[Integrated payments]\n    C --> D[Mobile / contactless check-in]\n    D --> E[Channel manager + BE bundled or partnered]\n    E --> F[Revenue mgmt + reporting]\n    F --> G[Multi-property / chain controls]\n```\n1. **Cloud-first**, browser/app\n2. **API-first + app marketplace**\n3. **Integrated payments** (tokenisation, card on file)\n4. **Automation**: automatic night audit, check-in, messaging\n5. **Mobile/contactless**: digital keys, kiosks, online check-in\n6. **Data ownership and export**\n7. **Modular pricing**: by property size/modules\n\n## 4. Industry standards (general knowledge; verify the official specs)\n- **OpenTravel Alliance (OTA) messages** — travel/hotel XML and later JSON specs; used by many CRS/CM/OTAs\n- **HTNG (Hotel Technology Next Generation)** — hotel system interface standards\n- **PCI DSS** — card data\n- **GDPR / local privacy laws** — guest data\n- **ISO 4217 (currency), ISO 3166 (country), ISO 8601 (time)**\n- **Door lock/POS/PBX interfaces**: vendor-specific and HTNG profiles\n\n## 5. Learning strategy\n- Read the official Mews/Apaleo developer docs — compare their resource models and webhook design\n- Learn OPERA's vocabulary (reservation, profile, block, trace, routing instruction) — the common language in chains\n- All-in-one (Cloudbeds style) vs modular (Apaleo style) — a business decision\n"}, "18": {"n": 18, "title": "১৮ — বাংলাদেশ বনাম আন্তর্জাতিক PMS", "md": "# ১৮ — বাংলাদেশ বনাম আন্তর্জাতিক PMS\n\n> তুলনা সাধারণ প্রবণতা; ব্যতিক্রম আছে। স্থানীয় বাজার তথ্য আংশিক যাচাইকৃত (ডক ১৬)।\n\n---\n\n## ১. তুলনা সারণি\n\n| ক্ষেত্র | বাংলাদেশ (স্থানীয় প্রবণতা) | আন্তর্জাতিক |\n|---|---|---|\n| **গ্রাহক ভিত্তি** | অনেক ছোট/স্বাধীন, গেস্ট হাউস; কিছু চেইন/তারকা | স্বাধীন থেকে বিশ্বচেইন, পরিণত বাজার |\n| **ভাষা** | বাংলা + ইংরেজি আবশ্যক | বহুভাষা, ইংরেজি ডিফল্ট |\n| **পেমেন্ট** | bKash, SSLCommerz, নগদ, কার্ড; MFS-গুরুত্ব | কার্ড-কেন্দ্রিক (Stripe, Adyen), Apple/Google Pay, SEPA ইত্যাদি |\n| **ট্যাক্স** | VAT/সার্ভিস চার্জ, BIN, VDS; বদলায়; EFD দাবি (যাচাই দরকার) | দেশভিত্তিক VAT/GST/city tax/tourist tax; e-invoicing কিছু দেশে |\n| **আইনি রিপোর্টিং** | থানায় গেস্ট তথ্য (বিস্তারিত অযাচাইকৃত) | বিদেশি গেস্ট রিপোর্টিং (উদা. ভারত, থাইল্যান্ড) বা শহর-কর |\n| **ডিস্ট্রিবিউশন** | OTA (Booking.com, Agoda ইত্যাদি) + সরাসরি + ট্রাভেল এজেন্ট; GDS সীমিত | OTA, GDS, metasearch, wholesalers, direct |\n| **চ্যানেল ম্যানেজার** | স্থানীয় পণ্যে নতুন/উদীয়মান | পরিণত, PMS-এ বান্ডেল বা মার্কেটপ্লেস |\n| **API/ইকোসিস্টেম** | সীমিত পাবলিক API/অ্যাপ স্টোর | বড় মার্কেটপ্লেস (Mews ১,০০০+, Apaleo ২০০+ দাবি) |\n| **ইন্টারনেট/অবকাঠামো** | অস্থিরতার ঝুঁকি → offline/downtime পরিকল্পনা | সাধারণত স্থিতিশীল; তবু offline-মোড বিদ্যমান |\n| **মূল্য মডেল** | টাকায় মাসিক প্ল্যান, কম মূল্য-সংবেদনশীল; কখনো একবারের লাইসেন্স | per-room/per-property, tiered, add-on |\n| **হার্ডওয়্যার** | ডেস্কটপ/ট্যাবলেট; কিওস্ক কম | কিওস্ক, ডিজিটাল কী, মোবাইল |\n| **মাইগ্রেশন উৎস** | খাতা/এক্সেল/WhatsApp, পুরনো ডেস্কটপ | লেগাসি অন-প্রেম PMS (Opera V5 ইত্যাদি) থেকে ক্লাউড |\n| **ডেটা গোপনীয়তা** | আইন/প্রয়োগ অনিশ্চিত (যাচাই) | GDPR/CCPA ইত্যাদি কঠোর |\n| **রাজস্ব ব্যবস্থাপনা** | সীমিত: ম্যানুয়াল/নিয়ম-ভিত্তিক সিজন রেট | RMS, dynamic pricing, comp set |\n| **সাপোর্ট** | স্থানীয় ভাষা, ফোন/WhatsApp | টিকেট/চ্যাট, টাইমজোন কভার |\n\n## ২. কোথায় মিল (ইঞ্জিনিয়ারিংয়ে অভিন্ন)\n- রুম টাইপ/রুম, রেট প্ল্যান, রিজার্ভেশন লাইফসাইকেল\n- folio ledger, night audit, business date\n- housekeeping স্ট্যাটাস\n- ইনভেন্টরি কনকারেন্সি, ARI সিঙ্ক\n- RBAC ও অডিট\n> শিক্ষা: **কোর ডোমেইন সর্বজনীন, পার্থক্য প্রান্তে** (ট্যাক্স, পেমেন্ট, আইনি রিপোর্ট, ভাষা, ডিস্ট্রিবিউশন)।\n\n## ৩. প্রকৌশল-সিদ্ধান্ত: \"লোকালাইজেশন লেয়ার\"\n\n```mermaid\nflowchart TB\n    CORE[Universal PMS Core: inventory, reservation, folio, HK, audit]\n    CORE --> LOC{Localization Layer}\n    LOC --> TAX[Tax packs: VAT BD, GST IN, ...]\n    LOC --> PAY[Payment adapters: bKash, SSLCommerz, Stripe]\n    LOC --> LEG[Legal reporting: guest registry exports]\n    LOC --> I18N[i18n: bn, en, ...]\n    LOC --> CH[Channel adapters]\n    LOC --> FMT[Number/date/currency formats]\n```\n**নীতি:**\n1. কোরে দেশ-নির্দিষ্ট কোড নয়\n2. \"country pack\" কনফিগ (ট্যাক্স রুল, ইনভয়েস টেমপ্লেট, রিপোর্ট)\n3. পেমেন্ট ও চ্যানেল অ্যাডাপ্টার ইন্টারফেস\n4. বাংলা প্রথম-শ্রেণি (শুধু অনুবাদ নয়: ফন্ট, সংখ্যা, SMS Unicode)\n\n## ৪. বাংলাদেশ থেকে গ্লোবাল সুযোগ ও ঝুঁকি\n**সুযোগ:** দক্ষিণ এশিয়ার অন্যান্য বাজারে (বাংলা/ইংরেজি, MFS-এর মতো মডেল) বিস্তার।\n**ঝুঁকি:** আন্তর্জাতিক OTA/PMS ছোট হোটেলে সস্তা সংস্করণ নিয়ে এলে প্রতিযোগিতা; স্থানীয় সুবিধা = পেমেন্ট, ভাষা, সাপোর্ট, ট্যাক্স।\n", "title_en": "18 — Bangladesh vs International PMS", "md_en": "# 18 — Bangladesh vs International PMS\n\n> General trends; exceptions exist. Local market data is partly verified (doc 16).\n\n---\n\n## 1. Comparison table\n\n| Area | Bangladesh (local trend) | International |\n|---|---|---|\n| **Customer base** | Many small/independent hotels, guest houses; some chains/star hotels | Independents to global chains, mature market |\n| **Language** | Bangla + English required | Multilingual, English default |\n| **Payments** | bKash, SSLCommerz, cash, cards; MFS matters | Card-centric (Stripe, Adyen), Apple/Google Pay, SEPA etc. |\n| **Tax** | VAT/service charge, BIN, VDS; changes often; EFD claims (verify) | Country VAT/GST/city/tourist taxes; e-invoicing in some countries |\n| **Legal reporting** | Guest info to police stations (details unverified) | Foreign guest reporting (e.g. India, Thailand) or city taxes |\n| **Distribution** | OTAs (Booking.com, Agoda etc.) + direct + travel agents; limited GDS | OTA, GDS, metasearch, wholesalers, direct |\n| **Channel manager** | New/emerging in local products | Mature, bundled with the PMS or via marketplaces |\n| **API/ecosystem** | Limited public APIs/app stores | Large marketplaces (Mews 1,000+, Apaleo 200+ claimed) |\n| **Internet/infrastructure** | Instability risk → offline/downtime planning | Usually stable; offline modes still exist |\n| **Pricing model** | Monthly plans in BDT, price-sensitive; sometimes one-time licences | Per room/per property, tiered, add-ons |\n| **Hardware** | Desktops/tablets; few kiosks | Kiosks, digital keys, mobile |\n| **Migration source** | Paper registers/Excel/WhatsApp, old desktop software | Legacy on-prem PMS (Opera V5 etc.) to cloud |\n| **Data privacy** | Law/enforcement uncertain (verify) | Strict GDPR/CCPA etc. |\n| **Revenue management** | Limited: manual/rule-based season rates | RMS, dynamic pricing, comp sets |\n| **Support** | Local language, phone/WhatsApp | Tickets/chat, time-zone coverage |\n\n## 2. What is the same (identical in engineering)\n- Room types/rooms, rate plans, reservation lifecycle\n- Folio ledger, night audit, business date\n- Housekeeping status\n- Inventory concurrency, ARI sync\n- RBAC and audit\n> Lesson: **the core domain is universal; differences live at the edges** (tax, payments, legal reporting, language, distribution).\n\n## 3. Engineering decision: a \"localisation layer\"\n\n```mermaid\nflowchart TB\n    CORE[Universal PMS Core: inventory, reservation, folio, HK, audit]\n    CORE --> LOC{Localization Layer}\n    LOC --> TAX[Tax packs: VAT BD, GST IN, ...]\n    LOC --> PAY[Payment adapters: bKash, SSLCommerz, Stripe]\n    LOC --> LEG[Legal reporting: guest registry exports]\n    LOC --> I18N[i18n: bn, en, ...]\n    LOC --> CH[Channel adapters]\n    LOC --> FMT[Number/date/currency formats]\n```\n**Principles:**\n1. No country-specific code in the core\n2. \"Country pack\" config (tax rules, invoice templates, reports)\n3. Payment and channel adapter interfaces\n4. Bangla as first-class (not just translation: fonts, numbers, Unicode SMS)\n\n## 4. Opportunities and risks from Bangladesh to global\n**Opportunity:** expansion into other South Asian markets (Bangla/English, MFS-like models).\n**Risk:** competition if international OTAs/PMSs bring cheaper editions for small hotels; local advantages = payments, language, support, tax.\n"}, "19": {"n": 19, "title": "১৯ — বাস্তব ক্ষেত্রের কেস স্টাডি", "md": "# ১৯ — বাস্তব ক্ষেত্রের কেস স্টাডি\n\n> **সতর্কতা:** এখানে কোনো বাস্তব হোটেলের ভেতরের সংখ্যা ব্যবহার করা হয়নি। সব দৃশ্য **উদাহরণ/সংশ্লেষিত**, প্রতিটি লেবেল করা। এগুলো চিন্তার অনুশীলন, প্রমাণ নয়।\n\n---\n\n## কেস ১ — একটি ডেমো উপকূলীয় রিসোর্ট (কাল্পনিক)\n**পটভূমি:** কক্সবাজারে ৪২ রুমের একটি কাল্পনিক রিসোর্ট; সিজন, restriction, bKash ডিপোজিট, housekeeping বোর্ড।\n**শেখার বিষয়:** একটি price engine ফ্রন্ট ডেস্ক, ওয়েবসাইট ও API-তে একই; অনলাইন ডিপোজিট; HK-ফ্রন্ট ডেস্কের শেয়ার্ড স্ট্যাটাস।\n**ইঞ্জিনিয়ারিং প্রশ্ন:** কীভাবে \"একটি ইঞ্জিন, তিন ক্লায়েন্ট\" নিশ্চিত করবে? উত্তর: কোট সার্ভিস (`POST /quotes`) একমাত্র মূল্য-উৎস।\n\n## কেস ২ — স্প্রেডশিট থেকে PMS (উদাহরণ পরিকল্পনা)\n**পটভূমি:** অনেক প্রপার্টি এক্সেল, বুকিং রেজিস্টার ও WhatsApp গ্রুপে চলে। এক সপ্তাহের মাইগ্রেশন পরিকল্পনা:\n| দিন | কাজ |\n|---|---|\n| ১ | প্রপার্টি, রুম টাইপ/নম্বর (bulk), ট্যাক্স, পলিসি সেটআপ |\n| ২ | রেট ও সিজন; পেমেন্ট মেথড |\n| ৩ | ভবিষ্যৎ বুকিং ইম্পোর্ট (CSV) + গেস্ট ডুপ্লিকেট পরিষ্কার |\n| ৪ | স্টাফ অ্যাকাউন্ট, রোল, প্রশিক্ষণ (sandbox) |\n| ৫ | সমান্তরাল রান (পুরনো + নতুন), ডিপোজিট ব্যালান্স মিলানো |\n| ৬-৭ | go-live, প্রথম night audit পর্যবেক্ষণ |\n**ঝুঁকি:** অসম্পূর্ণ ডেটা, রুম নম্বর অসঙ্গতি, ইনভেন্টরি ও OTA সিঙ্ক ভুল, স্টাফ প্রতিরোধ। (পূর্ণ পদ্ধতি: ডক ২৪)\n\n## কেস ৩ — OTA কমিশন বনাম ডাইরেক্ট (হিসাবের উদাহরণ)\n**দাবি:** মাসে ৬০ বুকিং সরালে ৳১০,০০০ গড়ে, ১৮% বনাম ~২% খরচ, বছরে ~৳১১.৫২ লাখ সাশ্রয়।\n**যাচাই:** ৬০×১২=৭২০ বুকিং; (১৮%−২%)=১৬% × ১০,০০০ = ১,৬০০ ফারাক/বুকিং; ৭২০×১,৬০০ = ১১,৫২,০০০ ✔ গণিত সঠিক।\n**সতর্কতা:** সরাসরি বুকিং আনতে মার্কেটিং খরচ, পেমেন্ট গেটওয়ে ফি, parity চুক্তি, OTA দৃশ্যমানতা হারানো — সব হিসাবে নেই।\n\n## কেস ৪ — লেগাসি ডেস্কটপ থেকে ক্লাউড (সংশ্লেষিত দৃশ্য)\n**পটভূমি:** ৬০ রুমের শহুরে হোটেল; ডেস্কটপ সার্ভার; ব্যাকআপ ম্যানুয়াল; OTA-তে হাতে আপডেট।\n**সমস্যা:** ডাবল বুকিং মাসে ২-৩ বার, ক্লোজিংয়ে ৩ দিন, মালিক রিপোর্ট পায় না।\n**সমাধান-পথ:** ক্লাউড PMS + channel manager → night audit স্বয়ংক্রিয় → owner report।\n**মূল শিক্ষা:** মাইগ্রেশনের কঠিন অংশ UI নয়: (১) ফোলিও/ডিপোজিট ব্যালেন্স, (২) ভবিষ্যৎ বুকিংয়ের রেট স্ন্যাপশট, (৩) POS/লক ইন্টারফেস, (৪) স্টাফ অভ্যাস।\n\n## কেস ৫ — \"ডাবল বুকিং\" ঘটনা-বিশ্লেষণ (সংশ্লেষিত)\n**ঘটনা:** শেষ ১ রুম; রিসেপশন ও Booking.com একই সেকেন্ডে।\n```mermaid\nsequenceDiagram\n    participant FD as Front Desk\n    participant PMS\n    participant CM as Channel Mgr\n    participant OTA\n    FD->>PMS: book last Deluxe (13 Jun)\n    PMS->>PMS: inventory 1→0 (tx)\n    OTA->>CM: new booking (last room, stale avail)\n    CM->>PMS: reservation\n    PMS-->>CM: rejected sold_out / or accept as overbook\n    Note over PMS,CM: কারণ: sync লেটেন্সি\n```\n**মূল কারণ বিশ্লেষণ:** push ধীর/ব্যর্থ, কোনো বাফার নেই।\n**প্রতিকার:** (১) ডেল্টা পুশ দ্রুত, (২) শেষ রুমে ইন্টারনাল বাফার, (৩) inbound সিদ্ধান্ত নীতি (গ্রহণ করে relocate নাকি প্রত্যাখ্যান — OTA নিয়মে প্রত্যাখ্যান সম্ভব নাও হতে পারে), (৪) অ্যালার্ট।\n\n## কেস ৬ — ভুল VAT হার (সংশ্লেষিত)\n**ঘটনা:** হোটেল ইনভয়েসে পুরনো হার রয়ে গেছে; আইন বদলের পর ৩ সপ্তাহ।\n**মূল কারণ:** হার কোডে বসানো বা তারিখ-বৈধতা নেই।\n**প্রতিকার:** `tax_rule` তারিখ-ভিত্তিক, পরিবর্তনে অ্যালার্ট, পুনঃগণনা রিপোর্ট, credit/debit note প্রবাহ।\n\n## কেস ৭ — নাইট অডিট মাঝপথে ব্যর্থ (সংশ্লেষিত)\n**ঘটনা:** রুম চার্জ ৩০/৫০ রুমে পোস্ট, সার্ভার রিস্টার্ট।\n**ঝুঁকি:** পুনরায় চালালে ডাবল চার্জ।\n**প্রতিকার:** `UNIQUE(stay_id, business_date, charge_code)`, ধাপ-ভিত্তিক স্থিতি, resumable, প্রি/পোস্ট ট্রায়াল ব্যালেন্স।\n\n## শিক্ষা-সারাংশ\n| ঘটনা | নকশা-নীতি |\n|---|---|\n| ডাবল বুকিং | atomic ইনভেন্টরি + দ্রুত sync + বাফার |\n| ভুল ট্যাক্স | তারিখ-ভিত্তিক কনফিগ |\n| ডাবল চার্জ | idempotency/ইউনিক কনস্ট্রেইন্ট |\n| মাইগ্রেশন ব্যর্থ | সমান্তরাল রান, ব্যালান্স মিলানো |\n| স্টাফ প্রতিরোধ | সরল UI, বাংলা, প্রশিক্ষণ মোড |\n\n---\n\n## কেস ৮ — হোস্টেল (বেড-ভিত্তিক) ও গেস্ট হাউসের সংশ্লেষিত দৃশ্য\n**পটভূমি:** ২৪ বেডের ডর্ম-হোস্টেল + ৬ প্রাইভেট রুম।\n**সমস্যা:** প্রাইভেট রুম হিসেবে ডর্ম পুরোটা বিক্রি হলে বেড কীভাবে কমবে?\n**সমাধান:** একই ফিজিক্যাল রুম থেকে দুটি প্রোডাক্ট; ইনভেন্টরি কনফ্লিক্ট নিয়ম (ডক ০৫ §১৭)।\n\n## কেস ৯ — রিসোর্টে POS + স্পা + ইভেন্ট (সংশ্লেষিত)\n**পটভূমি:** ৪০ রুম রিসোর্ট, বিয়ের অনুষ্ঠান একই সপ্তাহান্তে।\n**সমস্যা:** হল, ক্যাটারিং, ২০টি রুম ব্লক, স্পা প্যাকেজ — একটি master folio, ডিপোজিট শিডিউল, BEO, রিসোর্স ওভারল্যাপ।\n**শেখা:** ভেন্যু ও রিসোর্স time-slot মডেল রুম ইনভেন্টরি থেকে আলাদা (ডক ০৪, ০৫), master folio রাউটিং (ডক ০৭)।\n", "title_en": "19 — Real-World Case Studies", "md_en": "# 19 — Real-World Case Studies\n\n> **Accuracy note:** no internal figures from real hotels are used here. These are **illustrative/synthesised scenarios**, each labelled. They are thinking exercises, not evidence.\n\n---\n\n## Case 1 — A demo coastal resort (illustrative)\n**Setting:** a fictional 42-room resort in Cox's Bazar with seasons, restrictions, bKash deposits and a housekeeping board.\n**Lessons:** one price engine shared by the front desk, website and API; online deposits; status shared between housekeeping and front desk.\n**Engineering question:** how do you guarantee \"one engine, three clients\"? Answer: a quote service (`POST /quotes`) as the only source of prices.\n\n## Case 2 — From spreadsheet to PMS (illustrative plan)\n**Setting:** many properties run on Excel, a booking register and WhatsApp groups. A one-week migration plan:\n| Day | Work |\n|---|---|\n| 1 | Property, room types/numbers (bulk), taxes, policies |\n| 2 | Rates and seasons; payment methods |\n| 3 | Import future bookings (CSV) + clean duplicate guests |\n| 4 | Staff accounts, roles, training (sandbox) |\n| 5 | Parallel run (old + new), reconcile deposit balances |\n| 6–7 | Go-live, observe the first night audit |\n**Risks:** incomplete data, inconsistent room numbers, inventory and OTA sync mistakes, staff resistance. (Full method: doc 24.)\n\n## Case 3 — OTA commission vs direct (worked example)\n**Claim:** moving 60 bookings a month at an average BDT 10,000, at 18% vs ~2% cost, saves about BDT 11.52 lakh a year.\n**Check:** 60×12 = 720 bookings; (18% − 2%) = 16% × 10,000 = 1,600 difference per booking; 720 × 1,600 = 11,52,000 ✔ the maths is correct.\n**Caution:** marketing cost to win direct bookings, gateway fees, parity agreements and lost OTA visibility are not included.\n\n## Case 4 — Legacy desktop to cloud (synthesised)\n**Background:** 60-room city hotel; desktop server; manual backups; OTAs updated by hand.\n**Problems:** double bookings 2–3 times a month, 3 days to close the month, the owner gets no reports.\n**Path:** cloud PMS + channel manager → automatic night audit → owner report.\n**Key lesson:** the hard part of migration is not the UI: (1) folio/deposit balances, (2) rate snapshots of future bookings, (3) POS/lock interfaces, (4) staff habits.\n\n## Case 5 — A \"double booking\" incident analysis (synthesised)\n**Incident:** last room; reception and Booking.com in the same second.\n```mermaid\nsequenceDiagram\n    participant FD as Front Desk\n    participant PMS\n    participant CM as Channel Mgr\n    participant OTA\n    FD->>PMS: book last Deluxe (13 Jun)\n    PMS->>PMS: inventory 1→0 (tx)\n    OTA->>CM: new booking (last room, stale avail)\n    CM->>PMS: reservation\n    PMS-->>CM: rejected sold_out / or accept as overbook\n    Note over PMS,CM: cause: sync latency\n```\n**Root cause:** slow/failed push, no buffer.\n**Fixes:** (1) faster delta push, (2) an internal buffer on the last room, (3) an inbound decision policy (accept and relocate, or reject — OTA rules may not allow rejection), (4) alerts.\n\n## Case 6 — Wrong VAT rate (synthesised)\n**Incident:** invoices kept the old rate for 3 weeks after a law change.\n**Root cause:** rate hard-coded or without date validity.\n**Fixes:** date-based `tax_rule`, alert on change, recalculation report, credit/debit note flow.\n\n## Case 7 — Night audit fails halfway (synthesised)\n**Incident:** room charges posted for 30 of 50 rooms, then the server restarted.\n**Risk:** re-running posts double charges.\n**Fixes:** `UNIQUE(stay_id, business_date, charge_code)`, step-based status, resumable, trial balance before/after.\n\n## Lessons summary\n| Incident | Design principle |\n|---|---|\n| Double booking | Atomic inventory + fast sync + buffer |\n| Wrong tax | Date-based config |\n| Double charge | Idempotency / unique constraints |\n| Failed migration | Parallel run, balance reconciliation |\n| Staff resistance | Simple UI, Bangla, training mode |\n\n---\n\n## Case 8 — Hostel (bed-based) and guest house (synthesised)\n**Background:** a 24-bed dorm hostel + 6 private rooms.\n**Problem:** if a whole dorm is sold as a private room, how do beds decrease?\n**Solution:** two products from one physical room; inventory conflict rules (doc 05 §17).\n\n## Case 9 — Resort with POS + spa + events (synthesised)\n**Background:** 40-room resort with a wedding on the same weekend.\n**Problem:** hall, catering, a 20-room block, spa packages — one master folio, a deposit schedule, BEO, resource overlaps.\n**Lesson:** venues and resources use a time-slot model separate from room inventory (docs 04, 05); master folio routing (doc 07).\n"}, "20": {"n": 20, "title": "২০ — রেভিনিউ ম্যানেজমেন্ট গভীরে (Revenue Management)", "md": "# ২০ — রেভিনিউ ম্যানেজমেন্ট গভীরে (Revenue Management)\n\n> লক্ষ্য: ডক ০৬ (রেট) ও ১৫ (রিপোর্ট)-এর পরের ধাপ — চাহিদা পূর্বাভাস, দাম ঠিক করা, ইনভেন্টরি নিয়ন্ত্রণ, ওভারবুকিং ও গ্রুপ সিদ্ধান্তের অঙ্ক। PMS ইঞ্জিনিয়ার হিসেবে RMS-কে কী ডেটা দিতে হবে আর কীভাবে সিদ্ধান্ত ফেরত নিতে হবে — বুঝে যাওয়া।\n> নোট: সূত্র ও উদাহরণ শেখার জন্য সরলীকৃত। প্রোডাকশন RMS আরও জটিল মডেল ব্যবহার করে।\n\n---\n\n## ১. RM কী এবং কেন হোটেলে কাজ করে\n\n**Revenue Management (RM)** = সঠিক গেস্টকে, সঠিক সময়ে, সঠিক চ্যানেলে, সঠিক দামে, সঠিক রুম বিক্রি করা — যাতে মোট আয় (বা লাভ) সর্বোচ্চ হয়।\n\nRM সেই ব্যবসায় কাজ করে যেখানে এই শর্তগুলো আছে:\n\n| শর্ত | হোটেলে কীভাবে |\n|---|---|\n| **নষ্টযোগ্য ইনভেন্টরি (perishable)** | আজ রাতের খালি রুম কাল বিক্রি করা যায় না |\n| **স্থির সক্ষমতা (fixed capacity)** | রাতারাতি রুম বাড়ানো যায় না |\n| **আগাম বিক্রি (advance sales)** | বুকিং সপ্তাহ/মাস আগে আসে |\n| **ভাগযোগ্য চাহিদা (segmentable)** | কর্পোরেট, লেজার, গ্রুপ, OTA — ভিন্ন দাম-সংবেদনশীলতা |\n| **ওঠানামা করা চাহিদা** | ঈদ, শীত, উইকএন্ড, কনফারেন্স |\n| **কম প্রান্তিক খরচ** | আরেকটি রুম বিক্রির খরচ (ক্লিনিং, অ্যামেনিটি) দামের তুলনায় কম |\n\n---\n\n## ২. RM প্রক্রিয়া চক্র\n\n```mermaid\nflowchart LR\n    A[ডেটা সংগ্রহ<br/>OTB, ইতিহাস, প্রতিযোগী] --> B[বিশ্লেষণ<br/>pace, pickup, segment]\n    B --> C[পূর্বাভাস<br/>চাহিদা, cancel, no-show]\n    C --> D[অপ্টিমাইজ<br/>দাম, restriction, overbook]\n    D --> E[সিদ্ধান্ত<br/>RM টিম অনুমোদন]\n    E --> F[বিতরণ<br/>PMS → CM → OTA/BE]\n    F --> G[মনিটর<br/>RevPAR, RGI, ভুল]\n    G --> A\n```\n\n**PMS-এর ভূমিকা:** ডেটার উৎস (A) এবং সিদ্ধান্ত বাস্তবায়নের জায়গা (F)। মাঝের অংশ মানুষ (revenue manager) বা RMS সফটওয়্যার করে।\n\n---\n\n## ৩. RM-এর জন্য দরকারি ডেটা\n\n| ডেটা | মানে | PMS-এ কোথা থেকে |\n|---|---|---|\n| **OTB (On The Books)** | ভবিষ্যৎ প্রতিটি রাতের জন্য এখন পর্যন্ত বিক্রিত রুম ও আয় | `reservation_night` (stay date অনুযায়ী) |\n| **Pickup** | নির্দিষ্ট সময়ে (যেমন গত ৭ দিনে) OTB কতটা বাড়ল | দৈনিক OTB স্ন্যাপশটের পার্থক্য |\n| **Pace** | একই lead time-এ গত বছর বনাম এ বছর OTB | ঐতিহাসিক স্ন্যাপশট |\n| **ইতিহাস (actuals)** | গত দিনগুলোর আসল occupancy, ADR, segment mix | night audit-এর পরের ফাইনাল ডেটা |\n| **Cancellation / No-show হার** | segment ও lead time অনুযায়ী | reservation status ইতিহাস |\n| **Denials / Regrets** | চাওয়া হয়েছিল কিন্তু দেওয়া যায়নি (sold out) / দাম দেখে চলে গেছে | BE সার্চ লগ, ফোন রিজার্ভেশন নোট |\n| **Comp set রেট** | প্রতিযোগী হোটেলের দাম | rate shopper টুল |\n| **ইভেন্ট ক্যালেন্ডার** | ছুটি, কনফারেন্স, খেলা | ম্যানুয়াল/ইম্পোর্ট |\n| **Booking window, LOS** | কত দিন আগে বুক, কত রাত থাকে | reservation টেবিল |\n\n> **Unconstrained demand (সীমাহীন চাহিদা):** sold-out বা restriction না থাকলে যত বুকিং আসত। আমরা শুধু *constrained* (আসল বিক্রি) দেখি — তাই denials ট্র্যাক না করলে চাহিদা কম মনে হয়, দাম কম রাখা হয়। এটাকে বলে **\"spiral down\"** সমস্যা।\n\n---\n\n## ৪. মূল মেট্রিক (সূত্রসহ)\n\n| মেট্রিক | সূত্র | উদাহরণ (৫০ রুম, এক রাত) |\n|---|---|---|\n| **Occupancy** | বিক্রিত রুম ÷ বিক্রয়যোগ্য রুম | ৪০ ÷ ৫০ = ৮০% |\n| **ADR** | রুম আয় ÷ বিক্রিত রুম | ৳২,০০,০০০ ÷ ৪০ = ৳৫,০০০ |\n| **RevPAR** | রুম আয় ÷ বিক্রয়যোগ্য রুম = Occ × ADR | ৳২,০০,০০০ ÷ ৫০ = ৳৪,০০০ |\n| **TRevPAR** | মোট আয় (রুম+F&B+অন্য) ÷ বিক্রয়যোগ্য রুম | ৳৩,০০,০০০ ÷ ৫০ = ৳৬,০০০ |\n| **NetRevPAR** | (রুম আয় − কমিশন − বিতরণ খরচ) ÷ বিক্রয়যোগ্য রুম | (২,০০,০০০ − ২৪,০০০) ÷ ৫০ = ৳৩,৫২০ |\n| **GOPPAR** | Gross Operating Profit ÷ বিক্রয়যোগ্য রুম | লাভ দেখায়, শুধু আয় নয় |\n| **MPI** (Market Penetration Index) | আমার Occ ÷ comp set Occ × ১০০ | ৮০% ÷ ৭০% = ১১৪ |\n| **ARI** (Average Rate Index) | আমার ADR ÷ comp set ADR × ১০০ | ৫,০০০ ÷ ৫,৫০০ = ৯১ |\n| **RGI** (Revenue Generation Index) | আমার RevPAR ÷ comp set RevPAR × ১০০ | ৪,০০০ ÷ ৩,৮৫০ = ১০৪ |\n\n> সতর্কতা: এখানকার **ARI (Average Rate Index)** আর চ্যানেল ম্যানেজারের **ARI (Availability, Rates, Inventory)** — দুটো আলাদা জিনিস, একই সংক্ষেপ।\n> RGI ১০০-এর বেশি = বাজারে নিজের ন্যায্য ভাগের চেয়ে বেশি আয় করছ।\n\n**অন্য দরকারি সংখ্যা:**\n- **Booking window (lead time):** বুকিং তারিখ থেকে আগমনের দিন\n- **ALOS:** Average Length of Stay = মোট রুম-রাত ÷ বুকিং সংখ্যা\n- **Wash:** গ্রুপ ব্লকের যে অংশ শেষে বিক্রি হয় না (blocked − picked up)\n- **Cancellation rate:** বাতিল ÷ মোট বুকিং (segment অনুযায়ী আলাদা রাখো)\n\n---\n\n## ৫. চাহিদা পূর্বাভাস (Forecasting)\n\n### ৫.১ পদ্ধতিগুলো (সহজ থেকে কঠিন)\n\n| পদ্ধতি | কীভাবে | কখন ভালো |\n|---|---|---|\n| **গত বছরের একই দিন (same day last year)** | গত বছরের একই সপ্তাহের দিনের occupancy | খুব কম ডেটা |\n| **Moving average** | গত কয়েক সপ্তাহের একই বারের গড় | স্থিতিশীল বাজার |\n| **Additive pickup** | চূড়ান্ত = আজকের OTB + গড় বাকি pickup (ঐতিহাসিক) | সবচেয়ে প্রচলিত, সহজ |\n| **Multiplicative pickup** | চূড়ান্ত = আজকের OTB × গড় অনুপাত (final ÷ OTB) | OTB বেশি হলে বাড়ে |\n| **Exponential smoothing / Holt-Winters** | সাম্প্রতিক ডেটায় বেশি ওজন, ট্রেন্ড ও সিজন | ভালো ইতিহাস থাকলে |\n| **ML (gradient boosting ইত্যাদি)** | ফিচার: lead time, বার, ইভেন্ট, comp রেট, OTB | বড় চেইন, প্রচুর ডেটা |\n\n### ৫.২ Additive pickup — হাতে-কলমে উদাহরণ\n\nপ্রশ্ন: ১৪ দিন পরের শুক্রবারে শেষ পর্যন্ত কত রুম বিক্রি হবে?\n\nগত ৪টি শুক্রবারের ইতিহাস:\n\n| শুক্রবার | ১৪ দিন আগে OTB | চূড়ান্ত বিক্রি | বাকি pickup |\n|---|---|---|---|\n| ১ | ২২ | ৩৮ | ১৬ |\n| ২ | ২৫ | ৪২ | ১৭ |\n| ৩ | ১৮ | ৩৩ | ১৫ |\n| ৪ | ২৮ | ৪৪ | ১৬ |\n\nগড় বাকি pickup = (১৬+১৭+১৫+১৬) ÷ ৪ = **১৬**।\nআজ ওই শুক্রবারের OTB = ২৪ → পূর্বাভাস = ২৪ + ১৬ = **৪০ রুম** (৫০-এর মধ্যে, ৮০%)।\n\n```python\n# Additive pickup forecast — শেখার জন্য সরল কোড\nfrom statistics import mean\n\ndef additive_pickup(history, otb_today):\n    \"\"\"history: [(otb_at_same_lead_time, final_sold), ...]\"\"\"\n    pickups = [final - otb for otb, final in history]\n    return otb_today + mean(pickups)\n\nhistory = [(22, 38), (25, 42), (18, 33), (28, 44)]\nprint(additive_pickup(history, otb_today=24))   # 40.0\n```\n\n### ৫.৩ পূর্বাভাস মাপো\n- **MAPE** (Mean Absolute Percentage Error) = গড়(|পূর্বাভাস − আসল| ÷ আসল)\n- প্রতি lead time বাকেটে (০–৭, ৮–৩০, ৩১+ দিন) আলাদা ভুল মাপো\n- পূর্বাভাস স্ন্যাপশট সংরক্ষণ করো, পরে তুলনা করতে\n\n---\n\n## ৬. প্রাইসিং কৌশল\n\n### ৬.১ দামের কাঠামো\n- **BAR (Best Available Rate) by day:** প্রতিদিন আলাদা দাম, চাহিদা অনুযায়ী\n- **Tiered BAR:** কয়েকটা নির্দিষ্ট ধাপ (BAR1 = ৳৮,০০০, BAR2 = ৳৭,০০০ …), occupancy অনুযায়ী ধাপ বদল\n- **Open/dynamic pricing:** প্রতিটি রুম টাইপ, চ্যানেল, রেট প্ল্যান স্বাধীনভাবে — ধাপ ছাড়া\n- **Derived rates:** BAR থেকে স্বয়ংক্রিয়ভাবে (Non-refundable = BAR − ১০%; ডক ০৬)\n\n### ৬.২ Rate fence (কম দামকে আলাদা রাখার শর্ত)\nএকই রুম ভিন্ন দামে বিক্রি করতে শর্ত (fence) লাগে, যাতে বেশি দিতে রাজি গেস্ট কম দামে চলে না যায়:\n\n| শর্ত (fence) | উদাহরণ |\n|---|---|\n| অগ্রিম কেনা | ২১ দিন আগে বুক করলে ১৫% ছাড় |\n| ফেরতযোগ্যতা | Non-refundable সস্তা |\n| থাকার দৈর্ঘ্য | ৩ রাত+ থাকলে ছাড় |\n| সদস্যপদ | লয়্যালটি মেম্বার রেট |\n| চ্যানেল | মোবাইল-অনলি রেট |\n| পরিচয় | কর্পোরেট চুক্তি, সরকারি রেট |\n\n### ৬.৩ দাম-সংবেদনশীলতা (Price elasticity)\n- Elasticity = চাহিদার % পরিবর্তন ÷ দামের % পরিবর্তন\n- উদাহরণ: দাম ১০% বাড়ালে বুকিং ৫% কমে → elasticity = −০.৫ → **কম দাম-সংবেদনশীল (inelastic)** → দাম বাড়ালে আয় বাড়ে\n- উইকডে কর্পোরেট সাধারণত কম সংবেদনশীল, উইকএন্ড লেজার বেশি\n- সতর্কতা: হোটেলে এটা নিখুঁতভাবে মাপা কঠিন (প্রতিযোগী, ইভেন্ট একসাথে বদলায়)\n\n### ৬.৪ সরল ডাইনামিক প্রাইসিং রুল (শুরু করার মতো)\n\n```sql\n-- occupancy forecast অনুযায়ী BAR ধাপ (উদাহরণ টেবিল)\n-- occ_from, occ_to, multiplier\n-- 0.00 – 0.40  → 0.85\n-- 0.40 – 0.70  → 1.00\n-- 0.70 – 0.85  → 1.15\n-- 0.85 – 1.00  → 1.30\nSELECT stay_date,\n       base_rate * m.multiplier AS recommended_bar\nFROM   forecast f\nJOIN   price_ladder m\n  ON   f.forecast_occ >= m.occ_from AND f.forecast_occ < m.occ_to;\n```\nনিয়ম: সর্বনিম্ন (floor) ও সর্বোচ্চ (ceiling) দাম রাখো; দিনে কয়বার দাম বদলাবে তার সীমা রাখো; মানুষ অনুমোদন (auto/approve মোড)।\n\n---\n\n## ৭. ইনভেন্টরি নিয়ন্ত্রণ — কোন দামে কয়টা রুম\n\n### ৭.১ ধারণা\n- **Booking limit:** কোনো সস্তা রেট শ্রেণিতে সর্বোচ্চ কত রুম বেচা যাবে\n- **Protection level:** দামি শ্রেণির জন্য কত রুম সংরক্ষিত\n- **Nesting:** দামি শ্রেণি সবসময় সস্তা শ্রেণির জন্য রাখা রুমও নিতে পারে (উল্টোটা নয়)\n\n### ৭.২ Littlewood-এর নিয়ম (দুই শ্রেণি)\n\nদুই রেট: উচ্চ `p_H` (দেরিতে আসে, যেমন কর্পোরেট ৳৮,০০০), নিম্ন `p_L` (আগে আসে, যেমন প্রমো ৳৫,০০০)।\nসস্তায় আরেকটা রুম বেচব কি না? — যদি সেই রুম পরে দামি গেস্টকে বেচার সম্ভাবনা × p_H < p_L হয়, তবে বেচো।\n\n**নিয়ম:** উচ্চ শ্রেণির জন্য `y` রুম রাখো যেখানে\n`P(উচ্চ-চাহিদা > y) = p_L ÷ p_H`\n\nউদাহরণ: p_L ÷ p_H = ৫০০০ ÷ ৮০০০ = ০.৬২৫। উচ
