nts: `reservation.created`, `.modified`, `.cancelled`, `.no_show`, `.checked_in`, `.checked_out`\n\n---\n\n## 16. Database (short)\n\n```mermaid\nerDiagram\n    BOOKING ||--|{ RESERVATION : contains\n    GUEST ||--o{ BOOKING : makes\n    RESERVATION ||--|{ RESERVATION_NIGHT : \"per night\"\n    RESERVATION }o--|| ROOM_TYPE : books\n    RESERVATION }o--o| ROOM : \"assigned (late)\"\n    RESERVATION }o--|| RATE_PLAN : uses\n    RESERVATION ||--o{ RESERVATION_GUEST : \"pax\"\n    RESERVATION ||--o{ RESERVATION_HISTORY : revisions\n    BOOKING ||--o{ DEPOSIT : \"advance\"\n    GROUP_BLOCK ||--o{ RESERVATION : includes\n```\n\nImportant fields (reservation):\n`id, property_id, booking_id, confirmation_no, external_ref, source, channel, market_segment, status, arrival_date, departure_date, adults, children, room_type_id, room_id, rate_plan_id, company_id, group_id, guarantee_type, cancellation_policy_snapshot, total_amount, currency, notes, created_by, version, created_at, updated_at`\n\n---\n\n## 17. Front-end screens\n\n- **Availability search** (dates, pax) → result cards\n- **Reservation form** (guest, rate, deposit, notes)\n- **Reservation details** (tabs: Overview, Guests, Rates, Folio, History, Notes)\n- **Reservation list** + filters\n- **Tape chart** (rooms × dates)\n- **Group block manager**, rooming list import (CSV)\n- **Cancellation dialog** (fee preview)\n\n---\n\n## 18. Common mistakes\n\n1. No rate snapshot\n2. Applying the current cancellation policy instead of the one at booking time\n3. Inventory update and booking in **separate transactions** → inconsistency\n4. Cancellation deadline with the wrong time zone\n5. No idempotency → double bookings\n6. Treating deposits as revenue\n7. Letting staff edit OTA booking fields that are not allowed to change\n\n---\n\n## 19. Events & venues\n\n### Why separate\nGroup **room** bookings and **hall/venue** bookings differ: venues are sold in **time slots** (morning, afternoon, full day), not nights. Capacity is not a \"count\" like rooms but \"one venue at one time\".\n\n### Model\n```sql\nvenue(id, property_id, name, capacity_theatre, capacity_banquet, capacity_classroom, active)\nvenue_booking(id, venue_id, group_id NULL, company_id NULL, event_name, event_type,\n  start_at, end_at, setup_style, expected_pax, status, deposit_required, total_amount)\nvenue_booking_item(venue_booking_id, item_type /*hall|catering|av|decor*/, description, qty, unit_amount)\nEXCLUDE USING gist (venue_id WITH =, tstzrange(start_at,end_at) WITH &&)   -- no overlap in the same hall\n```\n\n### Workflow\nInquiry → tentative hold (with expiry) → quote (hall + food + AV) → contract/deposit → **BEO** (Banquet Event Order — instructions for kitchen, setup and AV teams) → event → final invoice → folio (on the master folio).\n\n**Edge cases:** setup/teardown buffer time, back-to-back events in one hall, partitioned halls, different VAT/service charge on catering items, falling guest numbers (guarantee number).\n\n**API:** `GET /v1/venues/availability?from=&to=`, `POST /v1/venue-bookings`, `GET /v1/venue-bookings/{id}/beo`\n**Screens:** venue calendar (time-slot grid), event form, BEO print.\n"}, "5": {"n": 5, "title": "০৫ — রুম ও ইনভেন্টরি (Room Inventory)", "md": "# ০৫ — রুম ও ইনভেন্টরি (Room Inventory)\n\n> ইনভেন্টরি = \"কোন রাতে কয়টা রুম বিক্রি করা যায়।\" ভুল হলে ডাবল বুকিং বা অবিক্রিত রুম।\n\n---\n\n## ১. মূল ধারণা\n\n```mermaid\nflowchart TB\n    P[Property] --> RT[Room Type: Deluxe King]\n    RT --> R1[Room 301]\n    RT --> R2[Room 302]\n    RT --> R3[Room 303]\n    RT --> INV[Inventory per date]\n    INV --> AV[Availability]\n```\n\n| ধারণা | মানে |\n|---|---|\n| **Room Type** | বিক্রয়যোগ্য ক্যাটাগরি (Deluxe King, Suite) |\n| **Room (Physical)** | নির্দিষ্ট রুম নম্বর |\n| **Inventory** | তারিখ ধরে বিক্রয়যোগ্য সংখ্যা |\n| **Availability** | বাকি বিক্রয়যোগ্য সংখ্যা |\n| **Room Status** | Clean/Dirty/Inspected ইত্যাদি (housekeeping অবস্থা) |\n| **Occupancy Status** | Vacant/Occupied |\n| **Service Status** | In Service / OOO / OOS |\n\n> **তিনটি আলাদা স্ট্যাটাস অক্ষ — একসাথে গুলিও না।**\n\n---\n\n## ২. Room Type\n\n### কেন\nদাম, বিক্রি, ম্যাপিং (OTA) সব room type ধরে। ১০০ রুম আলাদা আলাদা বিক্রি করা যায় না।\n\n### ফিল্ড\n`id, property_id, code (DLX), name, description, max_adults, max_children, max_occupancy, base_occupancy, bed_config (json), size_sqm, view, smoking, amenities, sort_order, active, ota_mapping`\n\n### ডিজাইন সিদ্ধান্ত\n- **Room type = যা গেস্টকে বিক্রি করো।** একই টাইপের রুম একে অপরের বদলযোগ্য হওয়া উচিত।\n- ভিন্ন view/floor হলে আলাদা টাইপ না attribute? ব্যবসা অনুযায়ী (OTA-তে কত টাইপ দেখাতে চাও)।\n- **Room class hierarchy** (upgrade পথ): Standard < Deluxe < Suite — `upgrade_rank`\n\n---\n\n## ৩. Room (ফিজিক্যাল)\n\nফিল্ড: `id, property_id, room_type_id, number, floor, building, features (balcony, corner), connecting_room_id, status flags, active`\n\n- **Connecting rooms**: পরিবারের জন্য, একসাথে বিক্রি/বরাদ্দ\n- **Room features**: view, smoking, accessible — assign করার সময় ম্যাচিং\n\n---\n\n## ৪. স্ট্যাটাস মডেল\n\n### ৪.১ Housekeeping Status\n```mermaid\nstateDiagram-v2\n    [*] --> Dirty\n    Dirty --> Clean: HK পরিষ্কার করেছে\n    Clean --> Inspected: সুপারভাইজার পরীক্ষা\n    Inspected --> Dirty: গেস্ট ব্যবহার / check-out\n    Clean --> Dirty\n    Dirty --> OutOfOrder\n    OutOfOrder --> Dirty: মেরামত শেষ\n```\n\n### ৪.২ Occupancy\n`Vacant` / `Occupied` (আরও: `Stayover`, `Due Out`, `Due In` — ডেরাইভড)\n\n### ৪.৩ Service Status\n- **Out of Order (OOO)**: মেরামত, দীর্ঘ; **ইনভেন্টরি থেকে বাদ**, রিপোর্টে occupancy হরে প্রভাব (কনফিগ)\n- **Out of Service (OOS)**: সাময়িক (কয়েক ঘণ্টা/দিন, যেমন গভীর পরিষ্কার); ইনভেন্টরিতে থাকে কিন্তু বরাদ্দ করা যায় না (সেটিংস ভেদে)\n\n**পার্থক্য কেন গুরুত্বপূর্ণ:** OOO রুম বিক্রি হলে মিথ্যা availability; OOS শুধু সাময়িক assign-block।\n\n### কম্বাইনড ডিসপ্লে (Room Rack)\n| রুম | Occupancy | HK | Service | দেখায় |\n|---|---|---|---|---|\n| 301 | Vacant | Inspected | In Service | Ready ✔ |\n| 302 | Occupied | Dirty | In Service | Occupied-Dirty |\n| 303 | Vacant | Dirty | In Service | Vacant-Dirty |\n| 304 | Vacant | — | OOO | Out of Order |\n\n---\n\n## ৫. Availability গণনা\n\n### সূত্র (প্রতি room type, প্রতি রাত)\n```\navailable = total_rooms\n          − out_of_order_rooms\n          − (booked_reservations that hold inventory)\n          − (blocked / allotment held)\n          + overbooking_allowance\n```\n\n### ইনভেন্টরি ধরে রাখার দুই পদ্ধতি\n\n**(A) Derived (গণনা)** — প্রতিবার বুকিং থেকে গোনা\n- সুবিধা: সত্য একটাই, অসঙ্গতি কম\n- অসুবিধা: ধীর (অনেক বুকিং, দীর্ঘ রেঞ্জ), কঠিন লক\n\n**(B) Materialized per-date counters** — `room_inventory(property, room_type, date, total, booked, blocked, ooo)` টেবিল\n- সুবিধা: দ্রুত সার্চ, সহজ row-level লক\n- অসুবিধা: কাউন্টার ও বুকিং ডিসিঙ্ক ঝুঁকি → reconcile জব দরকার\n\n> বেশিরভাগ প্রোডাকশন PMS **(B) + reconciliation** ব্যবহার করে।\n\n### স্কিমা (B)\n```sql\nCREATE TABLE room_inventory (\n  property_id   uuid NOT NULL,\n  room_type_id  uuid NOT NULL,\n  stay_date     date NOT NULL,          -- রাত (night of)\n  total_rooms   int  NOT NULL,\n  ooo_rooms     int  NOT NULL DEFAULT 0,\n  blocked_rooms int  NOT NULL DEFAULT 0,\n  booked_rooms  int  NOT NULL DEFAULT 0,\n  overbook_allowance int NOT NULL DEFAULT 0,\n  version       int  NOT NULL DEFAULT 0,\n  PRIMARY KEY (property_id, room_type_id, stay_date),\n  CHECK (booked_rooms >= 0)\n);\n```\n\n**রাত-ভিত্তিক:** ১২ তারিখ arrival, ১৪ departure = রাত ১২ ও ১৩ (১৪ নয়)। Departure দিন ইনভেন্টরি আটকে না।\n\n### উদাহরণ\nDeluxe মোট ২০, OOO ১, বুকড ১৫, blocked ২, overbooking ০:\n`available = 20 − 1 − 15 − 2 = 2`\n\n---\n\n## ৬. ডাবল বুকিং রোধ — Concurrency\n\n**সমস্যা:** শেষ ১টা রুমে দুজন একসাথে বুক করছে।\n\n### সমাধান (atomic conditional update)\n```sql\n-- প্রতি রাতের জন্য, একই ট্রানজ্যাকশনে\nUPDATE room_inventory\nSET booked_rooms = booked_rooms + 1, version = version + 1\nWHERE property_id = :p AND room_type_id = :rt\n  AND stay_date BETWEEN :arrival AND :last_night\n  AND (total_rooms - ooo_rooms - blocked_rooms - booked_rooms + overbook_allowance) >= 1;\n-- affected rows ≠ রাতের সংখ্যা হলে ROLLBACK (সবকিছু বা কিছুই না)\n```\n\nনিয়ম:\n- বুকিং রেকর্ড + ইনভেন্টরি আপডেট **একই DB ট্রানজ্যাকশন**\n- তারিখ ক্রমে লক নাও (deadlock এড়াতে sorted order)\n- বা: `SELECT ... FOR UPDATE` ইনভেন্টরি সারি\n- Redis লক শুধু সাহায্যকারী; ডেটাবেস অবশ্যই চূড়ান্ত (constraint/conditional update)\n- বাইরের সিস্টেমে (OTA) আপডেট **ট্রানজ্যাকশনের পরে** (outbox pattern)\n\n```mermaid\nsequenceDiagram\n    participant A as Agent A\n    participant B as Agent B\n    participant DB\n    A->>DB: BEGIN, UPDATE inventory (conditional)\n    B->>DB: BEGIN, UPDATE inventory (conditional)\n    DB-->>A: 1 row (সফল)\n    DB-->>B: 0 row (রুম নেই)\n    A->>DB: INSERT reservation, COMMIT\n    B->>DB: ROLLBACK → \"sold out\" বার্তা\n```\n\n---\n\n## ৭. Room Assignment ও ইনভেন্টরির সম্পর্ক\n\nদুই স্তর:\n1. **Type-level inventory** (বিক্রির সময়) — `room_inventory`\n2. **Room-level assignment** (check-in-এর কাছাকাছি) — `stay_room_assignment`\n\nনিশ্চিত করো: একটি রুম একই রাতে দুই stay-তে নয়।\n```sql\n-- PostgreSQL exclusion constraint\nALTER TABLE stay_room_assignment\nADD CONSTRAINT no_room_overlap\nEXCLUDE USING gist (\n  room_id WITH =,\n  daterange(from_date, to_date, '[)') WITH &&\n);\n```\n(এক্সটেনশন `btree_gist` লাগে।)\n\n**এজ কেস:** ইনভেন্টরিতে সংখ্যা ঠিক কিন্তু ফিজিক্যাল রুম অসম্ভব বিন্যাস (যেমন তিনটি বুকিং ভিন্ন তারিখে ভিন্ন রুমে ঢুকে যায় ও শেষে গ্যাপ থাকে — \"fragmentation\"/tetris সমস্যা) → রুম-অ্যাসাইনমেন্ট অপ্টিমাইজার/রিশাফল।\n\n---\n\n## ৮. Allotment / Block / Hold\n\n- **Allotment**: কোনো চ্যানেল/কোম্পানির জন্য নির্দিষ্ট রুম সংখ্যা বরাদ্দ (যেমন ট্যুর অপারেটরকে ১০টি)\n- **Block**: গ্রুপের জন্য আটকে রাখা\n- **Hold**: সাময়িক (বুকিং প্রক্রিয়া চলাকালীন কয়েক মিনিট; checkout cart)\n\nমডেল: `inventory_hold (id, room_type_id, from, to, qty, owner_type, owner_id, expires_at, released_at)`\n\n- Release নীতি: cut-off পরে অটো\n- অবিক্রীত allotment রিলিজে অন্য চ্যানেলে বিক্রয়যোগ্য\n\n---\n\n## ৯. Out of Order / Out of Service ম্যানেজমেন্ট\n\nফিল্ড: `room_id, type (OOO|OOS), from_date, to_date, reason, created_by, work_order_id`\n\n- তৈরি করলে ওই রাতগুলোর `ooo_rooms` বাড়ে → availability কমে → CM-এ আপডেট\n- ওই রাতে আগে থেকেই বুকিং/অ্যাসাইনমেন্ট থাকলে → সতর্কতা, রিলোকেশন কাজ\n- মেরামত শেষ → মুক্ত\n\n---\n\n## ১০. ডে-ইউজ (Day Use) ও আওয়ার-ভিত্তিক বিক্রি\n\n- রাত নয়, ঘণ্টা (যেমন ৯টা-৫টা)\n- আলাদা রেট প্ল্যান + স্লট ইনভেন্টরি\n- চ্যালেঞ্জ: night-based ইনভেন্টরি মডেলে ফিট করে না → আলাদা `time_slot_inventory` বা room_type=DayUse\n- ঢাকার মতো শহরে ডে-ইউজ ও কয়েক ঘণ্টার চাহিদা থাকতে পারে (বাজার যাচাই করো); নির্দিষ্ট স্থানীয় নিয়ম ডক ১৬-তে।\n\n---\n\n## ১১. Rate/Restriction-এর সাথে ইনভেন্টরি যোগ\n\nসার্চ রেজাল্ট = `availability ∩ restrictions ∩ rates`\n- Closed to Arrival (CTA), Closed to Departure (CTD)\n- Min/Max length of stay\n- Stop-sell\n(ডক ০৬)\n\n---\n\n## ১২. Channel Sync (ইনভেন্টরি → OTA)\n\nইনভেন্টরি বদলালে (বুকিং, ক্যানসেল, OOO, block) → ইভেন্ট → Channel Manager → প্রতিটি OTA-তে নতুন availability।\n\n```mermaid\nflowchart LR\n    BK[Booking / Cancel / OOO] --> TX[(DB transaction)]\n    TX --> OB[Outbox event]\n    OB --> Q[Queue]\n    Q --> CM[Channel Manager worker]\n    CM --> BDC[Booking.com]\n    CM --> EXP[Expedia]\n    CM --> AGD[Agoda]\n```\n\n**এজ কেস:** পুশ ব্যর্থ → retry/backoff; ধীর sync-এ ওভারবুকিং; ফুল সিঙ্ক (nightly) ব্যাকআপ; ডেল্টা বনাম ফুল পুশ।\n(ডক ১০)\n\n---\n\n## ১৩. Reconciliation (মিলিয়ে দেখা)\n\nনিয়মিত জব:\n```sql\n-- বুকিং থেকে প্রকৃত সংখ্যা গণনা\nSELECT rn.stay_date, r.room_type_id, COUNT(*) AS actual\nFROM reservation_night rn\nJOIN reservation r ON r.id = rn.reservation_id\nWHERE r.status IN ('confirmed','checked_in','tentative')\nGROUP BY rn.stay_date, r.room_type_id;\n-- room_inventory.booked_rooms-এর সাথে তুলনা, অমিলে সতর্কতা/সংশোধন\n```\n\n---\n\n## ১৪. API\n\n```\nGET  /room-types\nPOST /room-types\nGET  /rooms?status=&floor=\nPATCH /rooms/{id}                       // বৈশিষ্ট্য\nPUT  /rooms/{id}/housekeeping-status    // Dirty/Clean/Inspected\nPOST /rooms/{id}/out-of-order           // from,to,reason\nDELETE /rooms/{id}/out-of-order/{oooId}\nGET  /availability?from=&to=&room_type_id=\nGET  /inventory?from=&to=               // কাউন্টার দেখা (admin)\nPOST /inventory/holds\nPOST /inventory/holds/{id}/release\nPUT  /inventory/overbooking             // সীমা\nPOST /stays/{id}/assign-room\n```\n\n---\n\n## ১৫. ফ্রন্টএন্ড\n\n- **Room Rack**: রুম গ্রিড, রঙ দিয়ে স্ট্যাটাস, ফিল্টার (floor, type, status)\n- **Availability Calendar**: room type × তারিখ গ্রিড, কাউন্ট ও রঙ (সবুজ/হলুদ/লাল)\n- **Room Type Manager** (ফটো, বর্ণনা, অ্যামেনিটি)\n- **OOO Scheduler**\n- **Bulk Update**: একসাথে অনেক তারিখ/টাইপে block/stop-sell\n\n---\n\n## ১৬. এজ কেস চেকলিস্ট\n\n- [ ] Departure দিন ইনভেন্টরি আটকে না\n- [ ] OOO ও বুকিং ওভারল্যাপ সতর্কতা\n- [ ] মাল্টি-নাইট বুকিং all-or-nothing\n- [ ] সার্চ ও বুকিংয়ের মাঝে ইনভেন্টরি পরিবর্তন (stale quote) → বুকিংয়ের সময় পুনঃযাচাই\n- [ ] রুম টাইপ মার্জ/ভাগ (পুরনো বুকিং কী হবে)\n- [ ] রুম সংখ্যা বাড়ালে/কমালে ভবিষ্যৎ ইনভেন্টরি পুনঃগণনা\n- [ ] টাইমজোন ও রাত-সীমা (property local date)\n- [ ] ইনভেন্টরি ভবিষ্যতে কত দূর generate (যেমন ৫৫০ দিন), রোলিং জব\n- [ ] Reconciliation ও অডিট\n\n---\n\n## ১৭. প্রপার্টির ধরন অনুযায়ী ইনভেন্টরি একক\n\n| ধরন | বিক্রয় একক | মডেল |\n|---|---|---|\n| হোটেল/রিসোর্ট/গেস্ট হাউস | রুম টাইপ | `room_type` → `room` |\n| সার্ভিসড অ্যাপার্টমেন্ট/ভ্যাকেশন রেন্টাল | ইউনিট (bedroom সংখ্যা সহ) | `room_type` = ইউনিট টাইপ; মাসিক/দীর্ঘ থাকা রেট |\n| **হোস্টেল (ডর্ম)** | **বেড** | `room` (ডর্ম) → `bed`; ইনভেন্টরি বেড-গণনা |\n\n**হোস্টেল বেড-ইনভেন্টরি:**\n```sql\nbed(id, room_id, label, bed_type /*single|bunk_top|bunk_bottom*/, active)\n-- ডর্ম room_type: sellable_unit='bed', total_rooms = বেড সংখ্যা\n```\n- গেস্ট \"বেড\" বুক করে; check-in-এ নির্দিষ্ট বেড অ্যাসাইন\n- জেন্ডার-নির্দিষ্ট ডর্ম (পুরুষ/মহিলা) নিয়ম: বুকিং-এ গেস্টের জেন্ডার চেক\n- পুরো ডর্ম প্রাইভেট রুম হিসেবেও বিক্রি (দুই ধরনের প্রোডাক্ট একই ফিজিক্যাল রুম থেকে — ইনভেন্টরি সংযোগ ঝুঁকি: একটি বিক্রি অন্যটির availability কমায়)\n\n**UI পরিভাষা:** `property.type` অনুযায়ী লেবেল (Room/Unit/Bed) ও ডিফল্ট স্ক্রিন বদলায়।\n\n## ১৮. রিসোর্স ইনভেন্টরি (রুম ছাড়া সম্পদ)\n\nস্পা কক্ষ, থেরাপিস্ট, ট্যুর গাড়ি, হল, গল্ফ কার্ট — এগুলো **time-slot রিসোর্স**, রাত-ভিত্তিক নয়।\n```sql\nresource(id, property_id, type /*spa_room|therapist|vehicle|venue*/, name, active)\nresource_booking(id, resource_id, start_at, end_at, reservation_id NULL, folio_id NULL, status,\n  EXCLUDE USING gist (resource_id WITH =, tstzrange(start_at,end_at) WITH &&))\n```\nএকটি সেবা বুকিংয়ে একাধিক রিসোর্স লাগতে পারে (থেরাপিস্ট + কক্ষ) — সবগুলো একই ট্রানজ্যাকশনে আটকাও।\n\n## ১৯. Onboarding-এ বাল্ক রুম তৈরি\nনতুন প্রপার্টি সেটআপে ১০০টি রুম এক এক করে নয়: রেঞ্জ ইনপুট (`101–120`, ফ্লোর অনুযায়ী প্যাটার্ন, টাইপ বরাদ্দ) → প্রিভিউ → একসাথে তৈরি। CSV ইম্পোর্টও (ডক ১৩, ১৯)।\n", "title_en": "05 — Rooms & Inventory", "md_en": "# 05 — Rooms & Inventory\n\n> Inventory = \"how many rooms can be sold on which night\". Get it wrong and you get double bookings or unsold rooms.\n\n---\n\n## 1. Core concepts\n\n```mermaid\nflowchart TB\n    P[Property] --> RT[Room Type: Deluxe King]\n    RT --> R1[Room 301]\n    RT --> R2[Room 302]\n    RT --> R3[Room 303]\n    RT --> INV[Inventory per date]\n    INV --> AV[Availability]\n```\n\n| Concept | Meaning |\n|---|---|\n| **Room Type** | Sellable category (Deluxe King, Suite) |\n| **Room (physical)** | A specific room number |\n| **Inventory** | Sellable count per date |\n| **Availability** | Remaining sellable count |\n| **Room Status** | Clean/Dirty/Inspected etc. (housekeeping state) |\n| **Occupancy Status** | Vacant/Occupied |\n| **Service Status** | In Service / OOO / OOS |\n\n> **Three separate status axes — never mix them.**\n\n---\n\n## 2. Room type\n\n### Why\nPricing, selling and OTA mapping all work at room-type level. You cannot sell 100 rooms individually.\n\n### Fields\n`id, property_id, code (DLX), name, description, max_adults, max_children, max_occupancy, base_occupancy, bed_config (json), size_sqm, view, smoking, amenities, sort_order, active, ota_mapping`\n\n### Design decisions\n- **Room type = what you sell to the guest.** Rooms of the same type should be interchangeable.\n- Different view/floor: separate type or an attribute? Business decision (how many types to show on OTAs).\n- **Room class hierarchy** (upgrade path): Standard < Deluxe < Suite — `upgrade_rank`\n\n---\n\n## 3. Room (physical)\n\nFields: `id, property_id, room_type_id, number, floor, building, features (balcony, corner), connecting_room_id, status flags, active`\n\n- **Connecting rooms**: for families, sold/assigned together\n- **Room features**: view, smoking, accessible — matched during assignment\n\n---\n\n## 4. Status model\n\n### 4.1 Housekeeping status\n```mermaid\nstateDiagram-v2\n    [*] --> Dirty\n    Dirty --> Clean: HK cleaned\n    Clean --> Inspected: supervisor check\n    Inspected --> Dirty: guest use / check-out\n    Clean --> Dirty\n    Dirty --> OutOfOrder\n    OutOfOrder --> Dirty: repair done\n```\n\n### 4.2 Occupancy\n`Vacant` / `Occupied` (also `Stayover`, `Due Out`, `Due In` — derived)\n\n### 4.3 Service status\n- **Out of Order (OOO)**: repair, longer term; **removed from inventory**, affects the occupancy denominator in reports (configurable)\n- **Out of Service (OOS)**: temporary (hours/days, e.g. deep cleaning); stays in inventory but cannot be assigned (depending on settings)\n\n**Why the difference matters:** selling an OOO room creates false availability; OOS is only a temporary assignment block.\n\n### Combined display (room rack)\n| Room | Occupancy | HK | Service | Shows |\n|---|---|---|---|---|\n| 301 | Vacant | Inspected | In Service | Ready ✔ |\n| 302 | Occupied | Dirty | In Service | Occupied-Dirty |\n| 303 | Vacant | Dirty | In Service | Vacant-Dirty |\n| 304 | Vacant | — | OOO | Out of Order |\n\n---\n\n## 5. Calculating availability\n\n### Formula (per room type, per night)\n```\navailable = total_rooms\n          − out_of_order_rooms\n          − (booked_reservations that hold inventory)\n          − (blocked / allotment held)\n          + overbooking_allowance\n```\n\n### Two ways to hold inventory\n\n**(A) Derived** — count from bookings every time\n- Pro: one truth, fewer inconsistencies\n- Con: slow (many bookings, long ranges), hard locking\n\n**(B) Materialised per-date counters** — a `room_inventory(property, room_type, date, total, booked, blocked, ooo)` table\n- Pro: fast search, simple row-level locks\n- Con: counters can drift from bookings → needs a reconciliation job\n\n> Most production PMSs use **(B) + reconciliation**.\n\n### Schema (B)\n```sql\nCREATE TABLE room_inventory (\n  property_id   uuid NOT NULL,\n  room_type_id  uuid NOT NULL,\n  stay_date     date NOT NULL,          -- the night of\n  total_rooms   int  NOT NULL,\n  ooo_rooms     int  NOT NULL DEFAULT 0,\n  blocked_rooms int  NOT NULL DEFAULT 0,\n  booked_rooms  int  NOT NULL DEFAULT 0,\n  overbook_allowance int NOT NULL DEFAULT 0,\n  version       int  NOT NULL DEFAULT 0,\n  PRIMARY KEY (property_id, room_type_id, stay_date),\n  CHECK (booked_rooms >= 0)\n);\n```\n\n**Night-based:** arrival on the 12th, departure on the 14th = nights of the 12th and 13th (not the 14th). The departure day holds no inventory.\n\n### Example\nDeluxe total 20, OOO 1, booked 15, blocked 2, overbooking 0:\n`available = 20 − 1 − 15 − 2 = 2`\n\n---\n\n## 6. Preventing double bookings — concurrency\n\n**Problem:** two people book the last room at the same time.\n\n### Solution (atomic conditional update)\n```sql\n-- for every night, in the same transaction\nUPDATE room_inventory\nSET booked_rooms = booked_rooms + 1, version = version + 1\nWHERE property_id = :p AND room_type_id = :rt\n  AND stay_date BETWEEN :arrival AND :last_night\n  AND (total_rooms - ooo_rooms - blocked_rooms - booked_rooms + overbook_allowance) >= 1;\n-- if affected rows ≠ number of nights → ROLLBACK (all or nothing)\n```\n\nRules:\n- Booking record + inventory update in **one DB transaction**\n- Lock in date order (sorted, to avoid deadlocks)\n- Or: `SELECT ... FOR UPDATE` on the inventory rows\n- A Redis lock only helps; the database must be the final guard (constraint/conditional update)\n- Updates to external systems (OTAs) happen **after the transaction** (outbox pattern)\n\n```mermaid\nsequenceDiagram\n    participant A as Agent A\n    participant B as Agent B\n    participant DB\n    A->>DB: BEGIN, UPDATE inventory (conditional)\n    B->>DB: BEGIN, UPDATE inventory (conditional)\n    DB-->>A: 1 row (success)\n    DB-->>B: 0 rows (no room)\n    A->>DB: INSERT reservation, COMMIT\n    B->>DB: ROLLBACK → \"sold out\" message\n```\n\n---\n\n## 7. Room assignment and inventory\n\nTwo levels:\n1. **Type-level inventory** (at sale time) — `room_inventory`\n2. **Room-level assignment** (near check-in) — `stay_room_assignment`\n\nMake sure one room is never in two stays on the same night:\n```sql\n-- PostgreSQL exclusion constraint\nALTER TABLE stay_room_assignment\nADD CONSTRAINT no_room_overlap\nEXCLUDE USING gist (\n  room_id WITH =,\n  daterange(from_date, to_date, '[)') WITH &&\n);\n```\n(Requires the `btree_gist` extension.)\n\n**Edge case:** type counts are fine but the physical layout is impossible (bookings on different dates land in different rooms leaving gaps — the \"fragmentation\"/Tetris problem) → room assignment optimiser / reshuffle.\n\n---\n\n## 8. Allotment / block / hold\n\n- **Allotment**: a fixed number of rooms reserved for a channel/company (e.g. 10 for a tour operator)\n- **Block**: rooms held for a group\n- **Hold**: temporary (a few minutes during booking; checkout cart)\n\nModel: `inventory_hold (id, room_type_id, from, to, qty, owner_type, owner_id, expires_at, released_at)`\n\n- Release policy: automatic after cut-off\n- Released allotment becomes sellable on other channels\n\n---\n\n## 9. Out of order / out of service management\n\nFields: `room_id, type (OOO|OOS), from_date, to_date, reason, created_by, work_order_id`\n\n- Creating one increases `ooo_rooms` for those nights → availability drops → CM updated\n- If bookings/assignments already exist on those nights → warning, relocation task\n- Repair finished → released\n\n---\n\n## 10. Day use and hourly sales\n\n- Hours instead of nights (e.g. 9 am–5 pm)\n- Separate rate plan + slot inventory\n- Challenge: does not fit a night-based model → separate `time_slot_inventory` or room_type = DayUse\n- Cities like Dhaka may have demand for day use / a few hours (check the market); local rules in doc 16.\n\n---\n\n## 11. Combining inventory with rates/restrictions\n\nSearch result = `availability ∩ restrictions ∩ rates`\n- Closed to Arrival (CTA), Closed to Departure (CTD)\n- Min/Max length of stay\n- Stop-sell\n(Doc 06)\n\n---\n\n## 12. Channel sync (inventory → OTA)\n\nWhen inventory changes (booking, cancellation, OOO, block) → event → channel manager → new availability on every OTA.\n\n```mermaid\nflowchart LR\n    BK[Booking / Cancel / OOO] --> TX[(DB transaction)]\n    TX --> OB[Outbox event]\n    OB --> Q[Queue]\n    Q --> CM[Channel Manager worker]\n    CM --> BDC[Booking.com]\n    CM --> EXP[Expedia]\n    CM --> AGD[Agoda]\n```\n\n**Edge cases:** push fails → retry/backoff; slow sync causes overbooking; nightly full sync as backup; delta vs full push.\n(Doc 10)\n\n---\n\n## 13. Reconciliation\n\nRegular job:\n```sql\n-- count the real numbers from bookings\nSELECT rn.stay_date, r.room_type_id, COUNT(*) AS actual\nFROM reservation_night rn\nJOIN reservation r ON r.id = rn.reservation_id\nWHERE r.status IN ('confirmed','checked_in','tentative')\nGROUP BY rn.stay_date, r.room_type_id;\n-- compare with room_inventory.booked_rooms, alert/fix on mismatch\n```\n\n---\n\n## 14. API\n\n```\nGET  /room-types\nPOST /room-types\nGET  /rooms?status=&floor=\nPATCH /rooms/{id}                       // attributes\nPUT  /rooms/{id}/housekeeping-status    // Dirty/Clean/Inspected\nPOST /rooms/{id}/out-of-order           // from,to,reason\nDELETE /rooms/{id}/out-of-order/{oooId}\nGET  /availability?from=&to=&room_type_id=\nGET  /inventory?from=&to=               // view counters (admin)\nPOST /inventory/holds\nPOST /inventory/holds/{id}/release\nPUT  /inventory/overbooking             // limits\nPOST /stays/{id}/assign-room\n```\n\n---\n\n## 15. Front end\n\n- **Room rack**: room grid, status by colour, filters (floor, type, status)\n- **Availability calendar**: room type × date grid, counts and colours (green/yellow/red)\n- **Room type manager** (photos, description, amenities)\n- **OOO scheduler**\n- **Bulk update**: block/stop-sell across many dates/types at once\n\n---\n\n## 16. Edge case checklist\n\n- [ ] Departure day holds no inventory\n- [ ] Warning when OOO overlaps bookings\n- [ ] Multi-night bookings are all-or-nothing\n- [ ] Inventory changes between search and booking (stale quote) → re-check at booking time\n- [ ] Merging/splitting room types (what happens to old bookings)\n- [ ] Recalculate future inventory when room counts change\n- [ ] Time zone and night boundaries (property local date)\n- [ ] How far ahead inventory is generated (e.g. 550 days), rolling job\n- [ ] Reconciliation and audit\n\n---\n\n## 17. Inventory unit by property type\n\n| Type | Selling unit | Model |\n|---|---|---|\n| Hotel/resort/guest house | Room type | `room_type` → `room` |\n| Serviced apartment/vacation rental | Unit (with bedroom count) | `room_type` = unit type; monthly/long-stay rates |\n| **Hostel (dorm)** | **Bed** | `room` (dorm) → `bed`; inventory counts beds |\n\n**Hostel bed inventory:**\n```sql\nbed(id, room_id, label, bed_type /*single|bunk_top|bunk_bottom*/, active)\n-- dorm room_type: sellable_unit='bed', total_rooms = number of beds\n```\n- The guest books a \"bed\"; a specific bed is assigned at check-in\n- Gender-specific dorms (male/female): check the guest's gender at booking\n- A whole dorm can also be sold as a private room (two products from one physical room — linked inventory risk: selling one reduces the other's availability)\n\n**UI wording:** labels (Room/Unit/Bed) and default screens change with `property.type`.\n\n## 18. Resource inventory (non-room assets)\n\nSpa rooms, therapists, tour vehicles, halls, golf carts — these are **time-slot resources**, not night-based.\n```sql\nresource(id, property_id, type /*spa_room|therapist|vehicle|venue*/, name, active)\nresource_booking(id, resource_id, start_at, end_at, reservation_id NULL, folio_id NULL, status,\n  EXCLUDE USING gist (resource_id WITH =, tstzrange(start_at,end_at) WITH &&))\n```\nOne service booking may need several resources (therapist + room) — hold all of them in the same transaction.\n\n## 19. Bulk room creation during onboarding\nWhen setting up a new property, do not create 100 rooms one by one: range input (`101–120`, per-floor patterns, type assignment) → preview → create together. CSV import as well (docs 13, 19).\n"}, "6": {"n": 6, "title": "০৬ — রেট, প্রাইসিং, ট্যাক্স (Rates, Pricing, Taxes)", "md": "# ০৬ — রেট, প্রাইসিং, ট্যাক্স (Rates, Pricing, Taxes)\n\n> রেট ভুল = সরাসরি টাকা ক্ষতি। এই ডক সবচেয়ে \"ব্যবসা-ভারী\"।\n\n---\n\n## ১. রেট ম্যানেজমেন্টের কাঠামো\n\n```mermaid\nflowchart TD\n    RT[Room Type] --> RP[Rate Plan: BAR, B&B, Non-refundable, Corporate]\n    RP --> BR[Base Rate / প্রতি রাত]\n    BR --> RULES[Rules: Season, Weekday, Event, Last-minute]\n    RULES --> OCC[Occupancy pricing: extra adult/child]\n    OCC --> DISC[Discount / Promo / Package]\n    DISC --> TAX[Tax + Service charge]\n    TAX --> FINAL[Final price per night]\n    RES[Restrictions: MinLOS, CTA, CTD, Stop-sell] -.সার্চে ফিল্টার.-> RP\n```\n\n| ধারণা | মানে |\n|---|---|\n| **Rate Plan** | একই room type-এর ভিন্ন দাম+শর্ত (meal, cancellation, audience) |\n| **BAR** | Best Available Rate — সর্বোচ্চ ছাড়হীন সাধারণ রেট |\n| **Derived rate** | অন্য রেটের % বা fixed পার্থক্য (Corporate = BAR −15%) |\n| **Package** | রুম + অতিরিক্ত (breakfast, airport pickup) |\n| **Restriction** | বিক্রির শর্ত (min stay, closed to arrival) |\n| **Rate override** | নির্দিষ্ট বুকিংয়ে ম্যানুয়াল দাম (অনুমতি + কারণ) |\n\n> উদাহরণ (কাল্পনিক): Base ৳৬,৫০০; শুক্র-শনি +২০%; Pohela Boishakh-এ ২ রাতের মিনিমাম ও +৫০%; অবিক্রীত রুম সন্ধ্যা ৬টার পর −১০%। এই চারটি ধরনই একটি **rule engine** দিয়ে মডেল করা যায়।\n\n---\n\n## ২. রেট রুল ইঞ্জিন\n\n### রুল টাইপ\n1. **Base** — room type × rate plan ডিফল্ট\n2. **Day-of-week** — শুক্র/শনি অ্যাডজাস্ট\n3. **Season / date range** — শীত, ঈদ, কক্সবাজার পিক সিজন\n4. **Event** — নির্দিষ্ট দিন (ঈদ, পহেলা বৈশাখ, কনফারেন্স)\n5. **Lead time** — আগাম/last-minute\n6. **Length of stay** — ৩+ রাতে ছাড়\n7. **Occupancy** — pax অনুযায়ী\n8. **Channel** — OTA বনাম direct (parity সাবধানে)\n\n### প্রয়োগের ক্রম (সংজ্ঞায়িত রাখো!)\n```\nprice = base\nprice = apply(season)            // পরিবর্তন: replace/percent/fixed\nprice = apply(day_of_week)\nprice = apply(event)\nprice = apply(lead_time / LOS)\nprice = apply(occupancy)\nprice = apply(discount/promo)\n→ tax/service charge শেষে\n```\n> ক্রম বদলালে ফল বদলায় (+২০% তারপর −১০% ≠ −১০% তারপর +২০%-এর প্রতিটি ধাপে rounding)। ক্রম লিখিত ও টেস্টেড হতে হবে।\n\n### স্কিমা (সরলীকৃত)\n```sql\nrate_plan(id, property_id, code, name, meal_plan, cancel_policy_id,\n          refundable bool, derived_from_id, derive_type, derive_value, active)\nrate_rule(id, property_id, rate_plan_id, room_type_id NULL, rule_type,\n          date_from, date_to, dow_mask, adjust_type, adjust_value, priority,\n          min_los NULL, max_los NULL, lead_min NULL, lead_max NULL)\nrate_daily(property_id, room_type_id, rate_plan_id, stay_date, amount,\n           currency, source)               -- materialized cache\nrestriction_daily(property_id, room_type_id, rate_plan_id, stay_date,\n           min_los, max_los, cta bool, ctd bool, stop_sell bool)\n```\n**materialized `rate_daily`** রাখলে সার্চ দ্রুত; রুল বদলালে পুনঃগণনা জব। বুকিংয়ে স্ন্যাপশট (ডক ০৪)।\n\n---\n\n## ৩. Restrictions\n\n| Restriction | কাজ |\n|---|---|\n| **Min LOS** | ন্যূনতম রাত (পিক সিজনে ২-৩) |\n| **Max LOS** | সর্বোচ্চ রাত |\n| **CTA** | Closed to Arrival — এই দিনে ঢোকা যাবে না |\n| **CTD** | Closed to Departure — এই দিনে বের হওয়া যাবে না |\n| **Stop-sell** | বিক্রি বন্ধ |\n| **Advance purchase** | কমপক্ষে X দিন আগে বুক |\n\n**এজ কেস:** MinLOS arrival-based নাকি stay-through-based (দুটো আলাদা — OTA ম্যাপিংয়ে ভুল হয়)। মাঝের রাতে CTA থাকলেও থাকা চলবে (CTA শুধু arrival দিনে)।\n\n---\n\n## ৪. অকুপেন্সি-ভিত্তিক মূল্য\n\n- Base occupancy (যেমন ২ adult)\n- Extra adult / extra child (বয়স-ব্যান্ড) / extra bed ফি\n- Infant ফ্রি\n- রুম type-এর `max_occupancy` অতিক্রম করা ব্লক\n\n**এজ কেস:** child age গণনা arrival তারিখে নাকি stay-তারিখে; OTA থেকে child age না এলে ডিফল্ট ধরা।\n\n---\n\n## ৫. ডিসকাউন্ট, প্রমো, কমিশন\n\n| ধরন | নোট |\n|---|---|\n| Percent / Fixed | line-item হিসেবে (রেট বদলিয়ে নয়) যাতে রিপোর্টে দেখা যায় |\n| Promo code | মেয়াদ, ব্যবহার সীমা, রেট প্ল্যান-ভিত্তিক |\n| Comp / House use | ০ টাকা কিন্তু রিপোর্টে আলাদা |\n| Staff rate | অনুমতি সীমিত |\n| Commission | OTA/ট্রাভেল এজেন্টকে দেয়; গ্রস/নেট রেভিনিউ আলাদা |\n\n**কমিশন গণনা উদাহরণ:** রুম ৳১০,০০০, OTA ১৮% → কমিশন ৳১,৮০০, হোটেল নেট ৳৮,২০০। (হারের উদাহরণ শুধু; চুক্তি অনুযায়ী আলাদা।) কমিশন কি ট্যাক্স সহ মূল্যে না ট্যাক্স ছাড়া মূল্যে — চুক্তিতে দেখো, কনফিগারযোগ্য রাখো।\n\n**ডাইরেক্ট বুকিং সুবিধা:** কমিশন বাদ → হোটেলে বেশি আয়। এটিই booking engine-এর ব্যবসায়িক যুক্তি।\n\n---\n\n## ৬. ট্যাক্স ও ফি — সাধারণ কাঠামো\n\n```\nNet room rate\n+ Service charge (যদি আলাদা)\n+ VAT (service charge সহ বা ছাড়া — আইন/নীতি অনুযায়ী)\n+ অন্যান্য লেভি\n= Gross\n```\n\n### ইঞ্জিনিয়ারিং নীতি\n1. **Tax rule = কনফিগারযোগ্য, তারিখ-ভিত্তিক** (`valid_from/valid_to`) — আইন বদলায়।\n2. **Inclusive vs Exclusive**: দাম ট্যাক্স সহ (গ্রস) না ট্যাক্স ছাড়া (নেট)। OTA গ্রস পাঠাতে পারে — উল্টো হিসাব (back-calculate) দরকার।\n3. **Per-charge-code ট্যাক্স**: রুম, F&B, স্পা, লন্ড্রির আলাদা হার।\n4. **Rounding**: line-level নাকি invoice-level — নীতি ঠিক করে সংগতি রাখো।\n5. **স্ন্যাপশট**: ট্যাক্স হার পোস্টিংয়ের সময়ের — পরে বদলালে অতীত বদলাবে না।\n6. **Exemption**: ট্যাক্স-মুক্ত গেস্ট/কোম্পানি (কূটনৈতিক) — certificate ট্র্যাক।\n\n```sql\ntax_rule(id, property_id, code, name, rate_pct, applies_to_charge_group,\n         compound_on NULL, inclusive bool, valid_from, valid_to)\nfolio_line_tax(folio_line_id, tax_rule_id, base_amount, tax_amount)\n```\n\n---\n\n## ৭. বাংলাদেশ — ট্যাক্স (ব্যবহারের আগে যাচাই করো)\n\n**প্রকাশ্য সূত্রে যা পাওয়া যায়:**\n- একটি সার্ভিস-VAT তালিকা (২০২৪-২৫, তৃতীয় পক্ষ সাইট) হোটেল/রেস্টুরেন্টে AC হোটেল ১৫%, নন-AC ১০% দেখায়, এবং থ্রি-স্টার বা উচ্চতর হোটেলের রুম ভাড়া ও হোটেলের ভেতরের রেস্টুরেন্ট/বারের আলাদা উল্লেখ আছে। সূত্র: legalseba.com\n- ২০২৫-এর জানুয়ারিতে হোটেল-রেস্টুরেন্টে VAT নিয়ে সরকার একবার ১৫% করে, পরে NBR আগের স্তরে ফেরার সিদ্ধান্ত জানায় (Daily Ittefaq, ১৬ জানুয়ারি ২০২৫)।\n- সংবাদ ও ব্লগে পরস্পরবিরোধী হার (৫%, ৭.৫%, ১০%, ১৫%) পাওয়া যায়; তাছাড়া EFD (ইলেকট্রনিক ফিসক্যাল ডিভাইস) বাধ্যতামূলক বলে একটি ব্লগ দাবি করেছে।\n\n**সিদ্ধান্ত:** বর্তমান সঠিক হার ও নিয়ম এখানে নিশ্চিত নয়। প্রোডাকশনে কোডে হার বসানোর আগে NBR-এর সর্বশেষ প্রজ্ঞাপন বা লাইসেন্সড VAT কনসালট্যান্ট থেকে যাচাই করো। PMS-এ তাই **হার হার্ডকোড নয়, কনফিগ টেবিলে**।\n\n**PMS-এর জন্য যা নিশ্চিত দরকার (সাধারণ নীতি):**\n- ইনভয়েসে BIN (Business Identification Number) ও বিক্রেতার তথ্য\n- ইনভয়েস ক্রমিক নম্বর, অনন্য\n- রুম, F&B, সার্ভিস চার্জ আলাদা লাইনে\n- তারিখ-ভিত্তিক হার; credit note/debit note সাপোর্ট\n- সরকারি ফর্ম/রিটার্নের (যেমন মাসিক VAT রিটার্ন) জন্য এক্সপোর্টযোগ্য ডেটা\n- সার্ভিস চার্জের ওপর VAT প্রযোজ্য কি না — আইনি সংজ্ঞা যাচাই করে কনফিগ করো (এক ব্লগ সার্ভিস চার্জ ও VAT মিশিয়ে দেখানোকে সাধারণ ভুল বলেছে)\n\n---\n\n## ৮. API ও স্ক্রিন\n\n```\nGET  /rate-plans            POST /rate-plans\nGET  /rates?room_type_id=&from=&to=\nPUT  /rates/bulk            // তারিখ-রেঞ্জ, DOW mask, ± fixed/percent\nPUT  /restrictions/bulk\nPOST /quotes                // pax, তারিখ, প্ল্যান → breakdown (নেট, ট্যাক্স, ফি)\nGET  /tax-rules             POST /tax-rules\n```\n**Quote response** (ব্রেকডাউন সহ):\n```json\n{\"nights\":[{\"date\":\"2026-04-17\",\"base\":6500,\"adjustments\":[{\"rule\":\"weekend\",\"pct\":20}],\n \"net\":7800,\"service_charge\":0,\"tax\":[{\"code\":\"VAT\",\"amount\":0}],\"gross\":7800}],\n \"total_gross\":0,\"currency\":\"BDT\"}\n```\n**স্ক্রিন:** Rate calendar গ্রিড (room type × তারিখ, bulk edit), Restriction grid, Rule manager, Promo manager, Tax settings, Quote simulator।\n\n---\n\n## ৯. এজ কেস চেকলিস্ট\n- [ ] ভবিষ্যৎ রেট না থাকলে বুকিং ব্লক\n- [ ] রেট পরিবর্তনের পর পুরনো বুকিং অপরিবর্তিত\n- [ ] OTA-তে পাঠানো রেট = PMS-র গ্রস/নেট নীতি\n- [ ] Derived rate চেইন (A থেকে B, B থেকে C) লুপ প্রতিরোধ\n- [ ] Rounding পার্থক্য invoice বনাম নিজস্ব\n- [ ] Multi-currency (বিদেশি গেস্ট USD) — এক্সচেঞ্জ রেট স্ন্যাপশট\n- [ ] অতীত তারিখে রেট এডিট ব্লক\n- [ ] ট্যাক্স হার মধ্য-বুকিংয়ে বদল (stay-date ভিত্তিক)\n\n---\n\n## ১০. রেট রুল টেমপ্লেট (স্থানীয় সিজন ও ইভেন্ট)\n\nপ্রতিটি হোটেল নিজে নিজে রুল লিখলে ভুল হয়। **টেমপ্লেট লাইব্রেরি** দাও (কপি করে বদলানো যায়):\n\n| টেমপ্লেট | আচরণ (উদাহরণ, মান বদলযোগ্য) |\n|---|---|\n| ঈদ উল ফিতর/আযহা সিজন | তারিখ-রেঞ্জ, +X%, minimum stay |\n| পহেলা বৈশাখ/পহেলা ফাল্গুন | নির্দিষ্ট দিন, +X%, min ২ রাত |\n| শীত/পিক ট্যুরিস্ট সিজন (কক্সবাজার, সিলেট ইত্যাদি) | মাস-রেঞ্জ, +X% |\n| সপ্তাহান্ত (শুক্র-শনি) | DOW mask, +X% |\n| Last-minute | সন্ধ্যা ৬টার পর (বা X ঘণ্টা আগে) অবিক্রীত রুমে −X% |\n| Long stay | ৭+ রাতে −X% |\n| Early bird | ৩০+ দিন আগে −X% |\n\n**নোট:** ঈদ/ইসলামিক ক্যালেন্ডার তারিখ বছর বছর বদলায় এবং চাঁদ দেখার ওপর নির্ভর করে — টেমপ্লেটে তারিখ ম্যানুয়ালি নিশ্চিত করার ধাপ রাখো, স্বয়ংক্রিয় অনুমান নয়।\n\n**Last-minute রুল ইঞ্জিনিয়ারিং:** property-local সময় ও business date ব্যবহার; ছাড় OTA-তে পাঠাবে কি না আলাদা সুইচ (parity); একই দিনের বিক্রি সীমা।\n", "title_en": "06 — Rates, Pricing & Taxes", "md_en": "# 06 — Rates, Pricing & Taxes\n\n> A wrong rate = direct financial loss. This is the most \"business-heavy\" doc.\n\n---\n\n## 1. Structure of rate management\n\n```mermaid\nflowchart TD\n    RT[Room Type] --> RP[Rate Plan: BAR, B&B, Non-refundable, Corporate]\n    RP --> BR[Base rate per night]\n    BR --> RULES[Rules: Season, Weekday, Event, Last-minute]\n    RULES --> OCC[Occupancy pricing: extra adult/child]\n    OCC --> DISC[Discount / Promo / Package]\n    DISC --> TAX[Tax + Service charge]\n    TAX --> FINAL[Final price per night]\n    RES[Restrictions: MinLOS, CTA, CTD, Stop-sell] -.filters search.-> RP\n```\n\n| Concept | Meaning |\n|---|---|\n| **Rate Plan** | Different price + conditions for the same room type (meals, cancellation, audience) |\n| **BAR** | Best Available Rate — the general undiscounted public rate |\n| **Derived rate** | % or fixed difference from another rate (Corporate = BAR −15%) |\n| **Package** | Room + extras (breakfast, airport pickup) |\n| **Restriction** | Selling condition (min stay, closed to arrival) |\n| **Rate override** | Manual price on a specific booking (permission + reason) |\n\n> Example (illustrative): base BDT 6,500; Friday–Saturday +20%; Pohela Boishakh 2-night minimum and +50%; unsold rooms −10% after 6 pm. All four can be modelled with one **rule engine**.\n\n---\n\n## 2. Rate rule engine\n\n### Rule types\n1. **Base** — room type × rate plan default\n2. **Day of week** — Friday/Saturday adjustment\n3. **Season / date range** — winter, Eid, Cox's Bazar peak season\n4. **Event** — specific days (Eid, Pohela Boishakh, conferences)\n5. **Lead time** — early booking / last minute\n6. **Length of stay** — discount for 3+ nights\n7. **Occupancy** — by pax\n8. **Channel** — OTA vs direct (careful with parity)\n\n### Order of application (define it!)\n```\nprice = base\nprice = apply(season)            // modifier: replace/percent/fixed\nprice = apply(day_of_week)\nprice = apply(event)\nprice = apply(lead_time / LOS)\nprice = apply(occupancy)\nprice = apply(discount/promo)\n→ tax/service charge last\n```\n> Changing the order changes the result (+20% then −10% ≠ −10% then +20% once rounding happens at each step). The order must be written down and tested.\n\n### Schema (simplified)\n```sql\nrate_plan(id, property_id, code, name, meal_plan, cancel_policy_id,\n          refundable bool, derived_from_id, derive_type, derive_value, active)\nrate_rule(id, property_id, rate_plan_id, room_type_id NULL, rule_type,\n          date_from, date_to, dow_mask, adjust_type, adjust_value, priority,\n          min_los NULL, max_los NULL, lead_min NULL, lead_max NULL)\nrate_daily(property_id, room_type_id, rate_plan_id, stay_date, amount,\n           currency, source)               -- materialized cache\nrestriction_daily(property_id, room_type_id, rate_plan_id, stay_date,\n           min_los, max_los, cta bool, ctd bool, stop_sell bool)\n```\nA **materialised `rate_daily`** table makes search fast; a job recalculates it when rules change. Bookings keep a snapshot (doc 04).\n\n---\n\n## 3. Restrictions\n\n| Restriction | Effect |\n|---|---|\n| **Min LOS** | Minimum nights (2–3 in peak season) |\n| **Max LOS** | Maximum nights |\n| **CTA** | Closed to Arrival — no arrivals on this day |\n| **CTD** | Closed to Departure — no departures on this day |\n| **Stop-sell** | Selling stopped |\n| **Advance purchase** | Must book at least X days ahead |\n\n**Edge cases:** MinLOS can be arrival-based or stay-through-based (they differ — a common OTA mapping mistake). A CTA on a middle night does not block a stay (CTA applies only to the arrival day).\n\n---\n\n## 4. Occupancy-based pricing\n\n- Base occupancy (e.g. 2 adults)\n- Extra adult / extra child (age bands) / extra bed fee\n- Infants free\n- Block anything above the room type's `max_occupancy`\n\n**Edge cases:** is child age calculated on the arrival date or per stay date; default when the OTA sends no child age.\n\n---\n\n## 5. Discounts, promos, commission\n\n| Type | Note |\n|---|---|\n| Percent / Fixed | As a line item (not by changing the rate) so reports show it |\n| Promo code | Validity, usage limit, rate-plan based |\n| Comp / House use | Zero amount but reported separately |\n| Staff rate | Restricted permission |\n| Commission | Paid to OTAs/travel agents; keep gross and net revenue separate |\n\n**Commission example:** room BDT 10,000, OTA 18% → commission BDT 1,800, hotel net BDT 8,200. (Example rate only; contracts differ.) Whether commission applies to the price with or without tax depends on the contract — keep it configurable.\n\n**Direct booking advantage:** no commission → more income for the hotel. This is the business case for a booking engine.\n\n---\n\n## 6. Taxes and fees — general structure\n\n```\nNet room rate\n+ Service charge (if separate)\n+ VAT (with or without service charge — per law/policy)\n+ Other levies\n= Gross\n```\n\n### Engineering principles\n1. **Tax rules are configurable and date-based** (`valid_from/valid_to`) — laws change.\n2. **Inclusive vs exclusive**: is the price tax-inclusive (gross) or tax-exclusive (net)? OTAs may send gross — back-calculation needed.\n3. **Tax per charge code**: rooms, F&B, spa and laundry can have different rates.\n4. **Rounding**: line level or invoice level — decide a policy and stay consistent.\n5. **Snapshot**: the tax rate at posting time — later changes do not alter the past.\n6. **Exemptions**: tax-exempt guests/companies (diplomatic) — track certificates.\n\n```sql\ntax_rule(id, property_id, code, name, rate_pct, applies_to_charge_group,\n         compound_on NULL, inclusive bool, valid_from, valid_to)\nfolio_line_tax(folio_line_id, tax_rule_id, base_amount, tax_amount)\n```\n\n---\n\n## 7. Bangladesh — taxes (verify before use)\n\n**What public sources show:**\n- A third-party service-VAT list (2024–25) shows 15% for AC hotels and 10% for non-AC hotels/restaurants, with separate mentions for three-star-and-above room rent and in-hotel restaurants/bars. Source: legalseba.com\n- In January 2025 the government raised VAT on hotels/restaurants to 15%, then NBR announced a return to the earlier level (Daily Ittefaq, 16 January 2025).\n- News and blogs show conflicting rates (5%, 7.5%, 10%, 15%); one blog also says an EFD (Electronic Fiscal Device) is mandatory.\n\n**Decision:** the current exact rates and rules are not confirmed here. Before putting rates into production, verify against the latest NBR notification or a licensed VAT consultant. That is why the PMS keeps **rates in a config table, never hard-coded**.\n\n**What a PMS definitely needs (general principles):**\n- BIN (Business Identification Number) and seller details on the invoice\n- Unique sequential invoice numbers\n- Rooms, F&B and service charge on separate lines\n- Date-based rates; credit note/debit note support\n- Exportable data for government forms/returns (e.g. monthly VAT return)\n- Whether VAT applies on top of service charge — verify the legal definition and configure it (one blog calls mixing service charge and VAT a common mistake)\n\n---\n\n## 8. API and screens\n\n```\nGET  /rate-plans            POST /rate-plans\nGET  /rates?room_type_id=&from=&to=\nPUT  /rates/bulk            // date range, DOW mask, ± fixed/percent\nPUT  /restrictions/bulk\nPOST /quotes                // pax, dates, plan → breakdown (net, tax, fees)\nGET  /tax-rules             POST /tax-rules\n```\n**Quote response** (with breakdown):\n```json\n{\"nights\":[{\"date\":\"2026-04-17\",\"base\":6500,\"adjustments\":[{\"rule\":\"weekend\",\"pct\":20}],\n \"net\":7800,\"service_charge\":0,\"tax\":[{\"code\":\"VAT\",\"amount\":0}],\"gross\":7800}],\n \"total_gross\":0,\"currency\":\"BDT\"}\n```\n**Screens:** rate calendar grid (room type × date, bulk edit), restriction grid, rule manager, promo manager, tax settings, quote simulator.\n\n---\n\n## 9. Edge case checklist\n- [ ] Block bookings when future rates are missing\n- [ ] Old bookings unchanged after a rate change\n- [ ] Rates sent to OTAs follow the PMS gross/net policy\n- [ ] Prevent loops in derived-rate chains (A from B, B from C)\n- [ ] Rounding differences: invoice vs internal\n- [ ] Multi-currency (foreign guests in USD) — exchange rate snapshot\n- [ ] Block rate edits on past dates\n- [ ] Tax rate changes mid-stay (based on stay date)\n\n---\n\n## 10. Rate rule templates (local seasons and events)\n\nHotels make mistakes writing rules from scratch. Provide a **template library** (copy and adjust):\n\n| Template | Behaviour (example, values editable) |\n|---|---|\n| Eid ul-Fitr / Eid ul-Adha season | Date range, +X%, minimum stay |\n| Pohela Boishakh / Pohela Falgun | Specific day, +X%, min 2 nights |\n| Winter / peak tourist season (Cox's Bazar, Sylhet etc.) | Month range, +X% |\n| Weekend (Fri–Sat) | DOW mask, +X% |\n| Last minute | −X% on unsold rooms after 6 pm (or X hours before) |\n| Long stay | −X% for 7+ nights |\n| Early bird | −X% when booked 30+ days ahead |\n\n**Note:** Eid / Islamic calendar dates change every year and depend on moon sighting — keep a manual date-confirmation step in the template, not automatic guessing.\n\n**Last-minute rule engineering:** use property-local time and business date; a separate switch for whether the discount goes to OTAs (parity); same-day sales cap.\n"}, "7": {"n": 7, "title": "০৭ — গেস্ট, বুকিং, ফোলিও (Guests, Bookings, Folios)", "md": "# ০৭ — গেস্ট, বুকিং, ফোলিও (Guests, Bookings, Folios)\n\n---\n\n## ১. Guest Profile\n\n### কেন আলাদা এনটিটি\nএকই মানুষ একাধিকবার আসে। প্রোফাইল থাকলে হিস্ট্রি, পছন্দ, loyalty, দ্রুত check-in।\n\n**ফিল্ড:** `id, org_id, first_name, last_name, gender, dob, nationality, phone, email, address, language, vip_level, tags[], notes, marketing_consent, blacklist_flag, created_at, merged_into_id`\n**ডকুমেন্ট:** `guest_document(guest_id, type, number_enc, issue_country, expiry, file_ref)`\n\n### নিয়ম\n- **সংস্থা-স্তরে শেয়ার** (multi-property: একই গেস্ট সব শাখায়)\n- ডুপ্লিকেট: ফোন/ইমেইল/নাম+DOB ম্যাচ → **merge** (history সরিয়ে, `merged_into_id`)\n- সংবেদনশীল ফিল্ড (ID নম্বর, ছবি) এনক্রিপ্টেড, অ্যাক্সেস লগ\n- সম্মতি (marketing consent) আলাদা রেকর্ড\n- blacklist/VIP নোট: কে দেখতে পারে নিয়ন্ত্রণ\n\n### গেস্ট লাইফসাইকেল ডায়াগ্রাম\n```mermaid\nflowchart LR\n    L[Lead/Inquiry] --> P[Profile তৈরি]\n    P --> B[Booking]\n    B --> S[Stay]\n    S --> H[History + Folio]\n    H --> R[Repeat / Loyalty / Campaign]\n    R --> B\n```\n\n**এজ কেস:** একই ফোন দিয়ে পরিবারের সবাই; কোম্পানির বুকার ≠ গেস্ট; নাম বানান ভিন্ন (বাংলা/ইংরেজি ট্রান্সলিটারেশন) — ফাজি ম্যাচিং।\n\n---\n\n## ২. Booking vs Reservation vs Stay (মডেল)\n\n```mermaid\nerDiagram\n    GUEST ||--o{ BOOKING : \"বুকার\"\n    BOOKING ||--|{ RESERVATION : \"প্রতি রুম\"\n    RESERVATION ||--o{ RESERVATION_GUEST : \"অতিথিরা\"\n    GUEST ||--o{ RESERVATION_GUEST : \"\"\n    RESERVATION ||--o| STAY : \"check-in হলে\"\n    STAY ||--|{ STAY_ROOM_ASSIGNMENT : \"রুম ইতিহাস\"\n    BOOKING ||--o{ FOLIO : \"\"\n    RESERVATION ||--o{ FOLIO : \"\"\n```\n- **Booking** = অর্ডার/কনটেইনার (একজন বুকার, অনেক রুম)\n- **Reservation** = একটি রুমের চুক্তি\n- **Stay** = বাস্তব থাকা\n\n---\n\n## ৩. Folio (গেস্ট বিলের খাতা)\n\n### মানে\nচার্জ (debit) ও পেমেন্ট (credit) এর ledger। Balance = চার্জ − পেমেন্ট।\n\n### কেন\nপ্রতিটি টাকার হিসাব, অডিট, invoice-র ভিত্তি।\n\n### ফোলিও ধরন\n| ধরন | ব্যবহার |\n|---|---|\n| Guest folio | গেস্টের নিজের বিল |\n| Master folio | গ্রুপ/ইভেন্টের কেন্দ্রীয় বিল |\n| Company / City ledger | কোম্পানির ক্রেডিট বিল |\n| House / Non-resident | ডে-ভিজিটর, F&B ব্যাংকোয়েট |\n| Window (A/B/C) | একই folio-তে ভাগ করা অংশ |\n\n### ওয়ার্কফ্লো\n```mermaid\nflowchart LR\n    CI[Check-in: folio open] --> POST[Posting: room, F&B, spa, laundry]\n    POST --> PAY[Payments / deposits]\n    PAY --> AUD[Night audit: room+tax post]\n    AUD --> CO[Check-out: balance=0 → close]\n    CO --> INV[Invoice]\n    CO --> LOCK[Folio locked]\n```\n\n### Folio Line (লেজার সারি)\n```sql\nfolio_line(\n  id, folio_id, window_no, business_date, posted_at,\n  type              -- 'charge' | 'payment' | 'adjustment' | 'tax' | 'transfer'\n  charge_code_id, description, quantity, unit_amount,\n  amount            -- + debit, − credit (বা আলাদা কলাম)\n  currency, tax_amount, reference_id,    -- POS check no / gateway txn\n  reversal_of_id NULL, posted_by, source -- 'night_audit'|'pos'|'manual'|'channel'\n)\n```\n**নিয়ম:** **Append-only।** ভুল হলে নতুন `adjustment`/`reversal` সারি; মুছো না, আপডেট করো না। Business date দিয়ে পোস্ট (ক্যালেন্ডার নয়)।\n\n### Charge Code / Transaction Code\n`ROOM`, `ROOM_TAX`, `SVC`, `FNB_FOOD`, `FNB_BEV`, `SPA`, `LAUNDRY`, `MINIBAR`, `TRANSPORT`, `PAY_CASH`, `PAY_CARD`, `PAY_BKASH`, `ADJ`… প্রতিটির **department, revenue group, tax group, GL account** ম্যাপ।\n\n---\n\n## ৪. Routing, Split ও Shared Folio\n\n**Routing**: নির্দিষ্ট charge code স্বয়ংক্রিয় অন্য folio/window-এ।\n- কোম্পানি রুম+ট্যাক্স দেয় (Window A → company), গেস্ট নিজের খাবার (Window B → গেস্ট)\n\n**Split payment**: একটি বিল একাধিক পেমেন্টে (অর্ধেক কার্ড, অর্ধেক bKash) বা একাধিক পক্ষে।\n\n**Shared folio**: একাধিক রুম/গেস্টের একটি বিল (পরিবার, গ্রুপ) — transfer দিয়ে।\n\n```mermaid\nflowchart TB\n    R1[Room 301 charges] --> W{Routing rule}\n    W -- ROOM, ROOM_TAX --> CF[Company folio]\n    W -- FNB, SPA --> GF[Guest folio]\n    CF --> INV1[Invoice to company]\n    GF --> INV2[Settle at check-out]\n```\n\n**এজ কেস:** routing রুল মাঝপথে বদল (পুরনো লাইন কী হবে); Transfer করলে audit; ভাগ করা পেমেন্ট ফেরত দিতে কোন পেমেন্টে রিফান্ড; আংশিক ট্যাক্স।\n\n---\n\n## ৫. Posting-এর উৎস\n\n| উৎস | কীভাবে |\n|---|---|\n| Night audit | রুম চার্জ + ট্যাক্স (প্রতি রাত) |\n| POS | রেস্টুরেন্ট/বার/স্পা টিকিট রুমে চার্জ |\n| Manual | রিসেপশন (লন্ড্রি, ট্রান্সপোর্ট) |\n| Minibar | HK শিট/অ্যাপ |\n| Channel | OTA প্রি-পেইড/ভার্চুয়াল কার্ড |\n| Phone/Wi-Fi | বিলিং ইন্টারফেস |\n\n**POS → folio**: রুম নম্বর/গেস্ট ভেরিফাই করে পোস্ট। ব্যর্থ হলে retry queue; দ্বৈত পোস্ট রোধে `pos_check_id` অনন্য সীমাবদ্ধতা।\n\n---\n\n## ৬. Invoice\n\n- ইনভয়েস = folio-র স্ন্যাপশট (ক্রমিক নম্বর, তারিখ, গেস্ট/কোম্পানি, বিক্রেতার BIN/তথ্য, লাইন, ট্যাক্স, মোট)\n- **Immutable**: ইস্যু পরে বদল নয় — **credit note** + নতুন invoice\n- ভাষা: ইংরেজি/বাংলা\n- বাংলাদেশ: সরকারি ফরম্যাট/BIN-সংক্রান্ত প্রয়োজনীয়তা ডক ১৬-তে যাচাই করে\n\n```\ninvoice(id, property_id, number, folio_id, issued_at, bill_to_type, bill_to_id,\n        subtotal, tax_total, total, currency, status, void_of_id)\n```\n\n---\n\n## ৭. API\n\n```\nGET  /folios/{id}\nPOST /folios/{id}/charges        { charge_code, amount, qty, description, idempotency_key }\nPOST /folios/{id}/payments       { method, amount, reference }\nPOST /folios/{id}/adjustments    { line_id, reason }       // reversal সহ\nPOST /folios/{id}/transfer       { to_folio_id, line_ids[] }\nPOST /folios/{id}/split          { rules }\nPOST /folios/{id}/invoice\nPOST /invoices/{id}/credit-note\nGET  /guests?q=      POST /guests      POST /guests/{id}/merge\n```\n\n## ৮. স্ক্রিন\nGuest profile (ট্যাব: তথ্য, ডকুমেন্ট, stay history, নোট, consent), Folio view (windows, ফিল্টার), Post charge dialog, Payment dialog, Transfer/split UI, Invoice preview, Guest merge tool।\n\n## ৯. পিটফল\n1. folio লাইন UPDATE/DELETE\n2. business date ভুল\n3. POS ডাবল পোস্ট\n4. রাউটিং ছাড়া কর্পোরেট বিল\n5. Invoice এডিটযোগ্য\n6. গেস্ট ডুপ্লিকেট না ঠেকানো\n\n---\n\n## ১০. Guest CRM, ক্যাম্পেইন ও লয়ালটি\n\n### কেন\nসরাসরি বুকিং বাড়ানো, রিপিট গেস্ট ফেরানো — কমিশন-মুক্ত আয়।\n\n### উপাদান\n| উপাদান | ব্যাখ্যা |\n|---|---|\n| **সেগমেন্ট** | নিয়ম-ভিত্তিক গ্রুপ: \"গত ১২ মাসে ২+ বার এসেছে\", \"কর্পোরেট\", \"ঈদে আসে\" |\n| **ক্যাম্পেইন** | নির্দিষ্ট সেগমেন্টে বার্তা (SMS/WhatsApp/ইমেইল), প্রমো কোডসহ |\n| **অটোমেশন** | পোস্ট-স্টে রিভিউ রিকোয়েস্ট, জন্মদিন, pre-arrival আপসেল |\n| **লয়ালটি** | পয়েন্ট/টিয়ার, রিডেম্পশন folio-তে ডিসকাউন্ট হিসেবে |\n| **ভাষা** | বাংলা/ইংরেজি টেমপ্লেট; গেস্টের `language` অনুযায়ী |\n\n```sql\nguest_segment(id, org_id, name, rules jsonb, refreshed_at)\ncampaign(id, org_id, name, channel, template_id, segment_id, scheduled_at, status, stats jsonb)\ncampaign_message(id, campaign_id, guest_id, status, provider_ref, sent_at)\nloyalty_account(guest_id, org_id, tier, points, updated_at)\nloyalty_txn(id, guest_id, delta, reason, folio_id NULL, at)\nconsent_log(guest_id, channel, granted bool, source, at)\n```\n\n### কঠিন বিষয়\n- **সম্মতি (consent) ও opt-out** বাধ্যতামূলক; consent ছাড়া মার্কেটিং নয় (ডক ১৪)\n- OTA-গেস্টের ইমেইল প্রায়ই প্রক্সি/মাস্কড — ডাইরেক্ট ক্যাম্পেইনে ব্যবহারযোগ্য না-ও হতে পারে\n- খরচ ও কোটা ট্র্যাক (SMS ক্রেডিট)\n- ডেলিভারি স্ট্যাটাস webhook দিয়ে আপডেট\n\n**API:** `POST /v1/segments`, `POST /v1/campaigns`, `POST /v1/campaigns/{id}/send`, `GET /v1/guests/{id}/loyalty`\n**স্ক্রিন:** সেগমেন্ট বিল্ডার, ক্যাম্পেইন কম্পোজার (প্রিভিউ), লয়ালটি সেটিংস।\n", "title_en": "07 — Guests, Bookings & Folios", "md_en": "# 07 — Guests, Bookings & Folios\n\n---\n\n## 1. Guest profile\n\n### Why a separate entity\nThe same person comes back many times. A profile gives history, preferences, loyalty and faster check-in.\n\n**Fields:** `id, org_id, first_name, last_name, gender, dob, nationality, phone, email, address, language, vip_level, tags[], notes, marketing_consent, blacklist_flag, created_at, merged_into_id`\n**Documents:** `guest_document(guest_id, type, number_enc, issue_country, expiry, file_ref)`\n\n### Rules\n- **Shared at organisation level** (multi-property: the same guest across all branches)\n- Duplicates: match on phone/email/name + DOB → **merge** (move history, set `merged_into_id`)\n- Sensitive fields (ID numbers, photos) encrypted, access logged\n- Consent (marketing consent) recorded separately\n- Blacklist/VIP notes: control who can see them\n\n### Guest lifecycle diagram\n```mermaid\nflowchart LR\n    L[Lead/Inquiry] --> P[Create profile]\n    P --> B[Booking]\n    B --> S[Stay]\n    S --> H[History + Folio]\n    H --> R[Repeat / Loyalty / Campaign]\n    R --> B\n```\n\n**Edge cases:** a whole family using one phone number; the company booker ≠ the guest; different spellings (Bangla/English transliteration) — fuzzy matching.\n\n---\n\n## 2. Booking vs reservation vs stay (model)\n\n```mermaid\nerDiagram\n    GUEST ||--o{ BOOKING : \"booker\"\n    BOOKING ||--|{ RESERVATION : \"per room\"\n    RESERVATION ||--o{ RESERVATION_GUEST : \"guests\"\n    GUEST ||--o{ RESERVATION_GUEST : \"\"\n    RESERVATION ||--o| STAY : \"on check-in\"\n    STAY ||--|{ STAY_ROOM_ASSIGNMENT : \"room history\"\n    BOOKING ||--o{ FOLIO : \"\"\n    RESERVATION ||--o{ FOLIO : \"\"\n```\n- **Booking** = order/container (one booker, many rooms)\n- **Reservation** = the agreement for one room\n- **Stay** = the actual stay\n\n---\n\n## 3. Folio (the guest's bill ledger)\n\n### Meaning\nA ledger of charges (debits) and payments (credits). Balance = charges − payments.\n\n### Why\nAccounts for every taka; the basis for audit and invoices.\n\n### Folio types\n| Type | Use |\n|---|---|\n| Guest folio | The guest's own bill |\n| Master folio | Central bill for a group/event |\n| Company / City ledger | Company credit bill |\n| House / Non-resident | Day visitors, F&B banquets |\n| Window (A/B/C) | Split sections inside one folio |\n\n### Workflow\n```mermaid\nflowchart LR\n    CI[Check-in: folio open] --> POST[Posting: room, F&B, spa, laundry]\n    POST --> PAY[Payments / deposits]\n    PAY --> AUD[Night audit: room+tax post]\n    AUD --> CO[Check-out: balance=0 → close]\n    CO --> INV[Invoice]\n    CO --> LOCK[Folio locked]\n```\n\n### Folio line (ledger row)\n```sql\nfolio_line(\n  id, folio_id, window_no, business_date, posted_at,\n  type              -- 'charge' | 'payment' | 'adjustment' | 'tax' | 'transfer'\n  charge_code_id, description, quantity, unit_amount,\n  amount            -- + debit, − credit (or separate columns)\n  currency, tax_amount, reference_id,    -- POS check no / gateway txn\n  reversal_of_id NULL, posted_by, source -- 'night_audit'|'pos'|'manual'|'channel'\n)\n```\n**Rule:** **append-only.** For mistakes add a new `adjustment`/`reversal` row; never delete or update. Post by business date (not calendar date).\n\n### Charge code / transaction code\n`ROOM`, `ROOM_TAX`, `SVC`, `FNB_FOOD`, `FNB_BEV`, `SPA`, `LAUNDRY`, `MINIBAR`, `TRANSPORT`, `PAY_CASH`, `PAY_CARD`, `PAY_BKASH`, `ADJ`… each mapped to a **department, revenue group, tax group and GL account**.\n\n---\n\n## 4. Routing, split and shared folios\n\n**Routing**: specific charge codes go automatically to another folio/window.\n- The company pays room + tax (Window A → company), the guest pays their own food (Window B → guest)\n\n**Split payment**: one bill paid by several payments (half card, half bKash) or several parties.\n\n**Shared folio**: one bill for several rooms/guests (family, group) — via transfers.\n\n```mermaid\nflowchart TB\n    R1[Room 301 charges] --> W{Routing rule}\n    W -- ROOM, ROOM_TAX --> CF[Company folio]\n    W -- FNB, SPA --> GF[Guest folio]\n    CF --> INV1[Invoice to company]\n    GF --> INV2[Settle at check-out]\n```\n\n**Edge cases:** routing rule changed mid-stay (what about old lines); transfers must be audited; which payment receives the refund after a split payment; partial tax.\n\n---\n\n## 5. Posting sources\n\n| Source | How |\n|---|---|\n| Night audit | Room charge + tax (every night) |\n| POS | Restaurant/bar/spa tickets charged to the room |\n| Manual | Reception (laundry, transport) |\n| Minibar | HK sheet/app |\n| Channel | OTA prepaid / virtual card |\n| Phone/Wi-Fi | Billing interface |\n\n**POS → folio**: verify room number/guest, then post. On failure, retry queue; a unique constraint on `pos_check_id` prevents double posting.\n\n---\n\n## 6. Invoice\n\n- Invoice = a snapshot of the folio (sequential number, date, guest/company, seller BIN/details, lines, tax, total)\n- **Immutable**: never changed after issue — use a **credit note** + new invoice\n- Language: English/Bangla\n- Bangladesh: official format/BIN requirements in doc 16\n\n```\ninvoice(id, property_id, number, folio_id, issued_at, bill_to_type, bill_to_id,\n        subtotal, tax_total, total, currency, status, void_of_id)\n```\n\n---\n\n## 7. API\n\n```\nGET  /folios/{id}\nPOST /folios/{id}/charges        { charge_code, amount, qty, description, idempotency_key }\nPOST /folios/{id}/payments       { method, amount, reference }\nPOST /folios/{id}/adjustments    { line_id, reason }       // includes reversal\nPOST /folios/{id}/transfer       { to_folio_id, line_ids[] }\nPOST /folios/{id}/split          { rules }\nPOST /folios/{id}/invoice\nPOST /invoices/{id}/credit-note\nGET  /guests?q=      POST /guests      POST /guests/{id}/merge\n```\n\n## 8. Screens\nGuest profile (tabs: details, documents, stay history, notes, consent), folio view (windows, filters), post-charge dialog, payment dialog, transfer/split UI, invoice preview, guest merge tool.\n\n## 9. Pitfalls\n1. UPDATE/DELETE on folio lines\n2. Wrong business date\n3. POS double posting\n4. Corporate bills without routing\n5. Editable invoices\n6. Not preventing duplicate guests\n\n---\n\n## 10. Guest CRM, campaigns and loyalty\n\n### Why\nGrow direct bookings and bring back repeat guests — commission-free revenue.\n\n### Components\n| Component | Explanation |\n|---|---|\n| **Segment** | Rule-based group: \"stayed 2+ times in 12 months\", \"corporate\", \"comes at Eid\" |\n| **Campaign** | Message to a segment (SMS/WhatsApp/email), with a promo code |\n| **Automation** | Post-stay review request, birthday, pre-arrival upsell |\n| **Loyalty** | Points/tiers, redemption as a folio discount |\n| **Language** | Bangla/English templates by the guest's `language` |\n\n```sql\nguest_segment(id, org_id, name, rules jsonb, refreshed_at)\ncampaign(id, org_id, name, channel, template_id, segment_id, scheduled_at, status, stats jsonb)\ncampaign_message(id, campaign_id, guest_id, status, provider_ref, sent_at)\nloyalty_account(guest_id, org_id, tier, points, updated_at)\nloyalty_txn(id, guest_id, delta, reason, folio_id NULL, at)\nconsent_log(guest_id, channel, granted bool, source, at)\n```\n\n### Hard parts\n- **Consent and opt-out** are mandatory; no marketing without consent (doc 14)\n- OTA guest emails are often proxied/masked — may not be usable for direct campaigns\n- Track cost and quotas (SMS credits)\n- Update delivery status via webhooks\n\n**API:** `POST /v1/segments`, `POST /v1/campaigns`, `POST /v1/campaigns/{id}/send`, `GET /v1/guests/{id}/loyalty`\n**Screens:** segment builder, campaign composer (preview), loyalty settings.\n"}, "8": {"n": 8, "title": "০৮ — হাউসকিপিং ও মেইনটেন্যান্স", "md": "# ০৮ — হাউসকিপিং ও মেইনটেন্যান্স\n\n> রুম \"বিক্রয়যোগ্য\" হতে হলে শুধু খালি নয়, **পরিষ্কার ও ঠিকঠাক** হতে হবে। এই দুই মডিউল সেই দায়িত্ব নেয়।\n\n---\n\n## ১. হাউসকিপিং — মানে ও কেন\n\nরুম পরিষ্কার, পরিদর্শন, স্ট্যাটাস আপডেট, লিনেন/অ্যামেনিটি, lost & found, মিনিবার রিফিল।\n**কেন PMS-এ:** ফোন/কাগজের তালিকা ছাড়া front desk জানে রুম ready কি না; হাউসকিপার জানে কোন রুম আগে।\n\n### স্ট্যাটাস প্রবাহ\n```mermaid\nstateDiagram-v2\n    [*] --> Dirty: check-out / stayover শুরু\n    Dirty --> InProgress: HK শুরু\n    InProgress --> Clean: HK শেষ\n    Clean --> Inspected: সুপারভাইজার\n    Clean --> Dirty: ব্যর্থ পরিদর্শন (re-clean)\n    Inspected --> Dirty: গেস্ট ব্যবহার\n    Dirty --> OOO: মেরামত দরকার\n    OOO --> Dirty: মেরামত শেষ\n```\n\n> সাধারণ প্রবাহ: হাউসকিপার ফোনে \"Clean\" ট্যাপ → সুপারভাইজার পরিদর্শন → front desk বোর্ডে \"Ready\" — একবার আপডেট, সবখানে। এটি **real-time event** (WebSocket/SSE) দিয়ে করা হয়।\n\n---\n\n## ২. কাজের ধরন (Task Types)\n\n| Task | কখন |\n|---|---|\n| Departure clean | check-out-এর পর পূর্ণ পরিষ্কার |\n| Stayover / Refresh | থাকা অবস্থায় প্রতিদিন/বিকল্প দিনে |\n| Turndown | সন্ধ্যায় বিছানা প্রস্তুত |\n| Deep clean | পর্যায়ক্রমে |\n| Inspection | সুপারভাইজার |\n| Special | অনুরোধ (extra towel, baby cot) |\n| Pre-arrival | VIP সেটআপ |\n\n**Task জেনারেশন:** প্রতিদিন (night audit-এর পর বা সকালে) স্বয়ংক্রিয়: departures → departure clean, in-house → stayover (নীতি অনুযায়ী), DND রুম স্কিপ।\n\n---\n\n## ৩. ওয়ার্কফ্লো\n\n```mermaid\nsequenceDiagram\n    participant FD as Front Desk\n    participant PMS\n    participant HK as Housekeeper (mobile)\n    participant SUP as Supervisor\n    FD->>PMS: Check-out room 304\n    PMS->>PMS: room=Dirty, task(Departure) তৈরি\n    PMS-->>HK: আজকের তালিকা (departure উপরে, VIP flag)\n    HK->>PMS: Start, Done (Clean)\n    PMS-->>SUP: inspect queue\n    SUP->>PMS: Inspected / Reject(কারণ)\n    PMS-->>FD: Room ready (live)\n```\n\n**অ্যাসাইনমেন্ট:** floor/section-ভিত্তিক, ক্রেডিট পয়েন্ট (রুম টাইপ অনুযায়ী মিনিট ধরা), লোড ব্যালান্স। **প্রাধান্য:** আজ আগমন + early check-in অনুরোধ + VIP।\n\n---\n\n## ৪. অন্যান্য HK কাজ\n- **Minibar/Consumption**: HK রুম চেক করে চার্জ → folio (ডক ০৭)\n- **Lost & Found**: আইটেম, রুম, তারিখ, মালিক, status, ফেরত রেকর্ড\n- **Linen/Amenity count**: স্টোর ইনভেন্টরি সংযোগ (§১০ দেখো)\n- **DND / Refuse service**: স্ট্যাটাস\n- **Guest request**: front desk → task\n\n---\n\n## ৫. মেইনটেন্যান্স\n\n### Work Order\n```sql\nwork_order(id, property_id, room_id NULL, area, title, description, priority,\n   category, status, reported_by, assigned_to, ooo_id NULL,\n   reported_at, started_at, completed_at, cost, vendor_id NULL)\n```\n**স্ট্যাটাস:** Open → Assigned → In progress → Completed → Verified (→ Reopened)\n\n### রুমের সাথে সংযোগ\n- গুরুতর সমস্যা → **OOO** (ইনভেন্টরি কমে, CM sync — ডক ০৫)\n- ছোট সমস্যা → রুম চালু, টিকেট খোলা\n- কাজ শেষে ভেরিফাই → OOO মুক্ত, রুম Dirty→Clean প্রক্রিয়া\n\n### Preventive Maintenance\n- পুনরাবৃত্ত শিডিউল (AC সার্ভিস প্রতি ৩ মাস, জেনারেটর, লিফট)\n- স্বয়ংক্রিয় টিকেট জেনারেশন, অ্যাসেট রেজিস্টার\n\n### এজ কেস\n- OOO রুমে আগে থেকে বুকিং → relocate সতর্কতা\n- অর্ধেক-শেষ কাজ, দিন পার হওয়া — ওভারডিউ হাইলাইট\n- বাইরের ভেন্ডর, খরচ ট্র্যাক\n- গেস্ট কমপ্লেইন থেকে টিকেট তৈরি ও ক্ষতিপূরণ (ডিসকাউন্ট/comp)\n\n---\n\n## ৬. API\n```\nGET  /housekeeping/tasks?date=&assignee=&status=\nPOST /housekeeping/tasks/generate           // দৈনিক\nPATCH /housekeeping/tasks/{id}              // status, notes, assignee\nPUT  /rooms/{id}/housekeeping-status\nPOST /housekeeping/inspections              // pass/fail\nPOST /lost-found                            GET /lost-found\nPOST /work-orders     PATCH /work-orders/{id}\nPOST /rooms/{id}/out-of-order\n```\n**রিয়েল-টাইম:** `room.status_changed` ইভেন্ট (WebSocket/SSE/push)। মোবাইলে অফলাইন সহনশীলতা: কাজের তালিকা ক্যাশ, স্ট্যাটাস আপডেট কিউ।\n\n## ৭. স্ক্রিন\n- **HK মোবাইল**: আমার রুম, Start/Done, notes, ছবি, মিনিবার\n- **HK ড্যাশবোর্ড/Board**: floor গ্রিড, রঙ-কোড\n- **Assignment board** (drag & drop)\n- **Inspection** ফর্ম/চেকলিস্ট\n- **Work order** তালিকা/কানবান\n- **Lost & found**\n\n## ৮. পিটফল\n1. HK স্ট্যাটাস ও occupancy গুলিয়ে ফেলা\n2. check-out-এ task জেনারেট না হওয়া\n3. OOO ইনভেন্টরিতে আপডেট না\n4. কেবল ডেস্কটপে — মোবাইল বাদ (বাস্তবে হাউসকিপাররা ফোন/ট্যাবলেট ব্যবহার করে)\n5. বাংলা UI নেই (স্টাফের ভাষা) — i18n ধরো\n\n---\n\n## ৯. Staff, Roster ও উপস্থিতি\n\nহাউসকিপিং/ফ্রন্ট ডেস্ক/মেইনটেন্যান্স সবই শিফট-নির্ভর। PMS-এ হালকা workforce মডিউল থাকলে টাস্ক-অ্যাসাইনমেন্ট ও খরচ হিসাব মেলে।\n```sql\nstaff(id, property_id, user_id NULL, name, department, role, phone, active)\nshift_template(id, property_id, name, start_time, end_time)\nroster_entry(id, staff_id, work_date, shift_template_id, status /*planned|present|absent|leave*/)\nattendance(id, staff_id, clock_in, clock_out, source /*app|manual*/, approved_by)\nleave_request(id, staff_id, from_date, to_date, type, status)\n```\n- **Roster → HK assignment**: আজ যারা on-duty কেবল তাদেরই টাস্ক বরাদ্দযোগ্য\n- ক্লক-ইন: মোবাইল/PIN; ম্যানুয়াল এডিটে অনুমোদন ও অডিট\n- **ওভারটাইম/বেতন** সাধারণত আলাদা payroll সিস্টেমে — PMS শুধু ঘণ্টা এক্সপোর্ট করে\n- **এজ কেস:** রাত ১২টা পেরোনো শিফট কোন দিনে গণ্য; অনুপস্থিতিতে টাস্ক পুনঃবণ্টন\n\n## ১০. Inventory ও Purchasing (স্টোর)\n\nলিনেন, অ্যামেনিটি, মিনিবার, রান্নাঘরের কাঁচামাল, মেইনটেন্যান্স যন্ত্রাংশ — স্টকের হিসাব না থাকলে ক্ষতি/চুরি ধরা যায় না।\n```sql\nstock_item(id, property_id, sku, name, unit, category, reorder_level, active)\nstock_location(id, property_id, name)               -- মূল স্টোর, HK স্টোর, কিচেন\nstock_movement(id, item_id, location_id, qty_delta, reason /*purchase|issue|consume|transfer|adjust|waste*/,\n  ref_type, ref_id, at, by_user)\nsupplier(id, org_id, name, phone, terms)\npurchase_order(id, property_id, supplier_id, status, expected_at, total)\npurchase_order_line(po_id, item_id, qty, unit_cost, received_qty)\n```\n- **Append-only movement** (folio-র মতো) — স্টক = movement-এর যোগফল\n- **Reorder সতর্কতা**: `on_hand < reorder_level` → PO ড্রাফট\n- **মিনিবার ও লিনেন সংযোগ**: HK মিনিবার ব্যবহার রেকর্ড করলে (ক) folio-তে চার্জ, (খ) স্টক কমে\n- **রেসিপি/BOM** (রেস্টুরেন্ট): বিক্রির সাথে কাঁচামাল স্বয়ংক্রিয় কমানো (ডক ০৯)\n- **GRN ও বিল মেলানো** (3-way match): PO ↔ প্রাপ্তি ↔ সাপ্লায়ার বিল (অ্যাকাউন্টিং ডক ০৯)\n- **এজ কেস:** আংশিক ডেলিভারি, ভুল ইউনিট (kg বনাম g), ক্ষয়/অপচয় রেকর্ড, FIFO বনাম গড় খরচ\n\n**API:** `GET /v1/stock/items`, `POST /v1/stock/movements`, `POST /v1/purchase-orders`, `POST /v1/purchase-orders/{id}/receive`\n**স্ক্রিন:** স্টক ড্যাশবোর্ড, PO তালিকা/ফর্ম, রিসিভ স্ক্রিন, রোস্টার ক্যালেন্ডার, ক্লক-ইন অ্যাপ।\n", "title_en": "08 — Housekeeping & Maintenance", "md_en": "# 08 — Housekeeping & Maintenance\n\n> A room is sellable only when it is not just empty but **clean and working**. These two modules own that.\n\n---\n\n## 1. Housekeeping — what and why\n\nCleaning rooms, inspection, status updates, linen/amenities, lost & found, minibar refills.\n**Why in the PMS:** without phone calls or paper lists, the front desk knows whether a room is ready and housekeepers know which room comes first.\n\n### Status flow\n```mermaid\nstateDiagram-v2\n    [*] --> Dirty: check-out / stayover starts\n    Dirty --> InProgress: HK starts\n    InProgress --> Clean: HK finished\n    Clean --> Inspected: supervisor\n    Clean --> Dirty: failed inspection (re-clean)\n    Inspected --> Dirty: guest use\n    Dirty --> OOO: repair needed\n    OOO --> Dirty: repair done\n```\n\n> Typical flow: the housekeeper taps \"Clean\" on a phone → supervisor inspects → \"Ready\" appears on the front desk board — update once, visible everywhere. This is done with **real-time events** (WebSocket/SSE).\n\n---\n\n## 2. Task types\n\n| Task | When |\n|---|---|\n| Departure clean | Full clean after check-out |\n| Stayover / Refresh | Daily or alternate days during a stay |\n| Turndown | Preparing the bed in the evening |\n| Deep clean | Periodically |\n| Inspection | Supervisor |\n| Special | Requests (extra towel, baby cot) |\n| Pre-arrival | VIP setup |\n\n**Task generation:** automatic every day (after night audit or in the morning): departures → departure clean, in-house → stayover (per policy), skip DND rooms.\n\n---\n\n## 3. Workflow\n\n```mermaid\nsequenceDiagram\n    participant FD as Front Desk\n    participant PMS\n    participant HK as Housekeeper (mobile)\n    participant SUP as Supervisor\n    FD->>PMS: Check-out room 304\n    PMS->>PMS: room=Dirty, create Departure task\n    PMS-->>HK: today's list (departures first, VIP flag)\n    HK->>PMS: Start, Done (Clean)\n    PMS-->>SUP: inspection queue\n    SUP->>PMS: Inspected / Reject (reason)\n    PMS-->>FD: Room ready (live)\n```\n\n**Assignment:** by floor/section, credit points (minutes per room type), load balancing. **Priority:** today's arrivals + early check-in requests + VIPs.\n\n---\n\n## 4. Other HK work\n- **Minibar/consumption**: HK checks the room and posts charges → folio (doc 07)\n- **Lost & found**: item, room, date, owner, status, return record\n- **Linen/amenity count**: linked to store inventory (§10)\n- **DND / refused service**: status\n- **Guest requests**: front desk → task\n\n---\n\n## 5. Maintenance\n\n### Work order\n```sql\nwork_order(id, property_id, room_id NULL, area, title, description, priority,\n   category, status, reported_by, assigned_to, ooo_id NULL,\n   reported_at, started_at, completed_at, cost, vendor_id NULL)\n```\n**Status:** Open → Assigned → In progress → Completed → Verified (→ Reopened)\n\n### Link to rooms\n- Serious problem → **OOO** (inventory drops, CM sync — doc 05)\n- Small problem → room stays in use, ticket open\n- After verification → OOO released, room goes Dirty → Clean\n\n### Preventive maintenance\n- Recurring schedules (AC service every 3 months, generator, lift)\n- Automatic ticket generation, asset register\n\n### Edge cases\n- Bookings already on an OOO room → relocation warning\n- Half-finished work past the day — highlight overdue\n- External vendors, cost tracking\n- Tickets from guest complaints and compensation (discount/comp)\n\n---\n\n## 6. API\n```\nGET  /housekeeping/tasks?date=&assignee=&status=\nPOST /housekeeping/tasks/generate           // daily\nPATCH /housekeeping/tasks/{id}              // status, notes, assignee\nPUT  /rooms/{id}/housekeeping-status\nPOST /housekeeping/inspections              // pass/fail\nPOST /lost-found                            GET /lost-found\nPOST /work-orders     PATCH /work-orders/{id}\nPOST /rooms/{id}/out-of-order\n```\n**Real time:** `room.status_changed` event (WebSocket/SSE/push). Offline tolerance on mobile: cache the task list, queue status updates.\n\n## 7. Screens\n- **HK mobile**: my rooms, Start/Done, notes, photos, minibar\n- **HK dashboard/board**: floor grid, colour-coded\n- **Assignment board** (drag & drop)\n- **Inspection** form/checklist\n- **Work order** list/kanban\n- **Lost & found**\n\n## 8. Pitfalls\n1. Mixing HK status with occupancy\n2. No task generated at check-out\n3. OOO not reflected in inventory\n4. Desktop only — no mobile (in reality housekeepers use phones/tablets)\n5. No Bangla UI (the staff's language) — plan i18n\n\n---\n\n## 9. Staff, rosters and attendance\n\nHousekeeping, front desk and maintenance are all shift-based. A light workforce module in the PMS keeps task assignment and costs aligned.\n```sql\nstaff(id, property_id, user_id NULL, name, department, role, phone, active)\nshift_template(id, property_id, name, start_time, end_time)\nroster_entry(id, staff_id, work_date, shift_template_id, status /*planned|present|absent|leave*/)\nattendance(id, staff_id, clock_in, clock_out, source /*app|manual*/, approved_by)\nleave_request(id, staff_id, from_date, to_date, type, status)\n```\n- **Roster → HK assignment**: only staff on duty today can receive tasks\n- Clock-in: mobile/PIN; manual edits need approval and audit\n- **Overtime/payroll** usually lives in a separate payroll system — the PMS only exports hours\n- **Edge cases:** which day a shift crossing midnight counts for; redistributing tasks on absence\n\n## 10. Inventory & purchasing (store)\n\nLinen, amenities, minibar, kitchen ingredients, maintenance parts — without stock records, losses and theft go unnoticed.\n```sql\nstock_item(id, property_id, sku, name, unit, category, reorder_level, active)\nstock_location(id, property_id, name)               -- main store, HK store, kitchen\nstock_movement(id, item_id, location_id, qty_delta, reason /*purchase|issue|consume|transfer|adjust|waste*/,\n  ref_type, ref_id, at, by_user)\nsupplier(id, org_id, name, phone, terms)\npurchase_order(id, property_id, supplier_id, status, expected_at, total)\npurchase_order_line(po_id, item_id, qty, unit_cost, received_qty)\n```\n- **Append-only movements** (like the folio) — stock = sum of movements\n- **Reorder alert**: `on_hand < reorder_level` → draft PO\n- **Minibar and linen link**: when HK records minibar use, (a) the folio is charged and (b) stock decreases\n- **Recipe/BOM** (restaurant): ingredients deducted automatically with each sale (doc 09)\n- **GRN and bill matching** (3-way match): PO ↔ receipt ↔ supplier bill (accounting, doc 09)\n- **Edge cases:** partial deliveries, wrong units (kg vs g), waste records, FIFO vs average cost\n\n**API:** `GET /v1/stock/items`, `POST /v1/stock/movements`, `POST /v1/purchase-orders`, `POST /v1/purchase-orders/{id}/receive`\n**Screens:** stock dashboard, PO list/form, receiving screen, roster calendar, clock-in app.\n"}, "9": {"n": 9, "title": "০৯ — পেমেন্ট ও অ্যাকাউন্টিং", "md": "# ০৯ — পেমেন্ট ও অ্যাকাউন্টিং\n\n---\n\n## ১. পেমেন্টের ধরন\n\n| ধরন | মানে |\n|---|---|\n| Cash | নগদ |\n| Card (POS terminal / online) | Visa/Mastercard ইত্যাদি |\n| MFS | bKash, Nagad, Rocket (মোবাইল ওয়ালেট) |\n| Bank transfer | ব্যাংক ট্রান্সফার |\n| Direct bill / City ledger | কোম্পানিকে বিল, পরে পাওয়া |\n| OTA virtual card / prepaid | OTA-র পেমেন্ট |\n| Voucher / Gift card | |\n\n## ২. পেমেন্ট লাইফসাইকেল\n\n```mermaid\nstateDiagram-v2\n    [*] --> Initiated\n    Initiated --> Pending: গেস্ট গেটওয়েতে\n    Pending --> Authorized: pre-auth\n    Pending --> Succeeded\n    Authorized --> Captured\n    Authorized --> Voided\n    Pending --> Failed\n    Pending --> Cancelled\n    Succeeded --> PartiallyRefunded\n    Succeeded --> Refunded\n    Captured --> Refunded\n    Succeeded --> Disputed\n```\n**শব্দ:** *Authorization* = টাকা আটকানো; *Capture* = আসলে কাটা; *Void* = অথরাইজেশন বাতিল; *Refund* = সফল পেমেন্ট ফেরত; *Chargeback* = কার্ডধারীর ব্যাংক দাবি।\n\n---\n\n## ৩. ডিপোজিট, অগ্রিম, রিফান্ড (ওয়ার্কফ্লো)\n\n**ডিপোজিট (বুকিংয়ে):** নীতি অনুযায়ী % বা ফিক্সড → payment link/গেটওয়ে → `payment(status=succeeded, scope=booking)`।\n**Check-in-এ:** ডিপোজিট folio-তে **transfer** (credit) — রেভিনিউ না, দায় (liability) থেকে মূল ledger-এ।\n**রিফান্ড:** মূল পেমেন্ট মাধ্যমে ফেরত (গেটওয়ে API), নয়তো নগদ/ব্যাংক; অনুমতি + কারণ + audit।\n\n```mermaid\nflowchart TD\n    A[রিফান্ড অনুরোধ] --> B{অনুমতি?}\n    B -- না --> M[ম্যানেজার অনুমোদন]\n    M --> C\n    B -- হ্যাঁ --> C{মূল পেমেন্ট গেটওয়ে?}\n    C -- হ্যাঁ --> G[Gateway refund API]\n    C -- নগদ --> H[ক্যাশ আউট + cashier shift]\n    G --> R{সফল?}\n    R -- না --> F[ব্যর্থ: retry/ম্যানুয়াল ব্যাংক ট্রান্সফার]\n    R -- হ্যাঁ --> L[folio-তে negative payment + audit]\n    H --> L\n```\n\n**এজ কেস:** আংশিক রিফান্ড; রিফান্ড মূল পেমেন্টের বেশি নয়; bKash/কার্ডে রিফান্ডের সময়সীমা/নিয়ম গেটওয়ে অনুযায়ী; no-show ফি কাটা; ডিপোজিট ফেরত না, আয় হিসেবে স্বীকৃতি।\n\n---\n\n## ৪. বাংলাদেশ পেমেন্ট গেটওয়ে ইন্টিগ্রেশন\n\n### bKash (Tokenized Checkout)\nঅফিসিয়াল ডক (developer.bka.sh) ও প্রকাশ্য ক্লায়েন্ট লাইব্রেরির ভিত্তিতে প্রবাহ:\n1. **Grant token** (id_token; refresh সহ)\n2. **Create payment** → `bkashURL`, `paymentID`; `statusCode == \"0000\"` মানে শুধু সেশন তৈরি হয়েছে, পেমেন্ট নয়\n3. গেস্টকে bkashURL-এ পাঠাও\n4. bKash গেস্টকে `callbackURL`-এ ফেরত পাঠায় (status: success/failure/cancel)\n5. success হলে **Execute payment** (paymentID দিয়ে); failure/cancel-এ Execute করো না\n6. **Payment status / Search transaction** দিয়ে নিশ্চিত; **Refund** API; **IPN (SNS signed)** যাচাই\n- Authorization হেডারে id_token (Bearer ছাড়া — ওই লাইব্রেরির বর্ণনা অনুযায়ী); ভার্সন `v1.2.0-beta` পথে দেখা গেছে — **নিজের ক্রেডেনশিয়াল/সর্বশেষ অফিসিয়াল ডক দেখে নিশ্চিত করো**।\n\n### SSLCommerz (v4)\nঅফিসিয়াল ডকের সারাংশ:\n1. Checkout নিশ্চিত হলে **Session তৈরি** (Session ID)\n2. গেস্টকে hosted পেজ/Easy Checkout-এ\n3. **IPN** লিসেনার (merchant প্যানেলে কনফিগার) — POST বার্তা\n4. **Order/Transaction Validation API** দিয়ে অবশ্যই যাচাই (txn id, amount, currency) — IPN বিশ্বাস করার আগে\n5. Refund API\n- Sandbox ও Live পৃথক এনভায়রনমেন্ট\n\n### ডিজাইন প্যাটার্ন (গেটওয়ে-নিরপেক্ষ)\n```mermaid\nsequenceDiagram\n    participant G as Guest\n    participant P as PMS / Booking engine\n    participant GW as Gateway (bKash/SSLCommerz)\n    G->>P: ডিপোজিট দিতে চাই\n    P->>P: payment(status=initiated, idempotency_key)\n    P->>GW: create session/payment\n    GW-->>P: redirect URL\n    P-->>G: redirect\n    G->>GW: পেমেন্ট\n    GW-->>G: callback → P\n    GW-)P: IPN/webhook (সার্ভার-টু-সার্ভার)\n    P->>GW: verify/validate API\n    P->>P: status=succeeded (একবারই), folio/booking credit\n    P-)Notif: রসিদ, কনফার্মেশন\n```\n**মূল নিয়ম:**\n- **Callback ≠ প্রমাণ।** সার্ভার-সাইড যাচাই (validation/status API) না করে সফল ধরো না।\n- **Idempotent webhook/IPN**: একই ইভেন্ট ২বার এলে ২বার ক্রেডিট নয় (`gateway_txn_id` UNIQUE)।\n- অ্যামাউন্ট ও কারেন্সি মিলাও (গেস্ট কম টাকা দিলে/হেরফের)।\n- **Pending timeout**: গেস্ট ব্রাউজার বন্ধ করলে — status API পোল করে পুনর্মিলন জব।\n- Test mode/sandbox স্পষ্ট চিহ্নিত রাখো (সিমুলেটেড পেমেন্ট যেন কখনো আসল মনে না হয়)।\n- সিক্রেট (API key) ভল্টে, লগে নয়। কার্ড নম্বর নিজের DB-তে নয় (PCI DSS পরিধি এড়াতে গেটওয়ে hosted)।\n\nDB:\n```sql\npayment(id, property_id, folio_id NULL, booking_id NULL, method, provider,\n  amount, currency, status, provider_txn_id UNIQUE, provider_payload_json,\n  idempotency_key UNIQUE, captured_at, refunded_amount, created_by, cashier_shift_id)\npayment_event(id, payment_id, type, raw_json, received_at)   -- লগ\nrefund(id, payment_id, amount, reason, status, provider_ref, approved_by)\n```\n\n---\n\n## ৫. Night Audit\n\n### মানে\nপ্রতিদিনের হিসাব বন্ধ করে নতুন business date চালু।\n\n```mermaid\nflowchart TD\n    S[Start: user, সময়] --> A[Pre-check: pending check-in/out, অসম্পূর্ণ POS, খোলা cashier shift]\n    A -->|সমস্যা| X[সমাধান করো / override]\n    X --> A\n    A -->|ঠিক| B[No-show প্রসেস + ফি]\n    B --> C[Room & tax চার্জ পোস্ট: সব in-house]\n    C --> D[Trial balance: ডেবিট = ক্রেডিট, folio মোট = ledger]\n    D --> E[Reports: manager, revenue, cashier, tax]\n    E --> F[Business date +1]\n    F --> G[HK task জেনারেট, owner report ইমেইল]\n```\n\n**ইঞ্জিনিয়ারিং:**\n- **Idempotent ও resumable** (মাঝপথে ক্র্যাশ করলে পুনরায় চালানো যায়, ডাবল পোস্ট নয়)\n- `night_audit_run(id, property_id, business_date, status, started_at, finished_at, steps_json, error)`\n- রুম চার্জ পোস্টিংয়ে `UNIQUE(stay_id, business_date, charge_code)`\n- Audit চলাকালে লক (অন্যরা পোস্ট করলে সারি)\n- **স্বয়ংক্রিয় অডিট**: কিছু PMS নির্ধারিত সময়ে নিজে চালায় — ব্যতিক্রম হলে অ্যালার্ট\n- পূর্বের তারিখে পোস্ট (backdate) → অনুমতি + অডিট লগ\n\n**এজ কেস:** রাত ২টায় চেক-ইন (কোন business date?); late check-out ফি; স্টে এক্সটেন্ড; ভুল রুম চার্জ; টাইমজোন/DST (বাংলাদেশে সাধারণত DST নেই, তবে সিস্টেম জেনেরিক রাখো)।\n\n---\n\n## ৬. অ্যাকাউন্টিং ধারণা\n\n### Revenue বনাম Cash\n- **Revenue recognition**: রুম রেভিনিউ স্বীকৃত হয় থাকার রাতে (night audit-এ), পেমেন্ট আগে/পরে যাই হোক।\n- **ডিপোজিট** = liability (Advance Deposit Le
