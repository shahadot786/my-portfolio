 departure, adults = 2 } = req.body;\n  try {\n    const { rows } = await pool.query(\n      'SELECT create_booking($1,$2,$3,$4,$5,$6,$7) AS id',\n      [propertyId, guestId, roomTypeId, ratePlanId, arrival, departure, adults]);\n    res.status(201).json({ id: rows[0].id });\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/reservations/:id/check-in', async (req, res) => {\n  try {\n    const { rows } = await pool.query('SELECT check_in($1,$2) AS folio_id', [req.params.id, req.body.roomId]);\n    res.json(rows[0]);\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/folios/:id/payments', async (req, res) => {\n  const key = req.get('Idempotency-Key');\n  if (!key) return res.status(400).json({ error: 'IDEMPOTENCY_KEY_REQUIRED' });\n  try {\n    await pool.query('SELECT post_payment($1,$2,$3,$4)', [req.params.id, req.body.method, req.body.amount, key]);\n    res.status(201).json({ ok: true });\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/reservations/:id/check-out', async (req, res) => {\n  try { await pool.query('SELECT check_out($1)', [req.params.id]); res.json({ ok: true }); }\n  catch (e) { fail(res, e); }\n});\n\napp.post('/v1/properties/:id/night-audit', async (req, res) => {\n  try {\n    const { rows } = await pool.query('SELECT run_night_audit($1) AS new_business_date', [req.params.id]);\n    res.json(rows[0]);\n  } catch (e) { fail(res, e); }\n});\n\napp.listen(3000, () => console.log('Mini PMS on :3000'));\n```\n\nTry it:\n```bash\ncurl \"localhost:3000/v1/availability?property=1&arrival=2026-12-20&departure=2026-12-23\"\n\ncurl -X POST localhost:3000/v1/reservations -H 'content-type: application/json' \\\n  -d '{\"propertyId\":1,\"guestId\":1,\"roomTypeId\":1,\"ratePlanId\":1,\"arrival\":\"2026-12-18\",\"departure\":\"2026-12-20\"}'\n\ncurl -X POST localhost:3000/v1/reservations/1/check-in -H 'content-type: application/json' -d '{\"roomId\":1}'\ncurl -X POST localhost:3000/v1/properties/1/night-audit\ncurl -X POST localhost:3000/v1/folios/1/payments -H 'content-type: application/json' \\\n  -H 'Idempotency-Key: bkash-TRX123' -d '{\"method\":\"BKASH\",\"amount\":6325}'\n```\n(Create a guest: `INSERT INTO guest(first_name) VALUES ('Rahim');` — build a guest API as an exercise.)\n\n---\n\n## Lab 10 — Concurrency test\n\n```js\n// race-test.mjs — 100 parallel bookings for the last room\nconst BASE = 'http://localhost:3000';\nconst body = { propertyId: 1, guestId: 1, roomTypeId: 2, ratePlanId: 1,\n               arrival: '2027-02-14', departure: '2027-02-16' };\n\n// fill 3 rooms first so 1 is left (DLX = 4 rooms)\nfor (let i = 0; i < 3; i++)\n  await fetch(`${BASE}/v1/reservations`, { method: 'POST',\n    headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });\n\nconst results = await Promise.all(Array.from({ length: 100 }, () =>\n  fetch(`${BASE}/v1/reservations`, { method: 'POST',\n    headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })\n  .then(r => r.status)));\n\nconst count = s => results.filter(x => x === s).length;\nconsole.log({ created: count(201), conflict: count(409), other: results.length - count(201) - count(409) });\n// expected: { created: 1, conflict: 99, other: 0 }\n```\nVerified result: `{ created: 1, conflict: 99, other: 0 }`. Now experiment: remove `FOR UPDATE` from `create_booking` — what happens? (The `CHECK` constraint still prevents overselling, but some requests may get 500 instead of 409 — why? Think about it.)\n\n---\n\n## Exercises (getting harder)\n\n1. **Cancel:** `cancel_booking(res_id)` — status `cancelled`, `sold - 1` on every night, outbox event. Do nothing if already cancelled (idempotent).\n2. **Modify:** date change — release old nights and take new ones **in one transaction**; if the new nights are not available, the old ones stay intact.\n3. **Understand the no-show bug:** read the night audit comment — why does `UPDATE ... FROM` update a multiply-matched row only once? Write a version without GROUP BY and test it with two no-shows.\n4. **No-show charge:** post the first night's charge for a non-refundable no-show (opening a folio).\n5. **Out of order:** setting a room OOO increments `inventory_night.out_of_order`; what if the night is already full? (The CHECK fails — show a warning.)\n6. **Outbox worker:** every 2 seconds read rows with `published_at IS NULL`, print them, then set `published_at = now()`. Several workers with `FOR UPDATE SKIP LOCKED`.\n7. **Use the tax table:** replace the hard-coded 10%/15% in night audit with values from the `tax` table.\n8. **Split folio:** two folios per reservation (room → company, rest → guest) with routing rules.\n9. **Tenant isolation:** enable Row Level Security by `property_id` (docs 13 §3, 14).\n10. **Front end:** a room rack page (rooms × dates grid) — React/Vue/anything.\n11. **Reports:** add the `otb_snapshot` from doc 20 §11, take a snapshot in night audit, build a pickup report.\n12. **Tests:** run the property-based tests from doc 23 against this project.\n"}, "26": {"n": 26, "title": "২৬ — AI, অটোমেশন ও ভবিষ্যৎ প্রবণতা", "md": "# ২৬ — AI, অটোমেশন ও ভবিষ্যৎ প্রবণতা\n\n> লক্ষ্য: PMS-এ AI কোথায় সত্যিই কাজে লাগে, কোথায় ঝুঁকি, এবং আগামী কয়েক বছরের প্রযুক্তি-দিক (ABS, composable PMS, IoT, টেকসইতা)। প্রবণতা দ্রুত বদলায় — ভেন্ডর দাবি অফিসিয়াল ডকে যাচাই করো।\n\n---\n\n## ১. AI কোথায় কাজে লাগে (ব্যবহারিক তালিকা)\n\n| ক্ষেত্র | কাজ | ডেটা লাগে | ঝুঁকি |\n|---|---|---|---|\n| চাহিদা পূর্বাভাস | occupancy, pickup, no-show পূর্বাভাস | OTB স্ন্যাপশট, ইতিহাস (ডক ২০) | ভুল পূর্বাভাসে দাম ভুল |\n| ডাইনামিক প্রাইসিং | রেট সুপারিশ | পূর্বাভাস, comp রেট | অতিরিক্ত দাম বদল, ন্যায্যতা |\n| গেস্ট মেসেজিং বট | FAQ, বুকিং প্রশ্ন, রিকোয়েস্ট তৈরি | হোটেলের তথ্য, নীতি | ভুল তথ্য দেওয়া (hallucination) |\n| ইমেইল/রিভিউ উত্তর খসড়া | স্টাফ সময় বাঁচানো | রিভিউ টেক্সট | টোন ভুল, ব্যক্তিগত তথ্য ফাঁস |\n| ডকুমেন্ট OCR | পাসপোর্ট/NID থেকে তথ্য | ছবি | গোপনীয়তা, ভুল পড়া |\n| জালিয়াতি শনাক্ত | অস্বাভাবিক void/রিফান্ড/ডিসকাউন্ট | অডিট লগ (ডক ১৪) | ভুল সন্দেহ |\n| HK শিডিউলিং | কোন রুম কে কখন, check-out সময় অনুযায়ী | রুম স্ট্যাটাস, ETA/ETD | — |\n| রক্ষণাবেক্ষণ পূর্বাভাস | AC/লিফট নষ্টের আগে | work order ইতিহাস, IoT | — |\n| রিপোর্ট প্রশ্ন (\"গত মাসে কর্পোরেট ADR কত?\") | প্রাকৃতিক ভাষায় প্রশ্ন → কোয়েরি | রিপোর্ট সেমান্টিক লেয়ার | ভুল সংজ্ঞায় ভুল সংখ্যা |\n| অনুবাদ | বিদেশি গেস্টের সাথে কথা | — | সূক্ষ্ম অর্থ হারানো |\n\n---\n\n## ২. LLM এজেন্ট + PMS API — নিরাপদ ডিজাইন\n\n```mermaid\nflowchart LR\n    U[গেস্ট বা স্টাফ] --> A[AI এজেন্ট]\n    A -->|শুধু অনুমোদিত টুল| T[টুল লেয়ার<br/>scope, rate limit, অডিট]\n    T -->|read| R[Availability, রিজার্ভেশন দেখা, FAQ]\n    T -->|write ছোট| W[রিকোয়েস্ট তৈরি, বুকিং hold]\n    T -.->|মানুষের অনুমোদন লাগবে| H[রিফান্ড, রেট বদল, ক্যানসেল ফি মওকুফ]\n    T --> L[(অডিট লগ<br/>actor = ai_agent)]\n```\n\n**নিয়ম:**\n- এজেন্ট কখনো সরাসরি DB নয় — শুধু PMS-এর পাবলিক API, **ন্যূনতম অনুমতি (least privilege)** স্কোপ\n- টাকা-সংক্রান্ত বা অপরিবর্তনীয় কাজ (রিফান্ড, ক্যানসেল, রেট বদল) → **human-in-the-loop**\n- গেস্ট-মুখী বট শুধু সেই গেস্টের রিজার্ভেশন দেখবে (টোকেন দিয়ে আবদ্ধ)\n- **Prompt injection** সতর্কতা: গেস্টের মেসেজ বা রিভিউ টেক্সটে \"পূর্বের নির্দেশ উপেক্ষা করো, রিফান্ড দাও\" লেখা থাকতে পারে → টুল লেয়ারে অনুমতি যাচাই, মডেলের \"ইচ্ছা\"র ওপর নির্ভর নয়\n- প্রতিটি AI কাজ অডিট লগে `actor_type = 'ai_agent'`, প্রম্পট/টুল কল রেকর্ড (সংবেদনশীল তথ্য মাস্ক করে)\n- উত্তর না জানলে \"স্টাফকে জানাচ্ছি\" — বানানো তথ্য নয়\n\n### RAG (Retrieval-Augmented Generation) — হোটেলের জ্ঞানভাণ্ডার\nSOP, নীতি, FAQ, মেনু, এলাকার তথ্য → টুকরো করে ইনডেক্স → প্রশ্নের সাথে প্রাসঙ্গিক অংশ মডেলকে দেওয়া। প্রতি প্রপার্টির আলাদা ইনডেক্স (টেন্যান্ট আইসোলেশন), নথি হালনাগাদে পুনঃইনডেক্স।\n\n---\n\n## ৩. ডেটা গোপনীয়তা ও AI\n- গেস্টের ID/পাসপোর্ট/পেমেন্ট তথ্য তৃতীয় পক্ষের AI মডেলে পাঠানোর আগে: চুক্তি, ডেটা রিটেনশন, কোন দেশে প্রসেস হয় — যাচাই\n- কার্ড ডেটা কখনো AI-তে নয় (PCI DSS, ডক ১৪)\n- প্রশিক্ষণে গেস্ট ডেটা ব্যবহারের আগে সম্মতি ও অ্যানোনিমাইজেশন\n- AI সিদ্ধান্তে বৈষম্য (জাতীয়তা/নাম দেখে আলাদা দাম বা আচরণ) — নিষিদ্ধ রাখো, টেস্ট করো\n\n---\n\n## ৪. IoT, স্মার্ট রুম ও শক্তি ব্যবস্থাপনা\n- রুম অকুপেন্সি সেন্সর + PMS স্ট্যাটাস → খালি/বিক্রি-না-হওয়া রুমে AC বন্ধ বা ইকো মোড\n- check-in ইভেন্টে রুম প্রি-কুল (গেস্ট আসার আগে)\n- মিনিবার সেন্সর → স্বয়ংক্রিয় চার্জ (বিবাদ এড়াতে নিশ্চিতকরণ)\n- লিক/ধোঁয়া/দরজা খোলা অ্যালার্ট → maintenance টাস্ক\n- ইন্টিগ্রেশন: PMS ইভেন্ট (`stay.checked_in`, `stay.checked_out`, `room.status_changed`) → BMS/IoT প্ল্যাটফর্ম\n\n---\n\n## ৫. টেকসইতা (Sustainability) রিপোর্টিং\n- মেট্রিক উদাহরণ: প্রতি occupied room-night বিদ্যুৎ (kWh), পানি (লিটার), বর্জ্য, কার্বন নির্গমন\n- কর্পোরেট ক্লায়েন্ট ও কিছু OTA টেকসইতা তথ্য চায়\n- PMS-এর অবদান: সঠিক occupied room-nights ও গেস্ট-নাইট (denominator); ইউটিলিটি ডেটা অন্য সিস্টেম থেকে\n- \"লিনেন পুনঃব্যবহার\" অপশন → HK টাস্ক কম (ডক ০৮)\n- শিল্প-পদ্ধতি (যেমন হোটেল কার্বন পরিমাপের প্রচলিত উদ্যোগগুলো) অনুসরণ করো — নিজে সূত্র বানিও না\n\n---\n\n## ৬. Attribute-Based Selling (ABS)\n- **আজ:** গেস্ট \"Deluxe King\" কেনে; কোন রুম পাবে তা পরে ঠিক হয়\n- **ABS:** গেস্ট বৈশিষ্ট্য কেনে — \"সাগর দেখা যায়\" (+৳১,০০০), \"উঁচু ফ্লোর\" (+৳৫০০), \"কোণার রুম\"\n- **PMS-এ পরিবর্তন:** রুম-অ্যাট্রিবিউট টেবিল; অ্যাট্রিবিউট অনুযায়ী ইনভেন্টরি (সাগর-দেখা রুম কয়টা খালি প্রতি রাতে); অ্যাসাইনমেন্ট অ্যালগরিদম যা কেনা অ্যাট্রিবিউট নিশ্চিত করে; চ্যানেল স্ট্যান্ডার্ড এখনও বিকশিত হচ্ছে\n- কঠিন অংশ: অ্যাট্রিবিউট কম্বিনেশন বিস্ফোরণ, OTA সমর্থন সীমিত\n\n```sql\nCREATE TABLE room_attribute (room_id int, attr_code text, PRIMARY KEY (room_id, attr_code));\nCREATE TABLE reservation_attribute (reservation_id int, attr_code text, price numeric(10,2),\n  PRIMARY KEY (reservation_id, attr_code));\n-- অ্যাসাইনমেন্ট: রুম টাইপ মেলে + সব কেনা অ্যাট্রিবিউট আছে + ওভারল্যাপ নেই\n```\n\n---\n\n## ৭. Composable / API-first PMS\n- এক বড় সিস্টেমের বদলে **কোর PMS + মার্কেটপ্লেস অ্যাপ** (CRM, RMS, মেসেজিং, POS) — API ও webhook দিয়ে যুক্ত (ডক ১১, ১৭)\n- \"MACH\" (Microservices, API-first, Cloud-native, Headless) শব্দটি কিছু ভেন্ডর ব্যবহার করে\n- সুবিধা: সেরা টুল বেছে নেওয়া; অসুবিধা: ইন্টিগ্রেশন খরচ, ডেটা অসামঞ্জস্য, কে দায়ী\n- **ইঞ্জিনিয়ারিং শিক্ষা:** নিজের PMS বানালে শুরু থেকেই পাবলিক API + webhook + OAuth অ্যাপ রেজিস্ট্রেশন ডিজাইন করো\n\n---\n\n## ৮. পেমেন্ট প্রবণতা\n- ইন্টিগ্রেটেড পেমেন্ট (PMS ভেন্ডর নিজেই পেমেন্ট প্রসেসর/পার্টনার) — টোকেনাইজেশন, কার্ড-অন-ফাইল, অটো-চার্জ\n- পেমেন্ট লিংক ও QR (বাংলাদেশে MFS)\n- পে-বাই-লিংক ডিপোজিট, স্বয়ংক্রিয় no-show চার্জ (নীতি ও আইনের মধ্যে)\n- \"Unified commerce\": রুম, F&B, স্পা — একই গেস্ট প্রোফাইল ও পেমেন্ট টোকেন\n\n---\n\n## ৯. কর্মী ও অপারেশন টেক\n- মোবাইল-প্রথম স্টাফ অ্যাপ (HK, maintenance, ম্যানেজার অনুমোদন)\n- টাস্ক অটো-বণ্টন ও SLA\n- শিফট হস্তান্তর নোট, ভয়েস-টু-টেক্সট রিপোর্ট\n- স্টাফ ট্রেনিং মাইক্রো-ভিডিও (ডক ২৪)\n\n---\n\n## ১০. বাংলাদেশ প্রেক্ষিত\n- বাংলা ভাষার AI (বুঝা ও লেখা) উন্নত হচ্ছে, তবে হোটেল-নির্দিষ্ট শব্দ ও মিশ্র বাংলা-ইংরেজি (\"রুম রেডি আছে?\") টেস্ট করো\n- WhatsApp বট সবচেয়ে বাস্তবসম্মত প্রথম AI প্রকল্প\n- ছোট হোটেলে ডেটা কম → জটিল ML-এর আগে নিয়মভিত্তিক অটোমেশন\n- বিদ্যুৎ খরচ বেশি → অকুপেন্সি-ভিত্তিক AC নিয়ন্ত্রণে সরাসরি সাশ্রয়\n\n---\n\n## ১১. শেখার পরবর্তী ধাপ\n- সময়-সিরিজ পূর্বাভাস (Holt-Winters, gradient boosting) ছোট ডেটাসেটে অনুশীলন — ডক ২৫-এর `otb_snapshot` দিয়ে কৃত্রিম ডেটা বানাও\n- LLM টুল-কলিং দিয়ে \"রিপোর্ট প্রশ্ন\" প্রোটোটাইপ — শুধু read-only রিপোর্ট API\n- ভেন্ডর মার্কেটপ্লেস (Mews, Apaleo, OHIP) ঘুরে দেখো — কোন ধরনের অ্যাপ আছে (ডক ২৮)\n", "title_en": "26 — AI, Automation & Future Trends", "md_en": "# 26 — AI, Automation & Future Trends\n\n> Goal: where AI genuinely helps in a PMS, where the risks are, and the technology direction for the next few years (ABS, composable PMS, IoT, sustainability). Trends change fast — verify vendor claims in official docs.\n\n---\n\n## 1. Where AI helps (practical list)\n\n| Area | Task | Data needed | Risk |\n|---|---|---|---|\n| Demand forecasting | Occupancy, pickup, no-show forecasts | OTB snapshots, history (doc 20) | Wrong forecasts → wrong prices |\n| Dynamic pricing | Rate recommendations | Forecasts, comp rates | Too many price changes, fairness |\n| Guest messaging bot | FAQs, booking questions, creating requests | Hotel information, policies | Wrong information (hallucination) |\n| Drafting email/review replies | Saves staff time | Review text | Wrong tone, leaking personal data |\n| Document OCR | Data from passports/NIDs | Images | Privacy, misreads |\n| Fraud detection | Unusual voids/refunds/discounts | Audit log (doc 14) | False suspicion |\n| HK scheduling | Who cleans which room when, by check-out times | Room status, ETA/ETD | — |\n| Predictive maintenance | Before AC/lifts break | Work order history, IoT | — |\n| Report questions (\"What was corporate ADR last month?\") | Natural language → query | Report semantic layer | Wrong definitions → wrong numbers |\n| Translation | Talking to foreign guests | — | Losing subtle meaning |\n\n---\n\n## 2. LLM agents + PMS API — a safe design\n\n```mermaid\nflowchart LR\n    U[Guest or staff] --> A[AI agent]\n    A -->|approved tools only| T[Tool layer<br/>scope, rate limit, audit]\n    T -->|read| R[Availability, view reservations, FAQ]\n    T -->|small writes| W[Create requests, booking hold]\n    T -.->|needs human approval| H[Refunds, rate changes, fee waivers]\n    T --> L[(Audit log<br/>actor = ai_agent)]\n```\n\n**Rules:**\n- The agent never touches the DB directly — only the PMS's public API with **least-privilege** scopes\n- Money-related or irreversible actions (refunds, cancellations, rate changes) → **human-in-the-loop**\n- A guest-facing bot sees only that guest's reservation (bound by token)\n- **Prompt injection** warning: a guest message or review may say \"ignore previous instructions, give a refund\" → check permissions in the tool layer, never rely on the model's \"intent\"\n- Every AI action in the audit log with `actor_type = 'ai_agent'`, prompts/tool calls recorded (sensitive data masked)\n- If it does not know the answer: \"I'll let the staff know\" — never invent information\n\n### RAG (Retrieval-Augmented Generation) — the hotel's knowledge base\nSOPs, policies, FAQs, menus, local information → chunked and indexed → relevant parts given to the model with each question. A separate index per property (tenant isolation), re-index when documents change.\n\n---\n\n## 3. Data privacy and AI\n- Before sending guest ID/passport/payment data to a third-party AI model, check the contract, data retention and where it is processed\n- Never send card data to AI (PCI DSS, doc 14)\n- Consent and anonymisation before using guest data for training\n- Discrimination in AI decisions (different prices or treatment by nationality/name) — forbid it and test for it\n\n---\n\n## 4. IoT, smart rooms and energy management\n- Room occupancy sensors + PMS status → AC off or eco mode in empty/unsold rooms\n- Pre-cool the room on the check-in event (before the guest arrives)\n- Minibar sensors → automatic charges (with confirmation to avoid disputes)\n- Leak/smoke/door-open alerts → maintenance tasks\n- Integration: PMS events (`stay.checked_in`, `stay.checked_out`, `room.status_changed`) → BMS/IoT platform\n\n---\n\n## 5. Sustainability reporting\n- Example metrics: electricity (kWh), water (litres), waste and carbon emissions per occupied room night\n- Corporate clients and some OTAs ask for sustainability data\n- The PMS's contribution: accurate occupied room nights and guest nights (the denominator); utility data comes from other systems\n- \"Linen reuse\" option → fewer HK tasks (doc 08)\n- Follow established industry methods (e.g. common hotel carbon measurement initiatives) — do not invent your own formulas\n\n---\n\n## 6. Attribute-Based Selling (ABS)\n- **Today:** the guest buys \"Deluxe King\"; which room they get is decided later\n- **ABS:** the guest buys features — \"sea view\" (+BDT 1,000), \"high floor\" (+BDT 500), \"corner room\"\n- **Changes in the PMS:** a room attribute table; inventory by attribute (how many sea-view rooms are free each night); an assignment algorithm that guarantees purchased attributes; channel standards are still evolving\n- Hard parts: explosion of attribute combinations, limited OTA support\n\n```sql\nCREATE TABLE room_attribute (room_id int, attr_code text, PRIMARY KEY (room_id, attr_code));\nCREATE TABLE reservation_attribute (reservation_id int, attr_code text, price numeric(10,2),\n  PRIMARY KEY (reservation_id, attr_code));\n-- assignment: room type matches + all purchased attributes present + no overlap\n```\n\n---\n\n## 7. Composable / API-first PMS\n- Instead of one big system: **core PMS + marketplace apps** (CRM, RMS, messaging, POS) — connected by APIs and webhooks (docs 11, 17)\n- Some vendors use the term \"MACH\" (Microservices, API-first, Cloud-native, Headless)\n- Pros: pick the best tools; cons: integration cost, data inconsistency, unclear responsibility\n- **Engineering lesson:** if you build your own PMS, design a public API + webhooks + OAuth app registration from the start\n\n---\n\n## 8. Payment trends\n- Integrated payments (the PMS vendor is itself a payment processor/partner) — tokenisation, card on file, auto-charge\n- Payment links and QR (MFS in Bangladesh)\n- Pay-by-link deposits, automatic no-show charges (within policy and law)\n- \"Unified commerce\": rooms, F&B, spa — one guest profile and payment token\n\n---\n\n## 9. Staff and operations tech\n- Mobile-first staff apps (HK, maintenance, manager approvals)\n- Automatic task distribution and SLAs\n- Shift handover notes, voice-to-text reports\n- Staff training micro-videos (doc 24)\n\n---\n\n## 10. Bangladesh context\n- Bangla AI (understanding and writing) is improving, but test hotel-specific terms and mixed Bangla-English (\"রুম রেডি আছে?\")\n- A WhatsApp bot is the most realistic first AI project\n- Small hotels have little data → rule-based automation before complex ML\n- High electricity costs → occupancy-based AC control saves money directly\n\n---\n\n## 11. Next learning steps\n- Practise time-series forecasting (Holt-Winters, gradient boosting) on small datasets — generate synthetic data with the `otb_snapshot` from doc 25\n- Prototype \"report questions\" with LLM tool calling — read-only report API only\n- Explore vendor marketplaces (Mews, Apaleo, OHIP) — what kinds of apps exist (doc 28)\n"}, "27": {"n": 27, "title": "২৭ — ইন্টারভিউ প্রস্তুতি ও অনুশীলন", "md": "# ২৭ — ইন্টারভিউ প্রস্তুতি ও অনুশীলন\n\n> লক্ষ্য: নিজেকে যাচাই করা — ধারণাগত প্রশ্ন, সিস্টেম ডিজাইন, SQL, অপারেশন কেস। উত্তর দেখার আগে নিজে ভাবো, তারপর খোলো (▸ চাপো)।\n> প্রতিটি ডকের শেষে ছোট কুইজও আছে; ফ্ল্যাশকার্ড পাতায় গ্লসারি অনুশীলন।\n\n---\n\n## ১. ধারণাগত প্রশ্ন\n\n<details><summary>১. Room type আর room-এর পার্থক্য কী, আর কোনটা বিক্রি হয়?</summary>\n\nRoom type (Deluxe King) হলো ক্যাটাগরি — বুকিংয়ে এটাই বিক্রি হয়, ইনভেন্টরিও এই স্তরে গোনা হয়। Room (৩০১) ফিজিক্যাল রুম — সাধারণত check-in-এর সময় বা আগের দিন বরাদ্দ। এতে রুম নির্বাচনে নমনীয়তা থাকে (ডক ০১ §৩.২, ০৫)।\n</details>\n\n<details><summary>২. Business date কী এবং কেন ক্যালেন্ডার তারিখ ব্যবহার করা যায় না?</summary>\n\nহোটেলের হিসাবের দিন, যা night audit-এ বদলায় (প্রায়ই মধ্যরাতের পরে)। রাত ১টায় পোস্ট হওয়া রেস্টুরেন্ট বিল আগের \"দিনের\" আয়। ক্যালেন্ডার তারিখ দিলে রিপোর্ট ও লেজার বিভক্ত হয়ে যায় (ডক ০১ §৩.৬)।\n</details>\n\n<details><summary>৩. দুইজন একসাথে শেষ রুম বুক করলে কী হবে? কীভাবে রোধ করবে?</summary>\n\nরেস কন্ডিশন → ডাবল বুকিং। সমাধান: প্রতি রাতের ইনভেন্টরি সারিতে atomic conditional update বা `SELECT ... FOR UPDATE` তারিখ-ক্রমে, সাথে DB CHECK কনস্ট্রেইন্ট; চ্যানেলের জন্য buffer; idempotency key (ডক ০৫ §৬, ২৬ ল্যাব ৪)।\n</details>\n\n<details><summary>৪. ফোলিও লাইন কেন এডিট/ডিলিট করা যায় না?</summary>\n\nএটি লেজার — অডিট ট্রেইল ও ব্যালান্স সঠিকতা দরকার। ভুল হলে reversal (উল্টো লাইন) + নতুন সঠিক লাইন, কারণসহ। এতে \"কে, কখন, কেন\" থাকে এবং night audit মেলে (ডক ০৭, ২২)।\n</details>\n\n<details><summary>৫. ডিপোজিট কেন আয় নয়?</summary>\n\nথাকার আগে নেওয়া টাকা হোটেলের দায় — সেবা এখনও দেওয়া হয়নি; ক্যানসেলে ফেরত দিতে হতে পারে। থাকার রাতে আয় স্বীকৃত হয় (ডক ২২ §৬)।\n</details>\n\n<details><summary>৬. Channel manager কী সমস্যা সমাধান করে? ARI মানে কী?</summary>\n\nএকাধিক OTA-তে একই ইনভেন্টরি হাতে আপডেট করলে ওভারবুকিং হয়। CM এক জায়গা থেকে Availability, Rates, Inventory (ও restriction) সব চ্যানেলে পাঠায় এবং বুকিং PMS-এ আনে (ডক ১০)।\n</details>\n\n<details><summary>৭. Webhook প্রাপকে idempotency কেন দরকার?</summary>\n\nপ্রেরক retry করে — একই ইভেন্ট একাধিকবার আসতে পারে, ক্রমও উল্টাতে পারে। ইভেন্ট id/প্রোভাইডার txn id ইউনিক রেখে দ্বিতীয়বার কিছু না করা; ক্রমের জন্য version/timestamp দেখা (ডক ১১)।\n</details>\n\n<details><summary>৮. Outbox প্যাটার্ন কেন?</summary>\n\nDB-তে বুকিং সেভ আর মেসেজ কিউ-তে ইভেন্ট পাঠানো দুটো আলাদা সিস্টেম — একটা সফল আরেকটা ব্যর্থ হতে পারে। ইভেন্ট একই DB ট্রানজ্যাকশনে outbox টেবিলে লিখে পরে worker প্রকাশ করে → \"সেভ হলো কিন্তু ইভেন্ট হারাল\" অসম্ভব (ডক ১১ §৬)।\n</details>\n\n<details><summary>৯. RevPAR = Occupancy × ADR — প্রমাণ করো।</summary>\n\nOcc = sold ÷ available, ADR = revenue ÷ sold → গুণ করলে sold কেটে যায় = revenue ÷ available = RevPAR (ডক ০২ §৩, ২১ §৪)।\n</details>\n\n<details><summary>১০. মাল্টি-টেন্যান্ট SaaS PMS-এ সবচেয়ে বড় নিরাপত্তা ঝুঁকি কী?</summary>\n\nক্রস-টেন্যান্ট ডেটা লিক (এক হোটেল আরেক হোটেলের গেস্ট দেখা)। প্রতিরোধ: সব কোয়েরিতে tenant/property ফিল্টার, PostgreSQL RLS, টেস্টে আইসোলেশন যাচাই, IDOR টেস্ট (ডক ১৩ §৩, ১৪, ২৪)।\n</details>\n\n<details><summary>১১. Rate snapshot কেন রাখতে হয়?</summary>\n\nবুকিংয়ের পর রেট টেবিল বদলাতে পারে; গেস্টকে বুকিং সময়ের দামেই বিল করতে হবে। তাই প্রতিটি রাতের দাম, ট্যাক্স নিয়ম, নীতি বুকিংয়ে কপি রাখা (ডক ০৪ §৪)।\n</details>\n\n<details><summary>১২. Night audit মাঝপথে ক্র্যাশ করলে কী হয়?</summary>\n\nভালো ডিজাইনে: প্রতিটি ধাপ idempotent (source_ref ইউনিক), ধাপের অবস্থা রেকর্ড, আবার চালালে বাকি অংশ থেকে চলে — ডাবল পোস্ট নেই; business date শুধু সব ধাপ শেষে এগোয় (ডক ০৯, ১৯ কেস ৭, ২৬ ল্যাব ৭)।\n</details>\n\n---\n\n## ২. সিস্টেম ডিজাইন প্রশ্ন\n\n<details><summary>ক. ১০,০০০ হোটেলের জন্য availability সার্চ সার্ভিস ডিজাইন করো (BE + মেটাসার্চ)</summary>\n\n**বিবেচনা:** read-heavy (সার্চ : বুকিং ≈ ১০০০:১), সঠিকতা বুকিংয়ে লাগে, সার্চে কিছুটা পুরোনো ডেটা গ্রহণযোগ্য।\n- লেখার উৎস: PMS-এর `inventory_night` (সত্যের উৎস)\n- পড়ার মডেল: ইভেন্ট (outbox → stream) দিয়ে আপডেট হওয়া ক্যাশ/সার্চ স্টোর — key: (property, room_type, date) → available, price\n- সার্চ: তারিখ রেঞ্জে min available, যোগফল দাম; রেট রুল আগেই হিসাব (প্রি-কম্পিউটেড) বা দ্রুত ইঞ্জিন\n- বুকিংয়ের সময় **আসল DB-তে আবার যাচাই** (hold বা atomic update)\n- মেটাসার্চ ARI push (ডক ১০ §১০)\n- স্কেল: প্রপার্টি অনুযায়ী পার্টিশন, CDN নয় (ব্যক্তিগত দাম), রেট লিমিট\n- মেট্রিক: price accuracy, p95 latency, stale রেট হার\n</details>\n\n<details><summary>খ. চ্যানেল ম্যানেজার ডিজাইন করো</summary>\n\n- ম্যাপিং টেবিল (PMS room type/rate plan ↔ চ্যানেলের কোড), চ্যানেল-প্রতি অ্যাডাপ্টার\n- আউটবাউন্ড: ARI পরিবর্তন ইভেন্ট → ডিবাউন্স/কোয়ালেস (একই রাতের অনেক পরিবর্তন একসাথে) → চ্যানেল-প্রতি কিউ → রেট লিমিট মেনে পাঠানো → ack ও retry → full sync নির্ধারিত সময়ে\n- ইনবাউন্ড: পুল/পুশ বুকিং → ডুপ্লিকেট রোধ (চ্যানেল বুকিং id) → আউট-অব-অর্ডার মডিফাই/ক্যানসেল সামলানো → PMS-এ তৈরি → ack\n- আনম্যাপড/ব্যর্থ বুকিং কিউ + অ্যালার্ট — কখনো চুপচাপ হারাবে না\n- রিকনসিলিয়েশন: প্রতিদিন চ্যানেলের বুকিং তালিকা বনাম PMS\n- (ডক ১০, ১১)\n</details>\n\n<details><summary>গ. মাল্টি-প্রপার্টি night audit শিডিউলার ডিজাইন করো (বিভিন্ন টাইমজোন)</summary>\n\n- প্রতিটি প্রপার্টির লোকাল সময় অনুযায়ী অডিট উইন্ডো (যেমন রাত ২টা লোকাল) — UTC-তে রূপান্তর করে শিডিউল\n- জব: প্রপার্টি-প্রতি লক (advisory lock/`FOR UPDATE`), ধাপভিত্তিক স্টেট মেশিন, idempotent ধাপ\n- ব্যর্থ হলে retry + অ্যালার্ট; ম্যানুয়াল চালানোর বাটন\n- লোড ছড়ানো: অনেক প্রপার্টি একই টাইমজোনে → কিউ ও concurrency সীমা\n- ফল: রিপোর্ট স্ন্যাপশট, OTB স্ন্যাপশট, মালিকের দৈনিক রিপোর্ট\n- ডিপ্লয় উইন্ডো অডিট সময় এড়িয়ে (ডক ২৩ §১৫)\n</details>\n\n<details><summary>ঘ. পেমেন্ট গেটওয়ে অ্যাডাপ্টার (bKash, SSLCommerz, কার্ড) ডিজাইন করো</summary>\n\n- ইন্টারফেস: `createSession`, `verify`, `refund`, `parseWebhook` (ডক ১৬ §৩)\n- `payment_intent` স্টেট মেশিন: created → pending → authorized/captured → refunded/failed\n- callback আর IPN — যেটা আগে আসুক, **গেটওয়ের verify API দিয়ে নিশ্চিত** করে তারপর ফোলিও পোস্ট; idempotent\n- টাইমআউট: pending থাকলে পরে status query জব\n- রিকনসিলিয়েশন: সেটেলমেন্ট রিপোর্ট বনাম PMS (ডক ২২ §৯)\n- সিক্রেট ভল্টে, sandbox/production আলাদা কনফিগ\n</details>\n\n---\n\n## ৩. SQL অনুশীলন\n\nডক ২৫-এর স্কিমা ধরে।\n\n<details><summary>১. আজকের আগমন তালিকা (নাম, রুম টাইপ, রাত সংখ্যা, অ্যাসাইন হয়েছে কি না)</summary>\n\n```sql\nSELECT r.confirmation, g.first_name, g.last_name, rt.code,\n       r.departure - r.arrival AS nights,\n       (r.room_id IS NOT NULL) AS assigned\nFROM reservation r\nJOIN guest g ON g.id = r.guest_id\nJOIN room_type rt ON rt.id = r.room_type_id\nJOIN property p ON p.id = r.property_id\nWHERE r.arrival = p.business_date AND r.status = 'confirmed'\nORDER BY assigned, g.last_name;\n```\n</details>\n\n<details><summary>২. আগামী ৩০ দিনের প্রতি রাতের occupancy % (সব রুম টাইপ মিলিয়ে)</summary>\n\n```sql\nSELECT stay_date,\n       round(100.0 * sum(sold) / nullif(sum(total - out_of_order),0), 1) AS occ_pct\nFROM inventory_night\nWHERE stay_date >= DATE '2026-12-18' AND stay_date < DATE '2026-12-18' + 30\nGROUP BY stay_date ORDER BY stay_date;\n```\n</details>\n\n<details><summary>৩. যেসব ইন-হাউস গেস্টের ব্যালান্স ৳১০,০০০-এর বেশি (ক্রেডিট ঝুঁকি)</summary>\n\n```sql\nSELECT r.confirmation, rm.number, sum(fl.amount) AS balance\nFROM reservation r\nJOIN folio f ON f.reservation_id = r.id AND f.status = 'open'\nJOIN folio_line fl ON fl.folio_id = f.id\nJOIN room rm ON rm.id = r.room_id\nWHERE r.status = 'in_house'\nGROUP BY r.confirmation, rm.number\nHAVING sum(fl.amount) > 10000\nORDER BY balance DESC;\n```\n</details>\n\n<details><summary>৪. ইনভেন্টরি বনাম রিজার্ভেশন রিকনসিলিয়েশন (sold মিলছে কি না)</summary>\n\n```sql\nSELECT i.room_type_id, i.stay_date, i.sold, coalesce(x.cnt,0) AS from_reservations\nFROM inventory_night i\nLEFT JOIN (\n  SELECT rn.room_type_id, rn.stay_date, count(*) cnt\n  FROM reservation_night rn JOIN reservation r ON r.id = rn.reservation_id\n  WHERE r.status IN ('confirmed','in_house')\n     OR (r.status IN ('checked_out','no_show') AND rn.stay_date <= r.arrival) -- নীতি অনুযায়ী মানাও\n  GROUP BY 1,2\n) x ON x.room_type_id = i.room_type_id AND x.stay_date = i.stay_date\nWHERE i.sold <> coalesce(x.cnt,0);\n```\n(নিয়ম স্পষ্ট না হলে এই কোয়েরি \"মেলে না\" দেখাবে — সেটাই শেখার বিষয়: **sold-এর সংজ্ঞা লিখে রাখো**, ডক ০৫ §১৩।)\n</details>\n\n---\n\n## ৪. অপারেশন কেস (হোটেলের বাস্তব পরিস্থিতি)\n\n<details><summary>ক. রাত ১১টায় একজন কনফার্মড গেস্ট এলেন, কিন্তু হোটেল পূর্ণ (ওভারবুক)। কী করবে, PMS-এ কী রেকর্ড হবে?</summary>\n\nক্ষমা চাওয়া, কাছের সমমানের হোটেলে **walk** ব্যবস্থা (ভাড়া ও যাতায়াত হোটেল বহন), পরের দিন ফিরে আসার অপশন। PMS-এ: রিজার্ভেশন স্ট্যাটাস/নোট `walked`, walk খরচ পোস্ট (খরচ কোড), কারণ, কোন হোটেলে; রিপোর্টে walk সংখ্যা ও খরচ (ডক ০৪ §৮, ২১ §৮)। কে walk হবে তার নীতি: সাধারণত এক রাতের, নন-লয়্যালটি, OTA… — নীতি আগে থেকে লেখা থাকুক।\n</details>\n\n<details><summary>খ. গেস্ট বলছেন মিনিবারের চার্জ ভুল। ক্যাশিয়ার কী করবে?</summary>\n\nফোলিও লাইন দেখাও (কখন, কে পোস্ট করেছে)। বিবাদ সত্য হলে **adjustment/reversal** (কারণ বাধ্যতামূলক, সীমা অনুযায়ী সুপারভাইজার অনুমোদন) — লাইন মুছে নয়। অডিট লগে থাকবে (ডক ০৭, ১৪)।\n</details>\n\n<details><summary>গ. কোম্পানির গ্রুপ ২০ রুম ব্লক করেছে, কাট-অফ তারিখে মাত্র ১২টি নাম এসেছে। কী হবে?</summary>\n\nচুক্তি অনুযায়ী বাকি ৮টি রুম ব্লক থেকে মুক্ত হয়ে সাধারণ ইনভেন্টরিতে ফেরে (release), প্রয়োজনে attrition ফি। PMS-এ কাট-অফ জব স্বয়ংক্রিয় রিলিজ + সেলস টিমকে অ্যালার্ট + wash রিপোর্ট (ডক ০৪ §১০, ২১ §৪)।\n</details>\n\n<details><summary>ঘ. ইন্টারনেট ৩ ঘণ্টা বন্ধ (ক্লাউড PMS)। ডেস্ক কীভাবে চলবে?</summary>\n\nআগের রাতে প্রিন্ট/ডাউনলোড করা আগমন, ইন-হাউস, রুম স্ট্যাটাস তালিকা; মোবাইল হটস্পট ব্যাকআপ; কাগজে walk-in ও পেমেন্ট নোট; সংযোগ ফিরলে এন্ট্রি (ক্রম বজায় রেখে)। ডিজাইনে: অফলাইন রিপোর্ট প্যাক, PWA ক্যাশ, ডাউনটাইম রিপোর্ট (ডক ০২ §৮, ১৩ §৬, ১৬)।\n</details>\n\n---\n\n## ৫. পোর্টফোলিও প্রজেক্ট আইডিয়া\n1. ডক ২৫-এর মিনি PMS + রুম র‍্যাক UI + অনুশীলন ১–৮\n2. bKash/SSLCommerz sandbox পেমেন্ট অ্যাডাপ্টার (ডক ০৯) — টেস্টসহ\n3. iCal সিঙ্ক সার্ভিস (ডক ১০ §৭) — আমদানি/রপ্তানি, ডুপ্লিকেট রোধ\n4. pickup ফোরকাস্ট + প্রাইসিং সুপারিশ ড্যাশবোর্ড (ডক ২০)\n5. HK মোবাইল PWA (অফলাইন সহ) (ডক ০৮)\n6. WhatsApp প্রি-অ্যারাইভাল অটোমেশন (ডক ২১)\n7. Night audit সিমুলেটর + invariant টেস্ট (ডক ২৩)\n\nপ্রতিটির README-তে লেখো: সমস্যা, ডিজাইন সিদ্ধান্ত, ট্রেড-অফ, টেস্ট কীভাবে করেছ।\n", "title_en": "27 — Interview Preparation & Practice", "md_en": "# 27 — Interview Preparation & Practice\n\n> Goal: test yourself — concept questions, system design, SQL and operational cases. Think first, then open the answer (click ▸).\n> Every doc also ends with a short quiz; the flashcards page drills the glossary.\n\n---\n\n## 1. Concept questions\n\n<details><summary>1. What is the difference between a room type and a room, and which one is sold?</summary>\n\nA room type (Deluxe King) is a category — it is what gets sold, and inventory is counted at this level. A room (301) is the physical room — usually assigned at check-in or the day before. This keeps room selection flexible (docs 01 §3.2, 05).\n</details>\n\n<details><summary>2. What is the business date and why can't you use the calendar date?</summary>\n\nThe hotel's accounting day, which changes at night audit (often after midnight). A restaurant bill posted at 1 a.m. belongs to the previous \"day\". Using the calendar date splits reports and ledgers (doc 01 §3.6).\n</details>\n\n<details><summary>3. What happens if two people book the last room at the same time? How do you prevent it?</summary>\n\nA race condition → double booking. Solution: an atomic conditional update on each night's inventory row or `SELECT ... FOR UPDATE` in date order, plus a DB CHECK constraint; a buffer for channels; idempotency keys (docs 05 §6, 26 lab 4).\n</details>\n\n<details><summary>4. Why can't folio lines be edited or deleted?</summary>\n\nIt is a ledger — the audit trail and balance accuracy depend on it. Mistakes are fixed with a reversal (opposite line) + a new correct line, with a reason. This preserves \"who, when, why\" and keeps night audit balancing (docs 07, 22).\n</details>\n\n<details><summary>5. Why is a deposit not revenue?</summary>\n\nMoney taken before the stay is a liability — the service has not been delivered and may have to be refunded on cancellation. Revenue is recognised on the night of stay (doc 22 §6).\n</details>\n\n<details><summary>6. What problem does a channel manager solve? What does ARI mean?</summary>\n\nUpdating the same inventory by hand on several OTAs causes overbooking. The CM sends Availability, Rates, Inventory (and restrictions) from one place to all channels and brings bookings into the PMS (doc 10).\n</details>\n\n<details><summary>7. Why does a webhook receiver need idempotency?</summary>\n\nSenders retry — the same event can arrive several times, and the order can be reversed. Keep the event id/provider txn id unique and do nothing the second time; check version/timestamp for ordering (doc 11).\n</details>\n\n<details><summary>8. Why the outbox pattern?</summary>\n\nSaving a booking in the DB and publishing an event to a queue are two separate systems — one can succeed while the other fails. Writing the event to an outbox table in the same DB transaction, then letting a worker publish it, makes \"saved but the event was lost\" impossible (doc 11 §6).\n</details>\n\n<details><summary>9. Prove that RevPAR = Occupancy × ADR.</summary>\n\nOcc = sold ÷ available, ADR = revenue ÷ sold → multiplying cancels \"sold\" = revenue ÷ available = RevPAR (docs 02 §3, 21 §4).\n</details>\n\n<details><summary>10. What is the biggest security risk in a multi-tenant SaaS PMS?</summary>\n\nCross-tenant data leaks (one hotel seeing another hotel's guests). Prevention: tenant/property filters on every query, PostgreSQL RLS, isolation checks in tests, IDOR tests (docs 13 §3, 14, 24).\n</details>\n\n<details><summary>11. Why keep a rate snapshot?</summary>\n\nThe rate table can change after booking; the guest must be billed at the booking-time price. So each night's price, tax rule and policy are copied into the booking (doc 04 §4).\n</details>\n\n<details><summary>12. What happens if night audit crashes halfway?</summary>\n\nIn a good design: each step is idempotent (unique source_ref), step status is recorded, and a re-run continues from the remaining part — no double posting; the business date only advances after all steps finish (docs 09, 19 case 7, 26 lab 7).\n</details>\n\n---\n\n## 2. System design questions\n\n<details><summary>A. Design an availability search service for 10,000 hotels (BE + metasearch)</summary>\n\n**Considerations:** read-heavy (search : booking ≈ 1000:1), accuracy is needed at booking, slightly stale data is acceptable in search.\n- Write source: the PMS's `inventory_night` (source of truth)\n- Read model: a cache/search store updated by events (outbox → stream) — key: (property, room_type, date) → available, price\n- Search: min available over the date range, summed price; rate rules precomputed or a fast engine\n- **Re-check against the real DB at booking time** (hold or atomic update)\n- Metasearch ARI push (doc 10 §10)\n- Scale: partition by property, no CDN (personalised prices), rate limits\n- Metrics: price accuracy, p95 latency, stale-rate ratio\n</details>\n\n<details><summary>B. Design a channel manager</summary>\n\n- Mapping tables (PMS room type/rate plan ↔ channel codes), one adapter per channel\n- Outbound: ARI change events → debounce/coalesce (many changes for the same night together) → per-channel queue → send within rate limits → ack and retry → scheduled full sync\n- Inbound: pull/push bookings → prevent duplicates (channel booking id) → handle out-of-order modify/cancel → create in the PMS → ack\n- Unmapped/failed booking queue + alerts — never lose a booking silently\n- Reconciliation: the channel's booking list vs the PMS every day\n- (Docs 10, 11)\n</details>\n\n<details><summary>C. Design a multi-property night audit scheduler (different time zones)</summary>\n\n- An audit window per property in local time (e.g. 2 a.m. local) — converted to UTC for scheduling\n- Job: per-property lock (advisory lock/`FOR UPDATE`), step-based state machine, idempotent steps\n- On failure: retry + alert; a manual run button\n- Spreading load: many properties in the same time zone → queue and concurrency limits\n- Output: report snapshots, OTB snapshots, the owner's daily report\n- Deploy windows avoid audit times (doc 23 §15)\n</details>\n\n<details><summary>D. Design a payment gateway adapter (bKash, SSLCommerz, cards)</summary>\n\n- Interface: `createSession`, `verify`, `refund`, `parseWebhook` (doc 16 §3)\n- `payment_intent` state machine: created → pending → authorized/captured → refunded/failed\n- Callback and IPN — whichever comes first, **confirm with the gateway's verify API** before posting to the folio; idempotent\n- Timeouts: a status-query job for pending payments\n- Reconciliation: settlement reports vs PMS (doc 22 §9)\n- Secrets in a vault, separate sandbox/production config\n</details>\n\n---\n\n## 3. SQL practice\n\nBased on the schema from doc 25.\n\n<details><summary>1. Today's arrivals (name, room type, nights, assigned or not)</summary>\n\n```sql\nSELECT r.confirmation, g.first_name, g.last_name, rt.code,\n       r.departure - r.arrival AS nights,\n       (r.room_id IS NOT NULL) AS assigned\nFROM reservation r\nJOIN guest g ON g.id = r.guest_id\nJOIN room_type rt ON rt.id = r.room_type_id\nJOIN property p ON p.id = r.property_id\nWHERE r.arrival = p.business_date AND r.status = 'confirmed'\nORDER BY assigned, g.last_name;\n```\n</details>\n\n<details><summary>2. Occupancy % for each of the next 30 nights (all room types together)</summary>\n\n```sql\nSELECT stay_date,\n       round(100.0 * sum(sold) / nullif(sum(total - out_of_order),0), 1) AS occ_pct\nFROM inventory_night\nWHERE stay_date >= DATE '2026-12-18' AND stay_date < DATE '2026-12-18' + 30\nGROUP BY stay_date ORDER BY stay_date;\n```\n</details>\n\n<details><summary>3. In-house guests with a balance above BDT 10,000 (credit risk)</summary>\n\n```sql\nSELECT r.confirmation, rm.number, sum(fl.amount) AS balance\nFROM reservation r\nJOIN folio f ON f.reservation_id = r.id AND f.status = 'open'\nJOIN folio_line fl ON fl.folio_id = f.id\nJOIN room rm ON rm.id = r.room_id\nWHERE r.status = 'in_house'\nGROUP BY r.confirmation, rm.number\nHAVING sum(fl.amount) > 10000\nORDER BY balance DESC;\n```\n</details>\n\n<details><summary>4. Inventory vs reservation reconciliation (does sold match?)</summary>\n\n```sql\nSELECT i.room_type_id, i.stay_date, i.sold, coalesce(x.cnt,0) AS from_reservations\nFROM inventory_night i\nLEFT JOIN (\n  SELECT rn.room_type_id, rn.stay_date, count(*) cnt\n  FROM reservation_night rn JOIN reservation r ON r.id = rn.reservation_id\n  WHERE r.status IN ('confirmed','in_house')\n     OR (r.status IN ('checked_out','no_show') AND rn.stay_date <= r.arrival) -- adjust to your policy\n  GROUP BY 1,2\n) x ON x.room_type_id = i.room_type_id AND x.stay_date = i.stay_date\nWHERE i.sold <> coalesce(x.cnt,0);\n```\n(If the rule is unclear this query will show \"mismatches\" — that is the lesson: **write down the definition of sold**, doc 05 §13.)\n</details>\n\n---\n\n## 4. Operational cases (real hotel situations)\n\n<details><summary>A. A confirmed guest arrives at 11 p.m., but the hotel is full (overbooked). What do you do and what is recorded in the PMS?</summary>\n\nApologise, arrange a **walk** to a nearby equivalent hotel (the hotel pays the room and transport), offer to return the next day. In the PMS: reservation status/note `walked`, walk cost posted (expense code), reason, which hotel; walk count and cost in reports (docs 04 §8, 21 §8). Policy for who gets walked: usually one-night stays, non-loyalty, OTA… — write the policy in advance.\n</details>\n\n<details><summary>B. A guest says a minibar charge is wrong. What does the cashier do?</summary>\n\nShow the folio line (when and who posted it). If the dispute is valid, post an **adjustment/reversal** (reason mandatory, supervisor approval within limits) — never delete the line. It stays in the audit log (docs 07, 14).\n</details>\n\n<details><summary>C. A company blocked 20 rooms for a group, but only 12 names arrived by the cut-off date. What happens?</summary>\n\nPer the contract, the remaining 8 rooms are released from the block back to general inventory, with an attrition fee if applicable. In the PMS: an automatic cut-off release job + alert to the sales team + wash report (docs 04 §10, 21 §4).\n</details>\n\n<details><summary>D. The internet is down for 3 hours (cloud PMS). How does the desk keep working?</summary>\n\nArrivals, in-house and room status lists printed/downloaded the previous night; mobile hotspot backup; walk-ins and payments noted on paper; entered when the connection returns (keeping the order). In the design: offline report pack, PWA cache, downtime report (docs 02 §8, 13 §6, 16).\n</details>\n\n---\n\n## 5. Portfolio project ideas\n1. The mini PMS from doc 25 + a room rack UI + exercises 1–8\n2. A bKash/SSLCommerz sandbox payment adapter (doc 09) — with tests\n3. An iCal sync service (doc 10 §7) — import/export, duplicate prevention\n4. A pickup forecast + pricing recommendation dashboard (doc 20)\n5. An HK mobile PWA (with offline support) (doc 08)\n6. WhatsApp pre-arrival automation (doc 21)\n7. A night audit simulator + invariant tests (doc 23)\n\nIn each README write: the problem, design decisions, trade-offs, and how you tested it.\n"}, "28": {"n": 28, "title": "২৮ — রিসোর্স লাইব্রেরি (PDF, ভিডিও, বই, কোর্স, API ডক)", "md": "# ২৮ — রিসোর্স লাইব্রেরি (PDF, ভিডিও, বই, কোর্স, API ডক)\n\n> লক্ষ্য: গাইডের বাইরে গভীরে যাওয়ার জন্য বাছাই করা উৎস। প্রতিটি ডকের শেষেও সংশ্লিষ্ট রিসোর্স দেখানো হয়।\n> **চিহ্ন:** ✔ = এই সংস্করণ তৈরির সময় (অক্টোবর ২০২৬) ওয়েবে খুঁজে নিশ্চিত · ◐ = পরিচিত/প্রতিষ্ঠিত উৎস, লিংক নিজে যাচাই করো।\n> **ভিডিও:** নির্দিষ্ট ভিডিও প্রায়ই মুছে যায়, তাই YouTube-এর বাছাই করা সার্চ লিংক দেওয়া হয়েছে — সর্বশেষ ও জনপ্রিয় ভিডিও পাবে। চ্যানেলের মান নিজে যাচাই করো।\n> বই ও কোর্সের দাম/প্রাপ্যতা বদলায়। কপিরাইট মেনে চলো — শুধু অফিসিয়াল বা লেখক-অনুমোদিত বিনামূল্যের কপি ব্যবহার করো।\n\n<div id=\"reslib\"></div>\n\n## কীভাবে ব্যবহার করবে (৪ সপ্তাহের সাথী পরিকল্পনা)\n\n| সপ্তাহ | গাইড | সাথী রিসোর্স |\n|---|---|---|\n| ১ | ০১–০৫ | OPERA/ফ্রন্ট ডেস্ক ভিডিও; একটি হোটেলে রিসেপশনে ১ ঘণ্টা পর্যবেক্ষণ |\n| ২ | ০৬–১০ | Booking.com Connectivity ডক, Google Hotel ARI ওভারভিউ; Mews/Apaleo-র কনসেপ্ট পেজ |\n| ৩ | ১১–১৫, ২৩ | Mews Connector API বা OHIP Postman কালেকশন দিয়ে sandbox কল; PCI DSS কুইক রেফারেন্স; USALI সারাংশ |\n| ৪ | ২১, ২৪–২৬ | Kimes/Ivanov RM পেপার; PostgreSQL range/RLS ডক; ডক ২৫ ল্যাব শেষ করা |\n", "title_en": "28 — Resource Library (PDFs, videos, books, courses, API docs)", "md_en": "# 28 — Resource Library (PDFs, videos, books, courses, API docs)\n\n> Goal: hand-picked sources for going deeper than this guide. Related resources are also shown at the end of each doc.\n> **Marks:** ✔ = confirmed on the web when this edition was prepared (October 2026) · ◐ = known/established source, verify the link yourself.\n> **Videos:** specific videos often disappear, so curated YouTube search links are given — you get the latest and most popular videos. Judge channel quality yourself.\n> Book and course prices/availability change. Respect copyright — use only official or author-approved free copies.\n\n<div id=\"reslib\"></div>\n\n## How to use it (a 4-week companion plan)\n\n| Week | Guide | Companion resources |\n|---|---|---|\n| 1 | 01–05 | OPERA/front desk videos; observe a hotel reception for one hour |\n| 2 | 06–10 | Booking.com Connectivity docs, Google Hotel ARI overview; Mews/Apaleo concept pages |\n| 3 | 11–15, 23 | Sandbox calls with the Mews Connector API or OHIP Postman collection; PCI DSS quick reference; USALI summary |\n| 4 | 21, 24–26 | Kimes/Ivanov RM papers; PostgreSQL range/RLS docs; finish the doc 25 lab |\n"}, "g": {"n": 20, "title": "২০ — PMS গ্লসারি (Glossary)", "md": "# ২০ — PMS গ্লসারি (Glossary)\n\n> বর্ণানুক্রমে ইংরেজি টার্ম, বাংলায় সহজ ব্যাখ্যা। সার্চসহ পূর্ণ তালিকা \"গ্লসারি\" পাতায়ও আছে।\n\n## A\n- **ABS (Attribute-Based Selling)** — রুম টাইপের বদলে রুমের বৈশিষ্ট্য (সাগর-দেখা, উঁচু ফ্লোর) বিক্রি।\n- **ADR** — Average Daily Rate। রুম রেভিনিউ ÷ বিক্রিত রুম-রাত।\n- **Allotment** — চ্যানেল/কোম্পানির জন্য আগে থেকে রুম বরাদ্দ।\n- **ALOS** — Average Length of Stay; গড় থাকার রাত।\n- **API** — সফটওয়্যার-সফটওয়্যার যোগাযোগের ইন্টারফেস।\n- **AR (Accounts Receivable)** — পাওনা (কোম্পানির বকেয়া)।\n- **ARI** — Availability, Rates, Inventory (সঙ্গে restrictions)।\n- **Arrival** — আগমন; Arrivals list = আজকের আগন্তুক তালিকা।\n- **Audit log** — কে কী করেছে তার অপরিবর্তনীয় রেকর্ড।\n- **Authorization (pre-auth)** — কার্ডে টাকা আটকে রাখা, কাটা নয়।\n\n## B\n- **BAR** — Best Available Rate।\n- **BIN** — Business Identification Number (বাংলাদেশ VAT-সংক্রান্ত)।\n- **Block** — রুম আটকে রাখা (গ্রুপ/মেরামত)।\n- **Booking** — গ্রাহকের অর্ডার (এক বা একাধিক reservation)।\n- **Booking engine** — হোটেলের নিজস্ব অনলাইন বুকিং সিস্টেম।\n- **Booking window** — বুকিং থেকে আগমন পর্যন্ত দিন (lead time)।\n- **Buffer** — শেষ কয়েকটি রুম OTA-তে না পাঠানো।\n- **Business date** — হোটেলের হিসাবের দিন (night audit-এ বদলায়)।\n\n## C\n- **Capture** — অথোরাইজড পেমেন্ট থেকে আসলে টাকা নেওয়া।\n- **Channel** — বিক্রয় পথ (OTA, direct, GDS)।\n- **Channel manager (CM)** — সব চ্যানেলে ARI পাঠায়, বুকিং আনে।\n- **Charge code** — বিলের ধরন (ROOM, FNB…) যার সাথে বিভাগ, ট্যাক্স, GL যুক্ত।\n- **Chargeback** — কার্ডধারীর ব্যাংকের বিবাদ ও টাকা ফেরত।\n- **Check-in / Check-out** — প্রবেশ / প্রস্থান প্রক্রিয়া।\n- **City ledger** — কোম্পানি/এজেন্টকে বিল, পরে পাওয়া।\n- **Commission** — OTA/এজেন্টকে দেওয়া অংশ।\n- **Comp** — বিনামূল্যে রুম/সেবা।\n- **Comp set** — তুলনার জন্য বাছাই করা প্রতিযোগী হোটেল দল।\n- **Confirmation number** — বুকিং রেফারেন্স।\n- **Connecting rooms** — অভ্যন্তরীণ দরজাযুক্ত রুম।\n- **Constrained demand** — আসলে বিক্রি হওয়া চাহিদা (sold-out/restriction সীমিত)।\n- **CRS** — Central Reservation System।\n- **CTA / CTD** — Closed to Arrival / Departure।\n\n## D\n- **Day use** — রাত নয়, ঘণ্টাভিত্তিক ব্যবহার।\n- **Denial / Regret** — চাহিদা ছিল কিন্তু দেওয়া যায়নি / দাম দেখে চলে গেছে।\n- **Deposit** — অগ্রিম/জামানত।\n- **Derived rate** — অন্য রেটের % বা ফিক্সড পার্থক্যে।\n- **Digital key** — ফোন দিয়ে দরজা খোলা (BLE/NFC)।\n- **Direct bill** — কোম্পানিকে সরাসরি বিল।\n- **Displacement** — গ্রুপ নিলে যে সাধারণ (transient) আয় হারায়।\n- **DND** — Do Not Disturb।\n- **Double booking** — একই রুম দুজনকে বিক্রি।\n\n## E\n- **Early check-in / Late check-out** — স্ট্যান্ডার্ড সময়ের আগে/পরে।\n- **EFD** — Electronic Fiscal Device (বাংলাদেশে প্রযোজ্যতা যাচাই দরকার)।\n- **EMSR** — Expected Marginal Seat Revenue; বহু রেট শ্রেণির ইনভেন্টরি সুরক্ষা পদ্ধতি।\n- **Extra bed / extra person** — অতিরিক্ত বিছানা/ব্যক্তি চার্জ।\n\n## F\n- **FIT** — Free Independent Traveller (একক ভ্রমণকারী)।\n- **Folio** — গেস্ট/কোম্পানির বিলের লেজার।\n- **Forecast** — ভবিষ্যৎ occupancy/রেভিনিউ অনুমান।\n\n## G\n- **GDS** — Global Distribution System (Sabre, Amadeus, Travelport)।\n- **GL** — General Ledger।\n- **GOP** — Gross Operating Profit; বিভাগীয় লাভ − অবণ্টিত পরিচালন খরচ।\n- **Group block** — গ্রুপের জন্য রুম আটকানো।\n- **Guarantee** — বুকিং নিশ্চিত করার প্রতিশ্রুতি (কার্ড/ডিপোজিট)।\n- **Guest profile** — গেস্টের স্থায়ী তথ্য।\n\n## H\n- **HK** — Housekeeping।\n- **Hold / Option** — সাময়িক আটকে রাখা।\n- **House use** — হোটেলের নিজস্ব ব্যবহার।\n- **HTNG** — হোটেল প্রযুক্তি ইন্টারফেস মানদণ্ড সংস্থা।\n- **Hypercare** — go-live-এর পর প্রথম কয়েক দিনের নিবিড় সহায়তা।\n\n## I\n- **iCal** — ক্যালেন্ডার ফরম্যাট; সরল চ্যানেল সিঙ্ক।\n- **Idempotency** — একই অনুরোধ বারবার করলে একবারের ফল।\n- **In-house** — বর্তমানে হোটেলে থাকা গেস্ট।\n- **Inventory** — বিক্রয়যোগ্য রুমের সংখ্যা (তারিখ-ভিত্তিক)।\n- **Invoice** — আনুষ্ঠানিক বিলপত্র।\n- **IPN** — Instant Payment Notification (SSLCommerz ইত্যাদি)।\n\n## K–L\n- **Key card** — ইলেকট্রনিক চাবি।\n- **Kiosk** — গেস্টের নিজে check-in করার যন্ত্র।\n- **KPI** — Key Performance Indicator।\n- **Lead time** — বুকিং থেকে আগমন পর্যন্ত দিন।\n- **Littlewood's rule** — দুই রেট শ্রেণিতে দামি শ্রেণির জন্য কত রুম রাখতে হবে তার নিয়ম।\n- **LOS** — Length of Stay।\n- **Lost & found** — হারানো-প্রাপ্ত জিনিস।\n\n## M\n- **Market segment** — গেস্টের ধরন (Corporate, Leisure, Group)।\n- **Master folio** — গ্রুপের কেন্দ্রীয় বিল।\n- **Meal plan** — RO, BB, HB, FB, AI (খাবারের প্যাকেজ)।\n- **Metasearch** — একাধিক চ্যানেলের দাম পাশাপাশি দেখানো সাইট (Google Hotel Ads, Trivago)।\n- **MFS** — Mobile Financial Service (bKash, Nagad, Rocket)।\n- **Min LOS** — ন্যূনতম রাত।\n- **MPI** — Market Penetration Index; আমার Occ ÷ বাজারের Occ × ১০০।\n- **Multi-tenant** — একই সিস্টেমে অনেক গ্রাহক, বিচ্ছিন্ন ডেটা।\n\n## N\n- **NetRevPAR** — কমিশন ও বিতরণ খরচ বাদে RevPAR।\n- **Night audit** — দিন শেষে হিসাব বন্ধ, নতুন business date।\n- **No-show** — বুকিং ছিল, আসেনি।\n- **Non-refundable** — ফেরতযোগ্য নয়।\n\n## O\n- **Occupancy** — বিক্রিত ÷ মোট বিক্রয়যোগ্য।\n- **OOO / OOS** — Out of Order / Out of Service।\n- **OTA** — Online Travel Agency।\n- **OTB** — On The Books; ভবিষ্যৎ রাতের জন্য এখন পর্যন্ত বিক্রি।\n- **Outbox pattern** — DB পরিবর্তনের সাথে ইভেন্ট নিরাপদে প্রকাশ।\n- **Overbooking** — ক্যাপাসিটির বেশি বিক্রি।\n\n## P\n- **Pace** — একই lead time-এ এ বছর বনাম গত বছরের OTB।\n- **Pax** — গেস্ট সংখ্যা।\n- **PCI DSS** — কার্ড ডেটা সুরক্ষা মান।\n- **Pickup / Pace** — বুকিং গতি/তুলনা।\n- **PMS** — Property Management System।\n- **POS** — Point of Sale।\n- **Posting** — ফোলিওতে চার্জ/পেমেন্ট এন্ট্রি।\n- **Price accuracy** — মেটাসার্চ ফিডের দাম আর ল্যান্ডিং পেজের দামের মিল।\n\n## R\n- **Rack rate** — প্রকাশিত সাধারণ রেট।\n- **Rate fence** — কম দামের রেটকে আলাদা রাখার শর্ত (অগ্রিম কেনা, নন-রিফান্ডেবল)।\n- **Rate parity** — সব চ্যানেলে একই দাম।\n- **Rate plan** — রেটের ধরন ও শর্ত।\n- **Refund** — ফেরত।\n- **Reservation** — একটি রুমের চুক্তি।\n- **Restriction** — বিক্রয় শর্ত (MinLOS, CTA…)।\n- **RevPAR / TRevPAR / GOPPAR** — রেভিনিউ ও মুনাফার প্রতি রুম সূচক।\n- **RevPASH** — Revenue per Available Seat Hour (রেস্টুরেন্ট)।\n- **RGI** — Revenue Generation Index; আমার RevPAR ÷ বাজারের RevPAR × ১০০।\n- **RMS** — Revenue Management System।\n- **Room move** — থাকা অবস্থায় রুম বদল।\n- **Room type** — বিক্রয় ক্যাটাগরি।\n- **Rooming list** — গ্রুপে কে কোন রুমে।\n\n## S\n- **Service charge** — সেবা চার্জ (অনেক সময় ১০% ধরনের; আইন/নীতি যাচাই)।\n- **Split folio / split payment** — বিল/পেমেন্ট ভাগ।\n- **Stay** — বাস্তব থাকা।\n- **Stayover** — থাকছে এমন গেস্ট।\n- **Stop-sell** — বিক্রি বন্ধ।\n\n## T–W\n- **Tape chart** — রুম×তারিখ বুকিং গ্রিড।\n- **Tax inclusive/exclusive** — ট্যাক্স সহ/ছাড়া দাম।\n- **Tokenization** — কার্ড ডেটার বদলে টোকেন।\n- **Turndown** — সন্ধ্যার বিছানা প্রস্তুতি।\n- **Unconstrained demand** — কোনো সীমা না থাকলে যত চাহিদা হতো।\n- **USALI** — Uniform System of Accounts for the Lodging Industry; হোটেল হিসাবের মানদণ্ড।\n- **VAT / VDS** — মূল্য সংযোজন কর / উৎসে কর্তন।\n- **VCC** — Virtual Credit Card; OTA হোটেলকে পেমেন্টের জন্য দেয়।\n- **Virtual card (VCC)** — OTA-র একবারের কার্ড।\n- **Void** — লেনদেন বাতিল (settlement-এর আগে)।\n- **Waitlist** — অপেক্ষা তালিকা।\n- **Walk** — ওভারবুকের কারণে গেস্টকে অন্য হোটেলে পাঠানো।\n- **Walk-in** — বুকিং ছাড়া আগন্তুক; **Walk (a guest)** — ওভারবুকিংয়ে অন্য হোটেলে পাঠানো।\n- **Webhook** — ইভেন্ট ঘটলে সার্ভার-টু-সার্ভার HTTP বার্তা।\n- **Window (folio)** — এক folio-র ভাগ (A/B/C)।\n\n---\n\n## পরিশিষ্ট ক — সম্পূর্ণ PMS শেখার রোডম্যাপ\n\n```mermaid\nflowchart LR\n    A[১. হোটেল ব্যবসা বোঝো: ডক ০১-০২] --> B[২. ফ্রন্ট অফিস ও রিজার্ভেশন: ০৩-০৪]\n    B --> C[৩. ইনভেন্টরি ও রেট: ০৫-০৬]\n    C --> D[৪. গেস্ট, ফোলিও, পেমেন্ট: ০৭, ০৯]\n    D --> E[৫. HK, মেইনটেন্যান্স, স্টাফ, স্টক: ০৮]\n    E --> F[৬. ডিস্ট্রিবিউশন: ১০]\n    F --> G[৭. ডাটা মডেল ও API: ১১-১২]\n    G --> H[৮. আর্কিটেকচার, সিকিউরিটি, রিপোর্ট: ১৩-১৫]\n    H --> I[৯. বাংলাদেশ ও গ্লোবাল: ১৬-১৮]\n    I --> J[১০. RM, গেস্ট টেক, ফিনান্স: ২১-২৩]\n    J --> K[১১. টেস্টিং, ইমপ্লিমেন্টেশন, ল্যাব: ২৪-২৬]\n    K --> L[১২. বানাও: MVP → প্রোডাকশন]\n```\n\n| পর্যায় | সময় (আনুমানিক) | লক্ষ্য | অনুশীলন |\n|---|---|---|---|\n| ১ ব্যবসা | ১ সপ্তাহ | ADR/RevPAR, লাইফসাইকেল ব্যাখ্যা করতে পারা | একটি হোটেলের একদিনের প্রবাহ আঁকো, রিসেপশন শিফটে বসো/ইন্টারভিউ নাও |\n| ২ কোর ডোমেইন | ২–৩ সপ্তাহ | রিজার্ভেশন স্টেট মেশিন, ইনভেন্টরি, রেট কোট | ইনভেন্টরি কনকারেন্সি টেস্ট (১০০ সমান্তরাল বুকিং, ১ রুম) |\n| ৩ টাকা | ২ সপ্তাহ | ফোলিও, নাইট অডিট, রিফান্ড | ledger append-only, trial balance মিলাও |\n| ৪ অপারেশন | ১–২ সপ্তাহ | HK, work order, রোস্টার, স্টক | মোবাইল HK PWA প্রোটোটাইপ |\n| ৫ ইন্টিগ্রেশন | ২–৩ সপ্তাহ | webhook, outbox, payment adapter, iCal | bKash/SSLCommerz sandbox end-to-end |\n| ৬ প্ল্যাটফর্ম | ২ সপ্তাহ | multi-tenant, RBAC, audit, entitlement | RLS টেস্ট (cross-tenant leak নেই) |\n| ৭ স্থানীয়করণ | ১ সপ্তাহ | বাংলা, ট্যাক্স প্যাক, গেস্ট রেজিস্টার এক্সপোর্ট | ভ্যাট রুল তারিখ-ভিত্তিক টেস্ট |\n| ৮ বানানো | চলমান | MVP → প্রোডাকশন | নিচের চেকলিস্ট |\n\n**শেখার উৎস:** Mews/Apaleo ডেভেলপার ডক, QloApps ও OCA/pms (স্কিমা পড়া), bKash/SSLCommerz অফিসিয়াল ডক, NBR প্রজ্ঞাপন (VAT), OpenTravel/HTNG স্পেক, হোটেল স্টাফের সাথে বাস্তব কথা। লিংক ডক ২৯-এ।\n\n## পরিশিষ্ট খ — ইমপ্লিমেন্টেশন চেকলিস্ট (প্রকল্প শুরুতে)\n\n- [ ] টার্গেট সেগমেন্ট ঠিক (গেস্ট হাউস/মাঝারি হোটেল/রিসোর্ট/হোস্টেল)\n- [ ] ২–৩টি পাইলট প্রপার্টি, তাদের স্টাফের সাথে ওয়ার্কশপ\n- [ ] ডোমেইন শব্দকোষ ও business date নীতি লিখিত\n- [ ] টেনেন্সি মডেল, টাইমজোন (`Asia/Dhaka`), মুদ্রা নীতি\n- [ ] স্কিমা ও কনস্ট্রেইন্ট রিভিউ (ডক ১২)\n- [ ] ট্যাক্স/ইনভয়েস আইনি যাচাই (কনসালট্যান্ট)\n- [ ] পেমেন্ট গেটওয়ে অ্যাকাউন্ট ও sandbox\n- [ ] বাংলা কন্টেন্ট/ফন্ট/টেমপ্লেট\n- [ ] CI/CD, পরিবেশ (dev/staging/prod), ব্যাকআপ-রিস্টোর\n- [ ] মনিটরিং ও অ্যালার্ট\n- [ ] ডেটা মাইগ্রেশন পরিকল্পনা ও সমান্তরাল রান\n- [ ] স্টাফ প্রশিক্ষণ, sandbox, ডাউনটাইম পরিকল্পনা\n- [ ] সাপোর্ট চ্যানেল (ফোন/WhatsApp), SLA\n\n## পরিশিষ্ট গ — MVP ফিচার চেকলিস্ট\n\n**কোর (বাধ্যতামূলক)**\n- [ ] প্রপার্টি, রুম টাইপ, রুম (বাল্ক তৈরি)\n- [ ] রেট প্ল্যান (BAR + ১–২টি), সিজন/ডে-অফ-উইক রুল, কোট\n- [ ] Availability ও atomic ইনভেন্টরি, overbooking সীমা (০ ডিফল্ট)\n- [ ] রিজার্ভেশন তৈরি/সংশোধন/ক্যানসেল/no-show, স্টেট মেশিন\n- [ ] Walk-in, check-in, check-out, room assignment/move\n- [ ] গেস্ট প্রোফাইল ও ID তথ্য সংগ্রহ\n- [ ] Folio, charge code, পেমেন্ট (নগদ/কার্ড/MFS ম্যানুয়াল রেকর্ড), ডিপোজিট, ইনভয়েস (প্রিন্ট/PDF)\n- [ ] Housekeeping স্ট্যাটাস বোর্ড (মোবাইল-ফ্রেন্ডলি), OOO\n- [ ] Night audit (অটো-রুম চার্জ, business date)\n- [ ] ভূমিকা (৪–৫ রোল), অডিট লগ\n- [ ] বেসিক রিপোর্ট (arrivals, departures, in-house, daily revenue, occupancy)\n- [ ] বাংলা/ইংরেজি UI\n- [ ] ট্যাক্স/সার্ভিস চার্জ কনফিগযোগ্য\n\n**MVP-তে ঐচ্ছিক (পরিস্থিতি অনুযায়ী):** iCal সিঙ্ক, বুকিং ইঞ্জিন + একটি গেটওয়ে (bKash/SSLCommerz), SMS/WhatsApp কনফার্মেশন।\n\n## পরিশিষ্ট ঘ — প্রোডাকশন-রেডি ফিচার চেকলিস্ট\n\n- [ ] Idempotency সব মানি/বুকিং API-তে\n- [ ] Outbox + queue + retry + dead-letter\n- [ ] Webhook (outbound) সাইন, retry; inbound যাচাই-ভিত্তিক\n- [ ] Payment: authorization/capture/void/refund, reconciliation, চার্জব্যাক\n- [ ] Night audit resumable/idempotent, trial balance\n- [ ] Cashier shift, ভেরিয়েন্স রিপোর্ট\n- [ ] Credit note, ইনভয়েস অপরিবর্তনীয়, ক্রমিক নম্বর\n- [ ] Multi-property, রোল ও সীমা (maker-checker)\n- [ ] ফুল অডিট লগ ও সংবেদনশীল ডেটা এনক্রিপশন\n- [ ] চ্যানেল ম্যানেজার/অন্তত iCal + ম্যাপিং + আনম্যাপড কিউ + sync মনিটর\n- [ ] বুকিং ইঞ্জিন (মোবাইল, বাংলা, hold, ডিপোজিট)\n- [ ] POS/স্পা/ইভেন্ট (প্রয়োজনে), স্টক, রোস্টার\n- [ ] রিপোর্ট সেন্টার, শিডিউলড owner report, এক্সপোর্ট\n- [ ] আইনি রিপোর্ট এক্সপোর্ট (গেস্ট রেজিস্টার), VAT রিপোর্ট\n- [ ] Import/Export, sandbox, onboarding, entitlement\n- [ ] PITR ব্যাকআপ, রিস্টোর ড্রিল, DR পরিকল্পনা\n- [ ] পারফরম্যান্স (tape chart, availability সার্চ) লোড টেস্ট\n- [ ] নিরাপত্তা পরীক্ষা (pen test), ডিপেন্ডেন্সি স্ক্যান\n- [ ] ডাউনটাইম/offline পরিকল্পনা (রিপোর্ট, PWA ক্যাশ)\n\n## পরিশিষ্ট ঙ — এজ-কেস চেকলিস্ট\n\n**ইনভেন্টরি ও রিজার্ভেশন**\n- [ ] শেষ রুমে দুজন একসাথে; মাল্টি-নাইট all-or-nothing\n- [ ] Departure দিন ইনভেন্টরি আটকে না\n- [ ] তারিখ/রুম টাইপ বদলে ইনভেন্টরি একই ট্রানজ্যাকশনে\n- [ ] OOO ওভারল্যাপ বুকিং, রুম টাইপ মার্জ/ভাগ\n- [ ] ক্যানসেল ডেডলাইন টাইমজোন; পলিসি স্ন্যাপশট\n- [ ] No-show পরে গেস্ট এলে reinstate\n- [ ] ওভারবুকিং walk/upgrade\n\n**রেট ও ট্যাক্স**\n- [ ] ভবিষ্যৎ রেট না থাকা; derived রেট লুপ\n- [ ] ট্যাক্স inclusive/exclusive, rounding, stay-date অনুযায়ী হার বদল\n- [ ] OTA gross/net ম্যাপিং; child age অনুপস্থিত\n\n**ফোলিও ও পেমেন্ট**\n- [ ] ডাবল POS পোস্ট; চেকআউটের পর দেরিতে চার্জ\n- [ ] Split/shared folio, routing পরিবর্তন মাঝপথে\n- [ ] Refund > payment; আংশিক রিফান্ড; ব্যর্থ রিফান্ড\n- [ ] callback আগে নাকি IPN আগে; webhook ডুপ্লিকেট; পেমেন্ট pending timeout\n- [ ] ডিপোজিট ক্যানসেলে বাজেয়াপ্ত বনাম ফেরত\n- [ ] নাইট অডিট মাঝপথে ক্র্যাশ; backdated posting\n\n**অপারেশন**\n- [ ] ভুল রুমে check-in; room move ইতিহাস\n- [ ] Late check-out বনাম পরের গেস্ট\n- [ ] Skipper (বিল না দিয়ে চলে যাওয়া)\n- [ ] HK টাস্ক জেনারেট হয়নি; DND\n- [ ] ক্যাশিয়ার শিফট পেরোনো, রাত ১২টা/business date\n\n**ইন্টিগ্রেশন**\n- [ ] OTA বুকিং ডুপ্লিকেট/আউট-অব-অর্ডার modify/cancel\n- [ ] আনম্যাপড বুকিং, partial sync failure\n- [ ] third-party স্কিমা পরিবর্তন; রেট লিমিট\n\n**ডেটা ও নিরাপত্তা**\n- [ ] গেস্ট ডুপ্লিকেট/merge; ফাজি নাম (বাংলা/ইংরেজি)\n- [ ] ক্রস-টেনেন্ট ডেটা লিক; IDOR\n- [ ] মুছে ফেলার অনুরোধ বনাম ফিনান্সিয়াল রিটেনশন\n- [ ] ID ছবি অ্যাক্সেস লগ\n\n## পরিশিষ্ট চ — স্কিমা, API, ফ্রন্টএন্ড ও আর্কিটেকচার কোথায় পাবে\n\n| বিষয় | কোথায় |\n|---|---|\n| ডাটাবেস স্কিমা (সম্পূর্ণ) | ডক ১২ §৩, §৬, §৭ |\n| API স্ট্রাকচার | ডক ১১ §১১ |\n| ফ্রন্টএন্ড মডিউল স্ট্রাকচার | ডক ১৩ §১২ |\n| ক্লাউড PMS আর্কিটেকচার | ডক ১৩ §২, §১১ |\n| গ্লসারি | এই ডক, উপরে |\n", "title_en": "20 — PMS Glossary", "md_en": "# 20 — PMS Glossary\n\n> English terms in alphabetical order with plain explanations. The full searchable list is also on the Glossary page.\n\n## A\n- **ABS (Attribute-Based Selling)** — Selling room features (sea view, high floor) instead of only room types.\n- **ADR** — Average Daily Rate. Room revenue ÷ room nights sold.\n- **Allotment** — Rooms reserved in advance for a channel/company.\n- **ALOS** — Average Length of Stay; average nights per booking.\n- **API** — An interface for software-to-software communication.\n- **AR (Accounts Receivable)** — Money owed to the hotel (company balances).\n- **ARI** — Availability, Rates, Inventory (plus restrictions).\n- **Arrival** — A guest coming in; arrivals list = today's incoming guests.\n- **Audit log** — An unchangeable record of who did what.\n- **Authorization (pre-auth)** — Holding money on a card without taking it.\n\n## B\n- **BAR** — Best Available Rate.\n- **BIN** — Business Identification Number (Bangladesh VAT).\n- **Block** — Rooms held back (for a group/repairs).\n- **Booking** — The customer's order (one or more reservations).\n- **Booking engine** — The hotel's own online booking system.\n- **Booking window** — Days from booking to arrival (lead time).\n- **Buffer** — Not sending the last few rooms to OTAs.\n- **Business date** — The hotel's accounting day (changes at night audit).\n\n## C\n- **Capture** — Actually taking money from an authorised payment.\n- **Channel** — A sales route (OTA, direct, GDS).\n- **Channel manager (CM)** — Sends ARI to all channels and brings bookings in.\n- **Charge code** — Type of charge (ROOM, FNB…) linked to department, tax and GL.\n- **Chargeback** — A dispute by the cardholder's bank with money returned.\n- **Check-in / Check-out** — Arrival / departure process.\n- **City ledger** — Bills to companies/agents, collected later.\n- **Commission** — The share paid to an OTA/agent.\n- **Comp** — Complimentary (free) room/service.\n- **Comp set** — A chosen group of competing hotels for comparison.\n- **Confirmation number** — The booking reference.\n- **Connecting rooms** — Rooms joined by an internal door.\n- **Constrained demand** — Demand actually sold (limited by sell-outs/restrictions).\n- **CRS** — Central Reservation System.\n- **CTA / CTD** — Closed to Arrival / Closed to Departure.\n\n## D\n- **Day use** — Hourly use instead of a night.\n- **Denial / Regret** — Demand that could not be served / a guest who left after seeing the price.\n- **Deposit** — Advance payment/security.\n- **Derived rate** — A rate set as a % or fixed difference from another rate.\n- **Digital key** — Opening the door with a phone (BLE/NFC).\n- **Direct bill** — Billing a company directly.\n- **Displacement** — Regular (transient) revenue lost by accepting a group.\n- **DND** — Do Not Disturb.\n- **Double booking** — The same room sold to two people.\n\n## E\n- **Early check-in / Late check-out** — Before/after the standard time.\n- **EFD** — Electronic Fiscal Device (check applicability in Bangladesh).\n- **EMSR** — Expected Marginal Seat Revenue; an inventory protection method for many rate classes.\n- **Extra bed / extra person** — Charge for an additional bed/person.\n\n## F\n- **FIT** — Free Independent Traveller (individual traveller).\n- **Folio** — The bill ledger of a guest/company.\n- **Forecast** — An estimate of future occupancy/revenue.\n\n## G\n- **GDS** — Global Distribution System (Sabre, Amadeus, Travelport).\n- **GL** — General Ledger.\n- **GOP** — Gross Operating Profit; departmental profit − undistributed operating expenses.\n- **Group block** — Rooms held for a group.\n- **Guarantee** — A promise that secures a booking (card/deposit).\n- **Guest profile** — A guest's permanent record.\n\n## H\n- **HK** — Housekeeping.\n- **Hold / Option** — A temporary hold.\n- **House use** — Rooms used by the hotel itself.\n- **HTNG** — A body that sets hotel technology interface standards.\n- **Hypercare** — Intensive support in the first days after go-live.\n\n## I\n- **iCal** — A calendar format; simple channel sync.\n- **Idempotency** — Repeating the same request has the effect of doing it once.\n- **In-house** — Guests currently staying.\n- **Inventory** — Number of sellable rooms (per date).\n- **Invoice** — The formal bill document.\n- **IPN** — Instant Payment Notification (SSLCommerz etc.).\n\n## K–L\n- **Key card** — An electronic key.\n- **Kiosk** — A machine for guests to check themselves in.\n- **KPI** — Key Performance Indicator.\n- **Lead time** — Days from booking to arrival.\n- **Littlewood's rule** — How many rooms to protect for the higher rate class when there are two classes.\n- **LOS** — Length of Stay.\n- **Lost & found** — Items lost and found.\n\n## M\n- **Market segment** — Type of guest (Corporate, Leisure, Group).\n- **Master folio** — A group's central bill.\n- **Meal plan** — RO, BB, HB, FB, AI (meal packages).\n- **Metasearch** — Sites showing prices from many channels side by side (Google Hotel Ads, Trivago).\n- **MFS** — Mobile Financial Service (bKash, Nagad, Rocket).\n- **Min LOS** — Minimum number of nights.\n- **MPI** — Market Penetration Index; my occupancy ÷ market occupancy × 100.\n- **Multi-tenant** — Many customers in one system with isolated data.\n\n## N\n- **NetRevPAR** — RevPAR after commission and distribution costs.\n- **Night audit** — Closing the day's accounts and starting a new business date.\n- **No-show** — Had a booking, did not arrive.\n- **Non-refundable** — Not refundable.\n\n## O\n- **Occupancy** — Rooms sold ÷ total sellable rooms.\n- **OOO / OOS** — Out of Order / Out of Service.\n- **OTA** — Online Travel Agency.\n- **OTB** — On The Books; rooms sold so far for future nights.\n- **Outbox pattern** — Safely publishing events together with DB changes.\n- **Overbooking** — Selling more than capacity.\n\n## P\n- **Pace** — OTB this year vs last year at the same lead time.\n- **Pax** — Number of guests.\n- **PCI DSS** — Card data security standard.\n- **Pickup** — How much OTB grew over a period.\n- **PMS** — Property Management System.\n- **POS** — Point of Sale.\n- **Posting** — Entering a charge/payment on a folio.\n- **Price accuracy** — Match between the metasearch feed price and the landing page price.\n\n## R\n- **Rack rate** — The published standard rate.\n- **Rate fence** — A condition that separates a cheaper rate (advance purchase, non-refundable).\n- **Rate parity** — The same price on all channels.\n- **Rate plan** — A rate type with its conditions.\n- **Refund** — Money returned.\n- **Reservation** — The agreement for one room.\n- **Restriction** — A selling condition (MinLOS, CTA…).\n- **RevPAR / TRevPAR / GOPPAR** — Revenue and profit indicators per available room.\n- **RevPASH** — Revenue per Available Seat Hour (restaurants).\n- **RGI** — Revenue Generation Index; my RevPAR ÷ market RevPAR × 100.\n- **RMS** — Revenue Management System.\n- **Room move** — Changing rooms during a stay.\n- **Room type** — The sales category.\n- **Rooming list** — Who is in which room in a group.\n\n## S\n- **Service charge** — Service fee (often around 10%; verify law/policy).\n- **Split folio / split payment** — Dividing a bill/payment.\n- **Stay** — The actual stay.\n- **Stayover** — A guest continuing their stay.\n- **Stop-sell** — Selling stopped.\n\n## T–W\n- **Tape chart** — The rooms × dates booking grid.\n- **Tax inclusive/exclusive** — Price with/without tax.\n- **Tokenization** — Replacing card data with a token.\n- **Turndown** — Evening bed preparation.\n- **Unconstrained demand** — The demand that would exist without any limits.\n- **USALI** — Uniform System of Accounts for the Lodging Industry; the hotel accounting standard.\n- **VAT / VDS** — Value Added Tax / VAT deducted at source.\n- **Virtual card (VCC)** — A single-use card from an OTA for payment.\n- **Void** — Cancelling a transaction (before settlement).\n- **Waitlist** — A waiting list.\n- **Walk** — Sending a guest to another hotel because of overbooking.\n- **Walk-in** — A guest arriving without a booking.\n- **Webhook** — A server-to-server HTTP message sent when an event happens.\n- **Window (folio)** — A section of a folio (A/B/C).\n\n---\n\n## Appendix A — Complete PMS learning roadmap\n\n```mermaid\nflowchart LR\n    A[1. Understand the hotel business: docs 01-02] --> B[2. Front office & reservations: 03-04]\n    B --> C[3. Inventory & rates: 05-06]\n    C --> D[4. Guests, folio, payments: 07, 09]\n    D --> E[5. HK, maintenance, staff, stock: 08]\n    E --> F[6. Distribution: 10]\n    F --> G[7. Data model & API: 11-12]\n    G --> H[8. Architecture, security, reports: 13-15]\n    H --> I[9. Bangladesh & global: 16-18]\n    I --> J[10. RM, guest tech, finance: 21-23]\n    J --> K[11. Testing, implementation, lab: 24-26]\n    K --> L[12. Build: MVP → production]\n```\n\n| Stage | Time (approx.) | Goal | Practice |\n|---|---|---|---|\n| 1 Business | 1 week | Explain ADR/RevPAR and the lifecycle | Draw one day in a hotel; sit in on a reception shift or interview staff |\n| 2 Core domain | 2–3 weeks | Reservation state machine, inventory, rate quotes | Inventory concurrency test (100 parallel bookings, 1 room) |\n| 3 Money | 2 weeks | Folio, night audit, refunds | Append-only ledger, reconcile the trial balance |\n| 4 Operations | 1–2 weeks | HK, work orders, rosters, stock | Mobile HK PWA prototype |\n| 5 Integration | 2–3 weeks | Webhooks, outbox, payment adapters, iCal | bKash/SSLCommerz sandbox end to end |\n| 6 Platform | 2 weeks | Multi-tenant, RBAC, audit, entitlements | RLS test (no cross-tenant leak) |\n| 7 Localisation | 1 week | Bangla, tax packs, guest register export | Date-based VAT rule tests |\n| 8 Building | Ongoing | MVP → production | Checklists below |\n\n**Learning sources:** Mews/Apaleo developer docs, QloApps and OCA/pms (read the schemas), bKash/SSLCommerz official docs, NBR notifications (VAT), OpenTravel/HTNG specs, real conversations with hotel staff. Links in doc 29.\n\n## Appendix B — Implementation checklist (project start)\n\n- [ ] Target segment decided (guest house / mid-size hotel / resort / hostel)\n- [ ] 2–3 pilot properties, workshops with their staff\n- [ ] Domain vocabulary and business date policy written down\n- [ ] Tenancy model, time zone (`Asia/Dhaka`), currency policy\n- [ ] Schema and constraint review (doc 12)\n- [ ] Legal check of tax/invoices (consultant)\n- [ ] Payment gateway accounts and sandbox\n- [ ] Bangla content/fonts/templates\n- [ ] CI/CD, environments (dev/staging/prod), backup-restore\n- [ ] Monitoring and alerts\n- [ ] Data migration plan and parallel run\n- [ ] Staff training, sandbox, downtime plan\n- [ ] Support channel (phone/WhatsApp), SLA\n\n## Appendix C — MVP feature checklist\n\n**Core (required)**\n- [ ] Property, room types, rooms (bulk creation)\n- [ ] Rate plans (BAR + 1–2), season/day-of-week rules, quotes\n- [ ] Availability and atomic inventory, overbooking limit (0 by default)\n- [ ] Create/modify/cancel/no-show reservations, state machine\n- [ ] Walk-in, check-in, check-out, room assignment/move\n- [ ] Guest profiles and ID capture\n- [ ] Folio, charge codes, payments (cash/card/MFS manual records), deposits, invoices (print/PDF)\n- [ ] Housekeeping status board (mobile-friendly), OOO\n- [ ] Night audit (automatic room charges, business date)\n- [ ] Roles (4–5), audit log\n- [ ] Basic reports (arrivals, departures, in-house, daily revenue, occupancy)\n- [ ] Bangla/English UI\n- [ ] Configurable tax/service charge\n\n**Optional in the MVP (depends on context):** iCal sync, booking engine + one gateway (bKash/SSLCommerz), SMS/WhatsApp confirmations.\n\n## Appendix D — Production-ready feature checklist\n\n- [ ] Idempotency on every money/booking API\n- [ ] Outbox + queue + retry + dead-letter\n- [ ] Webhooks (outbound) signed with retries; inbound verification-based\n- [ ] Payments: authorization/capture/void/refund, reconciliation, chargebacks\n- [ ] Night audit resumable/idempotent, trial balance\n- [ ] Cashier shifts, variance report\n- [ ] Credit ons**\n- [ ] Duplicate OTA bookings / out-of-order modify/cancel\n- [ ] Unmapped bookings, partial sync failure\n- [ ] Third-party schema changes; rate limits\n\n**Data and security**\n- [ ] Duplicate guests/merge; fuzzy names (Bangla/English)\n- [ ] Cross-tenant data leak; IDOR\n- [ ] Erasure requests vs financial retention\n- [ ] ID image access log\n\n## Appendix F — Where to find schema, API, front end and architecture\n\n| Topic | Where |\n|---|---|\n| Database schema (full) | Doc 12 §3, §6, §7 |\n| API structure | Doc 11 §11 |\n| Front-end module structure | Doc 13 §12 |\n| Cloud PMS architecture | Doc 13 §2, §11 |\n| Glossary | This doc, above |\n"}}, "quiz": {"1": {"bn": [{"q": "হোটেলে মূলত কোনটি বিক্রি হয় বুকিংয়ের সময়?", "o": ["নির্দিষ্ট রুম নম্বর", "Room Type", "ফ্লোর", "বেড"], "a": 1, "e": "বুকিংয়ে Room Type বিক্রি হয়; রুম নম্বর সাধারণত পরে (late assignment) দেওয়া হয়।"}, {"q": "Business date কখন বদলায়?", "o": ["রাত ১২টায় স্বয়ংক্রিয়ভাবে", "Night audit সম্পন্ন হলে", "প্রথম check-in হলে", "ম্যানেজার লগইন করলে"], "a": 1, "e": "Business date হোটেলের হিসাবের দিন — night audit-এ এগোয়, ক্যালেন্ডার মধ্যরাতে নয়।"}, {"q": "PMS যে তিনটি মূল জিনিস সামলায় তার মধ্যে কোনটি নেই?", "o": ["Inventory", "Guest + Booking", "Money (Folio/Ledger)", "স্টাফের বেতন প্রক্রিয়া"], "a": 3, "e": "বেতন সাধারণত আলাদা payroll সিস্টেমে; PMS-এর কোর হলো ইনভেন্টরি, বুকিং, টাকা।"}, {"q": "Door lock সিস্টেম PMS-এর সাথে কেন যুক্ত?", "o": ["রেট ঠিক করতে", "check-in-এ কী কার্ড বানাতে", "OTA-তে ইনভেন্টরি পাঠাতে", "VAT হিসাব করতে"], "a": 1, "e": "check-in হলে রুমের কী কার্ড এনকোড হয়; check-out/room move-এ বাতিল।"}], "en": [{"q": "What is usually sold at booking time?", "o": ["A specific room number", "A room type", "A floor", "A bed"], "a": 1, "e": "Bookings sell a room type; the room number is usually assigned later (late assignment)."}, {"q": "When does the business date change?", "o": ["Automatically at midnight", "When night audit completes", "At the first check-in", "When the man  pane.innerHTML=`<p>${esc(t("flashIntro",num(G.length)))}</p><div class="fc-ctrl"><button type="button" id="fsh">${esc(t("shuffle"))}</button><button type="button" id="fun">${esc(t("onlyUnknown"))}</button><button type="button" id="fall">${esc(t("allCards"))}</button></div><div class="fc"><button type="button" class="fc-card" id="fcc" aria-live="polite"></button></div><div class="fc-ctrl"><button type="button" id="fpv">${esc(t("prev"))}</button><button type="button" id="fno">${esc(t("again"))}</button><button type="button" id="fyes">${esc(t("know"))}</button><button type="button" id="fnx">${esc(t("next"))}</button></div><p class="fc-stat" id="fst"></p>`;
 const draw=()=>{if(!deck.length){$("#fcc").textContent=t("allKnown");$("#fst").textContent="";return}const g=G[deck[pos]];
  $("#fcc").innerHTML=flip?`<div><div class="term" style="font-size:1em">${esc(g.term)}</div><p>${esc(g.def)}</p></div>`:`<div class="term">${esc(g.term)}</div>`;
  $("#fst").textContent=t("fstat",num(pos+1),num(deck.length),num(known.size),num(G.length))};
 const mv=d=>{if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;flip=false;draw()};
 $("#fcc").onclick=()=>{flip=!flip;draw()};$("#fpv").onclick=()=>mv(-1);$("#fnx").onclick=()=>mv(1);
 $("#fyes").onclick=()=>{if(!deck.length)return;known.add(G[deck[pos]].term);store.set("fcKnown",[...known]);mv(1)};
 $("#fno").onclick=()=>{if(!deck.length)return;known.delete(G[deck[pos]].term);store.set("fcKnown",[...known]);mv(1)};
 $("#fsh").onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}pos=0;flip=false;draw()};
 $("#fun").onclick=()=>{deck=G.map((g,i)=>i).filter(i=>!known.has(G[i].term));pos=0;flip=false;draw()};
 $("#fall").onclick=()=>{deck=G.map((g,i)=>i);pos=0;flip=false;draw()};
 draw();scrollTo(0,0)}
/* ---------- search ---------- */
let IDX=null;
function buildIndex(){IDX=[];ORDER.forEach(n=>{const r=document.createElement("div");r.innerHTML=mdToHtml(docMd(n));assignIds(r);
 let cur={n,sid:null,title:short(docTitle(n)),text:""};const push=()=>{if(cur.text.trim()||cur.sid)IDX.push(cur)};
 for(const c of r.children){if(/^H[1-4]$/.test(c.tagName)){push();cur={n,sid:c.id,title:c.textContent.trim(),text:""}}else if(c.matches("pre")&&c.querySelector("code.language-mermaid"))continue;else cur.text+=" "+c.textContent}
 push()});IDX.forEach(x=>{x.text=x.text.replace(/\s+/g," ");x.lt=x.title.toLowerCase();x.lx=x.text.toLowerCase()})}
const sx=$("#sx"),sxi=$("#sxi"),sxr=$("#sxr");let sel=0;
function openSearch(){if(!libsOk())return;if(!IDX)buildIndex();sx.classList.add("open");sxi.focus();sxi.select();doSearch()}
function closeSearch(){sx.classList.remove("open")}
function doSearch(){const q=sxi.value.trim().toLowerCase();const terms=q.split(/\s+/).filter(Boolean);
 if(!terms.length){sxr.innerHTML=`<div class="empty">${esc(t("searchStart"))}</div>`;return}
 const res=[];IDX.forEach(x=>{if(!terms.every(w=>x.lt.includes(w)||x.lx.includes(w)))return;let sc=0;terms.forEach(w=>{if(x.lt.includes(w))sc+=10;sc+=Math.min(5,x.lx.split(w).length-1)});if(!x.sid)sc+=2;res.push({x,sc})});
 res.sort((a,b)=>b.sc-a.sc);const top=res.slice(0,40);sel=0;
 if(!top.length){sxr.innerHTML=`<div class="empty">${esc(t("searchNone"))}</div>`;return}
 const hi=s=>{let o=esc(s);terms.forEach(w=>{o=o.replace(new RegExp("("+reEsc(esc(w))+")","gi"),"<mark>$1</mark>")});return o};
 sxr.innerHTML=top.map(({x},i)=>{const at=x.lx.indexOf(terms[0]);const st=Math.max(0,at-60);const snip=(st?"…":"")+x.text.slice(st,st+170)+"…";
  return `<a class="r${i?"":" sel"}" href="#d${x.n}${x.sid?"/"+x.sid:""}"><small>${pad2(x.n)} · ${esc(short(docTitle(x.n)))}</small><b>${hi(x.title)}</b><small>${hi(snip)}</small></a>`}).join("")+(res.length>40?`<div class="empty">${esc(t("searchMore",num(res.length-40)))}</div>`:"")}
sxi.addEventListener("input",doSearch);
sxi.addEventListener("keydown",e=>{const rs=$$(".r",sxr);if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!rs.length)return;rs[sel]&&rs[sel].classList.remove("sel");sel=(sel+(e.key==="ArrowDown"?1:-1)+rs.length)%rs.length;rs[sel].classList.add("sel");rs[sel].scrollIntoView({block:"nearest"})}else if(e.key==="Enter"&&rs[sel]){e.preventDefault();rs[sel].click()}});
sxr.addEventListener("click",e=>{const a=e.target.closest(".r");if(!a)return;pendingHighlight=sxi.value.trim().split(/\s+/).filter(Boolean);closeSearch();if(a.getAttribute("href")===location.hash){e.preventDefault();route()}});
sx.addEventListener("click",e=>{if(e.target===sx)closeSearch()});
/* ---------- global events ---------- */
addEventListener("hashchange",()=>route());
$("#mb").onclick=()=>document.body.classList.toggle("open");
$("#ms").onclick=openSearch;$("#sb").onclick=openSearch;
document.addEventListener("click",e=>{if(document.body.classList.contains("open")&&!e.target.closest("aside")&&!e.target.closest("#mb"))document.body.classList.remove("open")});
$("#th").onclick=()=>{const th=dark()?"light":"dark";document.documentElement.dataset.theme=th;try{localStorage.setItem("theme",th)}catch(e){}route({keepY:scrollY})};
const setFs=v=>{S.fs=Math.min(21,Math.max(14,v));save("fs");document.documentElement.style.setProperty("--fs",S.fs+"px")};
$("#fm").onclick=()=>setFs(S.fs-1);$("#fp").onclick=()=>setFs(S.fs+1);
$("#pr").onclick=()=>print();
addEventListener("beforeprint",()=>{$$("article details").forEach(d=>{d.dataset.wasOpen=d.open?"1":"";d.open=true})});
addEventListener("afterprint",()=>{$$("article details").forEach(d=>{if(!d.dataset.wasOpen)d.open=false})});
const totop=$("#totop"),rb=$("#readbar");
addEventListener("scroll",()=>{const h=document.documentElement;const p=h.scrollHeight-h.clientHeight;rb.style.width=(p>0?100*h.scrollTop/p:0)+"%";totop.classList.toggle("show",h.scrollTop>700)},{passive:true});
totop.onclick=()=>scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
document.addEventListener("keydown",e=>{
 const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
 if(e.key==="Escape"){if(ov.classList.contains("open"))closeOverlay();else if(sx.classList.contains("open"))closeSearch();else hideTip();return}
 if(ov.classList.contains("open")&&OV&&OV.kind==="svg"){
  if(e.key==="+"||e.key==="="){ovZoom(1.2);e.preventDefault()}else if(e.key==="-"){ovZoom(1/1.2);e.preventDefault()}else if(e.key==="0"){fit();e.preventDefault()}
  else if(e.key.startsWith("Arrow")){const d=60;if(e.key==="ArrowLeft")OV.x+=d;if(e.key==="ArrowRight")OV.x-=d;if(e.key==="ArrowUp")OV.y+=d;if(e.key==="ArrowDown")OV.y-=d;ovApply();e.preventDefault()}return}
 if((e.key==="k"&&(e.ctrlKey||e.metaKey))||(e.key==="/"&&!typing)){e.preventDefault();openSearch();return}
 if(typing||sx.classList.contains("open"))return;
 if(location.hash==="#flash"){if(e.key===" "){e.preventDefault();$("#fcc")&&$("#fcc").click()}else if(e.key==="ArrowRight")$("#fnx")&&$("#fnx").click();else if(e.key==="ArrowLeft")$("#fpv")&&$("#fpv").click();return}
 if(e.key==="?"){alert(t("shortcuts"));return}
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const st=parseHash();if(st.r!=="doc")return;const i=ORDER.indexOf(st.n);
 if(e.key==="ArrowRight"&&ORDER[i+1]!=null)location.hash="#d"+ORDER[i+1];
 if(e.key==="ArrowLeft"&&ORDER[i-1]!=null)location.hash="#d"+ORDER[i-1];
});
applyStatic();route();
})();
</script>
