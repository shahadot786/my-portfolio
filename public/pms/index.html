্চ-চাহিদা গড় ২০, standard deviation ৫ (normal ধরে)।\n`P(D > y) = 0.625` → z ≈ −০.৩২ → y ≈ ২০ − ০.৩২×৫ ≈ **১৮ রুম** রাখো। ৫০ রুম হোটেলে প্রমো বুকিং সীমা = ৫০ − ১৮ = ৩২।\n\n```python\nfrom statistics import NormalDist\n\ndef littlewood_protect(p_high, p_low, mu, sigma):\n    ratio = p_low / p_high            # P(D_high > y) = ratio\n    return NormalDist(mu, sigma).inv_cdf(1 - ratio)\n\nprint(round(littlewood_protect(8000, 5000, mu=20, sigma=5)))  # 18\n```\n> বহু শ্রেণির জন্য এর সাধারণীকরণ **EMSR-b** (Expected Marginal Seat Revenue) — বিমানে জনপ্রিয়, হোটেলেও ব্যবহৃত।\n\n### ৭.৩ Restriction দিয়ে নিয়ন্ত্রণ\n- **MinLOS:** পিক রাতের আশপাশে কম-চাহিদার রাত বিক্রি করতে (বৃহস্পতি-শুক্র-শনি প্যাটার্ন)\n- **CTA / CTD:** নির্দিষ্ট দিনে আগমন/প্রস্থান বন্ধ\n- **Stop-sell:** কোনো চ্যানেল/রেট বন্ধ\n- **Length-of-stay pricing:** প্রতি রাতের দাম থাকার দৈর্ঘ্যের ওপর নির্ভর (জটিল, কম চ্যানেলে সমর্থিত)\n\n---\n\n## ৮. ওভারবুকিং অপ্টিমাইজেশন\n\nসমস্যা: কিছু গেস্ট আসে না (no-show) বা শেষ মুহূর্তে বাতিল করে → রুম খালি থাকে। বেশি বুক করলে খালি কমে, কিন্তু সবাই এলে কাউকে **walk** করতে হয় (অন্য হোটেলে পাঠানো + খরচ + সুনাম ক্ষতি)।\n\n**খরচ তুলনা (critical ratio / newsvendor):**\n- `Cu` = খালি রুমের ক্ষতি ≈ হারানো আয় (ADR, minus পরিবর্তনশীল খরচ)\n- `Co` = walk খরচ = বিকল্প হোটেলের ভাড়া + যাতায়াত + ক্ষতিপূরণ + সুনাম\n- সর্বোত্তম ওভারবুক `x` যেখানে `P(no-show ≤ x) ≈ Cu ÷ (Cu + Co)`\n\nউদাহরণ: ADR ৳৫,০০০ (Cu ≈ ৪,৫০০), walk খরচ ৳১৫,০০০ → অনুপাত = ৪৫০০ ÷ ১৯৫০০ ≈ ০.২৩।\nইতিহাসে ওই ধরনের রাতে no-show: ০ (২০%), ১ (২৫%), ২ (২৫%), ৩ (১৫%), ৪+ (১৫%)।\nক্রমযোজিত: P(≤০)=০.২০, P(≤১)=০.৪৫ → প্রথম যেখানে ০.২৩ ছাড়ায় = **১ রুম** ওভারবুক।\n\n```python\ndef optimal_overbook(noshow_pmf, cu, co):\n    target, cum = cu / (cu + co), 0.0\n    for x, p in sorted(noshow_pmf.items()):\n        cum += p\n        if cum >= target:\n            return x\n    return max(noshow_pmf)\n\nprint(optimal_overbook({0:.20, 1:.25, 2:.25, 3:.15, 4:.15}, cu=4500, co=15000))  # 1\n```\n\n**PMS ইঞ্জিনিয়ারিং:** room type ও তারিখ অনুযায়ী `overbook_limit`; নন-রিফান্ডেবল বুকিং বেশি থাকলে কম ওভারবুক (তারা টাকা দিয়েছে, আসবে বা না এলেও আয় আছে); walk রিপোর্ট ও walk খরচ ট্র্যাক।\n\n---\n\n## ৯. গ্রুপ ডিসপ্লেসমেন্ট বিশ্লেষণ\n\nপ্রশ্ন: ৩ রাতের জন্য ২০ রুমের কনফারেন্স গ্রুপ ৳৪,০০০ রেটে নেব কি না?\n\nগ্রুপ নিলে কিছু **transient** (সাধারণ) গেস্ট জায়গা পাবে না (displace হবে)।\n\n| রাত | পূর্বাভাস transient | ফাঁকা রুম (৫০ − transient) | গ্রুপ ২০ নিলে displaced transient | transient ADR |\n|---|---|---|---|---|\n| বুধ | ২৫ | ২৫ | ০ | ৳৪,৫০০ |\n| বৃহঃ | ৩৮ | ১২ | ৮ | ৳৫,৫০০ |\n| শুক্র | ৪৪ | ৬ | ১৪ | ৳৬,০০০ |\n\n- গ্রুপ রুম আয় = ২০ × ৩ × ৪,০০০ = ৳২,৪০,০০০\n- গ্রুপ অতিরিক্ত আয় (মিটিং রুম, F&B, লাভ অংশ ধরে) ≈ ৳৮০,০০০\n- displaced আয় = ৮×৫,৫০০ + ১৪×৬,০০০ = ৪৪,০০০ + ৮৪,০০০ = ৳১,২৮,০০০\n- **নিট লাভ** = ২,৪০,০০০ + ৮০,০০০ − ১,২৮,০০০ = **৳১,৯২,০০০ → নাও** (অথবা শুক্রবারে রুম কমাতে/রেট বাড়াতে দরকষাকষি)\n\nআরও ধরো: wash (গ্রুপ সব রুম না-ও নিতে পারে), কমিশন, transient গেস্টের অন্য খরচ, অতিরিক্ত রাতে (shoulder) প্রভাব।\n**PMS ফিচার:** group quote স্ক্রিনে displacement ক্যালকুলেটর — forecast টেবিল থেকে অটো।\n\n---\n\n## ১০. Comp set, rate shopping ও parity\n\n- **Comp set:** ৪–৬টি সরাসরি প্রতিযোগী হোটেল (একই এলাকা, মান, সেগমেন্ট)\n- **Rate shopper:** প্রতিদিন তাদের পাবলিক দাম স্ক্যান করে (OTA/মেটাসার্চ থেকে) — ভবিষ্যৎ ৯০–৩৬৫ দিন\n- **Rate parity:** একই রুম/শর্তে সব চ্যানেলে একই দাম। ভাঙলে OTA র‍্যাঙ্কিং কমাতে পারে; কিছু দেশে \"wide parity\" ক্লজ আইনে নিষিদ্ধ — চুক্তি দেখো\n- **Benchmark ডেটা:** STR (CoStar)-এর মতো সার্ভিস comp set-এর সমষ্টিগত Occ/ADR/RevPAR দেয় → MPI/ARI/RGI\n- **PMS কী দেবে:** comp রেট ইম্পোর্ট টেবিল `comp_rate(shop_date, stay_date, competitor_id, channel, room_desc, rate, currency)`; নিজের রেটের পাশে দেখানো; parity ভাঙা অ্যালার্ট\n\n---\n\n## ১১. PMS ↔ RMS ইন্টিগ্রেশন\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant RMS\n    participant CM as Channel Manager\n    Note over PMS: প্রতি রাতে night audit-এর পর\n    PMS->>RMS: History (actuals) + OTB by stay date, segment, room type\n    PMS-->>RMS: সারাদিন: নতুন/বদল/বাতিল বুকিং (event বা ঘণ্টায়)\n    RMS->>RMS: Forecast + Optimize\n    RMS->>PMS: Rate/restriction recommendation (stay_date, room_type, rate_plan, price)\n    alt Auto mode\n        PMS->>PMS: রেট আপডেট, অডিট লগ (source = RMS)\n    else Approve mode\n        PMS->>PMS: Revenue manager অনুমোদন করে\n    end\n    PMS->>CM: ARI push\n```\n\n### ১১.১ OTB স্ন্যাপশট টেবিল (pace-এর জন্য অপরিহার্য)\n\n```sql\nCREATE TABLE otb_snapshot (\n  property_id   uuid,\n  snapshot_date date,          -- কোন দিনে তোলা (business date)\n  stay_date     date,          -- কোন রাতের জন্য\n  segment_code  text,\n  room_type_id  uuid,\n  rooms         int,\n  room_revenue  numeric(14,2),\n  PRIMARY KEY (property_id, snapshot_date, stay_date, segment_code, room_type_id)\n);\n\n-- night audit-এ: আগামী ৩৬৫ দিনের OTB সংরক্ষণ\nINSERT INTO otb_snapshot\nSELECT r.property_id, :business_date, rn.stay_date, r.segment_code, rn.room_type_id,\n       count(*), sum(rn.net_room_amount)\nFROM reservation r\nJOIN reservation_night rn ON rn.reservation_id = r.id\nWHERE r.status IN ('confirmed','in_house')\n  AND rn.stay_date BETWEEN :business_date AND :business_date + 365\nGROUP BY 1,2,3,4,5;\n\n-- pickup: গত ৭ দিনে কোন রাত কত বাড়ল\nSELECT t.stay_date, sum(t.rooms) - coalesce(sum(p.rooms),0) AS pickup_7d\nFROM otb_snapshot t\nLEFT JOIN otb_snapshot p\n  ON p.property_id=t.property_id AND p.stay_date=t.stay_date\n AND p.segment_code=t.segment_code AND p.room_type_id=t.room_type_id\n AND p.snapshot_date = t.snapshot_date - 7\nWHERE t.snapshot_date = :business_date\nGROUP BY t.stay_date ORDER BY t.stay_date;\n```\n> স্ন্যাপশট পরে \"আবার বানানো\" যায় না (বাতিল হওয়া বুকিং কখন বাতিল হয়েছিল ইত্যাদি হারায়) — **প্রথম দিন থেকেই রাখো।**\n\n### ১১.২ মার্কেট সেগমেন্ট কোড\nপ্রতিটি বুকিং-এ `segment_code` বাধ্যতামূলক: যেমন `TRN-RACK`, `TRN-OTA`, `TRN-DIRECT`, `CORP-NEG`, `GRP-MICE`, `GRP-TOUR`, `GOV`, `COMP`। এটা ছাড়া RM অন্ধ।\n\n---\n\n## ১২. Total Revenue Management (শুধু রুম নয়)\n\n| কেন্দ্র | মেট্রিক |\n|---|---|\n| রেস্টুরেন্ট | **RevPASH** = আয় ÷ (আসন × খোলা ঘণ্টা) |\n| মিটিং/ইভেন্ট স্পেস | **RevPASM** বা প্রতি বর্গফুট/মিটার আয়; দিনের স্লট |\n| স্পা | প্রতি ট্রিটমেন্ট-রুম-ঘণ্টা আয় |\n| পার্কিং, লন্ড্রি | ব্যবহারের হার |\n\nগ্রুপ সিদ্ধান্তে F&B ও স্পেস আয় যোগ করো (ডক ০৪ §১৯ ইভেন্ট বুকিং)।\n\n---\n\n## ১৩. নৈতিকতা, ন্যায্যতা ও আইন\n- দুর্যোগ/জরুরি অবস্থায় অতিরিক্ত দাম (price gouging) — অনেক দেশে নিষিদ্ধ, সুনামের বড় ক্ষতি\n- গেস্ট \"অন্যায্য\" মনে করলে (একই রুম পাশের জন ঘণ্টাখানেক আগে অর্ধেক দামে পেল) — rate fence স্পষ্ট রাখো\n- ব্যক্তিগত ডেটা দিয়ে আলাদা দাম (personalized pricing) — গোপনীয়তা আইন ও বৈষম্যের ঝুঁকি\n- প্রতিযোগীর সাথে দাম সমন্বয় (price fixing) — প্রতিযোগিতা আইনে অপরাধ; rate shopping পাবলিক দাম দেখা, আলোচনা নয়\n\n---\n\n## ১৪. বাংলাদেশ প্রেক্ষিত\n- **সিজন:** কক্সবাজার/সিলেট শীত মৌসুম ও লম্বা ছুটি পিক; ঈদের ছুটিতে লেজার গন্তব্যে চাহিদা বাড়ে, ঢাকার বিজনেস হোটেলে কমতে পারে\n- **ঢাকা কর্পোরেট:** রবি–বৃহস্পতি উইকডে বেশি, শুক্র–শনি কম → উইকএন্ড প্যাকেজ\n- **কম ডেটা:** অনেক ছোট হোটেলে ইতিহাস নেই → সহজ নিয়ম (tiered BAR + ইভেন্ট ক্যালেন্ডার) দিয়ে শুরু, ৬–১২ মাস স্ন্যাপশট জমলে pickup মডেল\n- **OTA নির্ভরতা:** NetRevPAR দেখো — কমিশন বাদে আসল আয়\n- **সরকারি/NGO চুক্তি রেট:** আলাদা segment কোড দাও\n\n---\n\n## ১৫. পিটফল ও এজ কেস\n- [ ] segment কোড ঐচ্ছিক রাখা → বিশ্লেষণ অসম্ভব\n- [ ] OTB স্ন্যাপশট না রাখা → pace/pickup নেই\n- [ ] denials ট্র্যাক না করা → চাহিদা কম মনে হওয়া (spiral down)\n- [ ] RMS রেট push-এ লুপ (PMS রেট বদল → RMS-কে event → আবার recommendation)\n- [ ] টাইমজোন: stay date হোটেলের লোকাল তারিখ, UTC নয়\n- [ ] group block-এর অবিক্রিত রুম OTB-তে কীভাবে গোনা হবে (blocked বনাম picked-up) — সংজ্ঞা লিখে রাখো\n- [ ] প্যাকেজ রেট থেকে রুম অংশ আলাদা না করলে ADR ফুলে যায় (ডক ২২ §৬)\n- [ ] Comp রেট তুলনায় ট্যাক্স inclusive/exclusive মিল না করা\n- [ ] দাম বদলের অডিট না রাখা (কে/কোন সিস্টেম বদলাল)\n", "title_en": "20 — Revenue Management in Depth", "md_en": "# 20 — Revenue Management in Depth\n\n> Goal: the next step after doc 06 (rates) and doc 15 (reports) — the maths of demand forecasting, pricing, inventory control, overbooking and group decisions. As a PMS engineer, understand what data the RMS needs and how its decisions come back.\n> Note: formulas and examples are simplified for learning. Production RMSs use more complex models.\n\n---\n\n## 1. What RM is and why it works in hotels\n\n**Revenue Management (RM)** = selling the right room to the right guest at the right time, through the right channel, at the right price — to maximise total revenue (or profit).\n\nRM works in businesses with these conditions:\n\n| Condition | In a hotel |\n|---|---|\n| **Perishable inventory** | Tonight's empty room cannot be sold tomorrow |\n| **Fixed capacity** | Rooms cannot be added overnight |\n| **Advance sales** | Bookings arrive weeks/months ahead |\n| **Segmentable demand** | Corporate, leisure, group, OTA — different price sensitivity |\n| **Fluctuating demand** | Eid, winter, weekends, conferences |\n| **Low marginal cost** | Selling one more room (cleaning, amenities) costs little compared with the price |\n\n---\n\n## 2. The RM cycle\n\n```mermaid\nflowchart LR\n    A[Collect data<br/>OTB, history, competitors] --> B[Analyse<br/>pace, pickup, segment]\n    B --> C[Forecast<br/>demand, cancels, no-shows]\n    C --> D[Optimise<br/>price, restrictions, overbooking]\n    D --> E[Decide<br/>RM team approval]\n    E --> F[Distribute<br/>PMS → CM → OTA/BE]\n    F --> G[Monitor<br/>RevPAR, RGI, errors]\n    G --> A\n```\n\n**The PMS's role:** the data source (A) and the place where decisions are applied (F). The middle is done by people (revenue managers) or RMS software.\n\n---\n\n## 3. Data needed for RM\n\n| Data | Meaning | Where in the PMS |\n|---|---|---|\n| **OTB (On The Books)** | Rooms and revenue sold so far for each future night | `reservation_night` (by stay date) |\n| **Pickup** | How much OTB grew over a period (e.g. the last 7 days) | Difference between daily OTB snapshots |\n| **Pace** | OTB this year vs last year at the same lead time | Historical snapshots |\n| **History (actuals)** | Real occupancy, ADR, segment mix of past days | Final data after night audit |\n| **Cancellation / no-show rates** | By segment and lead time | Reservation status history |\n| **Denials / regrets** | Requested but not available (sold out) / left after seeing the price | BE search logs, phone reservation notes |\n| **Comp set rates** | Competitors' prices | Rate shopper tool |\n| **Event calendar** | Holidays, conferences, sports | Manual/import |\n| **Booking window, LOS** | How far ahead people book, how long they stay | Reservation table |\n\n> **Unconstrained demand:** the bookings that would arrive with no sell-outs or restrictions. We only see *constrained* demand (actual sales) — so without tracking denials, demand looks lower and prices stay low. This is the **\"spiral down\"** problem.\n\n---\n\n## 4. Key metrics (with formulas)\n\n| Metric | Formula | Example (50 rooms, one night) |\n|---|---|---|\n| **Occupancy** | Rooms sold ÷ rooms available | 40 ÷ 50 = 80% |\n| **ADR** | Room revenue ÷ rooms sold | BDT 2,00,000 ÷ 40 = BDT 5,000 |\n| **RevPAR** | Room revenue ÷ rooms available = Occ × ADR | BDT 2,00,000 ÷ 50 = BDT 4,000 |\n| **TRevPAR** | Total revenue (rooms + F&B + other) ÷ rooms available | BDT 3,00,000 ÷ 50 = BDT 6,000 |\n| **NetRevPAR** | (Room revenue − commission − distribution cost) ÷ rooms available | (2,00,000 − 24,000) ÷ 50 = BDT 3,520 |\n| **GOPPAR** | Gross Operating Profit ÷ rooms available | Shows profit, not just revenue |\n| **MPI** (Market Penetration Index) | My Occ ÷ comp set Occ × 100 | 80% ÷ 70% = 114 |\n| **ARI** (Average Rate Index) | My ADR ÷ comp set ADR × 100 | 5,000 ÷ 5,500 = 91 |\n| **RGI** (Revenue Generation Index) | My RevPAR ÷ comp set RevPAR × 100 | 4,000 ÷ 3,850 = 104 |\n\n> Caution: this **ARI (Average Rate Index)** and the channel manager's **ARI (Availability, Rates, Inventory)** are different things with the same abbreviation.\n> RGI above 100 = you earn more than your fair share of the market.\n\n**Other useful numbers:**\n- **Booking window (lead time):** days from booking date to arrival\n- **ALOS:** Average Length of Stay = total room nights ÷ number of bookings\n- **Wash:** the part of a group block that ends up unsold (blocked − picked up)\n- **Cancellation rate:** cancelled ÷ total bookings (keep per segment)\n\n---\n\n## 5. Demand forecasting\n\n### 5.1 Methods (simple to advanced)\n\n| Method | How | Best when |\n|---|---|---|\n| **Same day last year** | Occupancy of the same weekday last year | Very little data |\n| **Moving average** | Average of the same weekday over recent weeks | Stable market |\n| **Additive pickup** | Final = today's OTB + average remaining pickup (historical) | Most common, simple |\n| **Multiplicative pickup** | Final = today's OTB × average ratio (final ÷ OTB) | Grows when OTB is high |\n| **Exponential smoothing / Holt-Winters** | More weight on recent data, trend and season | Good history available |\n| **ML (gradient boosting etc.)** | Features: lead time, weekday, events, comp rates, OTB | Large chains, lots of data |\n\n### 5.2 Additive pickup — worked example\n\nQuestion: how many rooms will finally be sold for the Friday 14 days from now?\n\nHistory of the last 4 Fridays:\n\n| Friday | OTB 14 days before | Final sold | Remaining pickup |\n|---|---|---|---|\n| 1 | 22 | 38 | 16 |\n| 2 | 25 | 42 | 17 |\n| 3 | 18 | 33 | 15 |\n| 4 | 28 | 44 | 16 |\n\nAverage remaining pickup = (16+17+15+16) ÷ 4 = **16**.\nToday's OTB for that Friday = 24 → forecast = 24 + 16 = **40 rooms** (of 50, 80%).\n\n```python\n# Additive pickup forecast — simple learning code\nfrom statistics import mean\n\ndef additive_pickup(history, otb_today):\n    \"\"\"history: [(otb_at_same_lead_time, final_sold), ...]\"\"\"\n    pickups = [final - otb for otb, final in history]\n    return otb_today + mean(pickups)\n\nhistory = [(22, 38), (25, 42), (18, 33), (28, 44)]\nprint(additive_pickup(history, otb_today=24))   # 40.0\n```\n\n### 5.3 Measure the forecast\n- **MAPE** (Mean Absolute Percentage Error) = mean(|forecast − actual| ÷ actual)\n- Measure error separately per lead-time bucket (0–7, 8–30, 31+ days)\n- Store forecast snapshots to compare later\n\n---\n\n## 6. Pricing strategy\n\n### 6.1 Price structures\n- **BAR by day:** a different price each day according to demand\n- **Tiered BAR:** a few fixed steps (BAR1 = BDT 8,000, BAR2 = BDT 7,000 …), switching steps by occupancy\n- **Open/dynamic pricing:** each room type, channel and rate plan independently — no steps\n- **Derived rates:** calculated automatically from BAR (Non-refundable = BAR − 10%; doc 06)\n\n### 6.2 Rate fences\nTo sell the same room at different prices you need \"fences\", so guests willing to pay more do not slip into the cheaper rate:\n\n| Fence | Example |\n|---|---|\n| Advance purchase | 15% off when booked 21 days ahead |\n| Refundability | Non-refundable is cheaper |\n| Length of stay | Discount for 3+ nights |\n| Membership | Loyalty member rate |\n| Channel | Mobile-only rate |\n| Identity | Corporate contract, government rate |\n\n### 6.3 Price elasticity\n- Elasticity = % change in demand ÷ % change in price\n- Example: raise price 10%, bookings fall 5% → elasticity = −0.5 → **inelastic** → raising price increases revenue\n- Weekday corporate demand is usually less sensitive, weekend leisure more\n- Caution: hard to measure precisely in hotels (competitors and events change at the same time)\n\n### 6.4 A simple dynamic pricing rule (good starting point)\n\n```sql\n-- BAR steps by forecast occupancy (example table)\n-- occ_from, occ_to, multiplier\n-- 0.00 – 0.40  → 0.85\n-- 0.40 – 0.70  → 1.00\n-- 0.70 – 0.85  → 1.15\n-- 0.85 – 1.00  → 1.30\nSELECT stay_date,\n       base_rate * m.multiplier AS recommended_bar\nFROM   forecast f\nJOIN   price_ladder m\n  ON   f.forecast_occ >= m.occ_from AND f.forecast_occ < m.occ_to;\n```\nRules: keep a floor and ceiling price; limit how many times a day the price can change; human approval (auto/approve mode).\n\n---\n\n## 7. Inventory control — how many rooms at which price\n\n### 7.1 Concepts\n- **Booking limit:** the maximum rooms sold in a cheaper rate class\n- **Protection level:** rooms reserved for the higher-priced class\n- **Nesting:** the higher class can always take rooms kept for the cheaper class (not the other way round)\n\n### 7.2 Littlewood's rule (two classes)\n\nTwo rates: high `p_H` (books late, e.g. corporate BDT 8,000), low `p_L` (books early, e.g. promo BDT 5,000).\nShould we sell one more room cheaply? — if the probability of later selling it to a high-paying guest × p_H < p_L, sell it.\n\n**Rule:** protect `y` rooms for the high class where\n`P(high demand > y) = p_L ÷ p_H`\n\nExample: p_L ÷ p_H = 5000 ÷ 8000 = 0.625. High demand mean 20, standard deviation 5 (assume normal).\n`P(D > y) = 0.625` → z ≈ −0.32 → y ≈ 20 − 0.32×5 ≈ **18 rooms** protected. In a 50-room hotel the promo booking limit = 50 − 18 = 32.\n\n```python\nfrom statistics import NormalDist\n\ndef littlewood_protect(p_high, p_low, mu, sigma):\n    ratio = p_low / p_high            # P(D_high > y) = ratio\n    return NormalDist(mu, sigma).inv_cdf(1 - ratio)\n\nprint(round(littlewood_protect(8000, 5000, mu=20, sigma=5)))  # 18\n```\n> The generalisation for many classes is **EMSR-b** (Expected Marginal Seat Revenue) — popular in airlines, also used in hotels.\n\n### 7.3 Control through restrictions\n- **MinLOS:** to sell low-demand nights around a peak night (Thursday–Friday–Saturday pattern)\n- **CTA / CTD:** no arrivals/departures on specific days\n- **Stop-sell:** close a channel/rate\n- **Length-of-stay pricing:** the nightly price depends on stay length (complex, supported by few channels)\n\n---\n\n## 8. Overbooking optimisation\n\nProblem: some guests do not show or cancel at the last minute → rooms stay empty. Overbooking reduces empty rooms, but if everyone comes someone must be **walked** (sent elsewhere + cost + reputation damage).\n\n**Cost comparison (critical ratio / newsvendor):**\n- `Cu` = loss from an empty room ≈ lost revenue (ADR minus variable costs)\n- `Co` = walk cost = alternative hotel + transport + compensation + reputation\n- Optimal overbooking `x` where `P(no-shows ≤ x) ≈ Cu ÷ (Cu + Co)`\n\nExample: ADR BDT 5,000 (Cu ≈ 4,500), walk cost BDT 15,000 → ratio = 4500 ÷ 19500 ≈ 0.23.\nHistorical no-shows on similar nights: 0 (20%), 1 (25%), 2 (25%), 3 (15%), 4+ (15%).\nCumulative: P(≤0) = 0.20, P(≤1) = 0.45 → first value above 0.23 = overbook **1 room**.\n\n```python\ndef optimal_overbook(noshow_pmf, cu, co):\n    target, cum = cu / (cu + co), 0.0\n    for x, p in sorted(noshow_pmf.items()):\n        cum += p\n        if cum >= target:\n            return x\n    return max(noshow_pmf)\n\nprint(optimal_overbook({0:.20, 1:.25, 2:.25, 3:.15, 4:.15}, cu=4500, co=15000))  # 1\n```\n\n**PMS engineering:** `overbook_limit` per room type and date; overbook less when there are many non-refundable bookings (they have paid — revenue exists whether or not they come); track walk reports and walk cost.\n\n---\n\n## 9. Group displacement analysis\n\nQuestion: should we accept a 20-room conference group for 3 nights at BDT 4,000?\n\nAccepting the group means some **transient** (regular) guests cannot be accommodated (they are displaced).\n\n| Night | Forecast transient | Free rooms (50 − transient) | Displaced transient if group of 20 | Transient ADR |\n|---|---|---|---|---|\n| Wed | 25 | 25 | 0 | BDT 4,500 |\n| Thu | 38 | 12 | 8 | BDT 5,500 |\n| Fri | 44 | 6 | 14 | BDT 6,000 |\n\n- Group room revenue = 20 × 3 × 4,000 = BDT 2,40,000\n- Extra group revenue (meeting room, F&B, counting the profit share) ≈ BDT 80,000\n- Displaced revenue = 8×5,500 + 14×6,000 = 44,000 + 84,000 = BDT 1,28,000\n- **Net gain** = 2,40,000 + 80,000 − 1,28,000 = **BDT 1,92,000 → accept** (or negotiate fewer rooms/higher rate on Friday)\n\nAlso consider: wash (the group may not take all rooms), commission, transient guests' other spending, impact on shoulder nights.\n**PMS feature:** a displacement calculator on the group quote screen — automatic from the forecast table.\n\n---\n\n## 10. Comp set, rate shopping and parity\n\n- **Comp set:** 4–6 direct competitors (same area, quality, segment)\n- **Rate shopper:** scans their public prices every day (from OTAs/metasearch) — 90–365 days ahead\n- **Rate parity:** the same price on all channels for the same room/conditions. Breaking it may lower OTA ranking; some countries ban \"wide parity\" clauses — check the contract\n- **Benchmark data:** services such as STR (CoStar) give aggregated comp set Occ/ADR/RevPAR → MPI/ARI/RGI\n- **What the PMS provides:** a comp rate import table `comp_rate(shop_date, stay_date, competitor_id, channel, room_desc, rate, currency)`; shown next to your own rates; parity-break alerts\n\n---\n\n## 11. PMS ↔ RMS integration\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant RMS\n    participant CM as Channel Manager\n    Note over PMS: every night after night audit\n    PMS->>RMS: History (actuals) + OTB by stay date, segment, room type\n    PMS-->>RMS: during the day: new/changed/cancelled bookings (events or hourly)\n    RMS->>RMS: Forecast + Optimize\n    RMS->>PMS: Rate/restriction recommendation (stay_date, room_type, rate_plan, price)\n    alt Auto mode\n        PMS->>PMS: update rates, audit log (source = RMS)\n    else Approve mode\n        PMS->>PMS: revenue manager approves\n    end\n    PMS->>CM: ARI push\n```\n\n### 11.1 OTB snapshot table (essential for pace)\n\n```sql\nCREATE TABLE otb_snapshot (\n  property_id   uuid,\n  snapshot_date date,          -- day the snapshot was taken (business date)\n  stay_date     date,          -- night it refers to\n  segment_code  text,\n  room_type_id  uuid,\n  rooms         int,\n  room_revenue  numeric(14,2),\n  PRIMARY KEY (property_id, snapshot_date, stay_date, segment_code, room_type_id)\n);\n\n-- in night audit: store OTB for the next 365 days\nINSERT INTO otb_snapshot\nSELECT r.property_id, :business_date, rn.stay_date, r.segment_code, rn.room_type_id,\n       count(*), sum(rn.net_room_amount)\nFROM reservation r\nJOIN reservation_night rn ON rn.reservation_id = r.id\nWHERE r.status IN ('confirmed','in_house')\n  AND rn.stay_date BETWEEN :business_date AND :business_date + 365\nGROUP BY 1,2,3,4,5;\n\n-- pickup: how much each night grew in the last 7 days\nSELECT t.stay_date, sum(t.rooms) - coalesce(sum(p.rooms),0) AS pickup_7d\nFROM otb_snapshot t\nLEFT JOIN otb_snapshot p\n  ON p.property_id=t.property_id AND p.stay_date=t.stay_date\n AND p.segment_code=t.segment_code AND p.room_type_id=t.room_type_id\n AND p.snapshot_date = t.snapshot_date - 7\nWHERE t.snapshot_date = :business_date\nGROUP BY t.stay_date ORDER BY t.stay_date;\n```\n> Snapshots cannot be \"rebuilt\" later (you lose when cancelled bookings were cancelled, etc.) — **keep them from day one.**\n\n### 11.2 Market segment codes\n`segment_code` is mandatory on every booking: e.g. `TRN-RACK`, `TRN-OTA`, `TRN-DIRECT`, `CORP-NEG`, `GRP-MICE`, `GRP-TOUR`, `GOV`, `COMP`. Without it RM is blind.\n\n---\n\n## 12. Total revenue management (not just rooms)\n\n| Area | Metric |\n|---|---|\n| Restaurant | **RevPASH** = revenue ÷ (seats × open hours) |\n| Meeting/event space | **RevPASM** or revenue per square foot/metre; daily slots |\n| Spa | Revenue per treatment-room hour |\n| Parking, laundry | Utilisation rate |\n\nInclude F&B and space revenue in group decisions (doc 04 §19 events).\n\n---\n\n## 13. Ethics, fairness and law\n- Excessive prices during disasters/emergencies (price gouging) — illegal in many countries, big reputational damage\n- Guests feeling it is \"unfair\" (the neighbour got the same room for half the price an hour earlier) — keep rate fences clear\n- Different prices from personal data (personalised pricing) — privacy law and discrimination risks\n- Coordinating prices with competitors (price fixing) — a crime under competition law; rate shopping means looking at public prices, not talking to competitors\n\n---\n\n## 14. Bangladesh context\n- **Seasons:** Cox's Bazar/Sylhet winter season and long holidays are peaks; Eid holidays raise demand at leisure destinations but may lower it in Dhaka business hotels\n- **Dhaka corporate:** Sunday–Thursday weekdays are strong, Friday–Saturday weak → weekend packages\n- **Little data:** many small hotels have no history → start with simple rules (tiered BAR + event calendar), move to pickup models after 6–12 months of snapshots\n- **OTA dependence:** watch NetRevPAR — real revenue after commission\n- **Government/NGO contract rates:** give them their own segment code\n\n---\n\n## 15. Pitfalls and edge cases\n- [ ] Optional segment codes → analysis impossible\n- [ ] No OTB snapshots → no pace/pickup\n- [ ] Denials not tracked → demand looks lower (spiral down)\n- [ ] Loops in RMS rate push (PMS rate change → event to RMS → new recommendation)\n- [ ] Time zone: stay date is the hotel's local date, not UTC\n- [ ] How unsold group block rooms count in OTB (blocked vs picked up) — write down the definition\n- [ ] Not separating the room part of package rates inflates ADR (doc 22 §6)\n- [ ] Comparing comp rates without matching tax inclusive/exclusive\n- [ ] No audit of price changes (who/which system changed it)\n"}, "21": {"n": 21, "title": "২১ — গেস্ট এক্সপেরিয়েন্স টেক (Online Check-in, Kiosk, Digital Key, Messaging, Upsell)", "md": "# ২১ — গেস্ট এক্সপেরিয়েন্স টেক (Online Check-in, Kiosk, Digital Key, Messaging, Upsell)\n\n> লক্ষ্য: আধুনিক PMS-এর \"গেস্ট-মুখী\" অংশ — গেস্ট নিজে কী করতে পারে, কীভাবে PMS-এর সাথে যুক্ত, কোথায় নিরাপত্তা ঝুঁকি।\n> আগের ডক: ০৩ (ফ্রন্ট অফিস), ০৭ (গেস্ট ও CRM), ১১ (ইন্টিগ্রেশন)।\n\n---\n\n## ১. গেস্ট জার্নির টাচপয়েন্ট\n\n```mermaid\nflowchart LR\n    A[খোঁজা ও বুকিং<br/>BE, OTA, মেটাসার্চ] --> B[বুকিং কনফার্মেশন<br/>ইমেইল, SMS, WhatsApp]\n    B --> C[আগমনের আগে<br/>অনলাইন check-in, আপসেল]\n    C --> D[আগমন<br/>ডেস্ক, কিওস্ক, মোবাইল কী]\n    D --> E[থাকাকালীন<br/>রিকোয়েস্ট, রুম সার্ভিস, চ্যাট]\n    E --> F[প্রস্থান<br/>এক্সপ্রেস check-out, ই-ইনভয়েস]\n    F --> G[পরে<br/>সার্ভে, রিভিউ, লয়্যালটি]\n    G --> A\n```\n\nপ্রতিটি ধাপে PMS **ইভেন্ট** তৈরি করে (`reservation.confirmed`, `stay.checked_in` …), আর গেস্ট-অ্যাপ/মেসেজিং সেই ইভেন্ট শুনে কাজ করে (ডক ১১ webhook/outbox)।\n\n---\n\n## ২. অনলাইন (প্রি-অ্যারাইভাল) check-in\n\n### মানে\nআগমনের ১–৩ দিন আগে গেস্ট একটি লিংকে গিয়ে ফর্ম পূরণ করে: পরিচয়, ডকুমেন্ট, আগমনের সময় (ETA), পছন্দ, পেমেন্ট। ডেস্কে শুধু চাবি নেওয়া বা সরাসরি রুমে যাওয়া।\n\n### কেন\n- ডেস্কে লাইন কমে, স্টাফ সময় বাঁচে\n- ডেটা আগেই সঠিক (টাইপ ভুল কম)\n- আপসেলের সুযোগ (ভালো রুম, early check-in)\n- ডিপোজিট/প্রি-অথ আগেই\n\n### ফ্লো\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant MSG as Messaging\n    participant G as Guest (Web)\n    participant PAY as Payment Gateway\n    PMS->>MSG: arrival - 2 days: send pre-checkin link\n    MSG->>G: SMS/Email/WhatsApp (signed link)\n    G->>PMS: GET /guest/checkin/{token}\n    G->>PMS: নাম, ফোন, জাতীয়তা, ID নম্বর, ETA\n    G->>PMS: ID/পাসপোর্ট ছবি আপলোড (এনক্রিপ্টেড স্টোরেজ)\n    G->>PAY: কার্ড/MFS pre-auth বা ডিপোজিট\n    PAY-->>PMS: webhook: authorized\n    G->>PMS: রেজিস্ট্রেশন কার্ডে ই-স্বাক্ষর\n    PMS->>PMS: reservation.precheckin_status = completed\n    Note over PMS: আগমনের দিনে রুম রেডি হলে \"রুম রেডি\" মেসেজ + কী\n```\n\n### নিয়ম ও ডিজাইন\n- লিংক = **signed token** (reservation_id + মেয়াদ + HMAC), অনুমানযোগ্য ID নয়; একবার সম্পন্ন হলে শুধু-পড়া\n- ডকুমেন্ট ছবি: আলাদা private bucket, ছোট মেয়াদের signed URL, অ্যাক্সেস লগ (ডক ১৪)\n- আইনি প্রয়োজন হলে (যেমন বিদেশি গেস্টের পাসপোর্ট/ভিসা) **ডেস্কে আসল ডকুমেন্ট যাচাই** স্ট্যাটাস আলাদা রাখো: `id_verified_by`, `id_verified_at`\n- একাধিক গেস্ট (রুমে ২ জন) — প্রত্যেকের তথ্য লাগলে `stay_guest` টেবিলে\n- অসম্পূর্ণ ফর্ম রিমাইন্ডার, কিন্তু সীমিত (স্প্যাম নয়)\n\n### API\n```\nGET  /v1/guest-portal/checkin/{token}\nPUT  /v1/guest-portal/checkin/{token}/details\nPOST /v1/guest-portal/checkin/{token}/documents      (multipart)\nPOST /v1/guest-portal/checkin/{token}/payment-intent\nPOST /v1/guest-portal/checkin/{token}/complete\n```\n\n---\n\n## ৩. কিওস্ক check-in\n\n### উপাদান\n| হার্ডওয়্যার | কাজ |\n|---|---|\n| টাচ স্ক্রিন | বুকিং খোঁজা (কনফার্মেশন নম্বর/QR/নাম) |\n| পাসপোর্ট/ID স্ক্যানার | MRZ/OCR পড়া |\n| পেমেন্ট টার্মিনাল | কার্ড/ট্যাপ (PCI P2PE সহ টার্মিনাল) |\n| কী-কার্ড এনকোডার/ডিসপেন্সার | ডোর লক সিস্টেম থেকে কার্ড বানানো |\n| প্রিন্টার | রেজিস্ট্রেশন কার্ড/রসিদ |\n\n### ফ্লো\n১. বুকিং খোঁজা → ২. পরিচয় স্ক্যান ও মিলানো → ৩. রুম অ্যাসাইন (শুধু Clean/Inspected রুম) → ৪. পেমেন্ট/প্রি-অথ → ৫. কী এনকোড → ৬. check-in সম্পন্ন → ৭. ব্যতিক্রম হলে \"ডেস্কে যান\"\n\n### এজ কেস\n- রুম রেডি নেই → অপেক্ষা তালিকা + \"রেডি হলে SMS\"\n- গ্রুপ/ভিআইপি/বিশেষ নোট থাকা বুকিং → কিওস্কে বন্ধ, ডেস্কে পাঠাও\n- কার্ড ডিসপেন্সার খালি/জ্যাম → অ্যালার্ট\n- নাবালক/একাধিক গেস্ট/বিদেশি গেস্ট নিয়ম\n- নেটওয়ার্ক বিচ্ছিন্ন → কিওস্ক নিষ্ক্রিয় (offline-এ চাবি দেওয়া ঝুঁকিপূর্ণ)\n\n> মানদণ্ড: HTNG একটি **Kiosk Integration** স্পেসিফিকেশন প্রকাশ করেছে (ডক ২৮ রিসোর্স দেখো)।\n\n---\n\n## ৪. মোবাইল / ডিজিটাল কী\n\n### প্রযুক্তি\n- **BLE (Bluetooth Low Energy):** ফোন অ্যাপ লকের সাথে কথা বলে\n- **NFC:** ফোন/ঘড়ি ট্যাপ (কিছু প্ল্যাটফর্মে ওয়ালেটে হোটেল কী)\n- লক ভেন্ডরের ক্লাউড/SDK — PMS সরাসরি লক খোলে না, **ক্রেডেনশিয়াল ইস্যু** করতে বলে\n\n### জীবনচক্র\n\n```mermaid\nstateDiagram-v2\n    [*] --> Requested: check-in সম্পন্ন\n    Requested --> Issued: lock vendor API ok\n    Issued --> Active: valid_from পৌঁছাল\n    Active --> Revoked: check-out / room move / ফোন হারানো\n    Active --> Expired: valid_to পার\n    Revoked --> [*]\n    Expired --> [*]\n```\n\n### নিয়ম\n- কী-এর মেয়াদ = stay-এর আগমন থেকে প্রস্থান সময় (+ late check-out হলে বাড়াও)\n- **Room move** → পুরোনো রুমের কী বাতিল আগে, নতুন রুমের কী পরে\n- **Check-out** → সব কী বাতিল (ফিজিক্যাল কার্ডের মেয়াদও শেষ)\n- শেয়ার্ড কী (দ্বিতীয় গেস্ট) — শুধু নিবন্ধিত গেস্টকে\n- টেবিল: `digital_key(id, stay_id, room_id, guest_id, vendor_ref, valid_from, valid_to, status, issued_by, revoked_reason)`\n- ব্যর্থ হলে বিকল্প: ফিজিক্যাল কার্ড\n\n---\n\n## ৫. গেস্ট মেসেজিং ও অটোমেশন\n\n### চ্যানেল\nSMS, ইমেইল, WhatsApp Business, অ্যাপ পুশ, OTA মেসেজিং (Booking.com-এর মতো প্ল্যাটফর্মের নিজস্ব মেসেজিং API)\n\n### ট্রিগার-ভিত্তিক অটোমেশন\n\n| ট্রিগার (PMS ইভেন্ট) | সময় | মেসেজ |\n|---|---|---|\n| `reservation.confirmed` | সাথে সাথে | কনফার্মেশন, পেমেন্ট লিংক |\n| আগমন − ৩ দিন | সকাল ১০টা (হোটেল টাইমজোন) | প্রি-check-in লিংক, আপসেল |\n| আগমন − ১ দিন | বিকেল | দিকনির্দেশ, পার্কিং, ETA জিজ্ঞাসা |\n| `room.status = inspected` (অ্যাসাইন করা রুম) | তাৎক্ষণিক | \"রুম রেডি\", ডিজিটাল কী |\n| `stay.checked_in` + ১ দিন | সকাল | \"সব ঠিক আছে?\" (সমস্যা আগেই ধরতে) |\n| প্রস্থান দিন সকাল | ৭টা | এক্সপ্রেস check-out লিংক, late check-out অফার |\n| `stay.checked_out` + ১ দিন | — | ধন্যবাদ, সার্ভে, ই-ইনভয়েস |\n\n### ডিজাইন\n- টেমপ্লেট: ভাষা (বাংলা/ইংরেজি), চ্যানেল, ভেরিয়েবল (`{{guest.first_name}}`, `{{stay.arrival_date}}`)\n- **Opt-in / opt-out** রেকর্ড; মার্কেটিং বনাম লেনদেন-সংক্রান্ত মেসেজ আলাদা\n- **নীরব সময় (quiet hours)** — রাতে না পাঠানো\n- Unified inbox: গেস্টের সব চ্যানেলের কথোপকথন এক থ্রেডে, রিজার্ভেশনের সাথে লিংক\n- ডুপ্লিকেট রোধ: `message_log` এ (template_id, reservation_id, trigger_key) ইউনিক\n- WhatsApp Business-এ প্রথম বার্তা অনুমোদিত টেমপ্লেট দিয়ে (ডক ১৬)\n\n```\nmessage_template(id, property_id, code, channel, lang, subject, body, active)\nautomation_rule(id, property_id, trigger_event, offset_minutes, conditions jsonb, template_id)\nmessage_log(id, reservation_id, guest_id, channel, template_id, trigger_key,\n            status[queued|sent|delivered|failed|read], provider_ref, sent_at)\n```\n\n---\n\n## ৬. আপসেল ও অ্যানসিলারি বিক্রি\n\n| অফার | কখন | নিয়ম |\n|---|---|---|\n| রুম আপগ্রেড | প্রি-অ্যারাইভাল, কিওস্ক | উচ্চ টাইপে availability থাকতে হবে; দাম = পার্থক্য × রাত (বা ডাইনামিক) |\n| Early check-in / Late check-out | আগমন/প্রস্থানের আগে | HK সক্ষমতা ও পরের/আগের বুকিং দেখে |\n| নাস্তা, এয়ারপোর্ট পিকআপ, স্পা | যেকোনো সময় | সময়স্লট ইনভেন্টরি (ডক ০৫ §১৮ রিসোর্স) |\n| বিশেষ উপলক্ষ প্যাকেজ (কেক, ফুল) | প্রি-অ্যারাইভাল | অপারেশন টাস্ক তৈরি |\n\n- আপসেল কেনা = ফোলিওতে চার্জ (নির্দিষ্ট transaction code) + অপারেশন টাস্ক\n- আপগ্রেড কনফার্ম হলে **ইনভেন্টরি সাথে সাথে বদলাও** (একই ট্রানজ্যাকশনে)\n- \"অনুরোধ\" বনাম \"নিশ্চিত\" — early check-in অনেক সময় অনুরোধ, আগমনের দিনে নিশ্চিত\n\n### Attribute-Based Selling (ABS) — ভবিষ্যতের দিক\nরুম টাইপের বদলে বৈশিষ্ট্য বেচা: \"উঁচু ফ্লোর\", \"সাগর দেখা যায়\", \"বাথটাব\", \"লিফটের কাছে নয়\"। PMS-এ রুমের অ্যাট্রিবিউট টেবিল ও অ্যাট্রিবিউট ইনভেন্টরি লাগে (ডক ২৬ §৬)।\n\n---\n\n## ৭. থাকাকালীন সেবা\n- **সার্ভিস রিকোয়েস্ট:** তোয়ালে, মেরামত, wake-up call → HK/maintenance টাস্ক (ডক ০৮), SLA টাইমার\n- **ডিজিটাল কম্পেন্ডিয়াম:** হোটেলের তথ্য, Wi-Fi, মেনু (QR)\n- **রুম সার্ভিস অর্ডার:** গেস্ট অ্যাপ → POS → ফোলিওতে পোস্ট (ডক ০৯ §৯)\n- **চ্যাট:** মানুষ + বট (ডক ২৬)\n- **DND (Do Not Disturb)** ও গোপনীয়তা\n\n---\n\n## ৮. এক্সপ্রেস check-out\n১. প্রস্থান দিন সকালে লিংক → ২. ফোলিও প্রিভিউ (শেষ রাতের চার্জ সহ) → ৩. বিবাদ থাকলে \"ডেস্কে যোগাযোগ\" → ৪. সেভ করা কার্ড/পেমেন্ট লিংক দিয়ে পরিশোধ → ৫. ই-ইনভয়েস (VAT তথ্যসহ) → ৬. ডিজিটাল কী বাতিল → ৭. HK-কে \"vacant dirty\" সংকেত।\n\nএজ কেস: মিনিবার/দেরিতে আসা POS চার্জ (late charge — ডক ০৯), গ্রুপ মাস্টার ফোলিও রাউটিং, কোম্পানি বিল (city ledger)।\n\n---\n\n## ৯. রেপুটেশন ম্যানেজমেন্ট\n- check-out-এর পর সার্ভে (NPS: \"০–১০, কতটা সুপারিশ করবেন?\")\n- কম স্কোর → ম্যানেজারকে অ্যালার্ট, সার্ভিস রিকভারি\n- বেশি স্কোর → পাবলিক রিভিউ লিখতে আমন্ত্রণ\n- OTA/Google রিভিউ একত্রে দেখা, উত্তর দেওয়ার ওয়ার্কফ্লো\n- রিভিউ থেকে থিম (পরিচ্ছন্নতা, স্টাফ, Wi-Fi) → অপারেশন উন্নতি\n- মেট্রিক: গড় রেটিং, রিভিউ সংখ্যা, উত্তর দেওয়ার হার ও সময়\n\n---\n\n## ১০. অ্যাক্সেসিবিলিটি ও ভাষা\n- গেস্ট পোর্টাল মোবাইল-প্রথম, বড় বাটন, স্ক্রিন রিডার লেবেল\n- বাংলা/ইংরেজি; বিদেশি গেস্টের জন্য আরও ভাষা টেমপ্লেট\n- প্রতিবন্ধী-বান্ধব রুম অ্যাট্রিবিউট ও অনুরোধ ফিল্ড\n\n---\n\n## ১১. ডেটা মডেল (সংযোজন)\n\n```sql\nCREATE TABLE guest_portal_token (\n  token_hash   text PRIMARY KEY,\n  reservation_id uuid NOT NULL,\n  purpose      text NOT NULL,          -- precheckin | checkout | survey\n  expires_at   timestamptz NOT NULL,\n  used_at      timestamptz\n);\n\nCREATE TABLE upsell_offer (\n  id uuid PRIMARY KEY, property_id uuid, code text, kind text,   -- upgrade | addon | early_ci | late_co\n  price_rule jsonb, inventory_ref text, active boolean\n);\n\nCREATE TABLE upsell_order (\n  id uuid PRIMARY KEY, reservation_id uuid, offer_id uuid,\n  status text,                         -- requested | confirmed | declined | fulfilled\n  amount numeric(12,2), folio_line_id uuid, created_at timestamptz\n);\n\nCREATE TABLE kiosk_session (\n  id uuid PRIMARY KEY, kiosk_id text, reservation_id uuid,\n  steps jsonb, outcome text, started_at timestamptz, ended_at timestamptz\n);\n```\n\n---\n\n## ১২. বাংলাদেশ প্রেক্ষিত\n- WhatsApp সবচেয়ে কার্যকর চ্যানেল; SMS ব্যাকআপ (বাংলা Unicode SMS ছোট — খরচ বেশি)\n- পেমেন্ট লিংকে bKash/SSLCommerz (ডক ০৯)\n- NID/পাসপোর্ট ছবি আপলোডে গোপনীয়তা: শুধু দরকারি স্টাফ দেখবে, মেয়াদ শেষে মুছে ফেলার নীতি (আইনি রিটেনশন মেনে)\n- কিওস্ক/ডিজিটাল কী এখনও মূলত উচ্চ-স্তরের হোটেলে; ছোট হোটেলে **অনলাইন check-in + WhatsApp** বেশি বাস্তবসম্মত শুরু\n\n---\n\n## ১৩. পিটফল\n- [ ] অনুমানযোগ্য লিংক (`/checkin/12345`) → অন্যের ডেটা দেখা (IDOR)\n- [ ] রুম move-এ পুরোনো ডিজিটাল কী সক্রিয় থাকা\n- [ ] অটোমেশন ডুপ্লিকেট মেসেজ (retry-তে আবার পাঠানো)\n- [ ] টাইমজোন ভুলে রাত ৩টায় মেসেজ\n- [ ] আপসেল কনফার্ম কিন্তু ইনভেন্টরি না কমানো → ওভারসেল\n- [ ] কিওস্ক dirty রুম অ্যাসাইন করা\n- [ ] ই-ইনভয়েসে VAT/BIN তথ্য না থাকা\n- [ ] opt-out মানা না হওয়া\n", "title_en": "21 — Guest Experience Tech (Online Check-in, Kiosk, Digital Key, Messaging, Upsell)", "md_en": "# 21 — Guest Experience Tech (Online Check-in, Kiosk, Digital Key, Messaging, Upsell)\n\n> Goal: the \"guest-facing\" side of a modern PMS — what guests can do themselves, how it connects to the PMS and where the security risks are.\n> Earlier docs: 03 (front office), 07 (guests and CRM), 11 (integrations).\n\n---\n\n## 1. Guest journey touchpoints\n\n```mermaid\nflowchart LR\n    A[Search & book<br/>BE, OTA, metasearch] --> B[Booking confirmation<br/>email, SMS, WhatsApp]\n    B --> C[Pre-arrival<br/>online check-in, upsell]\n    C --> D[Arrival<br/>desk, kiosk, mobile key]\n    D --> E[In-stay<br/>requests, room service, chat]\n    E --> F[Departure<br/>express check-out, e-invoice]\n    F --> G[After<br/>survey, review, loyalty]\n    G --> A\n```\n\nAt each step the PMS emits **events** (`reservation.confirmed`, `stay.checked_in` …), and the guest app/messaging listens and acts (doc 11 webhooks/outbox).\n\n---\n\n## 2. Online (pre-arrival) check-in\n\n### Meaning\n1–3 days before arrival the guest opens a link and fills in a form: identity, documents, arrival time (ETA), preferences, payment. At the desk they only collect the key, or go straight to the room.\n\n### Why\n- Shorter queues at the desk, staff time saved\n- Data correct in advance (fewer typing mistakes)\n- Upsell opportunities (better room, early check-in)\n- Deposit/pre-auth done in advance\n\n### Flow\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant MSG as Messaging\n    participant G as Guest (Web)\n    participant PAY as Payment Gateway\n    PMS->>MSG: arrival - 2 days: send pre-checkin link\n    MSG->>G: SMS/Email/WhatsApp (signed link)\n    G->>PMS: GET /guest/checkin/{token}\n    G->>PMS: name, phone, nationality, ID number, ETA\n    G->>PMS: upload ID/passport photo (encrypted storage)\n    G->>PAY: card/MFS pre-auth or deposit\n    PAY-->>PMS: webhook: authorized\n    G->>PMS: e-signature on registration card\n    PMS->>PMS: reservation.precheckin_status = completed\n    Note over PMS: on arrival day, when the room is ready: \"room ready\" message + key\n```\n\n### Rules and design\n- Link = **signed token** (reservation_id + expiry + HMAC), not a guessable ID; read-only once completed\n- Document photos: a separate private bucket, short-lived signed URLs, access log (doc 14)\n- Where the law requires it (e.g. foreign guests' passport/visa), keep a separate **original document verified at the desk** status: `id_verified_by`, `id_verified_at`\n- Several guests (2 in a room) — if each needs details, use a `stay_guest` table\n- Reminders for incomplete forms, but limited (no spam)\n\n### API\n```\nGET  /v1/guest-portal/checkin/{token}\nPUT  /v1/guest-portal/checkin/{token}/details\nPOST /v1/guest-portal/checkin/{token}/documents      (multipart)\nPOST /v1/guest-portal/checkin/{token}/payment-intent\nPOST /v1/guest-portal/checkin/{token}/complete\n```\n\n---\n\n## 3. Kiosk check-in\n\n### Components\n| Hardware | Job |\n|---|---|\n| Touch screen | Find the booking (confirmation number/QR/name) |\n| Passport/ID scanner | Read MRZ/OCR |\n| Payment terminal | Card/tap (PCI P2PE terminal) |\n| Key card encoder/dispenser | Create cards from the door lock system |\n| Printer | Registration card/receipt |\n\n### Flow\n1. Find booking → 2. scan and match identity → 3. assign room (Clean/Inspected only) → 4. payment/pre-auth → 5. encode key → 6. check-in complete → 7. on exceptions: \"please go to the desk\"\n\n### Edge cases\n- Room not ready → waiting list + \"SMS when ready\"\n- Group/VIP/special-note bookings → blocked at the kiosk, sent to the desk\n- Card dispenser empty/jammed → alert\n- Minors / multiple guests / foreign guest rules\n- Network down → kiosk disabled (issuing keys offline is risky)\n\n> Standard: HTNG has published a **Kiosk Integration** specification (see doc 28 resources).\n\n---\n\n## 4. Mobile / digital key\n\n### Technology\n- **BLE (Bluetooth Low Energy):** the phone app talks to the lock\n- **NFC:** tap a phone/watch (some platforms support hotel keys in the wallet)\n- The lock vendor's cloud/SDK — the PMS never opens locks directly; it asks for a **credential to be issued**\n\n### Lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Requested: check-in completed\n    Requested --> Issued: lock vendor API ok\n    Issued --> Active: valid_from reached\n    Active --> Revoked: check-out / room move / lost phone\n    Active --> Expired: valid_to passed\n    Revoked --> [*]\n    Expired --> [*]\n```\n\n### Rules\n- Key validity = stay arrival to departure time (+ extend for late check-out)\n- **Room move** → revoke the old room's key first, then issue the new one\n- **Check-out** → revoke all keys (physical cards expire too)\n- Shared keys (second guest) — only to registered guests\n- Table: `digital_key(id, stay_id, room_id, guest_id, vendor_ref, valid_from, valid_to, status, issued_by, revoked_reason)`\n- Fallback on failure: physical card\n\n---\n\n## 5. Guest messaging and automation\n\n### Channels\nSMS, email, WhatsApp Business, app push, OTA messaging (platform messaging APIs such as Booking.com's)\n\n### Trigger-based automation\n\n| Trigger (PMS event) | Time | Message |\n|---|---|---|\n| `reservation.confirmed` | Immediately | Confirmation, payment link |\n| Arrival − 3 days | 10 am (hotel time zone) | Pre-check-in link, upsell |\n| Arrival − 1 day | Afternoon | Directions, parking, ask for ETA |\n| `room.status = inspected` (assigned room) | Immediately | \"Room ready\", digital key |\n| `stay.checked_in` + 1 day | Morning | \"Is everything okay?\" (catch problems early) |\n| Departure morning | 7 am | Express check-out link, late check-out offer |\n| `stay.checked_out` + 1 day | — | Thank you, survey, e-invoice |\n\n### Design\n- Templates: language (Bangla/English), channel, variables (`{{guest.first_name}}`, `{{stay.arrival_date}}`)\n- **Opt-in / opt-out** records; marketing vs transactional messages kept separate\n- **Quiet hours** — no messages at night\n- Unified inbox: all of a guest's channels in one thread, linked to the reservation\n- Duplicate prevention: unique (template_id, reservation_id, trigger_key) in `message_log`\n- On WhatsApp Business the first message uses an approved template (doc 16)\n\n```\nmessage_template(id, property_id, code, channel, lang, subject, body, active)\nautomation_rule(id, property_id, trigger_event, offset_minutes, conditions jsonb, template_id)\nmessage_log(id, reservation_id, guest_id, channel, template_id, trigger_key,\n            status[queued|sent|delivered|failed|read], provider_ref, sent_at)\n```\n\n---\n\n## 6. Upsell and ancillary sales\n\n| Offer | When | Rule |\n|---|---|---|\n| Room upgrade | Pre-arrival, kiosk | Higher type must be available; price = difference × nights (or dynamic) |\n| Early check-in / late check-out | Before arrival/departure | Based on HK capacity and the previous/next booking |\n| Breakfast, airport pickup, spa | Any time | Time-slot inventory (doc 05 §18 resources) |\n| Special occasion packages (cake, flowers) | Pre-arrival | Creates an operations task |\n\n- Buying an upsell = folio charge (specific transaction code) + operations task\n- When an upgrade is confirmed, **change inventory immediately** (same transaction)\n- \"Requested\" vs \"confirmed\" — early check-in is often a request, confirmed on arrival day\n\n### Attribute-Based Selling (ABS) — the future direction\nSelling features instead of room types: \"high floor\", \"sea view\", \"bathtub\", \"away from the lift\". The PMS needs a room attribute table and attribute inventory (doc 26 §6).\n\n---\n\n## 7. In-stay services\n- **Service requests:** towels, repairs, wake-up calls → HK/maintenance tasks (doc 08), SLA timers\n- **Digital compendium:** hotel information, Wi-Fi, menus (QR)\n- **Room service orders:** guest app → POS → folio posting (doc 09 §9)\n- **Chat:** humans + bots (doc 26)\n- **DND (Do Not Disturb)** and privacy\n\n---\n\n## 8. Express check-out\n1. Link on departure morning → 2. folio preview (including last night's charges) → 3. \"contact the desk\" if disputed → 4. pay with saved card/payment link → 5. e-invoice (with VAT details) → 6. revoke digital key → 7. \"vacant dirty\" signal to HK.\n\nEdge cases: minibar/late POS charges (late charges — doc 09), group master folio routing, company bills (city ledger).\n\n---\n\n## 9. Reputation management\n- Survey after check-out (NPS: \"0–10, how likely are you to recommend us?\")\n- Low score → alert the manager, service recovery\n- High score → invite a public review\n- View OTA/Google reviews together, response workflow\n- Themes from reviews (cleanliness, staff, Wi-Fi) → operational improvement\n- Metrics: average rating, review count, response rate and time\n\n---\n\n## 10. Accessibility and language\n- Guest portal mobile-first, large buttons, screen-reader labels\n- Bangla/English; more language templates for foreign guests\n- Accessible room attributes and request fields\n\n---\n\n## 11. Data model (additions)\n\n```sql\nCREATE TABLE guest_portal_token (\n  token_hash   text PRIMARY KEY,\n  reservation_id uuid NOT NULL,\n  purpose      text NOT NULL,          -- precheckin | checkout | survey\n  expires_at   timestamptz NOT NULL,\n  used_at      timestamptz\n);\n\nCREATE TABLE upsell_offer (\n  id uuid PRIMARY KEY, property_id uuid, code text, kind text,   -- upgrade | addon | early_ci | late_co\n  price_rule jsonb, inventory_ref text, active boolean\n);\n\nCREATE TABLE upsell_order (\n  id uuid PRIMARY KEY, reservation_id uuid, offer_id uuid,\n  status text,                         -- requested | confirmed | declined | fulfilled\n  amount numeric(12,2), folio_line_id uuid, created_at timestamptz\n);\n\nCREATE TABLE kiosk_session (\n  id uuid PRIMARY KEY, kiosk_id text, reservation_id uuid,\n  steps jsonb, outcome text, started_at timestamptz, ended_at timestamptz\n);\n```\n\n---\n\n## 12. Bangladesh context\n- WhatsApp is the most effective channel; SMS as backup (Bangla Unicode SMS is shorter — higher cost)\n- bKash/SSLCommerz in payment links (doc 09)\n- Privacy for NID/passport uploads: only the staff who need them can see them, deletion policy after expiry (respecting legal retention)\n- Kiosks/digital keys are still mainly in upscale hotels; for small hotels **online check-in + WhatsApp** is a more realistic start\n\n---\n\n## 13. Pitfalls\n- [ ] Guessable links (`/checkin/12345`) → viewing someone else's data (IDOR)\n- [ ] Old digital key still active after a room move\n- [ ] Duplicate automation messages (resent on retry)\n- [ ] Messages at 3 a.m. because of a time zone mistake\n- [ ] Upsell confirmed but inventory not reduced → oversell\n- [ ] Kiosk assigning a dirty room\n- [ ] E-invoice without VAT/BIN details\n- [ ] Opt-out not respected\n"}, "22": {"n": 22, "title": "২২ — হোটেল ফিনান্স: লেজার ব্যালান্সিং, USALI ও GL ম্যাপিং", "md": "# ২২ — হোটেল ফিনান্স: লেজার ব্যালান্সিং, USALI ও GL ম্যাপিং\n\n> লক্ষ্য: PMS-এর টাকার অংশ অ্যাকাউন্ট্যান্টের চোখে দেখা — তিনটি লেজার কীভাবে মেলে, night audit-এ কোন সূত্র শূন্য হতে হবে, USALI কী, transaction code কীভাবে GL-এ যায়, AR/city ledger কীভাবে চলে।\n> আগের ডক: ০৭ (ফোলিও), ০৯ (পেমেন্ট ও অ্যাকাউন্টিং), ১৫ (রিপোর্ট)। আইনি/কর পরামর্শ নয় — অ্যাকাউন্ট্যান্টের সাথে মিলিয়ে নাও।\n\n---\n\n## ১. ইঞ্জিনিয়ারের কেন হিসাব বোঝা দরকার\n- PMS-এর বাগ মানে **টাকার ভুল** — অডিটর, মালিক, কর কর্তৃপক্ষ ধরবে\n- \"Trial balance মিলছে না\" টিকেট সবচেয়ে কঠিন বাগ — ডিজাইনেই প্রতিরোধ করতে হয়\n- হোটেল চেইন/মালিক USALI ফরম্যাটে রিপোর্ট চায়; transaction code সেটআপ ভুল হলে পরে ঠিক করা ব্যয়বহুল\n\n---\n\n## ২. তিনটি লেজার\n\n| লেজার | কী রাখে | উদাহরণ |\n|---|---|---|\n| **Guest ledger** (in-house) | হোটেলে থাকা গেস্টদের খোলা ফোলিওর ব্যালান্স | রুম ৩০১-এর বিল ৳১২,০০০ বাকি |\n| **City ledger** (AR) | চলে যাওয়া গেস্ট/কোম্পানির কাছে পাওনা | ABC কোম্পানি ৳৪৫,০০০ মাস শেষে দেবে |\n| **Deposit / Advance ledger** | আগমনের আগে নেওয়া অগ্রিম (দায়, আয় নয়) | আগামী মাসের বুকিং-এ ৳৫,০০০ অগ্রিম |\n\n```mermaid\nflowchart LR\n    DEP[Deposit ledger<br/>অগ্রিম দায়] -- check-in এ ট্রান্সফার --> GL[Guest ledger<br/>in-house ফোলিও]\n    CH[চার্জ: রুম, F&B, ট্যাক্স] --> GL\n    PAY[পেমেন্ট: নগদ, কার্ড, MFS] --> GL\n    GL -- check-out এ direct bill --> CL[City ledger AR<br/>কোম্পানি, এজেন্ট]\n    CL -- পেমেন্ট এলে --> BANK[ব্যাংক]\n    DEP -- ক্যানসেল ও বাজেয়াপ্ত --> REV[আয়: cancellation fee]\n    DEP -- ক্যানসেল ও ফেরত --> REF[রিফান্ড]\n```\n\n**মূল নিয়ম:** টাকা এক লেজার থেকে আরেক লেজারে **ট্রান্সফার** হয় — মাঝখানে হারায় না, দুবার গোনা হয় না।\n\n---\n\n## ৩. Night audit ব্যালান্সিং সূত্র\n\nপ্রতিটি business date শেষে:\n\n```\nGuest ledger:\n  আজকের closing = গতকালের closing\n                + আজকের চার্জ (রুম, F&B, ট্যাক্স ...)\n                − আজকের পেমেন্ট\n                − deposit থেকে ট্রান্সফার ইন (পেমেন্টের মতো কাজ করে)\n                − city ledger-এ ট্রান্সফার আউট\n                ± adjustment\n\nCity ledger:\n  আজকের closing = গতকালের closing + guest ledger থেকে ট্রান্সফার ইন − AR পেমেন্ট ± adjustment/write-off\n\nDeposit ledger:\n  আজকের closing = গতকালের closing + নতুন ডিপোজিট − check-in-এ ট্রান্সফার − রিফান্ড − বাজেয়াপ্ত (আয়ে)\n```\n\n### উদাহরণ (এক দিন)\n\n| লাইন | Guest ledger | City ledger | Deposit ledger |\n|---|---|---|---|\n| গতকালের closing | ১,২০,০০০ | ৩,০০,০০০ | ৫০,০০০ |\n| চার্জ (রুম+ট্যাক্স+F&B) | +৮০,০০০ | | |\n| নগদ/কার্ড/MFS পেমেন্ট | −৬০,০০০ | | |\n| নতুন ডিপোজিট | | | +২০,০০০ |\n| check-in-এ deposit ট্রান্সফার | −১০,০০০ | | −১০,০০০ |\n| check-out-এ direct bill | −৩৫,০০০ | +৩৫,০০০ | |\n| কোম্পানির পেমেন্ট | | −৪০,০০০ | |\n| **আজকের closing** | **৯৫,০০০** | **২,৯৫,০০০** | **৬০,০০০** |\n\n**চেক:** সব ফোলিওর ব্যালান্সের যোগফল = guest ledger closing (৯৫,০০০) হতেই হবে। না মিললে **night audit থামাও**, ভুল খুঁজো।\n\n```sql\n-- guest ledger পরীক্ষা: হিসাবের ব্যালান্স বনাম ফোলিও লাইনের যোগফল\nSELECT\n  (SELECT closing_balance FROM ledger_day\n    WHERE ledger='guest' AND business_date = :bd)              AS ledger_closing,\n  (SELECT coalesce(sum(fl.amount),0)\n     FROM folio f JOIN folio_line fl ON fl.folio_id = f.id\n    WHERE f.status = 'open' AND f.ledger = 'guest')            AS folios_sum;\n-- দুটো সমান না হলে: audit_exception তৈরি\n```\n\n> **Append-only:** folio_line কখনো আপডেট/ডিলিট নয় — ভুল হলে **reversal লাইন** (উল্টো চিহ্নে) + নতুন সঠিক লাইন। এতে ইতিহাস ও ব্যালান্স দুটোই ঠিক থাকে (ডক ০৭)।\n\n---\n\n## ৪. USALI — হোটেলের হিসাবের বিশ্বভাষা\n\n**Uniform System of Accounts for the Lodging Industry (USALI)** = হোটেলের আয়-ব্যয় বিবরণী (P&L) কীভাবে সাজাতে হবে তার শিল্প-মানদণ্ড। HFTP প্রকাশ করে, AHLA-র সাথে যৌথ কমিটি হালনাগাদ করে। সর্বশেষ **১২তম সংশোধিত সংস্করণ** (২০২৪-এ ডিজিটাল প্রকাশ), গ্রহণের তারিখ **১ জানুয়ারি ২০২৬**। প্রথম সংস্করণ ১৯২৬ সালে।\n\n### কাঠামো (সরলীকৃত)\n\n```mermaid\nflowchart TB\n    R[মোট আয়] --> OD[Operated Departments<br/>Rooms, F&B, Other Operated, Misc Income]\n    OD --> DP[Departmental Profit<br/>বিভাগের আয় − বিভাগের সরাসরি খরচ]\n    DP --> UOE[Undistributed Operating Expenses<br/>A&G, IT, Sales & Marketing,<br/>Property Ops & Maintenance, Utilities]\n    UOE --> GOP[Gross Operating Profit GOP]\n    GOP --> MF[Management Fees]\n    MF --> NOI_PRE[Non-Operating: ভাড়া, বীমা, সম্পত্তি কর]\n    NOI_PRE --> EBITDA[EBITDA]\n```\n\n| স্তর | উদাহরণ খরচ/আয় |\n|---|---|\n| Rooms বিভাগ | রুম আয়; HK বেতন, অ্যামেনিটি, লন্ড্রি, OTA কমিশন |\n| F&B বিভাগ | খাবার/পানীয় আয়; খাবারের খরচ, শেফ বেতন |\n| Other Operated | স্পা, পার্কিং, লন্ড্রি সার্ভিস |\n| Misc Income | ক্যানসেলেশন ফি, attrition ফি, ভাড়া দেওয়া দোকান |\n| A&G | অ্যাকাউন্টস, HR, অফিস খরচ, ক্রেডিট কার্ড কমিশন |\n| IT | PMS সাবস্ক্রিপশন, Wi-Fi, IT স্টাফ |\n| S&M | বিজ্ঞাপন, ওয়েবসাইট, সেলস টিম |\n| POM | মেরামত, রক্ষণাবেক্ষণ |\n| Utilities | বিদ্যুৎ, গ্যাস, পানি |\n\n**GOP ও GOPPAR** হোটেলের অপারেশনাল দক্ষতার মূল মাপ (ডক ২০ §৪)।\n\n> PMS সাধারণত পুরো USALI P&L বানায় না (খরচের দিক অ্যাকাউন্টিং সিস্টেমে) — কিন্তু **আয়ের দিক সঠিক বিভাগে** পাঠানো PMS-এর দায়িত্ব।\n\n---\n\n## ৫. Transaction code → বিভাগ → GL ম্যাপিং\n\nপ্রতিটি চার্জ/পেমেন্টের একটি **transaction code** থাকে (ডক ০৭ charge code)। কোডের সাথে কনফিগ:\n\n| Code | বর্ণনা | ধরন | USALI বিভাগ | GL অ্যাকাউন্ট | ট্যাক্স গ্রুপ |\n|---|---|---|---|---|---|\n| `RM` | রুম চার্জ | revenue | Rooms | 4000-Room Revenue | VAT_HOTEL + SC |\n| `RMNS` | No-show চার্জ | revenue | Rooms (নীতি দেখো) | 4010 | VAT_HOTEL |\n| `FB-BKF` | নাস্তা | revenue | F&B – Food | 4100 | VAT_FNB |\n| `LND` | লন্ড্রি | revenue | Other Operated | 4300 | VAT_GEN |\n| `CXL` | ক্যানসেলেশন ফি | revenue | Misc Income | 4900 | নিয়ম দেখো |\n| `VAT` | ভ্যাট | tax | — | 2200-VAT Payable | — |\n| `SC` | সার্ভিস চার্জ | revenue/liability | নীতি অনুযায়ী | 2210 বা 4xxx | — |\n| `CASH` | নগদ | payment | — | 1000-Cash on hand | — |\n| `BKASH` | bKash | payment | — | 1150-MFS Clearing | — |\n| `CARD` | কার্ড | payment | — | 1160-Card Clearing | — |\n| `DEP` | অগ্রিম | payment→deposit | — | 2300-Advance Deposits | — |\n| `CL` | City ledger ট্রান্সফার | transfer | — | 1200-AR | — |\n\n```json\n{\n  \"code\": \"FB-BKF\",\n  \"kind\": \"revenue\",\n  \"department\": \"FNB_FOOD\",\n  \"gl_account\": \"4100\",\n  \"tax_group\": \"VAT_FNB\",\n  \"allow_negative\": false,\n  \"requires_reason_on_adjust\": true,\n  \"effective_from\": \"2026-01-01\"\n}\n```\n\n**নিয়ম:** transaction code এর ম্যাপিং **তারিখসহ সংস্করণ** রাখো — পুরোনো লাইন পুরোনো ম্যাপিং-এ রিপোর্ট হবে।\n\n---\n\n## ৬. আয় স্বীকৃতি (Revenue recognition)\n\n| পরিস্থিতি | সঠিক পদ্ধতি |\n|---|---|\n| রুম আয় | **থাকার রাতে** (business date অনুযায়ী night audit-এ পোস্ট), বুকিং বা পেমেন্টের দিনে নয় |\n| অগ্রিম/ডিপোজিট | **দায় (liability)** — আয় নয়; থাকার সময় ব্যবহার |\n| প্যাকেজ (রুম + নাস্তা ৳৬,০০০) | ভাগ করে পোস্ট: রুম ৳৫,২০০ (Rooms) + নাস্তা ৳৮০০ (F&B) — নইলে ADR ফুলে যায়, F&B কম দেখায় |\n| নন-রিফান্ডেবল প্রিপেইড | টাকা আগে আসে, আয় থাকার রাতে; no-show হলে নীতি অনুযায়ী আয় |\n| গিফট ভাউচার | বিক্রিতে দায়, ব্যবহারে আয়; মেয়াদোত্তীর্ণ হলে নীতি অনুযায়ী |\n| OTA কমিশন | খরচ (Rooms বিভাগ), আয় থেকে বাদ দিয়ে পোস্ট নয় (gross পোস্ট + কমিশন খরচ) — অথবা চুক্তি/নীতি অনুযায়ী net; **সামঞ্জস্য রাখো** |\n\n### প্যাকেজ ভাগের কনফিগ উদাহরণ\n```\npackage \"BB\" (Bed & Breakfast):\n  component FB-BKF: 800 per adult per night (fixed)\n  component RM: remainder (rate − components)\n  posting: night audit-এ দুই লাইন, একই source_ref\n```\n\n---\n\n## ৭. Accounts Receivable (City ledger)\n\n### ফ্লো\n১. কোম্পানির **direct bill অনুমোদন** (account তৈরি, ক্রেডিট লিমিট, যোগাযোগ, পেমেন্ট শর্ত ৩০ দিন)\n২. check-out-এ ফোলিও ব্যালান্স city ledger account-এ ট্রান্সফার → AR ইনভয়েস\n৩. মাসিক স্টেটমেন্ট পাঠানো\n৪. পেমেন্ট এলে **নির্দিষ্ট ইনভয়েসে বরাদ্দ (allocation)**; আংশিক পেমেন্ট\n৫. বকেয়া → রিমাইন্ডার → ক্রেডিট বন্ধ → write-off (অনুমোদন সহ)\n\n### Aging রিপোর্ট\n```sql\nSELECT a.name,\n  sum(CASE WHEN :today - i.due_date <= 0               THEN i.open_amount END) AS current,\n  sum(CASE WHEN :today - i.due_date BETWEEN 1  AND 30  THEN i.open_amount END) AS d1_30,\n  sum(CASE WHEN :today - i.due_date BETWEEN 31 AND 60  THEN i.open_amount END) AS d31_60,\n  sum(CASE WHEN :today - i.due_date BETWEEN 61 AND 90  THEN i.open_amount END) AS d61_90,\n  sum(CASE WHEN :today - i.due_date > 90               THEN i.open_amount END) AS d90_plus\nFROM ar_invoice i JOIN ar_account a ON a.id = i.account_id\nWHERE i.open_amount > 0\nGROUP BY a.name ORDER BY d90_plus DESC NULLS LAST;\n```\n\n### এজ কেস\n- ক্রেডিট লিমিট পার হলে check-out-এ direct bill আটকাও (override = অনুমোদন)\n- একই কোম্পানির ডুপ্লিকেট account (নামের বানান ভিন্ন)\n- পেমেন্ট এসেছে কিন্তু কোন ইনভয়েসের জানা নেই → unallocated credit\n- বিদেশি মুদ্রায় পেমেন্ট → FX পার্থক্য\n\n---\n\n## ৮. কমিশন ও OTA-র ভার্চুয়াল কার্ড\n- **Travel agent / OTA কমিশন payable:** বুকিং-এ `commission_pct`, check-out-এর পর payable তৈরি, মাসিক পরিশোধ/রিপোর্ট\n- **Merchant model:** OTA গেস্টের কাছ থেকে টাকা নেয়, হোটেলকে net দেয় — অনেক সময় **Virtual Credit Card (VCC)**; VCC কখন চার্জ করা যাবে (activation date) ট্র্যাক করো\n- **Agency model:** গেস্ট হোটেলে পরিশোধ করে, হোটেল OTA-কে কমিশন দেয় (মাসিক ইনভয়েস)\n- দুটো মডেলের ফোলিও ও রিপোর্টিং ভিন্ন — reservation-এ `payment_model` ফিল্ড রাখো\n\n---\n\n## ৯. রিকনসিলিয়েশন\n| কী মেলাবে | কীভাবে |\n|---|---|\n| ক্যাশিয়ার শিফট | সিস্টেমের নগদ বনাম ড্রয়ারে গোনা (ডক ০৩ §১২) |\n| কার্ড | PMS কার্ড পেমেন্ট বনাম গেটওয়ে/ব্যাংক সেটেলমেন্ট রিপোর্ট (ফি বাদে) |\n| MFS (bKash ইত্যাদি) | PMS বনাম মার্চেন্ট স্টেটমেন্ট; transaction id দিয়ে ম্যাচ |\n| OTA | OTA স্টেটমেন্ট বনাম PMS বুকিং ও কমিশন |\n| ব্যাংক | AR পেমেন্ট বনাম ব্যাংক স্টেটমেন্ট |\n\nডিজাইন: প্রতিটি পেমেন্টে `provider_txn_id`, `settlement_batch_id`, `fee_amount`, `settled_at` রাখো; রিকনসিলিয়েশন স্ক্রিনে \"মিলেছে/মেলেনি/আংশিক\"।\n\n---\n\n## ১০. বহু মুদ্রা (Multi-currency)\n- **Base currency** (BDT) তে লেজার; বিদেশি মুদ্রায় পেমেন্ট নিলে সেই সময়ের **exchange rate স্ন্যাপশট** সহ লাইন\n- রেট টেবিল: `fx_rate(date, from, to, rate, source)`\n- ইনভয়েস গেস্টের মুদ্রায় দেখানো যায়, কিন্তু হিসাব base-এ\n- রাউন্ডিং পার্থক্য আলাদা transaction code-এ\n\n---\n\n## ১১. মাস শেষ বন্ধ (Period close)\n- মাস শেষে **period lock**: বন্ধ মাসে পোস্টিং নিষেধ; জরুরি হলে পরের মাসে adjustment\n- রিপোর্ট ফ্রিজ: মাসিক রিপোর্টের স্ন্যাপশট রাখো\n- অডিটরের জন্য: সব adjustment/void/রিফান্ডের তালিকা কারণসহ\n\n---\n\n## ১২. অ্যাকাউন্টিং সিস্টেমে এক্সপোর্ট\n- প্রতি business date-এ **journal summary** (GL অ্যাকাউন্ট অনুযায়ী ডেবিট/ক্রেডিট যোগফল) — প্রতিটি লাইন নয়\n- ডেবিট = ক্রেডিট নিশ্চিত করো এক্সপোর্টের আগে\n- **Idempotent:** `export_batch(business_date, target, status, checksum)` — একই দিন দুবার এক্সপোর্ট হলে ডুপ্লিকেট নয়\n- টার্গেট: Tally (XML/CSV), QuickBooks/Xero (API), সাধারণ CSV\n\n```\nJournal — Business date 2026-10-07\nDr 1000 Cash on hand          18,000\nDr 1150 MFS Clearing          22,000\nDr 1160 Card Clearing         20,000\nDr 1200 Accounts Receivable   35,000\n    Cr 4000 Room Revenue              60,000\n    Cr 4100 F&B Food                  12,000\n    Cr 2200 VAT Payable                5,600\n    Cr 2210 Service Charge             2,400\n    Cr 2300 Advance Deposits (net)    15,000\n-- (উদাহরণ সংখ্যা; ডেবিট মোট = ক্রেডিট মোট = ৯৫,০০০)\n```\n\n---\n\n## ১৩. পিটফল\n- [ ] ডিপোজিটকে আয় হিসেবে পোস্ট করা\n- [ ] প্যাকেজ ভাগ না করা → ADR ভুল\n- [ ] folio_line আপডেট/ডিলিট করা (reversal না করে)\n- [ ] night audit ব্যালান্স না মিললেও এগিয়ে যাওয়া\n- [ ] transaction code ম্যাপিং বদলালে পুরোনো রিপোর্ট বদলে যাওয়া\n- [ ] AR পেমেন্ট ইনভয়েসে বরাদ্দ না করা\n- [ ] VCC activation date-এর আগে চার্জ করা\n- [ ] বন্ধ মাসে backdated posting\n- [ ] এক্সপোর্ট দুবার → অ্যাকাউন্টিং-এ ডাবল আয়\n", "title_en": "22 — Hotel Finance: Ledger Balancing, USALI & GL Mapping", "md_en": "# 22 — Hotel Finance: Ledger Balancing, USALI & GL Mapping\n\n> Goal: see the money side of the PMS through an accountant's eyes — how the three ledgers balance, which formula must net to zero in night audit, what USALI is, how transaction codes reach the GL, and how AR/city ledger works.\n> Earlier docs: 07 (folio), 09 (payments and accounting), 15 (reports). Not legal/tax advice — check with an accountant.\n\n---\n\n## 1. Why engineers need to understand accounting\n- A PMS bug means **wrong money** — auditors, owners and tax authorities will notice\n- \"The trial balance does not match\" tickets are the hardest bugs — they must be prevented by design\n- Hotel chains/owners want USALI-format reports; a wrong transaction code setup is expensive to fix later\n\n---\n\n## 2. The three ledgers\n\n| Ledger | Holds | Example |\n|---|---|---|\n| **Guest ledger** (in-house) | Balances of open folios of guests in the hotel | Room 301 owes BDT 12,000 |\n| **City ledger** (AR) | Amounts owed by departed guests/companies | ABC company will pay BDT 45,000 at month end |\n| **Deposit / advance ledger** | Advances taken before arrival (a liability, not revenue) | BDT 5,000 advance for next month's booking |\n\n```mermaid\nflowchart LR\n    DEP[Deposit ledger<br/>advance liability] -- transfer at check-in --> GL[Guest ledger<br/>in-house folios]\n    CH[Charges: room, F&B, tax] --> GL\n    PAY[Payments: cash, card, MFS] --> GL\n    GL -- direct bill at check-out --> CL[City ledger AR<br/>companies, agents]\n    CL -- when paid --> BANK[Bank]\n    DEP -- cancelled and forfeited --> REV[Revenue: cancellation fee]\n    DEP -- cancelled and refunded --> REF[Refund]\n```\n\n**Core rule:** money is **transferred** from one ledger to another — it is never lost in between and never counted twice.\n\n---\n\n## 3. Night audit balancing formula\n\nAt the end of every business date:\n\n```\nGuest ledger:\n  today's closing = yesterday's closing\n                  + today's charges (room, F&B, tax ...)\n                  − today's payments\n                  − transfers in from deposits (they act like payments)\n                  − transfers out to city ledger\n                  ± adjustments\n\nCity ledger:\n  today's closing = yesterday's closing + transfers in from guest ledger − AR payments ± adjustments/write-offs\n\nDeposit ledger:\n  today's closing = yesterday's closing + new deposits − transfers at check-in − refunds − forfeits (to revenue)\n```\n\n### Example (one day)\n\n| Line | Guest ledger | City ledger | Deposit ledger |\n|---|---|---|---|\n| Yesterday's closing | 1,20,000 | 3,00,000 | 50,000 |\n| Charges (room + tax + F&B) | +80,000 | | |\n| Cash/card/MFS payments | −60,000 | | |\n| New deposits | | | +20,000 |\n| Deposit transferred at check-in | −10,000 | | −10,000 |\n| Direct bill at check-out | −35,000 | +35,000 | |\n| Company payment | | −40,000 | |\n| **Today's closing** | **95,000** | **2,95,000** | **60,000** |\n\n**Check:** the sum of all folio balances must equal the guest ledger closing (95,000). If not, **stop night audit** and find the error.\n\n```sql\n-- guest ledger check: ledger balance vs sum of folio lines\nSELECT\n  (SELECT closing_balance FROM ledger_day\n    WHERE ledger='guest' AND business_date = :bd)              AS ledger_closing,\n  (SELECT coalesce(sum(fl.amount),0)\n     FROM folio f JOIN folio_line fl ON fl.folio_id = f.id\n    WHERE f.status = 'open' AND f.ledger = 'guest')            AS folios_sum;\n-- if they differ: create an audit_exception\n```\n\n> **Append-only:** never update/delete a folio_line — on a mistake post a **reversal line** (opposite sign) + a new correct line. History and balance both stay right (doc 07).\n\n---\n\n## 4. USALI — the global language of hotel accounting\n\n**Uniform System of Accounts for the Lodging Industry (USALI)** = the industry standard for structuring a hotel's income statement (P&L). Published by HFTP and updated by a joint committee with AHLA. The latest is the **12th Revised Edition** (published digitally in 2024), effective **1 January 2026**. The first edition appeared in 1926.\n\n### Structure (simplified)\n\n```mermaid\nflowchart TB\n    R[Total revenue] --> OD[Operated Departments<br/>Rooms, F&B, Other Operated, Misc Income]\n    OD --> DP[Departmental Profit<br/>department revenue − direct department costs]\n    DP --> UOE[Undistributed Operating Expenses<br/>A&G, IT, Sales & Marketing,<br/>Property Ops & Maintenance, Utilities]\n    UOE --> GOP[Gross Operating Profit GOP]\n    GOP --> MF[Management Fees]\n    MF --> NOI_PRE[Non-Operating: rent, insurance, property tax]\n    NOI_PRE --> EBITDA[EBITDA]\n```\n\n| Level | Example costs/revenue |\n|---|---|\n| Rooms department | Room revenue; HK wages, amenities, laundry, OTA commission |\n| F&B department | Food/beverage revenue; cost of food, chef wages |\n| Other Operated | Spa, parking, laundry service |\n| Misc Income | Cancellation fees, attrition fees, rented shops |\n| A&G | Accounts, HR, office costs, credit card commission |\n| IT | PMS subscription, Wi-Fi, IT staff |\n| S&M | Advertising, website, sales team |\n| POM | Repairs, maintenance |\n| Utilities | Electricity, gas, water |\n\n**GOP and GOPPAR** are the key measures of a hotel's operating efficiency (doc 20 §4).\n\n> A PMS usually does not produce the full USALI P&L (the cost side lives in the accounting system) — but sending **revenue to the correct department** is the PMS's job.\n\n---\n\n## 5. Transaction code → department → GL mapping\n\nEvery charge/payment has a **transaction code** (doc 07 charge codes). Each code is configured with:\n\n| Code | Description | Kind | USALI department | GL account | Tax group |\n|---|---|---|---|---|---|\n| `RM` | Room charge | revenue | Rooms | 4000-Room Revenue | VAT_HOTEL + SC |\n| `RMNS` | No-show charge | revenue | Rooms (check policy) | 4010 | VAT_HOTEL |\n| `FB-BKF` | Breakfast | revenue | F&B – Food | 4100 | VAT_FNB |\n| `LND` | Laundry | revenue | Other Operated | 4300 | VAT_GEN |\n| `CXL` | Cancellation fee | revenue | Misc Income | 4900 | Check rules |\n| `VAT` | VAT | tax | — | 2200-VAT Payable | — |\n| `SC` | Service charge | revenue/liability | Per policy | 2210 or 4xxx | — |\n| `CASH` | Cash | payment | — | 1000-Cash on hand | — |\n| `BKASH` | bKash | payment | — | 1150-MFS Clearing | — |\n| `CARD` | Card | payment | — | 1160-Card Clearing | — |\n| `DEP` | Advance | payment→deposit | — | 2300-Advance Deposits | — |\n| `CL` | City ledger transfer | transfer | — | 1200-AR | — |\n\n```json\n{\n  \"code\": \"FB-BKF\",\n  \"kind\": \"revenue\",\n  \"department\": \"FNB_FOOD\",\n  \"gl_account\": \"4100\",\n  \"tax_group\": \"VAT_FNB\",\n  \"allow_negative\": false,\n  \"requires_reason_on_adjust\": true,\n  \"effective_from\": \"2026-01-01\"\n}\n```\n\n**Rule:** keep **dated versions** of transaction code mappings — old lines report under the old mapping.\n\n---\n\n## 6. Revenue recognition\n\n| Situation | Correct approach |\n|---|---|\n| Room revenue | **On the night of stay** (posted in night audit by business date), not on the booking or payment day |\n| Advance/deposit | **Liability** — not revenue; used during the stay |\n| Package (room + breakfast BDT 6,000) | Post split: room BDT 5,200 (Rooms) + breakfast BDT 800 (F&B) — otherwise ADR is inflated and F&B looks too low |\n| Non-refundable prepaid | Money comes first, revenue on the night of stay; on no-show, revenue per policy |\n| Gift vouchers | Liability when sold, revenue when used; per policy when expired |\n| OTA commission | An expense (Rooms department), not deducted from revenue (post gross + commission expense) — or net per contract/policy; **be consistent** |\n\n### Package split config example\n```\npackage \"BB\" (Bed & Breakfast):\n  component FB-BKF: 800 per adult per night (fixed)\n  component RM: remainder (rate − components)\n  posting: two lines in night audit, same source_ref\n```\n\n---\n\n## 7. Accounts receivable (city ledger)\n\n### Flow\n1. **Direct bill approval** for the company (create account, credit limit, contacts, payment terms of 30 days)\n2. At check-out, transfer the folio balance to the city ledger account → AR invoice\n3. Send monthly statements\n4. When payment arrives, **allocate it to specific invoices**; partial payments\n5. Overdue → reminder → stop credit → write-off (with approval)\n\n### Aging report\n```sql\nSELECT a.name,\n  sum(CASE WHEN :today - i.due_date <= 0               THEN i.open_amount END) AS current,\n  sum(CASE WHEN :today - i.due_date BETWEEN 1  AND 30  THEN i.open_amount END) AS d1_30,\n  sum(CASE WHEN :today - i.due_date BETWEEN 31 AND 60  THEN i.open_amount END) AS d31_60,\n  sum(CASE WHEN :today - i.due_date BETWEEN 61 AND 90  THEN i.open_amount END) AS d61_90,\n  sum(CASE WHEN :today - i.due_date > 90               THEN i.open_amount END) AS d90_plus\nFROM ar_invoice i JOIN ar_account a ON a.id = i.account_id\nWHERE i.open_amount > 0\nGROUP BY a.name ORDER BY d90_plus DESC NULLS LAST;\n```\n\n### Edge cases\n- Block direct billing at check-out when the credit limit is exceeded (override = approval)\n- Duplicate accounts for the same company (different spellings)\n- Payment received but invoice unknown → unallocated credit\n- Payments in foreign currency → FX differences\n\n---\n\n## 8. Commission and OTA virtual cards\n- **Travel agent / OTA commission payable:** `commission_pct` on the booking, payable created after check-out, monthly payment/report\n- **Merchant model:** the OTA collects from the guest and pays the hotel net — often by **Virtual Credit Card (VCC)**; track when a VCC may be charged (activation date)\n- **Agency model:** the guest pays the hotel, the hotel pays commission to the OTA (monthly invoice)\n- The two models differ in folio and reporting — keep a `payment_model` field on the reservation\n\n---\n\n## 9. Reconciliation\n| What to match | How |\n|---|---|\n| Cashier shift | System cash vs counted drawer (doc 03 §12) |\n| Cards | PMS card payments vs gateway/bank settlement report (after fees) |\n| MFS (bKash etc.) | PMS vs merchant statement; match by transaction id |\n| OTA | OTA statement vs PMS bookings and commission |\n| Bank | AR payments vs bank statement |\n\nDesign: store `provider_txn_id`, `settlement_batch_id`, `fee_amount`, `settled_at` on every payment; reconciliation screen with \"matched / unmatched / partial\".\n\n---\n\n## 10. Multi-currency\n- Ledger in the **base currency** (BDT); foreign-currency payments carry an **exchange rate snapshot** from that moment\n- Rate table: `fx_rate(date, from, to, rate, source)`\n- Invoices can display the guest's currency, but accounting stays in base\n- Rounding differences in a separate transaction code\n\n---\n\n## 11. Month-end close (period close)\n- **Period lock** at month end: no posting into closed months; urgent fixes as adjustments in the next month\n- Freeze reports: keep snapshots of monthly reports\n- For auditors: a list of every adjustment/void/refund with reasons\n\n---\n\n## 12. Export to the accounting system\n- A **journal summary** per business date (debit/credit totals per GL account) — not every line\n- Ensure debits = credits before exporting\n- **Idempotent:** `export_batch(business_date, target, status, checksum)` — exporting the same day twice does not duplicate\n- Targets: Tally (XML/CSV), QuickBooks/Xero (API), generic CSV\n\n```\nJournal — Business date 2026-10-07\nDr 1000 Cash on hand          18,000\nDr 1150 MFS Clearing          22,000\nDr 1160 Card Clearing         20,000\nDr 1200 Accounts Receivable   35,000\n    Cr 4000 Room Revenue              60,000\n    Cr 4100 F&B Food                  12,000\n    Cr 2200 VAT Payable                5,600\n    Cr 2210 Service Charge             2,400\n    Cr 2300 Advance Deposits (net)    15,000\n-- (example figures; total debits = total credits = 95,000)\n```\n\n---\n\n## 13. Pitfalls\n- [ ] Posting deposits as revenue\n- [ ] Not splitting packages → wrong ADR\n- [ ] Updating/deleting folio_line (instead of reversing)\n- [ ] Continuing night audit when balances do not match\n- [ ] Old reports changing when a transaction code mapping changes\n- [ ] AR payments not allocated to invoices\n- [ ] Charging a VCC before its activation date\n- [ ] Backdated posting into a closed month\n- [ ] Exporting twice → double revenue in accounting\n"}, "23": {"n": 23, "title": "২৩ — টেস্টিং ও কোয়ালিটি (Testing & QA for PMS)", "md": "# ২৩ — টেস্টিং ও কোয়ালিটি (Testing & QA for PMS)\n\n> লক্ষ্য: PMS-এ সবচেয়ে বেশি ক্ষতিকর বাগ — ডাবল বুকিং, টাকার ভুল, night audit ব্যর্থতা, ইন্টিগ্রেশন ভাঙা — কীভাবে টেস্ট দিয়ে আগেই ধরা যায়।\n> উদাহরণ কোড TypeScript (Node) ও SQL; ধারণা যেকোনো স্ট্যাকে প্রযোজ্য।\n\n---\n\n## ১. PMS টেস্টিং কেন কঠিন\n| চ্যালেঞ্জ | কেন |\n|---|---|\n| **সময়** | business date, টাইমজোন, ক্যানসেল ডেডলাইন, night audit — \"আজ\" বদলায় |\n| **টাকা** | রাউন্ডিং, ট্যাক্স, রিফান্ড, ব্যালান্স — এক পয়সা ভুলও বাগ |\n| **কনকারেন্সি** | একই সময়ে OTA + ডেস্ক + BE একই রুম বেচে |\n| **ইন্টিগ্রেশন** | তৃতীয় পক্ষের sandbox অস্থির, স্পেক বদলায় |\n| **দীর্ঘ প্রবাহ** | বুকিং → ৩০ দিন পর আগমন → ৩ রাত → check-out → AR → ৬০ দিন পর পেমেন্ট |\n| **কনফিগ বৈচিত্র্য** | প্রতিটি হোটেলের রেট, ট্যাক্স, নীতি আলাদা |\n\n---\n\n## ২. টেস্ট পিরামিড (PMS সংস্করণ)\n\n```mermaid\nflowchart TB\n    E2E[\"E2E — অল্প<br/>Playwright: বুকিং থেকে check-out\"]\n    CON[\"Contract — OTA, CM, Payment<br/>রেকর্ড করা fixture, sandbox\"]\n    INT[\"Integration — আসল PostgreSQL<br/>কনকারেন্সি, night audit, RLS\"]\n    PROP[\"Property-based — invariant<br/>availability, ledger\"]\n    UNIT[\"Unit — অনেক<br/>রেট কোট, ট্যাক্স, রাউন্ডিং, state machine\"]\n    E2E --- CON --- INT --- PROP --- UNIT\n```\n\nনিচের স্তর দ্রুত ও বেশি; ওপরের স্তর ধীর ও কম, কিন্তু সবচেয়ে গুরুত্বপূর্ণ ফ্লো ঢাকে।\n\n---\n\n## ৩. সময় নিয়ন্ত্রণ: Clock ও Business date\n\n**নিয়ম:** কোডে কোথাও সরাসরি `new Date()` / `now()` নয়। একটা `Clock` ইনজেক্ট করো।\n\n```ts\nexport interface Clock {\n  now(): Date;                         // আসল সময় (UTC)\n  businessDate(propertyId: string): Promise<string>; // 'YYYY-MM-DD' (DB থেকে)\n}\n\nexport class FixedClock implements Clock {\n  constructor(private t: Date, private bd: string) {}\n  now() { return this.t; }\n  async businessDate() { return this.bd; }\n  advance(ms: number) { this.t = new Date(this.t.getTime() + ms); }\n}\n\n// টেস্ট: ক্যানসেল ডেডলাইন (আগমনের ২৪ ঘণ্টা আগে, হোটেল টাইমজোন Asia/Dhaka)\ntest('free cancel until 24h before arrival (local time)', async () => {\n  const clock = new FixedClock(new Date('2026-10-09T13:59:00+06:00'), '2026-10-09');\n  const res = await svc.cancelQuote(reservationArriving('2026-10-10T14:00+06:00'), clock);\n  expect(res.fee).toBe(0);\n  clock.advance(2 * 60_000); // 14:01 → ডেডলাইন পার\n  expect((await svc.cancelQuote(reservationArriving('2026-10-10T14:00+06:00'), clock)).fee).toBeGreaterThan(0);\n});\n```\n\n---\n\n## ৪. ডোমেইন ইউনিট টেস্ট\n\n### ৪.১ টেবিল-চালিত (table-driven) টেস্ট — ট্যাক্স ও রাউন্ডিং\n```ts\nconst cases = [\n  // base, vatPct, scPct, inclusive, expectedTotal\n  [5000, 15, 10, false, 6325.00],   // SC আগে, VAT SC সহ? — নিয়ম স্পষ্ট লিখে রাখো\n  [5750, 15, 0,  true,  5750.00],\n  [3333.33, 5, 0, false, 3500.00],\n];\ntest.each(cases)('tax %p vat=%p sc=%p incl=%p', (base, vat, sc, incl, exp) => {\n  expect(quoteTotal({ base, vat, sc, inclusive: incl })).toBeCloseTo(exp, 2);\n});\n```\n> উপরের প্রথম লাইন: ৫০০০ + ১০% SC = ৫৫০০; ৫৫০০ + ১৫% VAT = ৬৩২৫। **কোন ক্রমে ট্যাক্স বসে** তা ট্যাক্স কনফিগের অংশ — টেস্টে স্পষ্ট করো (ডক ০৬)।\n\n### ৪.২ স্টেট মেশিন টেস্ট\nসব অনুমোদিত ও নিষিদ্ধ ট্রানজিশন টেস্ট করো:\n```ts\nconst allowed = {\n  confirmed: ['in_house', 'cancelled', 'no_show'],\n  in_house:  ['checked_out'],\n  no_show:   ['confirmed'],      // reinstate (অনুমতি সহ)\n};\nfor (const from of ALL_STATES) for (const to of ALL_STATES) {\n  test(`${from} -> ${to}`, () => {\n    const ok = allowed[from]?.includes(to) ?? false;\n    expect(canTransition(from, to)).toBe(ok);\n  });\n}\n```\n\n### ৪.৩ Golden-file টেস্ট — ইনভয়েস\nইনভয়েস রেন্ডার (JSON বা টেক্সট) একটি \"সোনালি\" ফাইলের সাথে মেলাও। পরিবর্তন হলে ডিফ রিভিউ করে আপডেট। ট্যাক্স লাইন, BIN, ক্রমিক নম্বর, বাংলা টেক্সট সব ধরা পড়ে।\n\n---\n\n## ৫. Property-based টেস্ট — invariant যা কখনো ভাঙবে না\n\n| Invariant | মানে |\n|---|---|\n| availability ≥ −overbook_limit | যেকোনো ক্রিয়ার পর |\n| প্রতিটি ফোলিওর ব্যালান্স = তার লাইনের যোগফল | সবসময় |\n| guest + city + deposit লেজার পরিবর্তন = পোস্ট করা লেনদেনের যোগফল | প্রতি business date |\n| একই রুম একই রাতে দুটি in-house stay নয় | সবসময় |\n| রিফান্ড মোট ≤ পেমেন্ট মোট | প্রতি পেমেন্ট |\n\n```ts\nimport fc from 'fast-check';\n\ntest('random booking/cancel sequence never oversells', async () => {\n  await fc.assert(fc.asyncProperty(\n    fc.array(fc.record({\n      op: fc.constantFrom('book', 'cancel', 'modify'),\n      nights: fc.integer({ min: 1, max: 5 }),\n      offset: fc.integer({ min: 0, max: 20 }),\n    }), { maxLength: 60 }),\n    async (ops) => {\n      const h = await freshHotel({ rooms: 3 });\n      for (const o of ops) await h.apply(o).catch(() => {}); // ব্যর্থতা গ্রহণযোগ্য\n      for (const night of h.nights()) {\n        expect(await h.soldOn(night)).toBeLessThanOrEqual(3);\n      }\n    }), { numRuns: 200 });\n});\n```\n\n---\n\n## ৬. কনকারেন্সি টেস্ট — \"১০০ জন, ১ রুম\"\n\n```ts\ntest('100 parallel bookings for last room → exactly 1 succeeds', async () => {\n  const h = await freshHotel({ rooms: 1 });\n  const attempts = Array.from({ length: 100 }, () =>\n    api.post('/v1/reservations', h.payload({ arrival: '2026-12-20', nights: 2 }))\n       .then(r => r.status).catch(e => e.status));\n  const statuses = await Promise.all(attempts);\n  expect(statuses.filter(s => s === 201)).toHaveLength(1);\n  expect(statuses.filter(s => s === 409)).toHaveLength(99);   // NO_AVAILABILITY\n  expect(await h.inventory('2026-12-20')).toEqual({ sold: 1, available: 0 });\n});\n```\nএকই কৌশলে: একই webhook ১০ বার একসাথে (idempotency), একই ফোলিওতে একসাথে পেমেন্ট ও check-out, night audit চলাকালীন পোস্টিং।\n\n---\n\n## ৭. আসল ডাটাবেস দিয়ে ইন্টিগ্রেশন টেস্ট\n- **Testcontainers** দিয়ে টেস্টে আসল PostgreSQL চালাও — mock DB-তে লক/কনস্ট্রেইন্ট/RLS আচরণ ধরা পড়ে না\n- প্রতিটি টেস্ট আলাদা schema/ট্রানজ্যাকশন রোলব্যাক বা নতুন tenant\n- মাইগ্রেশন টেস্ট: খালি DB → সব মাইগ্রেশন → seed → টেস্ট; এবং পুরোনো সংস্করণ ডেটা → নতুন মাইগ্রেশন\n- **RLS/টেন্যান্ট আইসোলেশন:** tenant A-এর টোকেন দিয়ে tenant B-এর প্রতিটি endpoint কল → ৪০৪/৪০৩ (ডক ১৪)\n\n---\n\n## ৮. কন্ট্রাক্ট টেস্ট — OTA, চ্যানেল ম্যানেজার, পেমেন্ট\n- তৃতীয় পক্ষের আসল রিকোয়েস্ট/রেসপন্স **রেকর্ড করে fixture** বানাও (সংবেদনশীল ডেটা মুছে)\n- ইনবাউন্ড: নতুন বুকিং, মডিফাই, ক্যানসেল, **আউট-অব-অর্ডার** (ক্যানসেল আগে, নতুন পরে), ডুপ্লিকেট, অজানা রুম কোড\n- আউটবাউন্ড: ARI মেসেজ স্কিমা যাচাই (XSD/JSON Schema)\n- পেমেন্ট: success, fail, timeout, IPN আগে/callback পরে, ডুপ্লিকেট IPN, রিফান্ড আংশিক — bKash/SSLCommerz sandbox (ডক ০৯)\n- নিজের পাবলিক API-র জন্য: OpenAPI স্পেক থেকে কন্ট্রাক্ট টেস্ট; consumer-driven (Pact) যদি পার্টনার থাকে\n\n---\n\n## ৯. Night audit সিমুলেশন — \"সময় যন্ত্র\"\n- একটি টেস্ট হোটেলে ৯০ দিন দ্রুত চালাও: প্রতিদিন র‍্যান্ডম বুকিং, check-in, চার্জ, পেমেন্ট, check-out, তারপর night audit\n- প্রতিটি অডিটের পর invariant (§৫) চেক\n- **মাঝপথে ক্র্যাশ** সিমুলেট: অডিটের ধাপ ৩-এ exception → আবার চালালে ডাবল পোস্ট হয় না (idempotent ধাপ; ডক ০৯, কেস ৭ ডক ১৯)\n- মাস শেষ, বছর শেষ, লিপ ইয়ার (২৯ ফেব্রুয়ারি) পার করো\n\n---\n\n## ১০. E2E টেস্ট (Playwright)\nঅল্প কিন্তু অপরিহার্য ফ্লো:\n1. ডেস্ক: walk-in বুকিং → রুম অ্যাসাইন → check-in → চার্জ → পেমেন্ট → check-out → ইনভয়েস\n2. BE: সার্চ → কোট → পেমেন্ট (sandbox) → কনফার্মেশন\n3. HK: dirty → clean → inspected, রুম র‍্যাক আপডেট\n4. Night audit: চালাও, রিপোর্ট দেখো\n5. রোল: ফ্রন্ট ডেস্ক এজেন্ট রিফান্ড দিতে পারে না\n\nটিপস: `data-testid` ব্যবহার, টেস্ট ডেটা API দিয়ে তৈরি (UI দিয়ে নয়), বাংলা UI-তেও একবার চালাও।\n\n---\n\n## ১১. পারফরম্যান্স ও লোড\n| দৃশ্য | লক্ষ্য (উদাহরণ) |\n|---|---|\n| BE availability সার্চ | p95 < ৩০০ms, ৫০ req/s প্রতি প্রপার্টি গ্রুপ |\n| OTA ARI বাস্ট (রেট আপডেট ৩৬৫ দিন × ১০ রুম টাইপ) | কিউ জমে না, ৫ মিনিটে সব চ্যানেলে |\n| Night audit (৫০০ রুম) | ৫ মিনিটের কম |\n| রিপোর্ট (১ বছর) | read replica/বিশ্লেষণ স্টোর থেকে, OLTP ধীর করে না |\n\n```js\n// k6 উদাহরণ\nimport http from 'k6/http';\nexport const options = { vus: 50, duration: '2m',\n  thresholds: { http_req_duration: ['p(95)<300'] } };\nexport default function () {\n  http.get(`${__ENV.BASE}/public/availability?property=demo&arrival=2026-12-20&nights=2&adults=2`);\n}\n```\n\n---\n\n## ১২. সিকিউরিটি টেস্ট\n- IDOR: অন্য গেস্টের রিজার্ভেশন/ইনভয়েস/ডকুমেন্ট URL\n- রোল এস্কেলেশন: কম অনুমতির ইউজার দিয়ে অ্যাডমিন API\n- ইনপুট: SQL injection, XSS (গেস্টের নামে `<script>`), CSV injection (`=HYPERLINK(...)` এক্সপোর্টে)\n- রেট লিমিট ও brute force (লগইন, গেস্ট পোর্টাল টোকেন)\n- ডিপেন্ডেন্সি স্ক্যান, সিক্রেট স্ক্যান CI-তে\n- রেফারেন্স: OWASP ASVS (ডক ২৮)\n\n---\n\n## ১৩. টেস্ট ডেটা\n- **Seed হোটেল**: ২০ রুম, ৩ রুম টাইপ, ৪ রেট প্ল্যান, VAT + SC, ২টি কোম্পানি account, একটি গ্রুপ — সবাই একই জানা ডেটা দিয়ে কাজ করে\n- **Factory** ফাংশন: `makeReservation({nights:3, rate:'BAR'})`\n- প্রোডাকশন কপি টেস্টে লাগলে **অ্যানোনিমাইজ** (নাম, ফোন, ID, ইমেইল বদল) — কখনো আসল গেস্ট ডেটা ডেভ মেশিনে নয়\n- বাংলা নাম, দীর্ঘ নাম, শুধু একটি নাম, বিশেষ অক্ষর\n\n---\n\n## ১৪. UAT (হোটেল স্টাফ দিয়ে গ্রহণযোগ্যতা টেস্ট)\n- রোল অনুযায়ী স্ক্রিপ্ট: \"আপনি রিসেপশনিস্ট, একটি walk-in ২ রাত, নগদ অর্ধেক, বাকি bKash\"\n- আসল দিনের দৃশ্য: সকালের check-out ভিড়, দুপুরে গ্রুপ আগমন, রাতে night audit\n- **প্যারালাল রান:** পুরোনো সিস্টেম (বা খ
