dger) → stay-তে revenue/folio-তে স্থানান্তর।\n- **City ledger / AR**: কোম্পানির বকেয়া; বয়স-বিশ্লেষণ (aging), ইনভয়েস, পেমেন্ট ম্যাচ।\n\n### ডাবল-এন্ট্রি (সরলীকৃত)\n| ঘটনা | Debit | Credit |\n|---|---|---|\n| রুম চার্জ পোস্ট | Guest Ledger (AR) | Room Revenue + VAT Payable |\n| নগদ পেমেন্ট | Cash | Guest Ledger |\n| ডিপোজিট আগাম | Cash/Bank | Advance Deposit (Liability) |\n| ডিপোজিট folio-তে | Advance Deposit | Guest Ledger |\n| কমিশন (OTA) | Commission Expense | AP/OTA payable |\n| কোম্পানিতে ট্রান্সফার | City Ledger (AR) | Guest Ledger |\n\n**চার্ট অফ অ্যাকাউন্টস ম্যাপিং:** `charge_code → gl_account`, `payment_method → gl_account`। PMS সব নিজে করে না; সাধারণত **অ্যাকাউন্টিং সিস্টেমে এক্সপোর্ট** (Tally, QuickBooks, Xero — স্থানীয় বাজারে Tally বহুল ব্যবহৃত বলে ধরা হয়, তবে বাজার যাচাই করো)।\n\n### রিকনসিলিয়েশন\n- গেটওয়ে সেটেলমেন্ট রিপোর্ট ↔ PMS payment\n- ক্যাশিয়ার শিফট ভেরিয়েন্স\n- OTA কমিশন ইনভয়েস ↔ PMS বুকিং\n- ব্যাংক স্টেটমেন্ট\n\n### কমিশন ও ভ্যাট\n- OTA কমিশন ট্র্যাক, নেট/গ্রস রিপোর্ট\n- ট্যাক্স রিপোর্ট (মাসিক এক্সপোর্ট)। সরকারি ফরম্যাট: ডক ১৬।\n\n---\n\n## ৭. API ও স্ক্রিন\n```\nPOST /payments/intents          // গেটওয়ে সেশন\nPOST /payments/webhooks/{provider}\nGET  /payments/{id}             POST /payments/{id}/refund\nPOST /cashier-shifts/open|close\nPOST /night-audit/run           GET /night-audit/{date}\nGET  /ledger/trial-balance?date=\nGET  /ar/aging                  POST /ar/{company}/payments\nPOST /exports/accounting?from=&to=&format=\n```\n**স্ক্রিন:** Payment dialog (split), Deposit/Refund, Cashier shift, Night audit wizard, AR/City ledger, Reconciliation, Tax/VAT report, Accounting export।\n\n## ৮. পিটফল\n1. callback দেখেই সফল মানা\n2. webhook idempotent নয়\n3. ডিপোজিট রেভিনিউ ধরা\n4. night audit ডাবল পোস্ট\n5. refund > payment\n6. কার্ড/ID ডেটা অনিরাপদ\n\n---\n\n## ৯. অ্যাড-অন: Restaurant / Bar POS\n\n### কেন নিজস্ব মডিউল\nশুধু \"রুমে চার্জ\" ইন্টিগ্রেশন নয়; ছোট হোটেল-রিসোর্টের জন্য একই সিস্টেমে POS থাকলে ডুপ্লিকেট ডেটা ও সিঙ্ক সমস্যা কমে।\n\n### মূল ধারণা\n| ধারণা | ব্যাখ্যা |\n|---|---|\n| Outlet | রেস্টুরেন্ট, বার, কফি শপ, রুম সার্ভিস |\n| Table / Section | টেবিল স্ট্যাটাস (খালি, অর্ডার, বিল চাওয়া) |\n| Menu / Category / Item / Modifier | আইটেম, সাইজ, অ্যাড-অন |\n| Order / Check | খোলা টিকিট |\n| **KOT/BOT** | রান্নাঘর/বারে অর্ডার টিকিট |\n| Void / Discount / Comp | অনুমতি ও কারণসহ |\n| Split bill | আইটেম বা সমানভাবে ভাগ |\n| **Settle** | নগদ/কার্ড/bKash বা **Room Charge** |\n\n```mermaid\nflowchart LR\n    T[Table open] --> O[Order items]\n    O --> K[KOT: kitchen/bar]\n    K --> S[Served]\n    S --> B[Bill + tax + service charge]\n    B --> P{Settle}\n    P -->|Cash/Card/MFS| REV[Outlet revenue]\n    P -->|Room charge| FOL[Folio posting]\n```\n\n```sql\noutlet(id, property_id, name, type, tax_group)\npos_table(id, outlet_id, label, status)\nmenu_item(id, outlet_id, category_id, name, price, tax_group, recipe_id NULL, active)\npos_check(id, outlet_id, table_id NULL, opened_by, status, opened_at, closed_at, subtotal, tax, total)\npos_check_line(id, check_id, menu_item_id, qty, unit_price, modifiers jsonb, status /*ordered|sent|voided*/)\npos_payment(id, check_id, method, amount, folio_id NULL, reference)\nUNIQUE(outlet_id, check_no)\n```\n\n### রুম চার্জ নিয়ম\n- POS গেস্ট যাচাই: রুম নম্বর + নাম, in-house স্ট্যাটাস, \"no post\" ফ্ল্যাগ\n- পোস্টিং `source='pos'`, `reference_id = check_id` (ডাবল পোস্ট রোধ — ডক ০৭)\n- রিফান্ড/ভয়েজ → folio reversal\n- **ইন্টারনেট ছাড়া POS**: স্থানীয় ক্যাশ করা মেনু, অর্ডার কিউ, পরে সিঙ্ক — রেস্টুরেন্টে এটি গুরুত্বপূর্ণ\n\n**এজ কেস:** চেকআউটের পর দেরিতে POS চার্জ, সার্ভিস চার্জ ও VAT আলাদা হার, টিপ, কমপ্লিমেন্টারি ব্রেকফাস্ট (প্যাকেজ চার্জ → POS-এ ০ টাকা কিন্তু ক্যাভার গণনা), শিফট ক্লোজ, Z-রিপোর্ট।\n\n## ১০. অ্যাড-অন: Spa, Activities ও Tour Desk\n\n- **Spa**: সেবা (60 মিনিট ম্যাসাজ) → রিসোর্স (থেরাপিস্ট + কক্ষ) বুকিং (ডক ০৫ রিসোর্স মডেল) → কনফার্ম → check-in/সেবা → folio বা সরাসরি পেমেন্ট। প্যাকেজ (রুম + স্পা), কমিশন (থেরাপিস্ট), ক্যানসেল নীতি আলাদা।\n- **Activities/Tour**: ট্যুর, বোট রাইড, এয়ারপোর্ট পিকআপ — সংরক্ষিত ধারণক্ষমতা (সিট), সময়সূচি, মূল্য, সরবরাহকারী (তৃতীয় পক্ষ হলে খরচ ও মার্জিন)।\n- `charge_code` আলাদা (SPA, TOUR, TRANSPORT), বিভাগ-ভিত্তিক রিপোর্ট।\n- **এজ কেস:** আবহাওয়ায় বাতিল (ফোর্স মেজর), সিজনাল অ্যাক্টিভিটি, সদস্য/গেস্ট ভিন্ন দাম।\n\n## ১১. SaaS বিলিং (PMS-এর নিজের ব্যবসা)\n\nযিনি PMS বানাচ্ছেন, তার নিজের গ্রাহক-বিলিংও দরকার (হোটেল-ফোলিও থেকে ভিন্ন!): প্ল্যান, সাবস্ক্রিপশন, প্রপার্টি/রুম সংখ্যা অনুযায়ী মূল্য, ট্রায়াল, রিনিউয়াল, ব্যর্থ পেমেন্ট retry, প্ল্যান আপগ্রেড/ডাউনগ্রেড (entitlement বদল — ডক ১৩)। `subscription`, `plan`, `plan_module`, `invoice_saas` — হোটেল ledger-এর সাথে মেশাবে না।\n", "title_en": "09 — Payments & Accounting", "md_en": "# 09 — Payments & Accounting\n\n---\n\n## 1. Payment types\n\n| Type | Meaning |\n|---|---|\n| Cash | Cash |\n| Card (POS terminal / online) | Visa/Mastercard etc. |\n| MFS | bKash, Nagad, Rocket (mobile wallets) |\n| Bank transfer | Bank transfer |\n| Direct bill / City ledger | Bill the company, collect later |\n| OTA virtual card / prepaid | Payment from the OTA |\n| Voucher / Gift card | |\n\n## 2. Payment lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Initiated\n    Initiated --> Pending: guest at gateway\n    Pending --> Authorized: pre-auth\n    Pending --> Succeeded\n    Authorized --> Captured\n    Authorized --> Voided\n    Pending --> Failed\n    Pending --> Cancelled\n    Succeeded --> PartiallyRefunded\n    Succeeded --> Refunded\n    Captured --> Refunded\n    Succeeded --> Disputed\n```\n**Terms:** *Authorization* = hold the money; *Capture* = actually take it; *Void* = cancel an authorisation; *Refund* = return a successful payment; *Chargeback* = a claim by the cardholder's bank.\n\n---\n\n## 3. Deposits, advances, refunds (workflow)\n\n**Deposit (at booking):** % or fixed per policy → payment link/gateway → `payment(status=succeeded, scope=booking)`.\n**At check-in:** the deposit is **transferred** to the folio (credit) — not revenue; it moves from liability to the main ledger.\n**Refund:** back through the original payment method (gateway API), otherwise cash/bank; permission + reason + audit.\n\n```mermaid\nflowchart TD\n    A[Refund request] --> B{Permitted?}\n    B -- No --> M[Manager approval]\n    M --> C\n    B -- Yes --> C{Original payment via gateway?}\n    C -- Yes --> G[Gateway refund API]\n    C -- Cash --> H[Cash out + cashier shift]\n    G --> R{Success?}\n    R -- No --> F[Failed: retry / manual bank transfer]\n    R -- Yes --> L[Negative payment on folio + audit]\n    H --> L\n```\n\n**Edge cases:** partial refunds; refund never larger than the original payment; refund time limits/rules per gateway (bKash/card); deducting no-show fees; forfeited deposits recognised as income.\n\n---\n\n## 4. Bangladesh payment gateway integration\n\n### bKash (Tokenized Checkout)\nFlow based on the official docs (developer.bka.sh) and public client libraries:\n1. **Grant token** (id_token, with refresh)\n2. **Create payment** → `bkashURL`, `paymentID`; `statusCode == \"0000\"` only means the session was created, not paid\n3. Send the guest to bkashURL\n4. bKash returns the guest to your `callbackURL` (status: success/failure/cancel)\n5. On success, **Execute payment** (with paymentID); never execute on failure/cancel\n6. Confirm with **Payment status / Search transaction**; **Refund** API; verify the **IPN (SNS signed)**\n- Header formats and API versions change — **always confirm against your own credentials and the latest official docs**.\n\n### SSLCommerz (v4)\nSummary of the official docs:\n1. Once checkout is confirmed, **create a session** (Session ID)\n2. Send the guest to the hosted page / Easy Checkout\n3. **IPN** listener (configured in the merchant panel) — POST messages\n4. Always verify with the **Order/Transaction Validation API** (txn id, amount, currency) before trusting the IPN\n5. Refund API\n- Sandbox and live are separate environments\n\n### Design pattern (gateway-neutral)\n```mermaid\nsequenceDiagram\n    participant G as Guest\n    participant P as PMS / Booking engine\n    participant GW as Gateway (bKash/SSLCommerz)\n    G->>P: wants to pay deposit\n    P->>P: payment(status=initiated, idempotency_key)\n    P->>GW: create session/payment\n    GW-->>P: redirect URL\n    P-->>G: redirect\n    G->>GW: pays\n    GW-->>G: callback → P\n    GW-)P: IPN/webhook (server to server)\n    P->>GW: verify/validate API\n    P->>P: status=succeeded (once only), credit folio/booking\n    P-)Notif: receipt, confirmation\n```\n**Core rules:**\n- **A callback is not proof.** Never mark success without server-side verification (validation/status API).\n- **Idempotent webhooks/IPN**: the same event twice must not credit twice (`gateway_txn_id` UNIQUE).\n- Match amount and currency (guest paid less / tampering).\n- **Pending timeout**: the guest closed the browser — a reconciliation job polls the status API.\n- Clearly mark test mode/sandbox (simulated payments must never look real).\n- Secrets (API keys) in a vault, never in logs. No card numbers in your own DB (use hosted gateways to stay out of PCI DSS scope).\n\nDB:\n```sql\npayment(id, property_id, folio_id NULL, booking_id NULL, method, provider,\n  amount, currency, status, provider_txn_id UNIQUE, provider_payload_json,\n  idempotency_key UNIQUE, captured_at, refunded_amount, created_by, cashier_shift_id)\npayment_event(id, payment_id, type, raw_json, received_at)   -- log\nrefund(id, payment_id, amount, reason, status, provider_ref, approved_by)\n```\n\n---\n\n## 5. Night audit\n\n### Meaning\nClose the day's accounts and start the new business date.\n\n```mermaid\nflowchart TD\n    S[Start: user, time] --> A[Pre-check: pending check-in/out, open POS, open cashier shifts]\n    A -->|problem| X[Fix / override]\n    X --> A\n    A -->|ok| B[Process no-shows + fees]\n    B --> C[Post room & tax for all in-house]\n    C --> D[Trial balance: debits = credits, folio totals = ledger]\n    D --> E[Reports: manager, revenue, cashier, tax]\n    E --> F[Business date +1]\n    F --> G[Generate HK tasks, email owner report]\n```\n\n**Engineering:**\n- **Idempotent and resumable** (can be re-run after a crash without double posting)\n- `night_audit_run(id, property_id, business_date, status, started_at, finished_at, steps_json, error)`\n- `UNIQUE(stay_id, business_date, charge_code)` for room charge postings\n- Lock during the audit (queue other postings)\n- **Automatic audit**: some PMSs run it themselves at a set time — alert on exceptions\n- Posting to a past date (backdating) → permission + audit log\n\n**Edge cases:** check-in at 2 a.m. (which business date?); late check-out fees; stay extensions; wrong room charge; time zone/DST (Bangladesh usually has no DST, but keep the system generic).\n\n---\n\n## 6. Accounting concepts\n\n### Revenue vs cash\n- **Revenue recognition**: room revenue is recognised on the night of stay (in night audit), whether payment came earlier or later.\n- **Deposit** = liability (advance deposit ledger) → moved to revenue/folio during the stay.\n- **City ledger / AR**: company receivables; aging analysis, invoices, payment matching.\n\n### Double entry (simplified)\n| Event | Debit | Credit |\n|---|---|---|\n| Room charge posted | Guest Ledger (AR) | Room Revenue + VAT Payable |\n| Cash payment | Cash | Guest Ledger |\n| Advance deposit | Cash/Bank | Advance Deposit (liability) |\n| Deposit to folio | Advance Deposit | Guest Ledger |\n| Commission (OTA) | Commission Expense | AP / OTA payable |\n| Transfer to company | City Ledger (AR) | Guest Ledger |\n\n**Chart of accounts mapping:** `charge_code → gl_account`, `payment_method → gl_account`. A PMS does not do all accounting itself; usually it **exports to an accounting system** (Tally, QuickBooks, Xero — Tally is widely used locally, but check the market).\n\n### Reconciliation\n- Gateway settlement report ↔ PMS payments\n- Cashier shift variance\n- OTA commission invoice ↔ PMS bookings\n- Bank statement\n\n### Commission and VAT\n- Track OTA commission, net/gross reports\n- Tax reports (monthly export). Official formats: doc 16.\n\n---\n\n## 7. API and screens\n```\nPOST /payments/intents          // gateway session\nPOST /payments/webhooks/{provider}\nGET  /payments/{id}             POST /payments/{id}/refund\nPOST /cashier-shifts/open|close\nPOST /night-audit/run           GET /night-audit/{date}\nGET  /ledger/trial-balance?date=\nGET  /ar/aging                  POST /ar/{company}/payments\nPOST /exports/accounting?from=&to=&format=\n```\n**Screens:** payment dialog (split), deposit/refund, cashier shift, night audit wizard, AR/city ledger, reconciliation, tax/VAT report, accounting export.\n\n## 8. Pitfalls\n1. Treating the callback as success\n2. Non-idempotent webhooks\n3. Counting deposits as revenue\n4. Night audit double posting\n5. Refund > payment\n6. Unsafe card/ID data\n\n---\n\n## 9. Add-on: Restaurant / Bar POS\n\n### Why its own module\nNot just a \"charge to room\" integration; for small hotels and resorts, having POS in the same system reduces duplicate data and sync problems.\n\n### Core concepts\n| Concept | Explanation |\n|---|---|\n| Outlet | Restaurant, bar, coffee shop, room service |\n| Table / Section | Table status (free, ordering, bill requested) |\n| Menu / Category / Item / Modifier | Items, sizes, add-ons |\n| Order / Check | Open ticket |\n| **KOT/BOT** | Order tickets for kitchen/bar |\n| Void / Discount / Comp | With permission and reason |\n| Split bill | By item or equally |\n| **Settle** | Cash/card/bKash or **room charge** |\n\n```mermaid\nflowchart LR\n    T[Table open] --> O[Order items]\n    O --> K[KOT: kitchen/bar]\n    K --> S[Served]\n    S --> B[Bill + tax + service charge]\n    B --> P{Settle}\n    P -->|Cash/Card/MFS| REV[Outlet revenue]\n    P -->|Room charge| FOL[Folio posting]\n```\n\n```sql\noutlet(id, property_id, name, type, tax_group)\npos_table(id, outlet_id, label, status)\nmenu_item(id, outlet_id, category_id, name, price, tax_group, recipe_id NULL, active)\npos_check(id, outlet_id, table_id NULL, opened_by, status, opened_at, closed_at, subtotal, tax, total)\npos_check_line(id, check_id, menu_item_id, qty, unit_price, modifiers jsonb, status /*ordered|sent|voided*/)\npos_payment(id, check_id, method, amount, folio_id NULL, reference)\nUNIQUE(outlet_id, check_no)\n```\n\n### Room charge rules\n- POS verifies the guest: room number + name, in-house status, \"no post\" flag\n- Posting with `source='pos'`, `reference_id = check_id` (prevents double posting — doc 07)\n- Refund/void → folio reversal\n- **POS without internet**: locally cached menu, order queue, sync later — important for restaurants\n\n**Edge cases:** late POS charges after check-out, different rates for service charge and VAT, tips, complimentary breakfast (package charge → zero on POS but covers counted), shift close, Z-report.\n\n## 10. Add-on: Spa, activities and tour desk\n\n- **Spa**: service (60-minute massage) → book resources (therapist + room, doc 05 resource model) → confirm → service → folio or direct payment. Packages (room + spa), therapist commission, separate cancellation policies.\n- **Activities/tours**: tours, boat rides, airport pickups — reserved capacity (seats), schedule, price, supplier (cost and margin if third party).\n- Separate `charge_code`s (SPA, TOUR, TRANSPORT), department-level reports.\n- **Edge cases:** weather cancellations (force majeure), seasonal activities, member/guest pricing.\n\n## 11. SaaS billing (the PMS vendor's own business)\n\nIf you build a PMS as SaaS, you also need billing for your own customers (separate from hotel folios!): plans, subscriptions, pricing by property/room count, trials, renewals, failed payment retries, plan upgrades/downgrades (entitlement changes — doc 13). Keep `subscription`, `plan`, `plan_module`, `invoice_saas` separate from the hotel ledger.\n"}, "10": {"n": 10, "title": "১০ — OTA, চ্যানেল ম্যানেজার, GDS", "md": "# ১০ — OTA, চ্যানেল ম্যানেজার, GDS\n\n> এই ডকে সাধারণ শিল্প-প্যাটার্ন আছে। ভেন্ডর-নির্দিষ্ট API বিবরণের জন্য (Booking.com, Expedia, Google) প্রতিটি পার্টনারের কানেক্টিভিটি ডক পড়ো — অফিসিয়াল লিংক ডক ২৮-এ।\n\n---\n\n## ১. বিতরণ চ্যানেলের মানচিত্র\n\n```mermaid\nflowchart TB\n    PMS((PMS)) <--> CM[Channel Manager]\n    PMS <--> BE[Booking Engine - direct]\n    CM <--> OTA1[Booking.com]\n    CM <--> OTA2[Expedia]\n    CM <--> OTA3[Agoda]\n    CM <--> OTA4[Airbnb / iCal সাইট]\n    CM <--> GDS[GDS via switch/CRS]\n    TA[Travel Agent / Tour Operator] --> PMS\n    CORP[Corporate] --> GDS\n```\n\n| টার্ম | মানে |\n|---|---|\n| **OTA** | Online Travel Agency — বুকিং এনে কমিশন নেয় |\n| **Channel Manager** | একবার রেট/availability আপডেট → সব চ্যানেলে; বুকিং ফেরত আনে |\n| **CRS** | Central Reservation System — চেইনের কেন্দ্রীয় বুকিং |\n| **GDS** | Sabre, Amadeus, Travelport — ট্রাভেল এজেন্ট/কর্পোরেট |\n| **Metasearch** | Google Hotel Ads, Trivago — দাম তুলনা |\n| **Direct (BE)** | নিজের ওয়েবসাইট, কমিশন নেই |\n| **Wholesaler/Bedbank** | পাইকারি রেট |\n\n**কেন:** একা হাতে প্রতিটি সাইটে আপডেট করলে ভুল ও ওভারবুকিং; কমিশন বনাম এক্সপোজার ট্রেডঅফ।\n\n> উদাহরণ হিসাব: মাসে ৬০ বুকিং ওয়েবসাইটে সরালে, গড় ৳১০,০০০ বুকিং, এজেন্ট কমিশন ১৮% বনাম ওয়েবসাইট ~২% → বছরে ৳১১.৫২ লাখ সাশ্রয়। উদাহরণ হার মাত্র।\n\n---\n\n## ২. ARI — সিঙ্ক্রোনাইজেশনের মূল ডেটা\n\n**ARI = Availability, Rates, Inventory (restrictions)**\n\nPMS → CM → OTA (push):\n- প্রতি room type/rate plan/তারিখে: available count, price, MinLOS, CTA/CTD, stop-sell\n\nOTA → CM → PMS (pull/push):\n- নতুন বুকিং, পরিবর্তন, ক্যানসেলেশন\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant OB as Outbox/Queue\n    participant CM as Channel Manager\n    participant OTA\n    PMS->>PMS: বুকিং/ক্যানসেল (DB tx)\n    PMS->>OB: event: inventory.changed(room_type, dates)\n    OB->>CM: ARI delta\n    CM->>OTA: update availability\n    OTA-->>CM: ack/error\n    OTA->>CM: নতুন reservation\n    CM->>PMS: POST /channel/reservations (idempotent)\n    PMS->>PMS: inventory আটকাও, ack\n    PMS-->>CM: confirmation id\n    CM-->>OTA: acknowledge\n```\n\n---\n\n## ৩. ম্যাপিং (সবচেয়ে বেশি ভুলের জায়গা)\n\nপ্রতিটি OTA-র নিজস্ব room/rate আইডি → PMS room type/rate plan।\n```sql\nchannel_connection(id, property_id, channel, credentials_enc, status, last_sync_at)\nchannel_room_map(connection_id, ota_room_id, room_type_id)\nchannel_rate_map(connection_id, ota_rate_id, rate_plan_id, price_basis /*gross|net*/, occupancy_basis)\n```\n**ম্যাপ করতে হবে:** room type, rate plan, meal plan, occupancy ভিত্তি (per-room vs per-person), ক্যানসেল নীতি, ট্যাক্স (inclusive/exclusive), কারেন্সি।\n\n**এজ কেস:** OTA বেশি/কম room type রাখে; ম্যাপ ছাড়া বুকিং এলে → ক্যুয়ারেন্টিন কিউ ও অ্যালার্ট (বুকিং হারিয়ে ফেলো না)।\n\n---\n\n## ৪. রিজার্ভেশন গ্রহণ (Inbound)\n\nধাপ: **fetch/receive → parse → map → validate → create/update → acknowledge**\n\n| ঘটনা | ক্রিয়া |\n|---|---|\n| New | reservation তৈরি, `external_ref`, source=OTA নাম |\n| Modify | পুরনোর সাথে মিলিয়ে আপডেট (diff) |\n| Cancel | ক্যানসেল, ইনভেন্টরি মুক্ত |\n| No-show রিপোর্ট | OTA পোর্টালে/API-তে |\n\n**নিয়ম:**\n- **Idempotent**: `UNIQUE(channel, external_ref, revision)`\n- OTA বুকিংয়ের কিছু ফিল্ড হোটেলে এডিট নিষেধ (রেট, গেস্ট নাম বদল OTA-তে)\n- **Payment model**: OTA collect (হোটেল পাবে OTA থেকে বা virtual card) বনাম hotel collect — folio-তে ভিন্নভাবে পোস্ট\n- **Commission**: OTA ইনভয়েসের সাথে মিলাও\n- ভার্চুয়াল কার্ড (VCC): নিরাপদ সংরক্ষণ, নির্ধারিত সময়ে চার্জ, কার্ড ডেটা PCI-সীমা সতর্কতা\n\n**এজ কেস:** একই বুকিং দুবার ডেলিভারি; modification এর আগেই cancel পৌঁছানো (অর্ডার উল্টো); টাইমজোন; পরিবর্তনে অ্যাক্সেস না থাকা রুম টাইপ; child age অনুপস্থিত; স্পেশাল রিকোয়েস্ট ও নোট; ব্যর্থ ইম্পোর্ট retry/ডেড-লেটার কিউ।\n\n---\n\n## ৫. আউটবাউন্ড (ARI Push)\n\n- **Delta push** (শুধু বদলানো) + নির্ধারিত **full sync** (রাতে)\n- রেট-লিমিট ও ব্যাচিং, retry (exponential backoff), অর্ডার সংরক্ষণ (পুরনো আপডেট নতুনকে না ওভাররাইট করে — ভার্সন/টাইমস্ট্যাম্প)\n- **Partial failure**: কিছু চ্যানেল সফল, কিছু না — প্রতি চ্যানেল অবস্থা ট্র্যাক\n- **Buffer/Safety**: শেষ ১-২ রুম সরাসরি চ্যানেলে না পাঠানো (overbooking প্রতিরোধ)\n- **Parity**: OTA ও direct রেট সমতা চুক্তি থাকতে পারে — যাচাই করো\n\n```sql\nchannel_sync_job(id, connection_id, kind /*ari_delta|full*/, scope_json,\n   status, attempts, last_error, created_at, finished_at)\n```\n\n---\n\n## ৬. ওভারবুকিং ও রেস কন্ডিশন\n- OTA-তে আপডেট পৌঁছানোর আগে আরেক চ্যানেলে বিক্রি → দুজন একই রুমে\n- প্রতিরোধ: দ্রুত push, নিরাপদ বাফার, সীমিত overbooking, ফল-ব্যাক (relocate/upgrade — ডক ০৪)\n- মনিটরিং: sync lag মেট্রিক, ব্যর্থ job অ্যালার্ট\n\n---\n\n## ৭. iCal সিঙ্ক (সরল বিকল্প)\nAirbnb/ছোট সাইট iCal ফিড ব্যবহার করে। সীমা: শুধু ব্লক/বুকড তারিখ, রেট নয়, বিলম্ব (পোলিং) বেশি, বিস্তারিত গেস্ট ডেটা নেই।\n> নতুন PMS-এর জন্য বাস্তবসম্মত ক্রমবিকাশ: **আগে iCal → পরে API-সংযোগ** (সরাসরি বা চ্যানেল হাবের মাধ্যমে)।\n\n---\n\n## ৮. GDS\n- ট্রাভেল এজেন্ট ও কর্পোরেট টুলের বুকিং চ্যানেল (Sabre, Amadeus, Travelport)\n- হোটেল সাধারণত **GDS switch/CRS** (যেমন একটি middleman) মারফত যুক্ত হয়; সরাসরি GDS সংযোগ ছোট ডেভেলপারদের জন্য কঠিন\n- কর্পোরেট **negotiated rates**, রেট কোড/প্রোমো কোড ম্যাপ\n- ব্যয়: ট্রানজ্যাকশন ফি + কমিশন\n\n**বাংলাদেশ প্রেক্ষাপট (যাচাই করো):** স্বাধীন ছোট হোটেলে GDS কম ব্যবহার; চেইন/৫-তারকা, কর্পোরেট ও আন্তর্জাতিক এজেন্টে প্রাসঙ্গিক। স্থানীয় OTA/ট্রাভেল-এজেন্ট বাজার আলাদাভাবে ডক ১৬-তে।\n\n---\n\n## ৯. Booking Engine (সরাসরি চ্যানেল)\n- হোটেলের নিজের সাইটে লাইভ প্রাইস/availability, ডিপোজিট পেমেন্ট, কনফার্মেশন, গেস্টের নিজে দেখা/ক্যানসেল লিংক\n- বাংলা/ইংরেজি, মোবাইল-ফ্রেন্ডলি, অ্যানালিটিক্স/pixel\n- API: `GET /public/availability`, `POST /public/quotes`, `POST /public/bookings`, `POST /public/payments/intents`\n- সুরক্ষা: rate limit, bot প্রতিরোধ, CAPTCHA, HOLD (checkout চলাকালীন ইনভেন্টরি আটকে কয়েক মিনিট)\n- **Marketplace**: একাধিক property-র সাধারণ বুকিং পোর্টাল — মাল্টি-টেনেন্ট সার্চ ইনডেক্স\n\n---\n\n## ১০. Metasearch (Google Hotel Ads, Trivago, Tripadvisor)\n\n### মানে\nমেটাসার্চ নিজে বুকিং নেয় না (সাধারণত) — বিভিন্ন চ্যানেলের দাম পাশাপাশি দেখায়; ক্লিক করলে গেস্ট হোটেলের Booking Engine বা OTA-তে যায়। হোটেলের সরাসরি বুকিং বাড়ানোর গুরুত্বপূর্ণ পথ।\n\n### কীভাবে কাজ করে\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant BE as Booking Engine / Connectivity Partner\n    participant META as Metasearch (যেমন Google)\n    participant G as Guest\n    PMS->>BE: ARI পরিবর্তন (রেট, availability, restriction)\n    BE->>META: ARI push (Transaction/Rate/Inventory/Availability মেসেজ)\n    G->>META: হোটেল খোঁজে, দাম দেখে\n    META->>BE: ক্লিক → ল্যান্ডিং পেজ (তারিখ, রুম, দাম)\n    BE->>PMS: বুকিং\n    META-->>BE: Price accuracy চেক (ফিডের দাম বনাম ল্যান্ডিং পেজ)\n```\n\n### ইঞ্জিনিয়ারিং বিবেচনা\n- **ডেলিভারি মোড:** Google Hotel Prices-এ ARI (push-on-change) মোড আছে, যেখানে Transaction, Rate, Inventory, Availability মেসেজ পাঠাতে হয়; পুরোনো pull/changed pricing মোডও আছে (ডক ২৮-এ অফিসিয়াল লিংক)\n- **Price accuracy:** ফিডের দাম আর ল্যান্ডিং পেজে গেস্ট যে দাম দেখে তা মিলতে হবে — ট্যাক্স/ফি, মুদ্রা, রাউন্ডিং, শিশু, প্রমো সব একই নিয়মে। কম accuracy = অংশগ্রহণ ঝুঁকিতে\n- **ল্যান্ডিং পেজ:** ডিপ-লিংক প্যারামিটার (চেক-ইন, রাত, রুম, রেট) থেকে সরাসরি সেই দাম দেখানো\n- **খরচ মডেল:** ক্লিক-প্রতি (CPC), কমিশন-প্রতি বুকিং, বা বিনামূল্যে লিস্টিং (free booking links) — ভেন্ডর/সময় অনুযায়ী বদলায়\n- **ছোট হোটেল:** সাধারণত নিজে সরাসরি নয়, Booking Engine/চ্যানেল ভেন্ডরের মাধ্যমে (\"connectivity partner\")\n- **PMS-এর কাজ:** সঠিক ও দ্রুত ARI ইভেন্ট (ডক ১১ outbox), ট্যাক্স-সহ মোট দামের এক নিয়ম (ডক ০৬), বুকিং সোর্স `META-GOOGLE` ইত্যাদি segment/channel কোড (ডক ২০ §১১.২)\n\n---\n\n## ১১. ইভেন্ট ও API সারাংশ\n```\n// inbound\nPOST /channels/{channel}/reservations     (CM → PMS)\nPOST /channels/{channel}/webhooks\n// outbound\nPOST /channels/{id}/push-ari               { scope }\nGET  /channels/{id}/status\n// ম্যাপিং\nGET/PUT /channels/{id}/room-map, /rate-map\n// ইভেন্ট\ninventory.changed, rate.changed, restriction.changed, reservation.cancelled\n```\n\n## ১২. স্ক্রিন\nChannel dashboard (স্বাস্থ্য, শেষ sync, ত্রুটি), Mapping UI, Rate/availability grid with channel overrides, Unmapped bookings queue, Commission report, Channel performance (production by source)।\n\n## ১৩. পিটফল\n1. ম্যাপ ভুল (gross/net)\n2. বুকিং ডুপ্লিকেট\n3. পুশ অর্ডারিং\n4. আনম্যাপড বুকিং হারানো\n5. কমিশন মিলে না\n6. OTA ক্যানসেল নীতি ভিন্ন\n\n---\n\n## ১৪. কৌশল: iCal → API সংযোগ (ক্রমবিকাশ)\n\n| ধাপ | কী | সুবিধা | সীমা |\n|---|---|---|---|\n| ১ | **iCal import/export** | সহজ, সব OTA জানে | বিলম্ব, শুধু ব্লক, রেট নেই |\n| ২ | একটি OTA-র সরাসরি API (পার্টনার অনুমোদন সাপেক্ষে) | রিয়েল-টাইম ARI | অনুমোদন প্রক্রিয়া, ম্যাপিং |\n| ৩ | Channel manager পার্টনার/হাব | অনেক OTA একসাথে | ফি, ডিপেন্ডেন্সি |\n| ৪ | নিজস্ব কানেক্টর | নিয়ন্ত্রণ | পরিচর্যা ব্যয় |\n\n**MVP পরামর্শ:** আগে iCal + ডাইরেক্ট বুকিং ইঞ্জিন; তারপর চ্যানেল পার্টনার।\n\n**iCal সিঙ্ক ডিজাইন:** প্রতি রুম/ইউনিটের জন্য ইউনিক ফিড URL (সিক্রেট টোকেন সহ), ইম্পোর্ট পোলিং (যেমন ১৫ মিনিট), ইম্পোর্টেড ব্লককে `source='ical'` বুকিং হিসেবে রাখো, ডিলিট হলে মুক্ত করো; একই ইভেন্ট UID ডুপ্লিকেট রোধ।\n\n## ১৫. ডাইরেক্ট বনাম OTA — সিদ্ধান্ত-সহায়ক হিসাব\n\n```\nসাশ্রয়/বুকিং = রুম রেভিনিউ × (OTA কমিশন% − ডাইরেক্ট খরচ%)\nমোট সাশ্রয় = সাশ্রয়/বুকিং × স্থানান্তরিত বুকিং সংখ্যা\n```\nডাইরেক্ট খরচে ধরো: পেমেন্ট গেটওয়ে ফি, মার্কেটিং, বুকিং ইঞ্জিন সাবস্ক্রিপশন। OTA-র দৃশ্যমানতা ক্ষতি ও parity চুক্তিও ভাবো। এটি মার্কেটিং-পেজে \"savings calculator\" হিসেবেও দেখানো যায়।\n", "title_en": "10 — OTA, Channel Manager & GDS", "md_en": "# 10 — OTA, Channel Manager & GDS\n\n> This doc covers general industry patterns. For vendor-specific API details (Booking.com, Expedia, Google), read each partner's connectivity docs — official links are in doc 28.\n\n---\n\n## 1. Map of distribution channels\n\n```mermaid\nflowchart TB\n    PMS((PMS)) <--> CM[Channel Manager]\n    PMS <--> BE[Booking Engine - direct]\n    CM <--> OTA1[Booking.com]\n    CM <--> OTA2[Expedia]\n    CM <--> OTA3[Agoda]\n    CM <--> OTA4[Airbnb / iCal sites]\n    CM <--> GDS[GDS via switch/CRS]\n    TA[Travel Agent / Tour Operator] --> PMS\n    CORP[Corporate] --> GDS\n```\n\n| Term | Meaning |\n|---|---|\n| **OTA** | Online Travel Agency — brings bookings, takes commission |\n| **Channel Manager** | Update rates/availability once → all channels; brings bookings back |\n| **CRS** | Central Reservation System — a chain's central booking system |\n| **GDS** | Sabre, Amadeus, Travelport — travel agents/corporates |\n| **Metasearch** | Google Hotel Ads, Trivago — price comparison |\n| **Direct (BE)** | Own website, no commission |\n| **Wholesaler/Bedbank** | Wholesale rates |\n\n**Why:** updating every site by hand leads to errors and overbooking; there is a trade-off between commission and exposure.\n\n> Illustrative calculation: move 60 bookings a month to the website, average booking BDT 10,000, agent commission 18% vs website cost ~2% → about BDT 11.52 lakh saved per year. Example rates only.\n\n---\n\n## 2. ARI — the core sync data\n\n**ARI = Availability, Rates, Inventory (restrictions)**\n\nPMS → CM → OTA (push):\n- Per room type/rate plan/date: available count, price, MinLOS, CTA/CTD, stop-sell\n\nOTA → CM → PMS (pull/push):\n- New bookings, modifications, cancellations\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant OB as Outbox/Queue\n    participant CM as Channel Manager\n    participant OTA\n    PMS->>PMS: booking/cancel (DB tx)\n    PMS->>OB: event: inventory.changed(room_type, dates)\n    OB->>CM: ARI delta\n    CM->>OTA: update availability\n    OTA-->>CM: ack/error\n    OTA->>CM: new reservation\n    CM->>PMS: POST /channel/reservations (idempotent)\n    PMS->>PMS: hold inventory, ack\n    PMS-->>CM: confirmation id\n    CM-->>OTA: acknowledge\n```\n\n---\n\n## 3. Mapping (where most mistakes happen)\n\nEach OTA's own room/rate IDs → PMS room type/rate plan.\n```sql\nchannel_connection(id, property_id, channel, credentials_enc, status, last_sync_at)\nchannel_room_map(connection_id, ota_room_id, room_type_id)\nchannel_rate_map(connection_id, ota_rate_id, rate_plan_id, price_basis /*gross|net*/, occupancy_basis)\n```\n**Must be mapped:** room type, rate plan, meal plan, occupancy basis (per room vs per person), cancellation policy, tax (inclusive/exclusive), currency.\n\n**Edge cases:** the OTA has more/fewer room types; a booking arrives without a mapping → quarantine queue and alert (never lose a booking).\n\n---\n\n## 4. Receiving reservations (inbound)\n\nSteps: **fetch/receive → parse → map → validate → create/update → acknowledge**\n\n| Event | Action |\n|---|---|\n| New | Create reservation, `external_ref`, source = OTA name |\n| Modify | Update by comparing with the existing one (diff) |\n| Cancel | Cancel, release inventory |\n| No-show report | Via the OTA portal/API |\n\n**Rules:**\n- **Idempotent**: `UNIQUE(channel, external_ref, revision)`\n- Some OTA booking fields must not be edited in the hotel (rate, guest name change happens on the OTA)\n- **Payment model**: OTA collect (hotel is paid by the OTA or a virtual card) vs hotel collect — posted differently on the folio\n- **Commission**: reconcile with the OTA invoice\n- Virtual cards (VCC): store securely, charge at the allowed time, mind PCI scope\n\n**Edge cases:** the same booking delivered twice; cancel arrives before the modification (reversed order); time zones; modification to an inaccessible room type; missing child ages; special requests and notes; failed import retry/dead-letter queue.\n\n---\n\n## 5. Outbound (ARI push)\n\n- **Delta push** (only changes) + scheduled **full sync** (nightly)\n- Rate limits and batching, retry (exponential backoff), ordering (an old update must not overwrite a newer one — version/timestamp)\n- **Partial failure**: some channels succeed, some fail — track status per channel\n- **Buffer/safety**: do not send the last 1–2 rooms to channels (prevents overbooking)\n- **Parity**: there may be OTA/direct rate parity agreements — check them\n\n```sql\nchannel_sync_job(id, connection_id, kind /*ari_delta|full*/, scope_json,\n   status, attempts, last_error, created_at, finished_at)\n```\n\n---\n\n## 6. Overbooking and race conditions\n- Another channel sells before the OTA update arrives → two guests for one room\n- Prevention: fast push, safety buffer, limited overbooking, fallback (relocate/upgrade — doc 04)\n- Monitoring: sync lag metric, failed job alerts\n\n---\n\n## 7. iCal sync (simple option)\nAirbnb and small sites use iCal feeds. Limits: only blocked/booked dates, no rates, long delays (polling), no detailed guest data.\n> A realistic evolution for a new PMS: **iCal first → API connections later** (directly or through a channel hub).\n\n---\n\n## 8. GDS\n- Booking channel for travel agents and corporate tools (Sabre, Amadeus, Travelport)\n- Hotels usually connect through a **GDS switch/CRS** (a middleman); a direct GDS connection is hard for small developers\n- Corporate **negotiated rates**, rate code/promo code mapping\n- Cost: transaction fees + commission\n\n**Bangladesh context (verify):** small independent hotels use GDS little; it matters for chains/5-star hotels, corporates and international agents. The local OTA/travel-agent market is covered in doc 16.\n\n---\n\n## 9. Booking engine (direct channel)\n- Live price/availability on the hotel's own site, deposit payment, confirmation, a link for the guest to view/cancel\n- Bangla/English, mobile-friendly, analytics/pixel\n- API: `GET /public/availability`, `POST /public/quotes`, `POST /public/bookings`, `POST /public/payments/intents`\n- Protection: rate limiting, bot protection, CAPTCHA, HOLD (inventory held for a few minutes during checkout)\n- **Marketplace**: a shared booking portal for many properties — multi-tenant search index\n\n---\n\n## 10. Metasearch (Google Hotel Ads, Trivago, Tripadvisor)\n\n### Meaning\nMetasearch usually does not take bookings itself — it shows prices from several channels side by side; a click sends the guest to the hotel's booking engine or an OTA. An important route to more direct bookings.\n\n### How it works\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant BE as Booking Engine / Connectivity Partner\n    participant META as Metasearch (e.g. Google)\n    participant G as Guest\n    PMS->>BE: ARI change (rate, availability, restriction)\n    BE->>META: ARI push (Transaction/Rate/Inventory/Availability messages)\n    G->>META: searches hotels, sees prices\n    META->>BE: click → landing page (dates, room, price)\n    BE->>PMS: booking\n    META-->>BE: price accuracy check (feed price vs landing page)\n```\n\n### Engineering considerations\n- **Delivery mode:** Google Hotel Prices has an ARI (push-on-change) mode using Transaction, Rate, Inventory and Availability messages; an older pull/changed-pricing mode also exists (official links in doc 28)\n- **Price accuracy:** the feed price must match what the guest sees on the landing page — tax/fees, currency, rounding, children and promos under the same rules. Low accuracy puts participation at risk\n- **Landing page:** show exactly that price from deep-link parameters (check-in, nights, room, rate)\n- **Cost model:** cost per click (CPC), commission per booking, or free listings (free booking links) — varies by vendor and over time\n- **Small hotels:** usually not direct, but through a booking engine/channel vendor (\"connectivity partner\")\n- **PMS job:** correct and fast ARI events (doc 11 outbox), one rule for tax-inclusive totals (doc 06), booking source codes such as `META-GOOGLE` for segment/channel (doc 20 §11.2)\n\n---\n\n## 11. Events and API summary\n```\n// inbound\nPOST /channels/{channel}/reservations     (CM → PMS)\nPOST /channels/{channel}/webhooks\n// outbound\nPOST /channels/{id}/push-ari               { scope }\nGET  /channels/{id}/status\n// mapping\nGET/PUT /channels/{id}/room-map, /rate-map\n// events\ninventory.changed, rate.changed, restriction.changed, reservation.cancelled\n```\n\n## 12. Screens\nChannel dashboard (health, last sync, errors), mapping UI, rate/availability grid with channel overrides, unmapped bookings queue, commission report, channel performance (production by source).\n\n## 13. Pitfalls\n1. Wrong mapping (gross/net)\n2. Duplicate bookings\n3. Push ordering\n4. Losing unmapped bookings\n5. Commission does not reconcile\n6. Different OTA cancellation policies\n\n---\n\n## 14. Strategy: iCal → API connections (evolution)\n\n| Step | What | Benefit | Limit |\n|---|---|---|---|\n| 1 | **iCal import/export** | Simple, every OTA supports it | Delay, blocks only, no rates |\n| 2 | Direct API with one OTA (subject to partner approval) | Real-time ARI | Approval process, mapping |\n| 3 | Channel manager partner/hub | Many OTAs at once | Fees, dependency |\n| 4 | Own connectors | Control | Maintenance cost |\n\n**MVP advice:** iCal + direct booking engine first; channel partner afterwards.\n\n**iCal sync design:** a unique feed URL per room/unit (with a secret token), import polling (e.g. every 15 minutes), store imported blocks as `source='ical'` bookings and release them when deleted; prevent duplicates by event UID.\n\n## 15. Direct vs OTA — a decision calculation\n\n```\nsaving per booking = room revenue × (OTA commission% − direct cost%)\ntotal saving       = saving per booking × number of bookings moved\n```\nDirect cost includes payment gateway fees, marketing and the booking engine subscription. Also consider the lost OTA visibility and parity agreements. This can be shown as a \"savings calculator\" on a marketing page.\n"}, "11": {"n": 11, "title": "১১ — ইন্টিগ্রেশন ও API প্যাটার্ন", "md": "# ১১ — ইন্টিগ্রেশন ও API প্যাটার্ন\n\n> এগুলো শিল্পে প্রচলিত প্যাটার্ন, নির্দিষ্ট কোনো ভেন্ডরের API নয়। অফিসিয়াল ভেন্ডর ডক ডক ২৮-এ।\n\n---\n\n## ১. কেন ইন্টিগ্রেশন PMS-এর প্রাণ\n\nPMS একা চলে না: payment, OTA, POS, door lock, accounting, SMS/email, WhatsApp, গভর্নমেন্ট রিপোর্টিং। প্রতিটি সংযোগ ব্যর্থ হতে পারে — তাই ডিজাইনে **ব্যর্থতা ধরে নিয়ে** চলো।\n\n```mermaid\nflowchart LR\n    PMS((PMS Core)) --- API[Public REST API]\n    PMS --- WH[Webhooks → বাইরে]\n    PMS --- IN[Inbound adapters]\n    IN --- PG[Payment GW]\n    IN --- CM[Channel Mgr]\n    IN --- POS[POS]\n    IN --- LOCK[Door Lock]\n    WH --- ACC[Accounting]\n    WH --- CRM[CRM/Marketing]\n    PMS --- MSG[SMS / Email / WhatsApp provider]\n```\n\n## ২. ইন্টিগ্রেশন ধরন\n\n| ধরন | উদাহরণ | নোট |\n|---|---|---|\n| REST/JSON | আধুনিক OTA, payment | সবচেয়ে সাধারণ |\n| SOAP/XML | পুরনো OTA/GDS/PMS | স্কিমা কঠোর |\n| Webhook (push) | payment IPN, বুকিং ইভেন্ট | সাইন যাচাই, retry |\n| File/SFTP | ব্যাংক, পুরনো accounting | ব্যাচ |\n| Direct DB/Socket | পুরনো POS, door lock | নিরাপত্তা ঝুঁকি, বাইরে রাখো |\n| iCal | Airbnb-ধরনের সাইট | সীমিত |\n| Local bridge agent | door lock, প্রিন্টার, ক্যাশ ড্রয়ার | ক্লাউড PMS-এও লাগে |\n\n## ৩. নিজের Public API ডিজাইন\n\n### নীতি\n- **Resource-ভিত্তিক REST**, ভার্সনিং `/v1/`\n- **Idempotency-Key** সব POST-এ (বুকিং, পেমেন্ট, চার্জ)\n- **Pagination** cursor-ভিত্তিক, **ফিল্টার**, `updated_since` (সিঙ্কের জন্য)\n- **এরর ফরম্যাট** একরকম:\n```json\n{\"error\":{\"code\":\"inventory.sold_out\",\"message\":\"...\",\"details\":{\"room_type_id\":\"...\"},\"request_id\":\"...\"}}\n```\n- **Auth**: OAuth2 client-credentials বা API key + scopes, per-property স্কোপ\n- **Rate limit** + `Retry-After`\n- **OpenAPI** স্পেক (ডক ও SDK জেনারেশন)\n- **সময়**: ISO-8601, UTC সংরক্ষণ; তারিখ-ভিত্তিক ফিল্ডে property-local date আলাদা (`stay_date`)\n- **টাকা**: integer minor unit (পয়সা) বা decimal স্ট্রিং; কখনো float নয়\n\n### কোর endpoint (সংক্ষেপ)\n```\nGET/POST   /v1/properties, /v1/room-types, /v1/rooms\nGET        /v1/availability\nPOST       /v1/quotes\nPOST/GET   /v1/bookings, /v1/reservations/{id}\nPOST       /v1/reservations/{id}/{check-in|check-out|cancel}\nGET/POST   /v1/guests\nGET/POST   /v1/folios/{id}/{charges|payments|invoice}\nGET        /v1/reports/{name}\nPOST       /v1/webhooks/subscriptions\n```\n\n## ৪. Webhook ডিজাইন (আউটবাউন্ড)\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant OB as Outbox\n    participant W as Webhook worker\n    participant C as Client endpoint\n    PMS->>OB: event (DB tx সহ)\n    W->>OB: poll/stream\n    W->>C: POST + X-Signature + event_id\n    alt 2xx\n      C-->>W: ok → delivered\n    else ব্যর্থ\n      W->>W: retry backoff (1m,5m,30m,…) → dead-letter\n    end\n```\n- **ইভেন্ট**: `reservation.created|modified|cancelled|checked_in|checked_out`, `folio.payment_posted`, `room.status_changed`, `night_audit.completed`\n- **Payload**: `event_id` (অনন্য), `type`, `occurred_at`, `property_id`, `data` — প্রাপক dedupe করবে\n- **Signature**: HMAC-SHA256 (শেয়ার্ড সিক্রেট) + timestamp (replay প্রতিরোধ)\n- **অর্ডার** গ্যারান্টি দেওয়া কঠিন → payload-এ `version`/`sequence`, গ্রাহক যেন আউট-অব-অর্ডার সামলায়\n\n## ৫. ইনবাউন্ড ওয়েবহুক (যেমন payment IPN)\n1. raw body সংরক্ষণ → 2. সাইন/ভ্যালিডেশন API → 3. `event_id`/`txn_id` দিয়ে dedupe → 4. দ্রুত 200 → 5. কাজ কিউতে।\n(বিস্তারিত ডক ০৯)\n\n## ৬. Outbox ও Sagas\n- DB পরিবর্তন + ইভেন্ট একই tx → **Transactional Outbox** → ব্রোকার/ওয়ার্কার\n- দীর্ঘ ক্রিয়া (বুকিং + পেমেন্ট + CM sync) → **saga**: ধাপ ও ক্ষতিপূরণ (compensation)\n\n## ৭. POS ইন্টিগ্রেশন\n- POS → PMS: `POST /v1/pos/charges {room_no|folio_id, outlet, check_id, items[], tax, total}`\n- PMS → POS: in-house গেস্ট লুকআপ (`GET /v1/in-house?room=`), ব্যালেন্স/ক্রেডিট স্ট্যাটাস\n- `UNIQUE(outlet, check_id)`; রিটার্ন/ভয়েড ইভেন্ট; ক্যাশিয়ার/শিফট ম্যাপ\n- নিজস্ব POS মডিউল থাকলে ইন-প্রসেস পোস্টিং — তবু একই folio API ব্যবহার করো\n\n## ৮. Door lock, Accounting, Messaging\n- **Lock**: key encode/revoke রিকোয়েস্ট; লোকাল ব্রিজ; offline কী; লগ\n- **Accounting**: দৈনিক/মাসিক এক্সপোর্ট (journal CSV/API), GL ম্যাপ, পুনঃএক্সপোর্ট নিরাপদ (idempotent batch id)\n- **Messaging**: provider অ্যাবস্ট্রাকশন (SMS/WhatsApp/email), টেমপ্লেট (বাংলা/ইংরেজি), ডেলিভারি স্ট্যাটাস, opt-out, কোটা/খরচ ট্র্যাক\n\n## ৯. সিঙ্ক ও কনসিস্টেন্সি\n- **Source of truth** প্রতিটি ডেটার জন্য একটি (যেমন ইনভেন্টরি = PMS)\n- ডেল্টা + রাতে ফুল রিকনসাইল\n- `updated_at` + `version` + tombstone (মোছা রেকর্ড)\n- Conflict নীতি: last-write-wins বনাম field-level merge বনাম manual review\n\n## ১০. সাধারণ পিটফল\n1. Idempotency নেই → ডাবল চার্জ\n2. Webhook সাইন যাচাই নেই\n3. শুধু callback-এ নির্ভর\n4. টাইমআউট/retry স্টর্ম (থান্ডারিং হার্ড)\n5. Third-party schema পরিবর্তনে ভাঙা — adapter + কন্ট্রাক্ট টেস্ট\n6. API key লগে ফাঁস\n7. ভার্সনিং ছাড়া breaking change\n\n---\n\n## ১১. সুপারিশকৃত API স্ট্রাকচার (সমাপনী)\n\n```\n/v1\n  /auth            token, refresh, mfa\n  /organizations   /properties   /settings   /entitlements\n  /users           /roles        /permissions\n  /room-types      /rooms        /beds\n  /inventory       /availability /holds\n  /rate-plans      /rates        /restrictions   /tax-rules   /quotes   /promos\n  /guests          /companies    /segments       /campaigns   /loyalty\n  /bookings        /reservations /groups         /waitlist\n  /stays           /arrivals     /departures     /in-house    /walk-ins\n  /folios          /payments     /refunds        /invoices    /credit-notes\n  /cashier-shifts  /night-audit\n  /housekeeping    /work-orders  /lost-found\n  /outlets         /pos          /resources      /venues      /venue-bookings\n  /staff           /rosters      /attendance\n  /stock           /purchase-orders /suppliers\n  /channels        /channel-mappings /webhooks   /webhook-subscriptions\n  /reports         /exports      /imports        /audit-logs\n  /public          (booking engine: availability, quotes, bookings, payment-intents)\n```\n**নিয়ম:** (১) সব তালিকা paginated + `updated_since`, (২) POST-এ `Idempotency-Key`, (৩) `If-Match`/`version`, (৪) একই এরর ফরম্যাট, (৫) `/public` আলাদা স্কোপ ও রেট লিমিট, (৬) OpenAPI + SDK, (৭) webhook ইভেন্ট ক্যাটালগ ভার্সনড।\n", "title_en": "11 — Integrations & API Patterns", "md_en": "# 11 — Integrations & API Patterns\n\n> These are common industry patterns, not a specific vendor's API. Official vendor docs are listed in doc 28.\n\n---\n\n## 1. Why integrations are the lifeblood of a PMS\n\nA PMS never runs alone: payments, OTAs, POS, door locks, accounting, SMS/email, WhatsApp, government reporting. Every connection can fail — so design **assuming failure**.\n\n```mermaid\nflowchart LR\n    PMS((PMS Core)) --- API[Public REST API]\n    PMS --- WH[Webhooks → outside]\n    PMS --- IN[Inbound adapters]\n    IN --- PG[Payment GW]\n    IN --- CM[Channel Mgr]\n    IN --- POS[POS]\n    IN --- LOCK[Door Lock]\n    WH --- ACC[Accounting]\n    WH --- CRM[CRM/Marketing]\n    PMS --- MSG[SMS / Email / WhatsApp provider]\n```\n\n## 2. Integration types\n\n| Type | Example | Note |\n|---|---|---|\n| REST/JSON | Modern OTAs, payments | Most common |\n| SOAP/XML | Older OTAs/GDS/PMS | Strict schemas |\n| Webhook (push) | Payment IPN, booking events | Verify signatures, retry |\n| File/SFTP | Banks, older accounting | Batch |\n| Direct DB/Socket | Older POS, door locks | Security risk, keep isolated |\n| iCal | Airbnb-like sites | Limited |\n| Local bridge agent | Door locks, printers, cash drawers | Needed even with a cloud PMS |\n\n## 3. Designing your own public API\n\n### Principles\n- **Resource-based REST**, versioned `/v1/`\n- **Idempotency-Key** on every POST (bookings, payments, charges)\n- **Cursor-based pagination**, **filters**, `updated_since` (for sync)\n- **One error format**:\n```json\n{\"error\":{\"code\":\"inventory.sold_out\",\"message\":\"...\",\"details\":{\"room_type_id\":\"...\"},\"request_id\":\"...\"}}\n```\n- **Auth**: OAuth2 client credentials or API key + scopes, per-property scope\n- **Rate limiting** + `Retry-After`\n- **OpenAPI** spec (docs and SDK generation)\n- **Time**: ISO-8601, stored in UTC; date fields in property-local date (`stay_date`)\n- **Money**: integer minor units (paisa) or decimal strings; never floats\n\n### Core endpoints (short)\n```\nGET/POST   /v1/properties, /v1/room-types, /v1/rooms\nGET        /v1/availability\nPOST       /v1/quotes\nPOST/GET   /v1/bookings, /v1/reservations/{id}\nPOST       /v1/reservations/{id}/{check-in|check-out|cancel}\nGET/POST   /v1/guests\nGET/POST   /v1/folios/{id}/{charges|payments|invoice}\nGET        /v1/reports/{name}\nPOST       /v1/webhooks/subscriptions\n```\n\n## 4. Webhook design (outbound)\n\n```mermaid\nsequenceDiagram\n    participant PMS\n    participant OB as Outbox\n    participant W as Webhook worker\n    participant C as Client endpoint\n    PMS->>OB: event (in DB tx)\n    W->>OB: poll/stream\n    W->>C: POST + X-Signature + event_id\n    alt 2xx\n      C-->>W: ok → delivered\n    else failure\n      W->>W: retry backoff (1m,5m,30m,…) → dead-letter\n    end\n```\n- **Events**: `reservation.created|modified|cancelled|checked_in|checked_out`, `folio.payment_posted`, `room.status_changed`, `night_audit.completed`\n- **Payload**: `event_id` (unique), `type`, `occurred_at`, `property_id`, `data` — receivers dedupe\n- **Signature**: HMAC-SHA256 (shared secret) + timestamp (replay protection)\n- **Ordering** is hard to guarantee → include `version`/`sequence` in the payload so consumers handle out-of-order delivery\n\n## 5. Inbound webhooks (e.g. payment IPN)\n1. Store the raw body → 2. signature/validation API → 3. dedupe by `event_id`/`txn_id` → 4. return 200 quickly → 5. do the work from a queue.\n(Details in doc 09)\n\n## 6. Outbox and sagas\n- DB change + event in the same tx → **transactional outbox** → broker/worker\n- Long operations (booking + payment + CM sync) → **saga**: steps and compensation\n\n## 7. POS integration\n- POS → PMS: `POST /v1/pos/charges {room_no|folio_id, outlet, check_id, items[], tax, total}`\n- PMS → POS: in-house guest lookup (`GET /v1/in-house?room=`), balance/credit status\n- `UNIQUE(outlet, check_id)`; return/void events; cashier/shift mapping\n- With a built-in POS module, post in-process — but still through the same folio API\n\n## 8. Door lock, accounting, messaging\n- **Lock**: key encode/revoke requests; local bridge; offline keys; logs\n- **Accounting**: daily/monthly export (journal CSV/API), GL mapping, safe re-export (idempotent batch id)\n- **Messaging**: provider abstraction (SMS/WhatsApp/email), templates (Bangla/English), delivery status, opt-out, quota/cost tracking\n\n## 9. Sync and consistency\n- One **source of truth** per piece of data (e.g. inventory = PMS)\n- Delta + full reconciliation at night\n- `updated_at` + `version` + tombstones (deleted records)\n- Conflict policy: last-write-wins vs field-level merge vs manual review\n\n## 10. Common pitfalls\n1. No idempotency → double charges\n2. No webhook signature verification\n3. Relying only on callbacks\n4. Timeout/retry storms (thundering herd)\n5. Breaking when a third-party schema changes — adapters + contract tests\n6. API keys leaking into logs\n7. Breaking changes without versioning\n\n---\n\n## 11. Recommended API structure (summary)\n\n```\n/v1\n  /auth            token, refresh, mfa\n  /organizations   /properties   /settings   /entitlements\n  /users           /roles        /permissions\n  /room-types      /rooms        /beds\n  /inventory       /availability /holds\n  /rate-plans      /rates        /restrictions   /tax-rules   /quotes   /promos\n  /guests          /companies    /segments       /campaigns   /loyalty\n  /bookings        /reservations /groups         /waitlist\n  /stays           /arrivals     /departures     /in-house    /walk-ins\n  /folios          /payments     /refunds        /invoices    /credit-notes\n  /cashier-shifts  /night-audit\n  /housekeeping    /work-orders  /lost-found\n  /outlets         /pos          /resources      /venues      /venue-bookings\n  /staff           /rosters      /attendance\n  /stock           /purchase-orders /suppliers\n  /channels        /channel-mappings /webhooks   /webhook-subscriptions\n  /reports         /exports      /imports        /audit-logs\n  /public          (booking engine: availability, quotes, bookings, payment-intents)\n```\n**Rules:** (1) every list paginated + `updated_since`, (2) `Idempotency-Key` on POST, (3) `If-Match`/`version`, (4) one error format, (5) `/public` with separate scope and rate limits, (6) OpenAPI + SDK, (7) versioned webhook event catalogue.\n"}, "12": {"n": 12, "title": "১২ — PMS ডাটা মডেল", "md": "# ১২ — PMS ডাটা মডেল\n\n> লক্ষ্য: PostgreSQL ভিত্তিক সুপারিশকৃত স্কিমা। সরলীকৃত; প্রোডাকশনে ইনডেক্স, পার্টিশন, মাইগ্রেশন যোগ করবে।\n\n---\n\n## ১. ডিজাইন নীতি\n1. **Multi-tenant**: প্রতিটি টেবিলে `org_id` (এবং প্রয়োজনে `property_id`); RLS (Row-Level Security) বা অ্যাপ-স্তরে বাধ্যতামূলক ফিল্টার\n2. **UUID** (v7 ক্রমানুসারে ভালো) বা bigint; বাইরে দেখানো আইডি আলাদা\n3. **টাকা**: `numeric(14,2)` বা integer minor unit + `currency`\n4. **সময়**: `timestamptz` UTC; রাত/তারিখ = `date` (property-local)\n5. **Append-only** ledger; soft delete (`deleted_at`) অন্যত্র\n6. **ভার্সন** (`version int`) optimistic locking\n7. **ইতিহাস/অডিট** আলাদা টেবিল\n8. কনফিগ ও ডেটা আলাদা, **তারিখ-ভিত্তিক বৈধতা** (ট্যাক্স, রেট)\n\n## ২. বড় ছবি ER\n\n```mermaid\nerDiagram\n    ORGANIZATION ||--o{ PROPERTY : has\n    ORGANIZATION ||--o{ GUEST : \"শেয়ার্ড প্রোফাইল\"\n    ORGANIZATION ||--o{ USER : staff\n    PROPERTY ||--o{ ROOM_TYPE : defines\n    ROOM_TYPE ||--o{ ROOM : contains\n    PROPERTY ||--o{ RATE_PLAN : offers\n    ROOM_TYPE ||--o{ ROOM_INVENTORY : \"প্রতি তারিখ\"\n    RATE_PLAN ||--o{ RATE_DAILY : prices\n    GUEST ||--o{ BOOKING : makes\n    BOOKING ||--|{ RESERVATION : contains\n    RESERVATION }o--|| ROOM_TYPE : books\n    RESERVATION ||--|{ RESERVATION_NIGHT : \"রাতভিত্তিক রেট\"\n    RESERVATION ||--o| STAY : \"check-in\"\n    STAY ||--|{ STAY_ROOM_ASSIGNMENT : \"\"\n    ROOM ||--o{ STAY_ROOM_ASSIGNMENT : \"\"\n    RESERVATION ||--o{ FOLIO : \"\"\n    FOLIO ||--|{ FOLIO_LINE : ledger\n    FOLIO ||--o{ INVOICE : issues\n    FOLIO ||--o{ PAYMENT : receives\n    PAYMENT ||--o{ REFUND : \"\"\n    ROOM ||--o{ HK_TASK : \"\"\n    ROOM ||--o{ WORK_ORDER : \"\"\n    PROPERTY ||--o{ NIGHT_AUDIT_RUN : \"\"\n    USER ||--o{ AUDIT_LOG : acts\n```\n\n## ৩. মূল টেবিল (কলাম সহ)\n\n### Tenant ও কনফিগ\n```sql\norganization(id, name, plan, status, created_at)\nproperty(id, org_id, name, type /*hotel|resort|guest_house|apartment|hostel|villa*/,\n  timezone, currency, business_date date, check_in_time, check_out_time,\n  address, tax_reg_no, settings jsonb, status)\nmodule_entitlement(org_id, property_id NULL, module_code, enabled, valid_from, valid_to)\n```\n\n### রুম\n```sql\nroom_type(id, property_id, code, name, max_adults, max_children, max_occupancy,\n  base_occupancy, bed_config jsonb, size_sqm, upgrade_rank, active)\nroom(id, property_id, room_type_id, number, floor, features jsonb,\n  connecting_room_id NULL, active)\nroom_inventory(property_id, room_type_id, stay_date, total_rooms, ooo_rooms,\n  blocked_rooms, booked_rooms, overbook_allowance, version,\n  PRIMARY KEY(property_id, room_type_id, stay_date))\nroom_out_of_service(id, room_id, kind /*OOO|OOS*/, from_date, to_date, reason, work_order_id)\nroom_hk_state(room_id, hk_status, occupancy_status, updated_at, updated_by)\n```\nহোস্টেলের জন্য: `bed(id, room_id, label)` + ইনভেন্টরি bed-স্তরে।\n\n### রেট\n```sql\nrate_plan(id, property_id, code, name, meal_plan, cancel_policy_id, refundable,\n  derived_from_id NULL, derive_type, derive_value, active)\nrate_rule(id, property_id, rate_plan_id, room_type_id NULL, rule_type, date_from, date_to,\n  dow_mask, adjust_type, adjust_value, priority, lead_min, lead_max, min_los, max_los)\nrate_daily(property_id, room_type_id, rate_plan_id, stay_date, amount, currency,\n  PRIMARY KEY(property_id, room_type_id, rate_plan_id, stay_date))\nrestriction_daily(property_id, room_type_id, rate_plan_id, stay_date,\n  min_los, max_los, cta, ctd, stop_sell)\ncancel_policy(id, property_id, name, rules jsonb)\ntax_rule(id, property_id, code, name, rate_pct, applies_to_group, inclusive, compound_on,\n  valid_from, valid_to)\n```\n\n### গেস্ট ও বুকিং\n```sql\nguest(id, org_id, first_name, last_name, gender, dob, nationality, phone, email, language,\n  vip_level, tags text[], marketing_consent, blacklist, merged_into_id, created_at)\nguest_document(id, guest_id, type, number_enc, country, expiry, file_ref)\ncompany_account(id, org_id, name, bin_no, credit_limit, terms_days, status)\nbooking(id, org_id, property_id, booker_guest_id, company_id NULL, source, channel,\n  external_ref, created_at)\nreservation(id, property_id, booking_id, confirmation_no UNIQUE, status, arrival_date,\n  departure_date, adults, children, room_type_id, rate_plan_id, room_id NULL,\n  guarantee_type, cancel_policy_snapshot jsonb, market_segment, group_id NULL,\n  total_amount, currency, version, created_by, created_at)\nreservation_night(reservation_id, stay_date, base_amount, tax_amount, fee_amount,\n  discount_amount, rate_plan_id, PRIMARY KEY(reservation_id, stay_date))\nreservation_guest(reservation_id, guest_id, role /*primary|adult|child*/, age)\nreservation_history(id, reservation_id, revision, snapshot jsonb, changed_by, changed_at, reason)\nstay(id, reservation_id, checked_in_at, checked_out_at, status)\nstay_room_assignment(id, stay_id, room_id, from_date, to_date, reason,\n  EXCLUDE USING gist (room_id WITH =, daterange(from_date,to_date,'[)') WITH &&))\ngroup_block(id, property_id, name, company_id, cutoff_date, status)\ngroup_block_night(block_id, room_type_id, stay_date, qty, picked_up)\n```\n\n### ফোলিও ও পেমেন্ট\n```sql\nfolio(id, property_id, type, reservation_id NULL, company_id NULL, guest_id NULL,\n  status /*open|closed*/, closed_at)\ncharge_code(id, property_id, code, name, department, revenue_group, tax_group, gl_account)\nfolio_line(id, folio_id, window_no, business_date, posted_at, kind, charge_code_id,\n  description, quantity, unit_amount, amount, currency, tax_amount, source,\n  reference_id, reversal_of_id NULL, posted_by, UNIQUE(source, reference_id))\nfolio_line_tax(folio_line_id, tax_rule_id, base_amount, tax_amount)\ninvoice(id, property_id, number UNIQUE per property, folio_id, issued_at, bill_to_type,\n  bill_to_id, subtotal, tax_total, total, status, void_of_id)\npayment(id, property_id, folio_id NULL, booking_id NULL, method, provider, amount, currency,\n  status, provider_txn_id UNIQUE, idempotency_key UNIQUE, cashier_shift_id, created_at)\nrefund(id, payment_id, amount, reason, status, provider_ref, approved_by)\nrouting_rule(id, folio_id, charge_group, to_folio_id, window_no)\ncashier_shift(id, property_id, user_id, opened_at, closed_at, opening_float, expected, counted, variance)\nnight_audit_run(id, property_id, business_date, status, steps jsonb, started_at, finished_at, error)\n```\n\n### হাউসকিপিং, মেইনটেন্যান্স, বার্তা\n```sql\nhk_task(id, property_id, room_id, type, status, assignee_id, due_date, started_at, finished_at, notes)\ninspection(id, hk_task_id, inspector_id, result, notes, checklist jsonb)\nlost_found(id, property_id, room_id, description, found_at, status)\nwork_order(id, property_id, room_id NULL, title, priority, status, assigned_to,\n  ooo_id NULL, reported_at, completed_at, cost)\nnotification(id, property_id, channel, template, to_ref, status, provider_ref, sent_at, payload jsonb)\n```\n\n### চ্যানেল, ইউজার, অডিট\n```sql\nchannel_connection(id, property_id, channel, credentials_enc, status, last_sync_at)\nchannel_room_map(connection_id, ota_room_id, room_type_id)\nchannel_rate_map(connection_id, ota_rate_id, rate_plan_id, price_basis)\nchannel_reservation_raw(id, connection_id, external_ref, revision, payload jsonb, status, UNIQUE(connection_id, external_ref, revision))\noutbox_event(id, aggregate, type, payload jsonb, created_at, published_at)\n\"user\"(id, org_id, email, name, language, status, mfa_enabled)\nrole(id, org_id, name) ; permission(code) ; role_permission(role_id, permission_code)\nuser_property_role(user_id, property_id, role_id)\naudit_log(id, org_id, property_id, user_id, action, entity, entity_id, before jsonb, after jsonb,\n  ip, user_agent, at)\n```\n\n## ৪. গুরুত্বপূর্ণ ইনডেক্স/কনস্ট্রেইন্ট\n- `reservation(property_id, arrival_date, status)`, `(property_id, departure_date, status)`\n- `reservation(confirmation_no)` UNIQUE; `booking(channel, external_ref)` UNIQUE\n- `folio_line(folio_id, business_date)`; `UNIQUE(source, reference_id)`\n- `room_inventory` PK; `payment(provider_txn_id)` UNIQUE\n- `guest(org_id, phone)`, `(org_id, lower(email))`; fuzzy নামের জন্য trigram\n- পার্টিশন: `folio_line`, `audit_log` — মাস/বছরে\n\n## ৫. ডেটা-পুনঃব্যবহার সতর্কতা\n- **কনফিগ স্ন্যাপশট**: রেট, ট্যাক্স, পলিসি বুকিংয়ে কপি\n- **ঐতিহাসিক সঠিকতা**: রুম টাইপ নাম বদলালে পুরনো ইনভয়েস অপরিবর্তিত (ইনভয়েস লাইনে text কপি)\n- **মুছা নিষেধ**: রুম/টাইপ নিষ্ক্রিয় (`active=false`)\n\n---\n\n## ৬. অ্যাড-অন মডিউলের টেবিল (সারাংশ)\n\nবিস্তারিত স্কিমা সংশ্লিষ্ট ডকে; এখানে মানচিত্র:\n\n| এলাকা | টেবিল | ডক |\n|---|---|---|\n| ভেন্যু/ইভেন্ট | `venue`, `venue_booking`, `venue_booking_item` | ০৪ |\n| রিসোর্স (স্পা, গাড়ি) | `resource`, `resource_booking` | ০৫ |\n| হোস্টেল বেড | `bed` | ০৫ |\n| CRM | `guest_segment`, `campaign`, `campaign_message`, `loyalty_account`, `loyalty_txn`, `consent_log` | ০৭ |\n| স্টাফ | `staff`, `shift_template`, `roster_entry`, `attendance`, `leave_request` | ০৮ |\n| স্টোর | `stock_item`, `stock_location`, `stock_movement`, `supplier`, `purchase_order(_line)` | ০৮ |\n| POS | `outlet`, `pos_table`, `menu_item`, `pos_check(_line)`, `pos_payment` | ০৯ |\n| SaaS | `plan`, `plan_module`, `subscription`, `module_entitlement` | ০৯, ১৩ |\n| সেটআপ | `onboarding_progress`, `import_job`, `import_row` | ১৩ |\n| সার্বজনীন | `outbox_event`, `audit_log`, `notification` | ১১, ১৪ |\n\n**sandbox ফ্ল্যাগ:** `organization.is_sandbox` বা `property.mode ('live'|'test')` — টেস্ট ডেটা লাইভ রিপোর্ট/ট্যাক্স/চ্যানেল থেকে আলাদা (ডক ১৩)।\n\n## ৭. সুপারিশকৃত ডাটাবেস স্কিমা — সারসংক্ষেপ (সমাপনী)\n\n1. **স্কিমা ভাগ**: `core` (property, room, rate, reservation, guest), `ledger` (folio, payment, invoice, audit), `ops` (hk, maintenance, staff, stock), `addons` (pos, spa, venue, crm), `platform` (org, user, role, plan, entitlement)\n2. সব টেবিলে `org_id`, `created_at/updated_at`, প্রয়োজনে `version`\n3. **Append-only**: `folio_line`, `stock_movement`, `audit_log`, `payment_event`, `loyalty_txn`\n4. **Exclusion constraints**: `stay_room_assignment`, `resource_booking`, `venue_booking`\n5. **স্ন্যাপশট**: রেট, ট্যাক্স, ক্যানসেল নীতি বুকিংয়ে; ইনভয়েস লাইনে টেক্সট কপি\n6. **পার্টিশন**: `folio_line`, `audit_log`, `outbox_event` — মাসভিত্তিক\n7. **ইনডেক্স**: উপরের ডকে নির্দিষ্ট; প্রতিটি FK-তে\n8. **RLS** টেনেন্ট আইসোলেশনে\n", "title_en": "12 — PMS Data Model", "md_en": "# 12 — PMS Data Model\n\n> Goal: a recommended PostgreSQL schema. Simplified; production adds indexes, partitions and migrations.\n\n---\n\n## 1. Design principles\n1. **Multi-tenant**: `org_id` on every table (and `property_id` where needed); RLS (Row-Level Security) or mandatory app-level filters\n2. **UUID** (v7 sorts well) or bigint; publicly exposed IDs kept separate\n3. **Money**: `numeric(14,2)` or integer minor units + `currency`\n4. **Time**: `timestamptz` in UTC; nights/dates = `date` (property-local)\n5. **Append-only** ledgers; soft delete (`deleted_at`) elsewhere\n6. **Version** (`version int`) for optimistic locking\n7. **History/audit** in separate tables\n8. Config separate from data, with **date-based validity** (tax, rates)\n\n## 2. Big-picture ER\n\n```mermaid\nerDiagram\n    ORGANIZATION ||--o{ PROPERTY : has\n    ORGANIZATION ||--o{ GUEST : \"shared profiles\"\n    ORGANIZATION ||--o{ USER : staff\n    PROPERTY ||--o{ ROOM_TYPE : defines\n    ROOM_TYPE ||--o{ ROOM : contains\n    PROPERTY ||--o{ RATE_PLAN : offers\n    ROOM_TYPE ||--o{ ROOM_INVENTORY : \"per date\"\n    RATE_PLAN ||--o{ RATE_DAILY : prices\n    GUEST ||--o{ BOOKING : makes\n    BOOKING ||--|{ RESERVATION : contains\n    RESERVATION }o--|| ROOM_TYPE : books\n    RESERVATION ||--|{ RESERVATION_NIGHT : \"nightly rates\"\n    RESERVATION ||--o| STAY : \"check-in\"\n    STAY ||--|{ STAY_ROOM_ASSIGNMENT : \"\"\n    ROOM ||--o{ STAY_ROOM_ASSIGNMENT : \"\"\n    RESERVATION ||--o{ FOLIO : \"\"\n    FOLIO ||--|{ FOLIO_LINE : ledger\n    FOLIO ||--o{ INVOICE : issues\n    FOLIO ||--o{ PAYMENT : receives\n    PAYMENT ||--o{ REFUND : \"\"\n    ROOM ||--o{ HK_TASK : \"\"\n    ROOM ||--o{ WORK_ORDER : \"\"\n    PROPERTY ||--o{ NIGHT_AUDIT_RUN : \"\"\n    USER ||--o{ AUDIT_LOG : acts\n```\n\n## 3. Main tables (with columns)\n\n### Tenant and config\n```sql\norganization(id, name, plan, status, created_at)\nproperty(id, org_id, name, type /*hotel|resort|guest_house|apartment|hostel|villa*/,\n  timezone, currency, business_date date, check_in_time, check_out_time,\n  address, tax_reg_no, settings jsonb, status)\nmodule_entitlement(org_id, property_id NULL, module_code, enabled, valid_from, valid_to)\n```\n\n### Rooms\n```sql\nroom_type(id, property_id, code, name, max_adults, max_children, max_occupancy,\n  base_occupancy, bed_config jsonb, size_sqm, upgrade_rank, active)\nroom(id, property_id, room_type_id, number, floor, features jsonb,\n  connecting_room_id NULL, active)\nroom_inventory(property_id, room_type_id, stay_date, total_rooms, ooo_rooms,\n  blocked_rooms, booked_rooms, overbook_allowance, version,\n  PRIMARY KEY(property_id, room_type_id, stay_date))\nroom_out_of_service(id, room_id, kind /*OOO|OOS*/, from_date, to_date, reason, work_order_id)\nroom_hk_state(room_id, hk_status, occupancy_status, updated_at, updated_by)\n```\nFor hostels: `bed(id, room_id, label)` + bed-level inventory.\n\n### Rates\n```sql\nrate_plan(id, property_id, code, name, meal_plan, cancel_policy_id, refundable,\n  derived_from_id NULL, derive_type, derive_value, active)\nrate_rule(id, property_id, rate_plan_id, room_type_id NULL, rule_type, date_from, date_to,\n  dow_mask, adjust_type, adjust_value, priority, lead_min, lead_max, min_los, max_los)\nrate_daily(property_id, room_type_id, rate_plan_id, stay_date, amount, currency,\n  PRIMARY KEY(property_id, room_type_id, rate_plan_id, stay_date))\nrestriction_daily(property_id, room_type_id, rate_plan_id, stay_date,\n  min_los, max_los, cta, ctd, stop_sell)\ncancel_policy(id, property_id, name, rules jsonb)\ntax_rule(id, property_id, code, name, rate_pct, applies_to_group, inclusive, compound_on,\n  valid_from, valid_to)\n```\n\n### Guests and bookings\n```sql\nguest(id, org_id, first_name, last_name, gender, dob, nationality, phone, email, language,\n  vip_level, tags text[], marketing_consent, blacklist, merged_into_id, created_at)\nguest_document(id, guest_id, type, number_enc, country, expiry, file_ref)\ncompany_account(id, org_id, name, bin_no, credit_limit, terms_days, status)\nbooking(id, org_id, property_id, booker_guest_id, company_id NULL, source, channel,\n  external_ref, created_at)\nreservation(id, property_id, booking_id, confirmation_no UNIQUE, status, arrival_date,\n  departure_date, adults, children, room_type_id, rate_plan_id, room_id NULL,\n  guarantee_type, cancel_policy_snapshot jsonb, market_segment, group_id NULL,\n  total_amount, currency, version, created_by, created_at)\nreservation_night(reservation_id, stay_date, base_amount, tax_amount, fee_amount,\n  discount_amount, rate_plan_id, PRIMARY KEY(reservation_id, stay_date))\nreservation_guest(reservation_id, guest_id, role /*primary|adult|child*/, age)\nreservation_history(id, reservation_id, revision, snapshot jsonb, changed_by, changed_at, reason)\nstay(id, reservation_id, checked_in_at, checked_out_at, status)\nstay_room_assignment(id, stay_id, room_id, from_date, to_date, reason,\n  EXCLUDE USING gist (room_id WITH =, daterange(from_date,to_date,'[)') WITH &&))\ngroup_block(id, property_id, name, company_id, cutoff_date, status)\ngroup_block_night(block_id, room_type_id, stay_date, qty, picked_up)\n```\n\n### Folios and payments\n```sql\nfolio(id, property_id, type, reservation_id NULL, company_id NULL, guest_id NULL,\n  status /*open|closed*/, closed_at)\ncharge_code(id, property_id, code, name, department, revenue_group, tax_group, gl_account)\nfolio_line(id, folio_id, window_no, business_date, posted_at, kind, charge_code_id,\n  description, quantity, unit_amount, amount, currency, tax_amount, source,\n  reference_id, reversal_of_id NULL, posted_by, UNIQUE(source, reference_id))\nfolio_line_tax(folio_line_id, tax_rule_id, base_amount, tax_amount)\ninvoice(id, property_id, number UNIQUE per property, folio_id, issued_at, bill_to_type,\n  bill_to_id, subtotal, tax_total, total, status, void_of_id)\npayment(id, property_id, folio_id NULL, booking_id NULL, method, provider, amount, currency,\n  status, provider_txn_id UNIQUE, idempotency_key UNIQUE, cashier_shift_id, created_at)\nrefund(id, payment_id, amount, reason, status, provider_ref, approved_by)\nrouting_rule(id, folio_id, charge_group, to_folio_id, window_no)\ncashier_shift(id, property_id, user_id, opened_at, closed_at, opening_float, expected, counted, variance)\nnight_audit_run(id, property_id, business_date, status, steps jsonb, started_at, finished_at, error)\n```\n\n### Housekeeping, maintenance, messages\n```sql\nhk_task(id, property_id, room_id, type, status, assignee_id, due_date, started_at, finished_at, notes)\ninspection(id, hk_task_id, inspector_id, result, notes, checklist jsonb)\nlost_found(id, property_id, room_id, description, found_at, status)\nwork_order(id, property_id, room_id NULL, title, priority, status, assigned_to,\n  ooo_id NULL, reported_at, completed_at, cost)\nnotification(id, property_id, channel, template, to_ref, status, provider_ref, sent_at, payload jsonb)\n```\n\n### Channels, users, audit\n```sql\nchannel_connection(id, property_id, channel, credentials_enc, status, last_sync_at)\nchannel_room_map(connection_id, ota_room_id, room_type_id)\nchannel_rate_map(connection_id, ota_rate_id, rate_plan_id, price_basis)\nchannel_reservation_raw(id, connection_id, external_ref, revision, payload jsonb, status, UNIQUE(connection_id, external_ref, revision))\noutbox_event(id, aggregate, type, payload jsonb, created_at, published_at)\n\"user\"(id, org_id, email, name, language, status, mfa_enabled)\nrole(id, org_id, name) ; permission(code) ; role_permission(role_id, permission_code)\nuser_property_role(user_id, property_id, role_id)\naudit_log(id, org_id, property_id, user_id, action, entity, entity_id, before jsonb, after jsonb,\n  ip, user_agent, at)\n```\n\n## 4. Important indexes/constraints\n- `reservation(property_id, arrival_date, status)`, `(property_id, departure_date, status)`\n- `reservation(confirmation_no)` UNIQUE; `booking(channel, external_ref)` UNIQUE\n- `folio_line(folio_id, business_date)`; `UNIQUE(source, reference_id)`\n- `room_inventory` PK; `payment(provider_txn_id)` UNIQUE\n- `guest(org_id, phone)`, `(org_id, lower(email))`; trigram for fuzzy names\n- Partitioning: `folio_line`, `audit_log` — by month/year\n\n## 5. Data reuse warnings\n- **Config snapshots**: rates, taxes and policies copied into bookings\n- **Historical accuracy**: renaming a room type does not change old invoices (copy text into invoice lines)\n- **No deleting**: deactivate rooms/types (`active=false`)\n\n---\n\n## 6. Add-on module tables (summary)\n\nDetailed schemas are in the related docs; here is the map:\n\n| Area | Tables | Doc |\n|---|---|---|\n| Venues/events | `venue`, `venue_booking`, `venue_booking_item` | 04 |\n| Resources (spa, vehicles) | `resource`, `resource_booking` | 05 |\n| Hostel beds | `bed` | 05 |\n| CRM | `guest_segment`, `campaign`, `campaign_message`, `loyalty_account`, `loyalty_txn`, `consent_log` | 07 |\n| Staff | `staff`, `shift_template`, `roster_entry`, `attendance`, `leave_request` | 08 |\n| Store | `stock_item`, `stock_location`, `stock_movement`, `supplier`, `purchase_order(_line)` | 08 |\n| POS | `outlet`, `pos_table`, `menu_item`, `pos_check(_line)`, `pos_payment` | 09 |\n| SaaS | `plan`, `plan_module`, `subscription`, `module_entitlement` | 09, 13 |\n| Setup | `onboarding_progress`, `import_job`, `import_row` | 13 |\n| Shared | `outbox_event`, `audit_log`, `notification` | 11, 14 |\n\n**Sandbox flag:** `organization.is_sandbox` or `property.mode ('live'|'test')` — test data kept out of live reports, tax and channels (doc 13).\n\n## 7. Recommended database schema — summary\n\n1. **Schema split**: `core` (property, room, rate, reservation, guest), `ledger` (folio, payment, invoice, audit), `ops` (hk, maintenance, staff, stock), `addons` (pos, spa, venue, crm), `platform` (org, user, role, plan, entitlement)\n2. `org_id`, `created_at/updated_at` on every table, `version` where needed\n3. **Append-only**: `folio_line`, `stock_movement`, `audit_log`, `payment_event`, `loyalty_txn`\n4. **Exclusion constraints**: `stay_room_assignment`, `resource_booking`, `venue_booking`\n5. **Snapshots**: rates, tax and cancellation policy on bookings; text copied into invoice lines\n6. **Partitioning**: `folio_line`, `audit_log`, `outbox_event` — monthly\n7. **Indexes**: as listed above; on every FK\n8. **RLS** for tenant isolation\n"}, "13": {"n": 13, "title": "১৩ — PMS আর্কিটেকচার", "md": "# ১৩ — PMS আর্কিটেকচার\n\n---\n\n## ১. Legacy PMS আর্কিটেকচার\n\n```mermaid\nflowchart LR\n    C1[Desktop client] --> S[On-premise server]\n    C2[Desktop client] --> S\n    S --> DB[(Local DB: SQL Server / Access / Firebird)]\n    S --> I1[Interface server: POS, PBX, Lock]\n    I1 --> X[Serial / TCP / file ইন্টারফেস]\n    S --> BK[ম্যানুয়াল ব্যাকআপ]\n```\n**বৈশিষ্ট্য:** হোটেলের ভেতরের সার্ভার, ডেস্কটপ ক্লায়েন্ট, ইন্টারফেস (RS-232/TCP/ফাইল), নিজে আপগ্রেড, নিজে ব্যাকআপ।\n**সুবিধা:** ইন্টারনেট ছাড়াই চলে, লোকাল ডিভাইস সহজ।\n**অসুবিধা:** আপডেট কঠিন, রিমোট অ্যাক্সেস/রিপোর্ট কঠিন, OTA/API ইন্টিগ্রেশন দুর্বল, ডেটা হারানোর ঝুঁকি, মাল্টি-প্রপার্টি জটিল।\nবাংলাদেশে অনেক পুরনো/ডেস্কটপ ইনস্টলেশন থাকতে পারে বলে ধরা হয় (যাচাই দরকার) — তাই মাইগ্রেশন পথ গুরুত্বপূর্ণ।\n\n## ২. আধুনিক Cloud PMS\n\n```mermaid\nflowchart TB\n    subgraph Clients\n      W[Web app - staff]\n      M[Mobile HK / PWA]\n      BE[Booking engine - guest]\n      P[Partner API clients]\n    end\n    CDN[CDN / WAF] --> GW[API Gateway: authN, rate limit]\n    W --> CDN\n    M --> CDN\n    BE --> CDN\n    P --> GW\n    CDN --> GW\n    GW --> AUTH[Auth / IAM]\n    GW --> APP\n    subgraph APP[Core Services]\n      RES[Reservation]\n      INV[Inventory & Rates]\n      FOL[Folio & Billing]\n      GST[Guest]\n      HK[Housekeeping/Maint.]\n      FO[Front Office]\n      RPT[Reporting]\n      NOTIF[Notification]\n    end\n    APP --> PG[(PostgreSQL primary)]\n    PG --> RR[(Read replicas)]\n    APP --> CACHE[(Redis)]\n    APP --> BUS[[Event bus / Queue]]\n    BUS --> WRK[Workers: night audit, sync, webhooks]\n    WRK --> CM[Channel adapters]\n    WRK --> PGW[Payment adapters]\n    WRK --> MSG[SMS/Email/WhatsApp]\n    PG --> DWH[(Analytics / Warehouse)]\n    APP --> OBJ[(Object storage: IDs, files)]\n```\n\n### সুপারিশ: **Modular Monolith** দিয়ে শুরু\n- একটি ডিপ্লয়, কিন্তু মডিউল সীমা স্পষ্ট (Reservation, Inventory, Folio, Guest, HK…)\n- ইনভেন্টরি + বুকিং + ফোলিও-র ACID ট্রানজ্যাকশন সহজ\n- পরে চাপ বুঝে বের করো (Channel sync, Notification, Reporting আগে মাইক্রোসার্ভিস প্রার্থী)\n- **শুরুতেই মাইক্রোসার্ভিস = বিতরিত ট্রানজ্যাকশন জটিলতা** (inventory ↔ reservation)\n\n## ৩. মাল্টি-টেনেন্সি\n\n| মডেল | ব্যাখ্যা | মন্তব্য |\n|---|---|---|\n| Shared DB + `org_id` + RLS | সব টেনেন্ট একই টেবিলে | সস্তা, স্কেলযোগ্য; আইসোলেশন কোডে |\n| Schema-per-tenant | প্রতি টেনেন্ট স্কিমা | মাঝারি, মাইগ্রেশন জটিল |\n| DB-per-tenant | আলাদা DB | বড়/এন্টারপ্রাইজ, ব্যয়বহুল |\n\n**সুপারিশ:** Shared + RLS দিয়ে শুরু; বড় চেইনের জন্য আলাদা DB অপশন। প্রতিটি কোয়েরিতে টেনেন্ট কনটেক্সট (middleware), টেনেন্ট-বিহীন কোয়েরি টেস্টে ফেল করাও।\n**Noisy neighbor:** রেট লিমিট, কোয়েরি টাইমআউট, ব্যাকগ্রাউন্ড জব কোটা।\n\n## ৪. স্কেলিং বিবেচনা\n- বেশিরভাগ লোড **পড়া** (availability search, tape chart) → read replica, ক্যাশ (সতর্কতার সাথে — stale availability বিপজ্জনক)\n- **রাইট হটস্পট**: `room_inventory` সারি (একই রাতে অনেক বুকিং) → ছোট ট্রানজ্যাকশন, সাজানো লক\n- **Night audit**: প্রতি প্রপার্টি আলাদা জব, সমান্তরালে, টাইমজোন-ভিত্তিক শিডিউল\n- **Search**: availability = ডিরাইভড/ম্যাটেরিয়ালাইজড; প্রয়োজনে Redis ক্যাশ ছোট TTL\n- **Reports**: প্রোডাকশন DB-তে ভারী কোয়েরি নয় — replica/warehouse\n- **Tape chart**: ভার্চুয়ালাইজড UI, পেজড/উইন্ডো API\n\n## ৫. ইভেন্ট-ড্রিভেন\n- **ডোমেইন ইভেন্ট** → Outbox → ব্রোকার (Kafka/RabbitMQ/SQS/Postgres-based) → কনজিউমার\n- কনজিউমার: CM সিঙ্ক, ওয়েবহুক, নোটিফিকেশন, অ্যানালিটিক্স, HK টাস্ক জেনারেশন\n- **অ্যাট-লিস্ট-ওয়ান্স ডেলিভারি** → কনজিউমার idempotent\n- **রিয়েল-টাইম UI**: WebSocket/SSE (room status, নতুন বুকিং)\n\n```mermaid\nflowchart LR\n    CMD[Command: Check-out] --> TX[(DB tx: reservation, room, outbox)]\n    TX --> OB[Outbox relay]\n    OB --> BUS[[Bus]]\n    BUS --> H1[HK: task তৈরি]\n    BUS --> H2[Notif: post-stay mail]\n    BUS --> H3[Channel: inventory push]\n    BUS --> H4[Webhook: partner]\n    BUS --> H5[UI push: room board]\n```\n\n## ৬. Offline / ক্লাউড বাধা\n- ব্রাউজার PWA: গুরুত্বপূর্ণ রিড ক্যাশ (in-house, arrivals), রাইট কিউ (সীমিত অপারেশন)\n- সম্পূর্ণ offline-first = conflict resolution জটিল; ব্যবসায়িক সিদ্ধান্ত: কোন কাজ offline-এ চলবে (check-in কপি, ফোলিও দেখা) আর কোনটা না (পেমেন্ট গেটওয়ে, ইনভেন্টরি বিক্রি)\n- লোকাল **bridge agent**: লক/প্রিন্টার/কার্ড মেশিন, রিট্রাই সহ\n- ডাউনটাইম রিপোর্ট (ডক ০২) স্বয়ংক্রিয় জেনারেট\n\n## ৭. ডিপ্লয়মেন্ট ও অপারেশনস\n- কন্টেইনার + অর্কেস্ট্রেশন (Kubernetes/ECS) বা সরল VM দিয়ে শুরু\n- **IaC** (Terraform), CI/CD, ব্লু-গ্রিন/ক্যানারি\n- ডাটাবেস মাইগ্রেশন: backward-compatible (expand → migrate → contract)\n- **ব্যাকআপ**: PITR (point-in-time), পুনরুদ্ধার ড্রিল; RPO/RTO লক্ষ্য\n- **মনিটরিং**: মেট্রিক (latency, error), লগ, ট্রেস, অ্যালার্ট (night audit ব্যর্থ, sync lag, payment ব্যর্থতা)\n- **অঞ্চল/ল্যাটেন্সি**: বাংলাদেশের ব্যবহারকারীর জন্য নিকটতম রিজিয়ন; ডেটা রেসিডেন্সি/আইনি প্রয়োজন যাচাই করো\n\n## ৮. টেকনোলজি স্ট্যাক (উদাহরণ, বাধ্যতা নয়)\n| স্তর | বিকল্প |\n|---|---|\n| Backend | Node.js/TypeScript (NestJS), Java/Kotlin (Spring), Go, Python (Django), PHP (Laravel — BD-তে প্রচলিত) |\n| DB | PostgreSQL (range/exclusion constraint, jsonb, RLS) |\n| Cache/Queue | Redis, RabbitMQ/Kafka/SQS |\n| Frontend | React/Next.js, Vue; ক্যালেন্ডার/টেপ চার্ট: virtualization |\n| Mobile | PWA বা React Native/Flutter |\n| Infra | AWS/GCP/Azure বা স্থানীয় ক্লাউড |\n\n## ৯. জটিল টেকনিক্যাল চ্যালেঞ্জ\n1. **ইনভেন্টরি কনকারেন্সি** ও চ্যানেল sync লেটেন্সি\n2. **টাইমজোন/business date**\n3. **রেট ইঞ্জিন** জটিলতা ও পারফরম্যান্স\n4. **ফোলিও সঠিকতা** (rounding, tax, routing)\n5. **রিপোর্ট/অডিট** ঠিক রাখা\n6. **ইন্টিগ্রেশন ভঙ্গুরতা** (third-party পরিবর্তন)\n7. **ডেটা মাইগ্রেশন** পুরনো PMS/এক্সেল থেকে\n8. **UI পারফরম্যান্স** (টেপ চার্ট)\n9. **অফলাইন সহনশীলতা**\n\n---\n\n## ১০. SaaS প্ল্যাটফর্ম স্তর: Entitlement, Onboarding, Sandbox, Import\n\n### ১০.১ Module Entitlements / Feature Flags\nপ্ল্যান অনুযায়ী কোন প্রপার্টিতে কোন মডিউল চালু (POS, Spa, Events, API অ্যাক্সেস, চ্যানেল)।\n```sql\nplan(id, code, name, price_model)\nplan_module(plan_id, module_code, limits jsonb)        -- যেমন max_rooms, api_calls\nmodule_entitlement(org_id, property_id NULL, module_code, enabled, valid_from, valid_to, source)\n```\n- **কোথায় প্রয়োগ:** API গেটওয়ে/মিডলওয়্যার (403 `module.not_enabled`), UI মেনু লুকানো, ব্যাকগ্রাউন্ড জব স্কিপ\n- **ক্যাশ**: entitlement স্বল্প TTL; আপগ্রেডে তৎক্ষণাৎ ইনভ্যালিডেট\n- **ডাউনগ্রেড**: ডেটা মুছে না — রিড-অনলি/লুকানো; সীমা অতিক্রম (বেশি রুম) হ্যান্ডলিং\n\n### ১০.২ Onboarding Wizard\nধাপ: প্রপার্টি তথ্য → রুম টাইপ → বাল্ক রুম → অ্যামেনিটি → রেট ও সিজন টেমপ্লেট → ট্যাক্স/সার্ভিস চার্জ → পলিসি → পেমেন্ট মেথড → স্টাফ/রোল → go-live চেকলিস্ট।\n```sql\nonboarding_progress(property_id, step_code, status, completed_at, data jsonb)\n```\nপ্রতিটি ধাপ রিজিউমযোগ্য, ভ্যালিডেশন (রুম টাইপ ছাড়া রুম নয়), \"পরে করব\" অনুমোদন, শেষে readiness রিপোর্ট (কোন কনফিগ বাকি)।\n\n### ১০.৩ Sandbox / Test Mode\n- প্রশিক্ষণ ও ট্রায়ালের জন্য আলাদা `mode='test'` প্রপার্টি/ডেটা; পেমেন্ট সিমুলেটেড (গেটওয়ে sandbox), চ্যানেল ও SMS ডিসেবলড বা ডামি\n- লাইভ রিপোর্ট, ট্যাক্স এক্সপোর্ট, ইনভয়েস নম্বর সিকোয়েন্স থেকে বিচ্ছিন্ন\n- টেস্ট→লাইভ রূপান্তরে ডেটা পরিষ্কার/কপি নীতি\n- UI-তে স্পষ্ট ব্যানার (ভুল করে লাইভ ভাবা রোধ)\n\n### ১০.৪ Data Import / Export\n- **Import:** CSV/Excel টেমপ্লেট (রুম, গেস্ট, ভবিষ্যৎ বুকিং, ডিপোজিট ব্যালান্স) → `import_job` → ভ্যালিডেশন (সারিভিত্তিক ত্রুটি রিপোর্ট) → ড্রাই-রান → কমিট\n```sql\nimport_job(id, property_id, type, status, file_ref, stats jsonb, created_by)\nimport_row(job_id, row_no, status, error, entity_id)\n```\n- **Export:** গ্রাহকের ডেটা তাদের নিজের (গেস্ট, বুকিং, ফোলিও, ইনভয়েস); CSV/JSON; লক-ইন ভয় কমায়, বিশ্বাস বাড়ায়\n\n## ১১. সুপারিশকৃত ক্লাউড PMS আর্কিটেকচার (সমাপনী)\n\n```mermaid\nflowchart TB\n    subgraph Edge\n      CDN[CDN + WAF]\n    end\n    subgraph Apps\n      WEB[Staff Web App - React]\n      PWA[Mobile PWA: HK, Maintenance, Staff]\n      BE[Booking Engine - public]\n    end\n    CDN --> WEB & PWA & BE\n    CDN --> GW[API Gateway: authN/Z, rate limit, entitlements]\n    GW --> MONO[Modular Monolith]\n    subgraph MONO[Modular Monolith - একটি ডিপ্লয়]\n      CORE[Core: property, room, inventory, rate, reservation, guest]\n      LED[Ledger: folio, payment, invoice, night audit]\n      OPS[Ops: HK, maintenance, staff, stock]\n      ADD[Add-ons: POS, spa, venue, CRM]\n      PLAT[Platform: org, user, role, plan, entitlement, onboarding]\n    end\n    MONO --> PG[(PostgreSQL + RLS)]\n    PG --> REP[(Read replica / Warehouse)]\n    MONO --> RD[(Redis: cache, locks, rate limit)]\n    MONO --> OBX[Outbox] --> BUS[[Queue / Event bus]]\n    BUS --> W1[Channel sync workers]\n    BUS --> W2[Webhook workers]\n    BUS --> W3[Notification workers: SMS/WhatsApp/Email]\n    BUS --> W4[Night audit / schedulers]\n    BUS --> W5[Report & export workers]\n    W1 --> OTA[(OTA / iCal / CM)]\n    W3 --> MSG[(Providers)]\n    MONO --> PGW[Payment adapters: bKash, SSLCommerz, cards]\n    MONO --> OBJ[(Object storage: IDs, files)]\n    MONO --> OBS[Observability: logs, metrics, traces]\n```\n\n**সিদ্ধান্ত সারাংশ:**\n| বিষয় | সুপারিশ |\n|---|---|\n| শুরুর স্থাপত্য | Modular monolith + worker প্রসেস |\n| DB | PostgreSQL (exclusion constraint, jsonb, RLS, partitioning) |\n| টেনেন্সি | Shared DB + `org_id` + RLS; বড় চেইনে আলাদা DB অপশন |\n| ইনভেন্টরি | Materialized per-date counters + reconciliation + conditional update |\n| ইভেন্ট | Transactional outbox → queue; consumers idempotent |\n| Realtime | SSE/WebSocket (room board, নতুন বুকিং) |\n| Offline | PWA ক্যাশ + রাইট কিউ (সীমিত অপারেশন); লোকাল bridge (লক, প্রিন্টার) |\n| নিরাপত্তা | MFA, RBAC+সীমা, field encryption, audit, signed webhooks |\n| Observability | night audit ব্যর্থতা, sync lag, payment ব্যর্থতা অ্যালার্ট |\n| ডিপ্লয় | কন্টেইনার, IaC, ব্লু-গ্রিন/ক্যানারি, PITR ব্যাকআপ + রিস্টোর ড্রিল |\n\n## ১২. সুপারিশকৃত ফ্রন্টএন্ড মডিউল স্ট্রাকচার (সমাপনী)\n\n```\napps/\n  staff-web/              (React/Next.js)\n    src/\n      app/                routing, layout, providers (auth, tenant, i18n, theme)\n      shared/             ui kit, api client (generated from OpenAPI), hooks, utils, i18n (bn/en), formatters (BDT, লাখ/কোটি, date)\n      modules/\n        dashboard/\n        front-office/     arrivals, departures, in-house, walk-in, check-in, check-out, room-rack\n        reservations/     search, form, details, tape-chart, groups, waitlist\n        rooms-inventory/  room-types, rooms, availability-calendar, ooo\n        rates/            rate-plans, rate-calendar, restrictions, rules, promos, taxes, quote-simulator\n        guests/           profiles, documents, merge, crm (segments, campaigns, loyalty)\n        folio/            folio-view, post-charge, payment, split/transfer, invoice, credit-note\n        housekeeping/     board, assignments, inspections, lost-found\n        maintenance/      work-orders, preventive\n        cashier-audit/    shifts, night-audit wizard, reconciliation\n        pos/              outlets, tables, orders, menu, kot\n        spa-activities/   resources calendar, booki
