াতা) আর নতুন PMS কয়েক দিন একসাথে — রিপোর্ট মিলাও (ডক ২৪)\n- সমস্যা লগ: তীব্রতা (blocker/major/minor), কে ঠিক করবে, পুনঃটেস্ট\n\n---\n\n## ১৫. রিলিজ নিরাপত্তা\n- **Feature flag** দিয়ে নতুন ফিচার প্রপার্টি-ভিত্তিক চালু (ডক ১৩ §১০)\n- **Backward-compatible মাইগ্রেশন:** expand → migrate → contract (কলাম যোগ, ডেটা কপি, পরে পুরোনো সরানো)\n- **Night audit চলার সময়ে ডিপ্লয় নয়** (প্রপার্টির লোকাল রাতে) — ডিপ্লয় উইন্ডো টাইমজোন-সচেতন\n- Canary: কয়েকটি প্রপার্টিতে আগে\n- মনিটরিং: বুকিং সফলতার হার, ARI কিউ দৈর্ঘ্য, night audit সময়, পেমেন্ট ব্যর্থতা — অ্যালার্ট\n\n---\n\n## ১৬. চেকলিস্ট\n- [ ] Clock ইনজেকশন, সরাসরি `now()` নেই\n- [ ] ট্যাক্স/রাউন্ডিং টেবিল-চালিত টেস্ট\n- [ ] রিজার্ভেশন স্টেট মেশিন পূর্ণ টেস্ট\n- [ ] কনকারেন্সি টেস্ট (শেষ রুম)\n- [ ] invariant property টেস্ট (availability, ledger)\n- [ ] ৯০ দিনের night audit সিমুলেশন\n- [ ] OTA/পেমেন্ট কন্ট্রাক্ট fixture (আউট-অব-অর্ডার, ডুপ্লিকেট)\n- [ ] টেন্যান্ট আইসোলেশন টেস্ট\n- [ ] E2E ৫টি মূল ফ্লো\n- [ ] লোড টেস্ট BE সার্চ ও ARI\n- [ ] UAT স্ক্রিপ্ট ও প্যারালাল রান\n", "title_en": "23 — Testing & Quality (QA for a PMS)", "md_en": "# 23 — Testing & Quality (QA for a PMS)\n\n> Goal: catch the most damaging PMS bugs — double bookings, money errors, night audit failures, broken integrations — with tests before they reach a hotel.\n> Example code in TypeScript (Node) and SQL; the ideas apply to any stack.\n\n---\n\n## 1. Why testing a PMS is hard\n| Challenge | Why |\n|---|---|\n| **Time** | Business date, time zones, cancellation deadlines, night audit — \"today\" keeps changing |\n| **Money** | Rounding, tax, refunds, balances — even one paisa wrong is a bug |\n| **Concurrency** | OTA + desk + BE selling the same room at the same time |\n| **Integrations** | Third-party sandboxes are unstable, specs change |\n| **Long flows** | Booking → arrival 30 days later → 3 nights → check-out → AR → payment 60 days later |\n| **Config variety** | Every hotel's rates, taxes and policies differ |\n\n---\n\n## 2. Test pyramid (PMS version)\n\n```mermaid\nflowchart TB\n    E2E[\"E2E — few<br/>Playwright: booking to check-out\"]\n    CON[\"Contract — OTA, CM, Payment<br/>recorded fixtures, sandbox\"]\n    INT[\"Integration — real PostgreSQL<br/>concurrency, night audit, RLS\"]\n    PROP[\"Property-based — invariants<br/>availability, ledger\"]\n    UNIT[\"Unit — many<br/>rate quotes, tax, rounding, state machine\"]\n    E2E --- CON --- INT --- PROP --- UNIT\n```\n\nLower levels are fast and numerous; upper levels are slow and few, but cover the most important flows.\n\n---\n\n## 3. Controlling time: Clock and business date\n\n**Rule:** never call `new Date()` / `now()` directly in code. Inject a `Clock`.\n\n```ts\nexport interface Clock {\n  now(): Date;                         // real time (UTC)\n  businessDate(propertyId: string): Promise<string>; // 'YYYY-MM-DD' (from DB)\n}\n\nexport class FixedClock implements Clock {\n  constructor(private t: Date, private bd: string) {}\n  now() { return this.t; }\n  async businessDate() { return this.bd; }\n  advance(ms: number) { this.t = new Date(this.t.getTime() + ms); }\n}\n\n// test: cancellation deadline (24h before arrival, hotel time zone Asia/Dhaka)\ntest('free cancel until 24h before arrival (local time)', async () => {\n  const clock = new FixedClock(new Date('2026-10-09T13:59:00+06:00'), '2026-10-09');\n  const res = await svc.cancelQuote(reservationArriving('2026-10-10T14:00+06:00'), clock);\n  expect(res.fee).toBe(0);\n  clock.advance(2 * 60_000); // 14:01 → deadline passed\n  expect((await svc.cancelQuote(reservationArriving('2026-10-10T14:00+06:00'), clock)).fee).toBeGreaterThan(0);\n});\n```\n\n---\n\n## 4. Domain unit tests\n\n### 4.1 Table-driven tests — tax and rounding\n```ts\nconst cases = [\n  // base, vatPct, scPct, inclusive, expectedTotal\n  [5000, 15, 10, false, 6325.00],   // SC first, then VAT on base + SC? — write the rule down\n  [5750, 15, 0,  true,  5750.00],\n  [3333.33, 5, 0, false, 3500.00],\n];\ntest.each(cases)('tax %p vat=%p sc=%p incl=%p', (base, vat, sc, incl, exp) => {\n  expect(quoteTotal({ base, vat, sc, inclusive: incl })).toBeCloseTo(exp, 2);\n});\n```\n> First row: 5000 + 10% SC = 5500; 5500 + 15% VAT = 6325. **The order in which taxes apply** is part of the tax config — make it explicit in tests (doc 06).\n\n### 4.2 State machine tests\nTest every allowed and forbidden transition:\n```ts\nconst allowed = {\n  confirmed: ['in_house', 'cancelled', 'no_show'],\n  in_house:  ['checked_out'],\n  no_show:   ['confirmed'],      // reinstate (with permission)\n};\nfor (const from of ALL_STATES) for (const to of ALL_STATES) {\n  test(`${from} -> ${to}`, () => {\n    const ok = allowed[from]?.includes(to) ?? false;\n    expect(canTransition(from, to)).toBe(ok);\n  });\n}\n```\n\n### 4.3 Golden-file tests — invoices\nCompare the rendered invoice (JSON or text) with a \"golden\" file. When it changes, review the diff and update. Catches tax lines, BIN, sequence numbers and Bangla text.\n\n---\n\n## 5. Property-based tests — invariants that must never break\n\n| Invariant | Meaning |\n|---|---|\n| availability ≥ −overbook_limit | After any operation |\n| Each folio's balance = sum of its lines | Always |\n| Guest + city + deposit ledger changes = sum of posted transactions | Every business date |\n| No room has two in-house stays on the same night | Always |\n| Total refunds ≤ total payments | Per payment |\n\n```ts\nimport fc from 'fast-check';\n\ntest('random booking/cancel sequence never oversells', async () => {\n  await fc.assert(fc.asyncProperty(\n    fc.array(fc.record({\n      op: fc.constantFrom('book', 'cancel', 'modify'),\n      nights: fc.integer({ min: 1, max: 5 }),\n      offset: fc.integer({ min: 0, max: 20 }),\n    }), { maxLength: 60 }),\n    async (ops) => {\n      const h = await freshHotel({ rooms: 3 });\n      for (const o of ops) await h.apply(o).catch(() => {}); // failures are acceptable\n      for (const night of h.nights()) {\n        expect(await h.soldOn(night)).toBeLessThanOrEqual(3);\n      }\n    }), { numRuns: 200 });\n});\n```\n\n---\n\n## 6. Concurrency test — \"100 people, 1 room\"\n\n```ts\ntest('100 parallel bookings for last room → exactly 1 succeeds', async () => {\n  const h = await freshHotel({ rooms: 1 });\n  const attempts = Array.from({ length: 100 }, () =>\n    api.post('/v1/reservations', h.payload({ arrival: '2026-12-20', nights: 2 }))\n       .then(r => r.status).catch(e => e.status));\n  const statuses = await Promise.all(attempts);\n  expect(statuses.filter(s => s === 201)).toHaveLength(1);\n  expect(statuses.filter(s => s === 409)).toHaveLength(99);   // NO_AVAILABILITY\n  expect(await h.inventory('2026-12-20')).toEqual({ sold: 1, available: 0 });\n});\n```\nSame technique: the same webhook 10 times at once (idempotency), a payment and check-out on the same folio at once, posting during night audit.\n\n---\n\n## 7. Integration tests with a real database\n- Run real PostgreSQL in tests with **Testcontainers** — a mock DB does not show lock/constraint/RLS behaviour\n- Each test gets its own schema/transaction rollback or a new tenant\n- Migration tests: empty DB → all migrations → seed → tests; and old-version data → new migrations\n- **RLS/tenant isolation:** call every endpoint of tenant B with tenant A's token → 404/403 (doc 14)\n\n---\n\n## 8. Contract tests — OTA, channel manager, payments\n- **Record real third-party requests/responses as fixtures** (with sensitive data removed)\n- Inbound: new booking, modify, cancel, **out-of-order** (cancel before new), duplicates, unknown room codes\n- Outbound: validate ARI message schemas (XSD/JSON Schema)\n- Payments: success, fail, timeout, IPN before callback, duplicate IPN, partial refunds — bKash/SSLCommerz sandbox (doc 09)\n- For your own public API: contract tests from the OpenAPI spec; consumer-driven (Pact) if there are partners\n\n---\n\n## 9. Night audit simulation — a \"time machine\"\n- Run a test hotel through 90 days quickly: random bookings, check-ins, charges, payments, check-outs every day, then night audit\n- Check the invariants (§5) after every audit\n- Simulate a **crash halfway**: exception at audit step 3 → re-running does not double post (idempotent steps; doc 09, case 7 in doc 19)\n- Cross month end, year end, leap year (29 February)\n\n---\n\n## 10. E2E tests (Playwright)\nFew but essential flows:\n1. Desk: walk-in booking → room assignment → check-in → charge → payment → check-out → invoice\n2. BE: search → quote → payment (sandbox) → confirmation\n3. HK: dirty → clean → inspected, room rack updates\n4. Night audit: run it, check reports\n5. Roles: a front desk agent cannot issue refunds\n\nTips: use `data-testid`, create test data through the API (not the UI), run once with the Bangla UI too.\n\n---\n\n## 11. Performance and load\n| Scenario | Target (example) |\n|---|---|\n| BE availability search | p95 < 300 ms, 50 req/s per property group |\n| OTA ARI burst (rate update 365 days × 10 room types) | No queue build-up, all channels within 5 minutes |\n| Night audit (500 rooms) | Under 5 minutes |\n| Reports (1 year) | From a read replica/analytics store, without slowing OLTP |\n\n```js\n// k6 example\nimport http from 'k6/http';\nexport const options = { vus: 50, duration: '2m',\n  thresholds: { http_req_duration: ['p(95)<300'] } };\nexport default function () {\n  http.get(`${__ENV.BASE}/public/availability?property=demo&arrival=2026-12-20&nights=2&adults=2`);\n}\n```\n\n---\n\n## 12. Security tests\n- IDOR: another guest's reservation/invoice/document URLs\n- Role escalation: admin APIs with a low-permission user\n- Input: SQL injection, XSS (`<script>` in a guest name), CSV injection (`=HYPERLINK(...)` in exports)\n- Rate limits and brute force (login, guest portal tokens)\n- Dependency and secret scanning in CI\n- Reference: OWASP ASVS (doc 28)\n\n---\n\n## 13. Test data\n- **Seed hotel**: 20 rooms, 3 room types, 4 rate plans, VAT + SC, 2 company accounts, one group — everyone works with the same known data\n- **Factory** functions: `makeReservation({nights:3, rate:'BAR'})`\n- If a production copy is needed, **anonymise** it (change names, phones, IDs, emails) — never real guest data on dev machines\n- Bangla names, long names, single names, special characters\n\n---\n\n## 14. UAT (acceptance testing with hotel staff)\n- Role-based scripts: \"You are the receptionist: a 2-night walk-in, half cash, the rest bKash\"\n- Real-day scenarios: morning check-out rush, afternoon group arrival, night audit at night\n- **Parallel run:** old system (or paper register) and the new PMS side by side for a few days — reconcile reports (doc 24)\n- Issue log: severity (blocker/major/minor), owner, retest\n\n---\n\n## 15. Release safety\n- Turn on new features per property with **feature flags** (doc 13 §10)\n- **Backward-compatible migrations:** expand → migrate → contract (add column, copy data, remove the old one later)\n- **No deploys during night audit** (the property's local night) — time-zone-aware deploy windows\n- Canary: a few properties first\n- Monitoring: booking success rate, ARI queue length, night audit duration, payment failures — with alerts\n\n---\n\n## 16. Checklist\n- [ ] Clock injection, no direct `now()`\n- [ ] Table-driven tax/rounding tests\n- [ ] Full reservation state machine tests\n- [ ] Concurrency test (last room)\n- [ ] Invariant property tests (availability, ledger)\n- [ ] 90-day night audit simulation\n- [ ] OTA/payment contract fixtures (out-of-order, duplicates)\n- [ ] Tenant isolation tests\n- [ ] E2E for 5 core flows\n- [ ] Load tests for BE search and ARI\n- [ ] UAT scripts and parallel run\n"}, "24": {"n": 24, "title": "২৪ — ইমপ্লিমেন্টেশন, ডেটা মাইগ্রেশন ও Go-Live", "md": "# ২৪ — ইমপ্লিমেন্টেশন, ডেটা মাইগ্রেশন ও Go-Live\n\n> লক্ষ্য: একটি হোটেলে PMS চালু করা — কনফিগারেশন, পুরোনো সিস্টেম/খাতা থেকে ডেটা আনা, স্টাফ ট্রেনিং, কাটওভার রাত, প্রথম সপ্তাহের সহায়তা। অনেক PMS প্রকল্প সফটওয়্যারের কারণে নয়, **ইমপ্লিমেন্টেশনের কারণে** ব্যর্থ হয়।\n> আগের ডক: ১৩ §১০ (onboarding wizard, import), ১৯ কেস ২ ও ৪ (মাইগ্রেশন দৃশ্য), ২০ পরিশিষ্ট খ (চেকলিস্ট)।\n\n---\n\n## ১. প্রকল্পের ধাপ\n\n```mermaid\ngantt\n    title একটি মাঝারি হোটেলে PMS চালু (উদাহরণ, ৬ সপ্তাহ)\n    dateFormat  YYYY-MM-DD\n    section প্রস্তুতি\n    Discovery ও প্রশ্নাবলি      :a1, 2026-11-01, 5d\n    কনফিগারেশন বিল্ড            :a2, after a1, 8d\n    section ডেটা\n    মাইগ্রেশন ম্যাপিং           :b1, after a1, 4d\n    ড্রাই রান ১ ও ২             :b2, after b1, 8d\n    section মানুষ\n    সুপার-ইউজার ট্রেনিং         :c1, after a2, 3d\n    সব স্টাফ ট্রেনিং ও UAT      :c2, after c1, 6d\n    section চালু\n    কাটওভার রাত                :milestone, d1, after c2, 1d\n    Hypercare                  :d2, after d1, 7d\n```\n\n---\n\n## ২. Discovery — কী জানতে হবে\n\n| বিষয় | প্রশ্ন |\n|---|---|\n| প্রপার্টি | রুম সংখ্যা, টাইপ, ফ্লোর, connecting রুম, অ্যাক্সেসিবল রুম, ছবি |\n| রেট | কয়টি রেট প্ল্যান, সিজন, কর্পোরেট চুক্তি, প্যাকেজ, শিশু নীতি |\n| ট্যাক্স | VAT হার, সার্ভিস চার্জ, inclusive/exclusive, BIN (ডক ০৬, ১৬) |\n| নীতি | check-in/out সময়, ক্যানসেল, ডিপোজিট, no-show |\n| বিভাগ | রেস্টুরেন্ট, বার, স্পা, লন্ড্রি — কোনগুলো PMS-এ পোস্ট করবে |\n| পেমেন্ট | নগদ, কার্ড টার্মিনাল, bKash/নগদ মার্চেন্ট, ব্যাংক |\n| চ্যানেল | কোন OTA, চ্যানেল ম্যানেজার, নিজের ওয়েবসাইট |\n| হার্ডওয়্যার | ডোর লক ভেন্ডর, প্রিন্টার, স্ক্যানার, ইন্টারনেট ব্যাকআপ |\n| রিপোর্ট | মালিক প্রতিদিন কী দেখতে চান |\n| মানুষ | কতজন স্টাফ, কোন রোল, শিফট, কম্পিউটার দক্ষতা |\n| আইনি | গেস্ট রেজিস্টার, পুলিশ রিপোর্টিং ফরম্যাট (ডক ১৬) |\n\n**আউটপুট:** স্বাক্ষরিত \"কনফিগারেশন ডকুমেন্ট\" — পরে বিতর্ক এড়াতে।\n\n---\n\n## ৩. কনফিগারেশন বিল্ডের ক্রম (নির্ভরতা)\n\n```mermaid\nflowchart LR\n    P[Property, টাইমজোন, মুদ্রা] --> TX[ট্যাক্স ও ফি]\n    P --> RT[রুম টাইপ] --> RM[রুম]\n    TX --> TC[Transaction code ও GL]\n    TC --> PK[প্যাকেজ]\n    RT --> RP[রেট প্ল্যান]\n    PK --> RP\n    POL[নীতি: cancel, deposit] --> RP\n    RP --> CH[চ্যানেল ম্যাপিং]\n    P --> U[ইউজার ও রোল]\n    TC --> POS[POS আউটলেট ম্যাপিং]\n    RM --> LOCK[ডোর লক ম্যাপিং]\n```\n\nএই ক্রম ভাঙলে (যেমন রেট প্ল্যান আগে, ট্যাক্স পরে) পরে সব রেট আবার এডিট করতে হয়। Onboarding wizard (ডক ১৩) এই ক্রমেই প্রশ্ন করবে।\n\n---\n\n## ৪. ডেটা মাইগ্রেশন\n\n### ৪.১ কী আনবে, কী আনবে না\n\n| ডেটা | আনো? | মন্তব্য |\n|---|---|---|\n| **ভবিষ্যৎ রিজার্ভেশন** | **অবশ্যই** | রেট, ডিপোজিট, নোট, সোর্স, OTA রেফারেন্স সহ |\n| **ইন-হাউস গেস্ট** | **অবশ্যই** | কাটওভার রাতে চলমান stay + খোলা ব্যালান্স |\n| অগ্রিম/ডিপোজিট ব্যালান্স | অবশ্যই | প্রতি বুকিং অনুযায়ী, যোগফল মিলিয়ে |\n| City ledger (AR) খোলা ইনভয়েস | অবশ্যই | কোম্পানি অনুযায়ী, ইনভয়েস তারিখ ও মেয়াদ সহ |\n| গেস্ট প্রোফাইল | হ্যাঁ (পরিষ্কার করে) | ডুপ্লিকেট মার্জ, সম্মতি থাকলে মার্কেটিং তথ্য |\n| কোম্পানি/এজেন্ট প্রোফাইল | হ্যাঁ | চুক্তি রেট, ক্রেডিট লিমিট |\n| গ্রুপ ব্লক | হ্যাঁ | ব্লক ও rooming list |\n| পুরোনো লেনদেন ইতিহাস | সাধারণত না | মাসিক সারসংক্ষেপ (RM-এর জন্য) আনো; বিস্তারিত পুরোনো সিস্টেমে পড়ার-জন্য রাখো |\n| পুরোনো ইউজার/পাসওয়ার্ড | **না** | নতুন করে তৈরি |\n\n### ৪.২ ম্যাপিং শিট\n```\nপুরোনো ফিল্ড          → নতুন ফিল্ড              রূপান্তর\nRoomCat \"DLX-K\"      → room_type \"DELUXE_KING\"  টেবিল ম্যাপ\nRateCode \"RACK\"      → rate_plan \"BAR\"          টেবিল ম্যাপ\nGuest \"Name\"         → first_name, last_name    শেষ শব্দ = last_name (যাচাই!)\nPhone \"01712-xxxxxx\" → +8801712xxxxxx           E.164\nDate \"07/10/26\"      → 2026-10-07               dd/mm/yy নিশ্চিত করো!\nAmount \"1,52,000/-\"  → 152000.00                লাখ ফরম্যাট, \"/-\" মুছে\n```\n\n### ৪.৩ যাচাই (Validation) — সংখ্যা ও যোগফল মেলাও\n\n| চেক | পুরোনো | নতুন |\n|---|---|---|\n| ভবিষ্যৎ রিজার্ভেশন সংখ্যা | ৪১২ | ৪১২ |\n| ভবিষ্যৎ রুম-রাত | ১,২৮০ | ১,২৮০ |\n| প্রতি রাতের OTB (পরের ৯০ দিন) | তালিকা | একই |\n| মোট ডিপোজিট | ৳৮,৪৫,০০০ | ৳৮,৪৫,০০০ |\n| মোট AR খোলা | ৳১২,৩০,৫০০ | ৳১২,৩০,৫০০ |\n| ইন-হাউস ব্যালান্স মোট | কাটওভার রাতে | একই |\n\n```sql\n-- মাইগ্রেশনের পর: রাত অনুযায়ী OTB তুলনা (staging_old_otb পুরোনো সিস্টেমের এক্সপোর্ট)\nSELECT d.stay_date, o.rooms AS old_rooms, coalesce(n.rooms,0) AS new_rooms\nFROM staging_old_otb o\nJOIN generate_series(:from, :to, interval '1 day') d(stay_date) ON d.stay_date = o.stay_date\nLEFT JOIN (\n  SELECT stay_date, count(*) rooms FROM reservation_night rn\n  JOIN reservation r ON r.id = rn.reservation_id\n  WHERE r.status IN ('confirmed','in_house') GROUP BY stay_date\n) n ON n.stay_date = d.stay_date\nWHERE o.rooms <> coalesce(n.rooms,0);   -- শূন্য সারি = মিলেছে\n```\n\n### ৪.৪ ড্রাই রান\n- অন্তত **দুটি** ড্রাই রান (স্টেজিং-এ পুরো মাইগ্রেশন) — সময় মাপো, ভুল ঠিক করো\n- মাইগ্রেশন স্ক্রিপ্ট **পুনরায় চালানো যায় (idempotent)**: `legacy_id` কলাম দিয়ে upsert\n- প্রতিটি রেকর্ডে `source = 'migration'`, `legacy_ref` রাখো (অডিট ও পরে খোঁজার জন্য)\n\n### ৪.৫ খাতা/এক্সেল থেকে (ছোট হোটেল)\n- ভবিষ্যৎ বুকিং হাতে বা CSV টেমপ্লেটে এন্ট্রি (ডক ১৯ কেস ২)\n- দুজন আলাদা মানুষ যাচাই করে (একজন এন্ট্রি, একজন মিলায়)\n- OTA এক্সট্রানেট থেকে ভবিষ্যৎ বুকিং লিস্ট ডাউনলোড করে মিলাও\n\n---\n\n## ৫. কাটওভার পরিকল্পনা\n\n| সময় | কাজ |\n|---|---|\n| T−১৪ দিন | চূড়ান্ত কনফিগ ফ্রিজ; ড্রাই রান ২ |\n| T−৭ | সব স্টাফ ট্রেনিং শেষ; UAT সাইন-অফ; চ্যানেল ম্যানেজার নতুন PMS-এ ম্যাপিং প্রস্তুত (সক্রিয় নয়) |\n| T−১ | পুরোনো সিস্টেমে নতুন ভবিষ্যৎ বুকিং **ফ্রিজ** বা দ্বৈত এন্ট্রি নিয়ম; প্রিন্টেড আগমন/ইন-হাউস তালিকা |\n| T রাত (পুরোনো সিস্টেমে শেষ night audit-এর পর) | চূড়ান্ত এক্সপোর্ট → মাইগ্রেশন → যাচাই (§৪.৩) |\n| T রাত | ইন-হাউস ব্যালান্স মিলাও; রুম স্ট্যাটাস সেট; ডোর লক ইন্টারফেস টেস্ট |\n| T রাত | চ্যানেল ম্যানেজার নতুন PMS-এ সুইচ; পুরো ARI পুশ; একটি টেস্ট বুকিং |\n| T+০ সকাল | নতুন PMS-এ প্রথম check-out/check-in; সুপার-ইউজার প্রতিটি ডেস্কে |\n| T+০ রাত | নতুন PMS-এ প্রথম night audit (ইমপ্লিমেন্টেশন টিম সাথে) |\n| T+১…৭ | Hypercare |\n\n> **কাটওভার সময় বেছে নাও কম ব্যস্ত দিনে** — বড় গ্রুপ আগমন, ঈদ, সপ্তাহান্তের পিক এড়িয়ে।\n\n---\n\n## ৬. ট্রেনিং\n- **রোল-ভিত্তিক:** রিসেপশন (বুকিং, check-in/out, ক্যাশিয়ার), HK (মোবাইল স্ট্যাটাস), অ্যাকাউন্টস (AR, রিপোর্ট, night audit), ম্যানেজার (রিপোর্ট, অনুমোদন)\n- **সুপার-ইউজার:** প্রতি শিফটে একজন গভীরভাবে প্রশিক্ষিত, প্রথম সাহায্যকারী\n- **Sandbox/ট্রেনিং প্রপার্টি:** আসল ডেটা নষ্ট না করে অনুশীলন (ডক ১৩ §১০.৩)\n- **SOP:** প্রতিটি কাজের ছোট ধাপ-তালিকা, স্ক্রিনশট সহ, বাংলায়; ছোট ভিডিও (২–৩ মিনিট)\n- **মূল্যায়ন:** প্রত্যেকে একটি পূর্ণ check-in থেকে check-out নিজে করে দেখাবে\n- নতুন স্টাফ যোগদানে একই উপকরণ (স্টাফ বদল বেশি হলে খুব জরুরি)\n\n---\n\n## ৭. Go-live দিনের রানবুক ও Hypercare\n- যোগাযোগ চ্যানেল (WhatsApp গ্রুপ/হটলাইন), কে কখন অন-কল\n- **ইস্যু লগ:** সময়, কে, কী, স্ক্রিনশট, তীব্রতা, সমাধান\n- প্রতিদিন সকালে ১৫ মিনিট মিটিং: গত দিনের সমস্যা, night audit ফলাফল, রিপোর্ট মিল\n- প্রথম ৭ দিন: প্রতিটি night audit-এর পর ট্রায়াল ব্যালান্স ও OTA বুকিং সংখ্যা মিলাও\n- ব্যাকআপ: প্রিন্টেড আগমন/ইন-হাউস তালিকা প্রতি সন্ধ্যায় (বিদ্যুৎ/ইন্টারনেট সমস্যায়)\n\n---\n\n## ৮. রোলব্যাক পরিকল্পনা\n- কোন অবস্থায় রোলব্যাক: চেক-ইন করা অসম্ভব, টাকার হিসাব ব্যাপক ভুল, চ্যানেল বুকিং আসছে না ও ঠিক করা যাচ্ছে না\n- **সময়সীমা:** সাধারণত প্রথম ২৪–৪৮ ঘণ্টা; পরে রোলব্যাকের চেয়ে সামনে ঠিক করা সহজ\n- পুরোনো সিস্টেম পড়ার-জন্য সচল রাখো; নতুন সিস্টেমে হওয়া লেনদেন ফেরত নেওয়ার পদ্ধতি লেখা থাকুক\n- চ্যানেল ম্যানেজার পুরোনো সংযোগ ফেরানোর ধাপ\n\n---\n\n## ৯. Go-live পরে KPI (প্রকল্প সফল কি না)\n- check-in গড় সময় (মিনিট)\n- night audit সময় ও ব্যর্থতা সংখ্যা\n- ওভারবুকিং/ডাবল বুকিং ঘটনা = ০\n- OTA বুকিং মিস = ০\n- ক্যাশিয়ার ভেরিয়েন্স\n- সাপোর্ট টিকেট সংখ্যা (কমার প্রবণতা)\n- মালিকের দৈনিক রিপোর্ট সময়মতো\n\n---\n\n## ১০. বাংলাদেশ প্রেক্ষিত\n- **বিদ্যুৎ/ইন্টারনেট:** UPS, মোবাইল হটস্পট ব্যাকআপ, প্রিন্টেড তালিকা (ডক ১৬ §৭)\n- **স্টাফ বদল বেশি:** বাংলা SOP ভিডিও, সুপার-ইউজার একাধিক\n- **খাতা সংস্কৃতি:** প্রথম মাসে খাতা + PMS দুটোই চলতে পারে — কিন্তু সময়সীমা ঠিক করো, না হলে PMS \"ঐচ্ছিক\" হয়ে যায়\n- **মালিক-কেন্দ্রিক অনুমোদন:** মালিকের ফোনে দৈনিক রিপোর্ট (ডক ১৫ §৯) গ্রহণযোগ্যতা বাড়ায়\n- VAT সেটআপ VAT কনসালট্যান্টের সাথে যাচাই\n\n---\n\n## ১১. পিটফল\n- [ ] তারিখ ফরম্যাট (dd/mm বনাম mm/dd) ভুলে সব বুকিং ভুল মাসে\n- [ ] ইন-হাউস গেস্টের ব্যালান্স না এনে শুধু বুকিং আনা\n- [ ] চ্যানেল ম্যানেজার আগেই সুইচ → দুই সিস্টেমেই বুকিং/ইনভেন্টরি এলোমেলো\n- [ ] ট্রেনিং শুধু ম্যানেজারের, রাতের শিফট বাদ\n- [ ] প্রথম night audit কেউ পাশে না থেকে চালানো\n- [ ] পুরোনো সিস্টেম সাথে সাথে বন্ধ (পরে কোনো তথ্য দরকার হলে পাওয়া যায় না)\n- [ ] কনফিগ ডকুমেন্ট স্বাক্ষর না নেওয়া → \"এটা তো চেয়েছিলাম না\"\n", "title_en": "24 — Implementation, Data Migration & Go-Live", "md_en": "# 24 — Implementation, Data Migration & Go-Live\n\n> Goal: launching a PMS in a hotel — configuration, bringing data from the old system/paper register, staff training, the cutover night and first-week support. Many PMS projects fail not because of the software but because of the **implementation**.\n> Earlier docs: 13 §10 (onboarding wizard, import), 19 cases 2 and 4 (migration scenarios), 20 appendix B (checklists).\n\n---\n\n## 1. Project phases\n\n```mermaid\ngantt\n    title Launching a PMS in a mid-size hotel (example, 6 weeks)\n    dateFormat  YYYY-MM-DD\n    section Preparation\n    Discovery and questionnaire   :a1, 2026-11-01, 5d\n    Configuration build           :a2, after a1, 8d\n    section Data\n    Migration mapping             :b1, after a1, 4d\n    Dry runs 1 and 2              :b2, after b1, 8d\n    section People\n    Super-user training           :c1, after a2, 3d\n    All-staff training and UAT    :c2, after c1, 6d\n    section Launch\n    Cutover night                 :milestone, d1, after c2, 1d\n    Hypercare                     :d2, after d1, 7d\n```\n\n---\n\n## 2. Discovery — what you need to know\n\n| Topic | Questions |\n|---|---|\n| Property | Number of rooms, types, floors, connecting rooms, accessible rooms, photos |\n| Rates | How many rate plans, seasons, corporate contracts, packages, child policy |\n| Tax | VAT rate, service charge, inclusive/exclusive, BIN (docs 06, 16) |\n| Policies | Check-in/out times, cancellation, deposit, no-show |\n| Departments | Restaurant, bar, spa, laundry — which will post to the PMS |\n| Payments | Cash, card terminals, bKash/Nagad merchant, bank |\n| Channels | Which OTAs, channel manager, own website |\n| Hardware | Door lock vendor, printers, scanners, internet backup |\n| Reports | What the owner wants to see every day |\n| People | How many staff, which roles, shifts, computer skills |\n| Legal | Guest register, police reporting format (doc 16) |\n\n**Output:** a signed \"configuration document\" — to avoid disputes later.\n\n---\n\n## 3. Configuration build order (dependencies)\n\n```mermaid\nflowchart LR\n    P[Property, time zone, currency] --> TX[Taxes and fees]\n    P --> RT[Room types] --> RM[Rooms]\n    TX --> TC[Transaction codes and GL]\n    TC --> PK[Packages]\n    RT --> RP[Rate plans]\n    PK --> RP\n    POL[Policies: cancel, deposit] --> RP\n    RP --> CH[Channel mapping]\n    P --> U[Users and roles]\n    TC --> POS[POS outlet mapping]\n    RM --> LOCK[Door lock mapping]\n```\n\nBreaking this order (e.g. rate plans before taxes) means re-editing every rate later. The onboarding wizard (doc 13) asks questions in this order.\n\n---\n\n## 4. Data migration\n\n### 4.1 What to migrate and what not\n\n| Data | Migrate? | Comment |\n|---|---|---|\n| **Future reservations** | **Always** | With rates, deposits, notes, source, OTA reference |\n| **In-house guests** | **Always** | Ongoing stays on cutover night + open balances |\n| Advance/deposit balances | Always | Per booking, totals reconciled |\n| City ledger (AR) open invoices | Always | Per company, with invoice and due dates |\n| Guest profiles | Yes (cleaned) | Merge duplicates, marketing data only with consent |\n| Company/agent profiles | Yes | Contract rates, credit limits |\n| Group blocks | Yes | Blocks and rooming lists |\n| Old transaction history | Usually not | Bring monthly summaries (for RM); keep details read-only in the old system |\n| Old users/passwords | **No** | Create fresh |\n\n### 4.2 Mapping sheet\n```\nOld field             → New field                Transformation\nRoomCat \"DLX-K\"      → room_type \"DELUXE_KING\"  table map\nRateCode \"RACK\"      → rate_plan \"BAR\"          table map\nGuest \"Name\"         → first_name, last_name    last word = last_name (verify!)\nPhone \"01712-xxxxxx\" → +8801712xxxxxx           E.164\nDate \"07/10/26\"      → 2026-10-07               confirm dd/mm/yy!\nAmount \"1,52,000/-\"  → 152000.00                lakh format, strip \"/-\"\n```\n\n### 4.3 Validation — match counts and totals\n\n| Check | Old | New |\n|---|---|---|\n| Future reservations | 412 | 412 |\n| Future room nights | 1,280 | 1,280 |\n| OTB per night (next 90 days) | list | same |\n| Total deposits | BDT 8,45,000 | BDT 8,45,000 |\n| Total open AR | BDT 12,30,500 | BDT 12,30,500 |\n| Total in-house balances | on cutover night | same |\n\n```sql\n-- after migration: compare OTB per night (staging_old_otb = export from the old system)\nSELECT d.stay_date, o.rooms AS old_rooms, coalesce(n.rooms,0) AS new_rooms\nFROM staging_old_otb o\nJOIN generate_series(:from, :to, interval '1 day') d(stay_date) ON d.stay_date = o.stay_date\nLEFT JOIN (\n  SELECT stay_date, count(*) rooms FROM reservation_night rn\n  JOIN reservation r ON r.id = rn.reservation_id\n  WHERE r.status IN ('confirmed','in_house') GROUP BY stay_date\n) n ON n.stay_date = d.stay_date\nWHERE o.rooms <> coalesce(n.rooms,0);   -- zero rows = matched\n```\n\n### 4.4 Dry runs\n- At least **two** dry runs (full migration in staging) — measure time, fix errors\n- Migration scripts are **re-runnable (idempotent)**: upsert by a `legacy_id` column\n- Store `source = 'migration'` and `legacy_ref` on every record (for audit and later lookup)\n\n### 4.5 From a paper register/Excel (small hotels)\n- Enter future bookings by hand or in a CSV template (doc 19 case 2)\n- Two different people verify (one enters, one checks)\n- Download future booking lists from OTA extranets and reconcile\n\n---\n\n## 5. Cutover plan\n\n| Time | Work |\n|---|---|\n| T−14 days | Final config freeze; dry run 2 |\n| T−7 | All staff trained; UAT sign-off; channel manager mapping ready on the new PMS (not active) |\n| T−1 | **Freeze** new future bookings in the old system or use a double-entry rule; printed arrivals/in-house lists |\n| T night (after the last night audit in the old system) | Final export → migration → validation (§4.3) |\n| T night | Reconcile in-house balances; set room statuses; test the door lock interface |\n| T night | Switch the channel manager to the new PMS; full ARI push; one test booking |\n| T+0 morning | First check-outs/check-ins in the new PMS; a super-user at every desk |\n| T+0 night | First night audit in the new PMS (with the implementation team) |\n| T+1…7 | Hypercare |\n\n> **Choose a quiet day for cutover** — avoid big group arrivals, Eid and weekend peaks.\n\n---\n\n## 6. Training\n- **Role-based:** reception (bookings, check-in/out, cashiering), HK (mobile status), accounts (AR, reports, night audit), managers (reports, approvals)\n- **Super-users:** one deeply trained person per shift, the first line of help\n- **Sandbox/training property:** practise without damaging real data (doc 13 §10.3)\n- **SOPs:** short step lists for every task, with screenshots, in Bangla; short videos (2–3 minutes)\n- **Assessment:** everyone performs a full check-in to check-out themselves\n- Same materials for new joiners (very important with high staff turnover)\n\n---\n\n## 7. Go-live day runbook and hypercare\n- Communication channel (WhatsApp group/hotline), who is on call when\n- **Issue log:** time, who, what, screenshot, severity, resolution\n- A 15-minute meeting every morning: yesterday's issues, night audit result, report reconciliation\n- First 7 days: reconcile the trial balance and OTA booking counts after every night audit\n- Backup: printed arrivals/in-house lists every evening (for power/internet problems)\n\n---\n\n## 8. Rollback plan\n- When to roll back: check-in impossible, money records badly wrong, channel bookings not arriving and not fixable\n- **Time limit:** usually the first 24–48 hours; after that fixing forward is easier than rolling back\n- Keep the old system available read-only; document how to bring back transactions made in the new system\n- Steps to restore the old channel manager connection\n\n---\n\n## 9. KPIs after go-live (is the project successful?)\n- Average check-in time (minutes)\n- Night audit duration and number of failures\n- Overbooking/double booking incidents = 0\n- Missed OTA bookings = 0\n- Cashier variance\n- Support ticket count (trending down)\n- Owner's daily report on time\n\n---\n\n## 10. Bangladesh context\n- **Power/internet:** UPS, mobile hotspot backup, printed lists (doc 16 §7)\n- **High staff turnover:** Bangla SOP videos, several super-users\n- **Paper register culture:** the register and the PMS may run together in the first month — but set a deadline, or the PMS becomes \"optional\"\n- **Owner-centred approval:** a daily report on the owner's phone (doc 15 §9) increases acceptance\n- Verify the VAT setup with a VAT consultant\n\n---\n\n## 11. Pitfalls\n- [ ] Date format mix-up (dd/mm vs mm/dd) moves every booking to the wrong month\n- [ ] Migrating bookings without in-house balances\n- [ ] Switching the channel manager too early → bookings/inventory scrambled across both systems\n- [ ] Training only managers, skipping the night shift\n- [ ] Running the first night audit with nobody beside the auditor\n- [ ] Shutting down the old system immediately (information needed later is lost)\n- [ ] No signed config document → \"this is not what we asked for\"\n"}, "25": {"n": 25, "title": "২৫ — হাতে-কলমে ল্যাব: একটি মিনি PMS বানাও", "md": "# ২৫ — হাতে-কলমে ল্যাব: একটি মিনি PMS বানাও\n\n> লক্ষ্য: পড়া থেকে বানানোয় যাওয়া। PostgreSQL + Node.js দিয়ে একটি ছোট কিন্তু **সঠিক** PMS কোর — রুম, রেট, ইনভেন্টরি, বুকিং, check-in, ফোলিও, পেমেন্ট, night audit, রিপোর্ট, outbox।\n> এই ল্যাবের সব SQL ও কোড PostgreSQL 16 ও Node 22-এ চালিয়ে যাচাই করা হয়েছে (১০০টি সমান্তরাল বুকিং টেস্টে ঠিক ১টি সফল)। এটা শেখার কোড — প্রোডাকশনে ডক ১১–১৪-এর অথ, টেন্যান্ট, অডিট যোগ করতে হবে।\n\n---\n\n## ল্যাব ০ — সেটআপ\n\n```bash\nmkdir mini-pms && cd mini-pms\n# PostgreSQL (Docker)\ndocker run -d --name pms-db -e POSTGRES_PASSWORD=pms -p 5432:5432 postgres:16\nexport DATABASE_URL=postgres://postgres:pms@localhost:5432/postgres\n\nnpm init -y && npm i pg express\n# ফাইল: schema.sql, seed.sql, functions.sql, server.mjs, race-test.mjs\npsql \"$DATABASE_URL\" -f schema.sql -f seed.sql -f functions.sql\nnode server.mjs\n```\n\nপ্রকল্পের কাঠামো:\n```\nmini-pms/\n├── schema.sql        ল্যাব ১–২: টেবিল ও কনস্ট্রেইন্ট\n├── seed.sql          ডেমো হোটেল: ১০ রুম, ২ টাইপ, ২ রেট প্ল্যান, ৯০ দিন\n├── functions.sql     ল্যাব ৩–৭: কোট, বুকিং, check-in/out, পেমেন্ট, night audit\n├── reports.sql       ল্যাব ৮\n├── server.mjs        ল্যাব ৯: REST API\n└── race-test.mjs     ল্যাব ১০: কনকারেন্সি টেস্ট\n```\n\n```mermaid\nflowchart LR\n    API[server.mjs<br/>Express] -->|SQL function call| DB[(PostgreSQL)]\n    DB --> INV[inventory_night<br/>CHECK sold ≤ total]\n    DB --> OCC[room_occupancy<br/>EXCLUDE overlap]\n    DB --> FL[folio_line<br/>UNIQUE source_ref]\n    DB --> OB[outbox<br/>ইভেন্ট]\n    OB -.->|worker প্রকাশ করবে| WH[Webhook / CM / SMS]\n```\n\n**ডিজাইন সিদ্ধান্ত:** ব্যবসায়িক নিয়ম PostgreSQL ফাংশনে রাখা হয়েছে যাতে ল্যাব ছোট থাকে এবং ট্রানজ্যাকশন সহজে বোঝা যায়। বাস্তব প্রকল্পে এগুলো সাধারণত অ্যাপ্লিকেশন লেয়ারে (সার্ভিস) থাকে, কিন্তু **কনস্ট্রেইন্ট (CHECK, EXCLUDE, UNIQUE) DB-তেই রাখো** — এগুলো শেষ প্রতিরক্ষা।\n\n---\n\n## ল্যাব ১ — স্কিমা\n\nমূল ধারণা চিহ্নিত:\n- `inventory_night` — প্রতি রুম টাইপ প্রতি রাতে একটি সারি; `CHECK (sold + out_of_order <= total)` → ওভারসেল DB-তেই অসম্ভব\n- `reservation_night` — বুকিংয়ের সময়ের দাম জমা (রেট স্ন্যাপশট, ডক ০৪ §৪)\n- `room_occupancy` + `EXCLUDE USING gist` — একই রুমে তারিখ ওভারল্যাপ অসম্ভব (ল্যাব ২)\n- `folio_line` + `UNIQUE (folio_id, source_ref)` — একই চার্জ/পেমেন্ট দুবার পোস্ট অসম্ভব (idempotency)\n- `outbox` — ইভেন্ট একই ট্রানজ্যাকশনে লেখা (ডক ১১ §৬)\n\n```sql\nCREATE EXTENSION IF NOT EXISTS btree_gist;\n\nCREATE TABLE property (\n  id            serial PRIMARY KEY,\n  name          text NOT NULL,\n  tz            text NOT NULL DEFAULT 'Asia/Dhaka',\n  currency      char(3) NOT NULL DEFAULT 'BDT',\n  business_date date NOT NULL\n);\n\nCREATE TABLE room_type (\n  id          serial PRIMARY KEY,\n  property_id int NOT NULL REFERENCES property(id),\n  code        text NOT NULL,\n  name        text NOT NULL,\n  max_adults  int  NOT NULL DEFAULT 2,\n  UNIQUE (property_id, code)\n);\n\nCREATE TABLE room (\n  id           serial PRIMARY KEY,\n  property_id  int  NOT NULL REFERENCES property(id),\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  number       text NOT NULL,\n  hk_status    text NOT NULL DEFAULT 'clean'\n               CHECK (hk_status IN ('dirty','clean','inspected','out_of_order')),\n  UNIQUE (property_id, number)\n);\n\nCREATE TABLE rate_plan (\n  id          serial PRIMARY KEY,\n  property_id int  NOT NULL REFERENCES property(id),\n  code        text NOT NULL,\n  refundable  boolean NOT NULL DEFAULT true,\n  UNIQUE (property_id, code)\n);\n\nCREATE TABLE rate (\n  rate_plan_id int  NOT NULL REFERENCES rate_plan(id),\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  stay_date    date NOT NULL,\n  amount       numeric(12,2) NOT NULL CHECK (amount >= 0),\n  PRIMARY KEY (rate_plan_id, room_type_id, stay_date)\n);\n\n-- ক্রমানুসারে প্রযোজ্য ট্যাক্স (seq ছোট আগে); compound = আগের ট্যাক্সসহ মূল্যের ওপর\nCREATE TABLE tax (\n  property_id int  NOT NULL REFERENCES property(id),\n  code        text NOT NULL,\n  pct         numeric(5,2) NOT NULL,\n  seq         int  NOT NULL,\n  compound    boolean NOT NULL DEFAULT false,\n  PRIMARY KEY (property_id, code)\n);\n\nCREATE TABLE inventory_night (\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  stay_date    date NOT NULL,\n  total        int  NOT NULL,\n  sold         int  NOT NULL DEFAULT 0,\n  out_of_order int  NOT NULL DEFAULT 0,\n  PRIMARY KEY (room_type_id, stay_date),\n  CHECK (sold >= 0 AND sold + out_of_order <= total)\n);\n\nCREATE TABLE guest (\n  id         serial PRIMARY KEY,\n  first_name text NOT NULL,\n  last_name  text,\n  phone      text\n);\n\nCREATE SEQUENCE confirmation_seq;\n\nCREATE TABLE reservation (\n  id           serial PRIMARY KEY,\n  property_id  int  NOT NULL REFERENCES property(id),\n  confirmation text NOT NULL UNIQUE,\n  guest_id     int  NOT NULL REFERENCES guest(id),\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  rate_plan_id int  NOT NULL REFERENCES rate_plan(id),\n  arrival      date NOT NULL,\n  departure    date NOT NULL,\n  adults       int  NOT NULL DEFAULT 1,\n  status       text NOT NULL DEFAULT 'confirmed'\n               CHECK (status IN ('confirmed','in_house','checked_out','cancelled','no_show')),\n  room_id      int REFERENCES room(id),\n  segment_code text NOT NULL DEFAULT 'TRN-DIRECT',\n  created_at   timestamptz NOT NULL DEFAULT now(),\n  CHECK (departure > arrival)\n);\n\n-- রেট স্ন্যাপশট: বুকিংয়ের সময়ের দাম প্রতি রাতে জমা (ডক ০৪ §৪)\nCREATE TABLE reservation_night (\n  reservation_id int  NOT NULL REFERENCES reservation(id),\n  stay_date      date NOT NULL,\n  room_type_id   int  NOT NULL REFERENCES room_type(id),\n  amount         numeric(12,2) NOT NULL,\n  PRIMARY KEY (reservation_id, stay_date)\n);\n\n-- একই রুম একই রাতে দুজনকে দেওয়া অসম্ভব — DB নিজেই আটকায়\nCREATE TABLE room_occupancy (\n  room_id        int NOT NULL REFERENCES room(id),\n  reservation_id int NOT NULL REFERENCES reservation(id),\n  stay           daterange NOT NULL,\n  EXCLUDE USING gist (room_id WITH =, stay WITH &&)\n);\n\nCREATE TABLE folio (\n  id             serial PRIMARY KEY,\n  reservation_id int NOT NULL REFERENCES reservation(id),\n  status         text NOT NULL DEFAULT 'open' CHECK (status IN ('open','closed'))\n);\n\n-- append-only লেজার; source_ref ইউনিক = ডাবল পোস্টিং অসম্ভব (idempotent)\nCREATE TABLE folio_line (\n  id            bigserial PRIMARY KEY,\n  folio_id      int  NOT NULL REFERENCES folio(id),\n  business_date date NOT NULL,\n  code          text NOT NULL,          -- RM, VAT, SC, FB, CASH, BKASH ...\n  description   text,\n  amount        numeric(12,2) NOT NULL, -- চার্জ ধনাত্মক, পেমেন্ট ঋণাত্মক\n  source_ref    text NOT NULL,\n  created_at    timestamptz NOT NULL DEFAULT now(),\n  UNIQUE (folio_id, source_ref)\n);\n\nCREATE TABLE outbox (\n  id           bigserial PRIMARY KEY,\n  topic        text  NOT NULL,\n  payload      jsonb NOT NULL,\n  created_at   timestamptz NOT NULL DEFAULT now(),\n  published_at timestamptz\n);\nCREATE INDEX outbox_unpublished ON outbox (id) WHERE published_at IS NULL;\n\n-- ===== seed.sql =====\nINSERT INTO property (name, business_date) VALUES ('Demo Inn, Cox''s Bazar', '2026-12-18');\nINSERT INTO room_type (property_id, code, name, max_adults) VALUES\n  (1,'STD','Standard Twin',2), (1,'DLX','Deluxe King',2);\nINSERT INTO room (property_id, room_type_id, number)\nSELECT 1, 1, (100+g)::text FROM generate_series(1,6) g\nUNION ALL\nSELECT 1, 2, (200+g)::text FROM generate_series(1,4) g;\nINSERT INTO rate_plan (property_id, code, refundable) VALUES (1,'BAR',true),(1,'NRF',false);\n-- ৯০ দিনের রেট: শুক্র/শনি বেশি\nINSERT INTO rate (rate_plan_id, room_type_id, stay_date, amount)\nSELECT rp.id, rt.id, d::date,\n       (CASE rt.code WHEN 'STD' THEN 4000 ELSE 6000 END)\n     * (CASE WHEN extract(isodow FROM d) IN (5,6) THEN 1.25 ELSE 1 END)\n     * (CASE rp.code WHEN 'NRF' THEN 0.9 ELSE 1 END)\nFROM rate_plan rp CROSS JOIN room_type rt\nCROSS JOIN generate_series('2026-12-18'::date, '2027-03-17'::date, interval '1 day') d;\n-- ইনভেন্টরি: রুম টাইপের রুম সংখ্যা\nINSERT INTO inventory_night (room_type_id, stay_date, total)\nSELECT rt.id, d::date, (SELECT count(*) FROM room r WHERE r.room_type_id = rt.id)\nFROM room_type rt CROSS JOIN generate_series('2026-12-18'::date, '2027-03-17'::date, interval '1 day') d;\nINSERT INTO tax (property_id, code, pct, seq, compound) VALUES\n  (1,'SC',10,1,false), (1,'VAT',15,2,true);   -- উদাহরণ হার; আসল হার যাচাই করো (ডক ০৬, ১৬)\n```\n\n---\n\n## ল্যাব ২ — একই রুমে ডাবল অ্যাসাইন অসম্ভব (Exclusion constraint)\n\n`daterange(arrival, departure, '[)')` মানে আগমনের দিন অন্তর্ভুক্ত, প্রস্থানের দিন নয় — তাই একজনের check-out আর আরেকজনের check-in একই দিনে হলে ওভারল্যাপ নয়।\n\n```sql\n-- রুম ১ এ ১৮–২০ ডিসেম্বর কেউ আছে; ১৯–২০ দিলে:\nINSERT INTO room_occupancy VALUES (1, 2, daterange('2026-12-19','2026-12-20'));\n-- ERROR: conflicting key value violates exclusion constraint ...  (SQLSTATE 23P01)\n\n-- ২০–২২ দিলে: ঠিক আছে (২০ তারিখ আগেরজনের প্রস্থান দিন)\n```\n**অনুশীলন:** room move হলে পুরোনো সারির range ছোট করো (`upper = আজ`) আর নতুন রুমে নতুন সারি — এক ট্রানজ্যাকশনে।\n\n---\n\n## ল্যাব ৩ — Availability\n\n```sql\n-- ২০ থেকে ২৩ ডিসেম্বর (৩ রাত) প্রতিটি রুম টাইপে সব রাতে কয়টা খালি\nSELECT rt.code,\n       min(i.total - i.sold - i.out_of_order) AS available_all_nights\nFROM inventory_night i JOIN room_type rt ON rt.id = i.room_type_id\nWHERE rt.property_id = 1\n  AND i.stay_date >= DATE '2026-12-20' AND i.stay_date < DATE '2026-12-23'\nGROUP BY rt.code\nHAVING count(*) = (DATE '2026-12-23' - DATE '2026-12-20');  -- কোনো রাতের সারি অনুপস্থিত হলে বাদ\n```\nফল (খালি হোটেলে): `DLX 4`, `STD 6`। **কেন `min`?** — থাকার যেকোনো রাতে শূন্য হলে পুরো থাকা অসম্ভব।\n\n---\n\n## ল্যাব ৪ — বুকিং (সবচেয়ে গুরুত্বপূর্ণ)\n\nধাপ: ১) রাতগুলো **তারিখ-ক্রমে লক** (`FOR UPDATE ... ORDER BY stay_date`) → ২) সব রাতে খালি আছে কি না গোনো → ৩) `sold + 1` → ৪) রিজার্ভেশন ও রেট স্ন্যাপশট → ৫) outbox ইভেন্ট। সব এক ট্রানজ্যাকশনে; কোনো ধাপ ব্যর্থ হলে সব বাতিল।\n\n> **কেন তারিখ-ক্রমে লক?** দুটি বুকিং ভিন্ন ক্রমে রাত লক করলে (A: ২০→২১, B: ২১→২০) একে অপরের জন্য অপেক্ষা করে deadlock হয়। সবসময় একই ক্রম = deadlock নেই।\n\n```sql\n-- ল্যাব ৪: বুকিং ফাংশন (একটি ট্রানজ্যাকশন)\nCREATE OR REPLACE FUNCTION create_booking(\n  p_property int, p_guest int, p_room_type int, p_rate_plan int,\n  p_arrival date, p_departure date, p_adults int DEFAULT 2)\nRETURNS int LANGUAGE plpgsql AS $$\nDECLARE\n  v_nights int := p_departure - p_arrival;\n  v_locked int;\n  v_res_id int;\nBEGIN\n  -- ১) রাতগুলো তারিখ-ক্রমে লক (deadlock এড়াতে সবসময় একই ক্রম)\n  SELECT count(*) INTO v_locked FROM (\n    SELECT 1 FROM inventory_night\n    WHERE room_type_id = p_room_type AND stay_date >= p_arrival AND stay_date < p_departure\n      AND sold + out_of_order < total\n    ORDER BY stay_date\n    FOR UPDATE\n  ) x;\n  IF v_locked <> v_nights THEN\n    RAISE EXCEPTION 'NO_AVAILABILITY' USING ERRCODE = 'P0001';\n  END IF;\n\n  -- ২) ইনভেন্টরি কমাও\n  UPDATE inventory_night SET sold = sold + 1\n  WHERE room_type_id = p_room_type AND stay_date >= p_arrival AND stay_date < p_departure;\n\n  -- ৩) রিজার্ভেশন + রেট স্ন্যাপশট\n  INSERT INTO reservation (property_id, confirmation, guest_id, room_type_id, rate_plan_id,\n                           arrival, departure, adults)\n  VALUES (p_property, 'DI' || to_char(now(),'YYMMDD') || '-' || lpad(nextval('confirmation_seq')::text, 5, '0'),\n          p_guest, p_room_type, p_rate_plan, p_arrival, p_departure, p_adults)\n  RETURNING id INTO v_res_id;\n\n  INSERT INTO reservation_night (reservation_id, stay_date, room_type_id, amount)\n  SELECT v_res_id, stay_date, room_type_id, amount FROM rate\n  WHERE rate_plan_id = p_rate_plan AND room_type_id = p_room_type\n    AND stay_date >= p_arrival AND stay_date < p_departure;\n  IF NOT FOUND THEN RAISE EXCEPTION 'RATE_MISSING'; END IF;\n\n  -- ৪) ইভেন্ট (একই ট্রানজ্যাকশনে — outbox প্যাটার্ন, ডক ১১ §৬)\n  INSERT INTO outbox (topic, payload)\n  VALUES ('reservation.created', jsonb_build_object('reservation_id', v_res_id,\n          'room_type_id', p_room_type, 'arrival', p_arrival, 'departure', p_departure));\n  RETURN v_res_id;\nEND $$;\n```\n\n---\n\n## ল্যাব ৫ — রেট কোট (ট্যাক্সসহ)\n\nউদাহরণে SC ১০% (মূল দামের ওপর), তারপর VAT ১৫% (SC সহ দামের ওপর, `compound = true`)। **এগুলো শেখার জন্য উদাহরণ হার** — আসল হার ও ক্রম ডক ০৬ ও ১৬ দেখে, VAT কনসালট্যান্টের সাথে যাচাই করো।\n\n```sql\n-- ল্যাব ৫: রেট কোট (ট্যাক্সসহ)\nCREATE OR REPLACE FUNCTION quote_stay(p_rate_plan int, p_room_type int, p_arrival date, p_departure date)\nRETURNS TABLE (room_total numeric, sc numeric, vat numeric, grand_total numeric)\nLANGUAGE plpgsql AS $$\nDECLARE\n  v_nights int := p_departure - p_arrival;\n  v_found  int;\n  v_base   numeric;\n  v_running numeric;\n  v_tax    record;\nBEGIN\n  SELECT count(*), sum(amount) INTO v_found, v_base\n  FROM rate WHERE rate_plan_id = p_rate_plan AND room_type_id = p_room_type\n    AND stay_date >= p_arrival AND stay_date < p_departure;\n  IF v_found <> v_nights THEN RAISE EXCEPTION 'RATE_MISSING'; END IF;\n  room_total := v_base; v_running := v_base; sc := 0; vat := 0;\n  FOR v_tax IN SELECT t.* FROM tax t JOIN rate_plan rp ON rp.property_id = t.property_id\n               WHERE rp.id = p_rate_plan ORDER BY seq LOOP\n    IF v_tax.code = 'SC'  THEN sc  := round((CASE WHEN v_tax.compound THEN v_running ELSE v_base END) * v_tax.pct/100, 2); v_running := v_running + sc; END IF;\n    IF v_tax.code = 'VAT' THEN vat := round((CASE WHEN v_tax.compound THEN v_running ELSE v_base END) * v_tax.pct/100, 2); v_running := v_running + vat; END IF;\n  END LOOP;\n  grand_total := v_running;\n  RETURN NEXT;\nEND $$;\n\nSELECT * FROM quote_stay(1, 2, '2026-12-24', '2026-12-27');\n-- Deluxe, ২৪–২৭ ডিসেম্বর (বৃহঃ ৬,০০০ + শুক্র ৭,৫০০ + শনি ৭,৫০০)\n-- room_total 21000.00 | sc 2100.00 | vat 3465.00 | grand_total 26565.00\n```\n\n---\n\n## ল্যাব ৬ — Check-in, পেমেন্ট, Check-out\n\n```sql\n-- ল্যাব ৬ক: check-in\nCREATE OR REPLACE FUNCTION check_in(p_res int, p_room int) RETURNS int\nLANGUAGE plpgsql AS $$\nDECLARE r reservation; v_bd date; v_folio int; v_room room;\nBEGIN\n  SELECT * INTO r FROM reservation WHERE id = p_res FOR UPDATE;\n  SELECT business_date INTO v_bd FROM property WHERE id = r.property_id;\n  IF r.status <> 'confirmed' THEN RAISE EXCEPTION 'INVALID_STATUS %', r.status; END IF;\n  IF r.arrival <> v_bd THEN RAISE EXCEPTION 'NOT_ARRIVAL_DAY'; END IF;\n  SELECT * INTO v_room FROM room WHERE id = p_room FOR UPDATE;\n  IF v_room.room_type_id <> r.room_type_id THEN RAISE EXCEPTION 'ROOM_TYPE_MISMATCH'; END IF;\n  IF v_room.hk_status NOT IN ('clean','inspected') THEN RAISE EXCEPTION 'ROOM_NOT_READY'; END IF;\n  -- exclusion constraint ওভারল্যাপ হলে নিজেই error দেবে\n  INSERT INTO room_occupancy (room_id, reservation_id, stay)\n  VALUES (p_room, p_res, daterange(r.arrival, r.departure, '[)'));\n  UPDATE reservation SET status = 'in_house', room_id = p_room WHERE id = p_res;\n  INSERT INTO folio (reservation_id) VALUES (p_res) RETURNING id INTO v_folio;\n  INSERT INTO outbox (topic, payload) VALUES ('stay.checked_in',\n    jsonb_build_object('reservation_id', p_res, 'room', v_room.number));\n  RETURN v_folio;\nEND $$;\n\n-- ল্যাব ৬খ: পেমেন্ট পোস্ট (idempotency key = source_ref)\nCREATE OR REPLACE FUNCTION post_payment(p_folio int, p_method text, p_amount numeric, p_key text)\nRETURNS void LANGUAGE plpgsql AS $$\nDECLARE v_bd date;\nBEGIN\n  SELECT p.business_date INTO v_bd FROM folio f JOIN reservation r ON r.id = f.reservation_id\n  JOIN property p ON p.id = r.property_id WHERE f.id = p_folio AND f.status = 'open';\n  IF v_bd IS NULL THEN RAISE EXCEPTION 'FOLIO_NOT_OPEN'; END IF;\n  INSERT INTO folio_line (folio_id, business_date, code, description, amount, source_ref)\n  VALUES (p_folio, v_bd, p_method, 'Payment', -abs(p_amount), 'PAY:' || p_key)\n  ON CONFLICT (folio_id, source_ref) DO NOTHING;\nEND $$;\n\n-- ল্যাব ৬গ: check-out (ব্যালান্স শূন্য হতে হবে)\nCREATE OR REPLACE FUNCTION check_out(p_res int) RETURNS void\nLANGUAGE plpgsql AS $$\nDECLARE r reservation; v_bal numeric; v_folio int;\nBEGIN\n  SELECT * INTO r FROM reservation WHERE id = p_res FOR UPDATE;\n  IF r.status <> 'in_house' THEN RAISE EXCEPTION 'INVALID_STATUS %', r.status; END IF;\n  SELECT f.id, coalesce(sum(fl.amount),0) INTO v_folio, v_bal\n  FROM folio f LEFT JOIN folio_line fl ON fl.folio_id = f.id\n  WHERE f.reservation_id = p_res AND f.status = 'open' GROUP BY f.id;\n  IF v_bal <> 0 THEN RAISE EXCEPTION 'BALANCE_NOT_ZERO %', v_bal; END IF;\n  UPDATE folio SET status = 'closed' WHERE id = v_folio;\n  UPDATE reservation SET status = 'checked_out' WHERE id = p_res;\n  UPDATE room SET hk_status = 'dirty' WHERE id = r.room_id;\n  INSERT INTO outbox (topic, payload) VALUES ('stay.checked_out', jsonb_build_object('reservation_id', p_res));\nEND $$;\n```\n\n**লক্ষ্য করো:** `post_payment` একই `p_key` দিয়ে দুবার ডাকলে দ্বিতীয়টি কিছুই করে না (`ON CONFLICT DO NOTHING`)। গেটওয়ের transaction id বা ক্লায়েন্টের `Idempotency-Key` হেডার এখানে যায়।\n\n---\n\n## ল্যাব ৭ — Night audit\n\nধাপ: প্রপার্টি লক → in-house গেস্টদের আজকের রুম চার্জ + ট্যাক্স পোস্ট (idempotent) → no-show চিহ্নিত ও পরের রাতের ইনভেন্টরি ছেড়ে দেওয়া → business date এগোনো → ইভেন্ট।\n\n```sql\n-- ল্যাব ৭: Night audit (idempotent, এক প্রপার্টি একবারে একটাই)\nCREATE OR REPLACE FUNCTION run_night_audit(p_property int) RETURNS date\nLANGUAGE plpgsql AS $$\nDECLARE\n  v_bd date;\n  v_res record;\n  v_folio int;\n  v_base numeric; v_sc numeric; v_vat numeric;\nBEGIN\n  -- ১) প্রপার্টি লক: সমান্তরাল দুটি অডিট অসম্ভব\n  SELECT business_date INTO v_bd FROM property WHERE id = p_property FOR UPDATE;\n\n  -- ২) আজকের রুম চার্জ + ট্যাক্স পোস্ট (source_ref ইউনিক → দুবার চালালেও একবার)\n  FOR v_res IN\n    SELECT r.id, rn.amount FROM reservation r\n    JOIN reservation_night rn ON rn.reservation_id = r.id AND rn.stay_date = v_bd\n    WHERE r.property_id = p_property AND r.status = 'in_house'\n  LOOP\n    SELECT id INTO v_folio FROM folio WHERE reservation_id = v_res.id AND status = 'open';\n    v_base := v_res.amount;\n    v_sc   := round(v_base * 0.10, 2);           -- সরলতার জন্য হার্ডকোড; আসলে tax টেবিল\n    v_vat  := round((v_base + v_sc) * 0.15, 2);\n    INSERT INTO folio_line (folio_id, business_date, code, description, amount, source_ref) VALUES\n      (v_folio, v_bd, 'RM',  'Room charge',     v_base, 'RM:'  || v_res.id || ':' || v_bd),\n      (v_folio, v_bd, 'SC',  'Service charge',  v_sc,   'SC:'  || v_res.id || ':' || v_bd),\n      (v_folio, v_bd, 'VAT', 'VAT',             v_vat,  'VAT:' || v_res.id || ':' || v_bd)\n    ON CONFLICT (folio_id, source_ref) DO NOTHING;\n  END LOOP;\n\n  -- ৩) No-show: আজ আসার কথা ছিল, আসেনি → পরের রাতগুলোর ইনভেন্টরি ছেড়ে দাও\n  -- (সতর্কতা: UPDATE ... FROM-এ একই টার্গেট সারি একাধিক বার মিললে মাত্র একবার আপডেট হয়,\n  --  তাই আগে GROUP BY করে গুনে নিচ্ছি)\n  UPDATE inventory_night i SET sold = i.sold - x.cnt\n  FROM (\n    SELECT r.room_type_id, rn.stay_date, count(*) AS cnt\n    FROM reservation r JOIN reservation_night rn ON rn.reservation_id = r.id\n    WHERE r.property_id = p_property AND r.status = 'confirmed' AND r.arrival = v_bd\n      AND rn.stay_date > v_bd\n    GROUP BY r.room_type_id, rn.stay_date\n  ) x\n  WHERE i.room_type_id = x.room_type_id AND i.stay_date = x.stay_date;\n  UPDATE reservation SET status = 'no_show'\n  WHERE property_id = p_property AND status = 'confirmed' AND arrival = v_bd;\n\n  -- ৪) business date এগোও\n  UPDATE property SET business_date = v_bd + 1 WHERE id = p_property;\n  INSERT INTO outbox (topic, payload) VALUES ('night_audit.completed',\n    jsonb_build_object('property_id', p_property, 'business_date', v_bd));\n  RETURN v_bd + 1;\nEND $$;\n```\n\n> **আগমনের রাতের ইনভেন্টরি কেন ছাড়া হলো না?** সেই রাত পার হয়ে গেছে — আর বিক্রি সম্ভব নয়। No-show চার্জ (প্রথম রাত) নীতি অনুযায়ী আলাদা ধাপে পোস্ট করা যায় (অনুশীলন ৪)।\n> **ক্র্যাশ হলে?** পুরো ফাংশন এক ট্রানজ্যাকশন — মাঝপথে ব্যর্থ হলে কিছুই বদলায় না, আবার চালাও। বড় হোটেলে ধাপগুলো আলাদা ট্রানজ্যাকশনে করলে প্রতিটি ধাপ idempotent ও \"কোন ধাপ শেষ\" রেকর্ড রাখতে হয় (ডক ০৯, ১৯ কেস ৭)।\n\n---\n\n## ল্যাব ৮ — রিপোর্ট\n\n```sql\n-- ল্যাব ৮: দৈনিক KPI (একটি রাতের জন্য)\nWITH n AS (SELECT DATE '2026-12-19' AS d),\ncap AS (SELECT sum(total - out_of_order) AS rooms_available FROM inventory_night, n WHERE stay_date = n.d),\nsold AS (\n  SELECT count(*) AS rooms_sold, coalesce(sum(rn.amount),0) AS room_revenue\n  FROM reservation_night rn JOIN reservation r ON r.id = rn.reservation_id, n\n  WHERE rn.stay_date = n.d AND r.status IN ('confirmed','in_house','checked_out'))\nSELECT rooms_available, rooms_sold,\n       round(100.0 * rooms_sold / rooms_available, 1)       AS occupancy_pct,\n       round(room_revenue / nullif(rooms_sold,0), 2)         AS adr,\n       round(room_revenue / rooms_available, 2)              AS revpar\nFROM cap, sold;\n-- ফল (উদাহরণ ডেটায়): rooms_available 10 | rooms_sold 1 | occupancy_pct 10.0 | adr 5000.00 | revpar 500.00\n```\n\n---\n\n## ল্যাব ৯ — REST API (Node.js)\n\n```js\n// server.mjs — Mini PMS API (Node 20+, Express, pg)\nimport express from 'express';\nimport pg from 'pg';\n\nconst pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });\nconst app = express();\napp.use(express.json());\n\n// DB error → HTTP কোড\nconst ERR = { NO_AVAILABILITY: 409, RATE_MISSING: 422, ROOM_NOT_READY: 409,\n              BALANCE_NOT_ZERO: 409, INVALID_STATUS: 409, NOT_ARRIVAL_DAY: 409 };\nfunction fail(res, e) {\n  if (e.code === '23P01') return res.status(409).json({ error: 'ROOM_ALREADY_OCCUPIED' }); // exclusion\n  const key = Object.keys(ERR).find(k => e.message?.startsWith(k));\n  if (key) return res.status(ERR[key]).json({ error: key, detail: e.message });\n  console.error(e); res.status(500).json({ error: 'INTERNAL' });\n}\n\napp.get('/v1/availability', async (req, res) => {\n  const { property, arrival, departure } = req.query;\n  try {\n    const { rows } = await pool.query(`\n      SELECT rt.code, min(i.total - i.sold - i.out_of_order) AS available\n      FROM inventory_night i JOIN room_type rt ON rt.id = i.room_type_id\n      WHERE rt.property_id = $1 AND i.stay_date >= $2 AND i.stay_date < $3\n      GROUP BY rt.code HAVING count(*) = ($3::date - $2::date)`, [property, arrival, departure]);\n    res.json(rows);\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/reservations', async (req, res) => {\n  const { propertyId, guestId, roomTypeId, ratePlanId, arrival, departure, adults = 2 } = req.body;\n  try {\n    const { rows } = await pool.query(\n      'SELECT create_booking($1,$2,$3,$4,$5,$6,$7) AS id',\n      [propertyId, guestId, roomTypeId, ratePlanId, arrival, departure, adults]);\n    res.status(201).json({ id: rows[0].id });\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/reservations/:id/check-in', async (req, res) => {\n  try {\n    const { rows } = await pool.query('SELECT check_in($1,$2) AS folio_id', [req.params.id, req.body.roomId]);\n    res.json(rows[0]);\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/folios/:id/payments', async (req, res) => {\n  const key = req.get('Idempotency-Key');\n  if (!key) return res.status(400).json({ error: 'IDEMPOTENCY_KEY_REQUIRED' });\n  try {\n    await pool.query('SELECT post_payment($1,$2,$3,$4)', [req.params.id, req.body.method, req.body.amount, key]);\n    res.status(201).json({ ok: true });\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/reservations/:id/check-out', async (req, res) => {\n  try { await pool.query('SELECT check_out($1)', [req.params.id]); res.json({ ok: true }); }\n  catch (e) { fail(res, e); }\n});\n\napp.post('/v1/properties/:id/night-audit', async (req, res) => {\n  try {\n    const { rows } = await pool.query('SELECT run_night_audit($1) AS new_business_date', [req.params.id]);\n    res.json(rows[0]);\n  } catch (e) { fail(res, e); }\n});\n\napp.listen(3000, () => console.log('Mini PMS on :3000'));\n```\n\nচেষ্টা করো:\n```bash\ncurl \"localhost:3000/v1/availability?property=1&arrival=2026-12-20&departure=2026-12-23\"\n\ncurl -X POST localhost:3000/v1/reservations -H 'content-type: application/json' \\\n  -d '{\"propertyId\":1,\"guestId\":1,\"roomTypeId\":1,\"ratePlanId\":1,\"arrival\":\"2026-12-18\",\"departure\":\"2026-12-20\"}'\n\ncurl -X POST localhost:3000/v1/reservations/1/check-in -H 'content-type: application/json' -d '{\"roomId\":1}'\ncurl -X POST localhost:3000/v1/properties/1/night-audit\ncurl -X POST localhost:3000/v1/folios/1/payments -H 'content-type: application/json' \\\n  -H 'Idempotency-Key: bkash-TRX123' -d '{\"method\":\"BKASH\",\"amount\":6325}'\n```\n(গেস্ট তৈরি: `INSERT INTO guest(first_name) VALUES ('রহিম');` — গেস্ট API অনুশীলন হিসেবে বানাও।)\n\n---\n\n## ল্যাব ১০ — কনকারেন্সি টেস্ট\n\n```js\n// race-test.mjs — ১০০টি সমান্তরাল বুকিং, শেষ রুমের জন্য\nconst BASE = 'http://localhost:3000';\nconst body = { propertyId: 1, guestId: 1, roomTypeId: 2, ratePlanId: 1,\n               arrival: '2027-02-14', departure: '2027-02-16' };\n\n// আগে ৩টি রুম ভরাও, যাতে ১টি বাকি থাকে (DLX = ৪ রুম)\nfor (let i = 0; i < 3; i++)\n  await fetch(`${BASE}/v1/reservations`, { method: 'POST',\n    headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });\n\nconst results = await Promise.all(Array.from({ length: 100 }, () =>\n  fetch(`${BASE}/v1/reservations`, { method: 'POST',\n    headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })\n  .then(r => r.status)));\n\nconst count = s => results.filter(x => x === s).length;\nconsole.log({ created: count(201), conflict: count(409), other: results.length - count(201) - count(409) });\n// প্রত্যাশা: { created: 1, conflict: 99, other: 0 }\n```\nযাচাই করা ফল: `{ created: 1, conflict: 99, other: 0 }`। এবার পরীক্ষা করো: `create_booking` থেকে `FOR UPDATE` সরিয়ে দাও — কী হয়? (`CHECK` কনস্ট্রেইন্ট তবুও ওভারসেল আটকাবে, কিন্তু কিছু রিকোয়েস্ট ৪০৯-এর বদলে ৫০০ এরর পেতে পারে — কেন? ভাবো।)\n\n---\n\n## অনুশীলন (ধাপে ধাপে কঠিন)\n\n1. **ক্যানসেল:** `cancel_booking(res_id)` — স্ট্যাটাস `cancelled`, প্রতিটি রাতের `sold - 1`, outbox ইভেন্ট। ইতিমধ্যে ক্যানসেল হলে কিছু না করা (idempotent)।\n2. **মডিফাই:** তারিখ বদল — পুরোনো রাত ছেড়ে নতুন রাত নেওয়া **এক ট্রানজ্যাকশনে**; নতুন রাত না পেলে পুরোনোটাও অক্ষত।\n3. **No-show বাগ বোঝো:** night audit-এর মন্তব্য দেখো — কেন `UPDATE ... FROM` একাধিক মিলের সারি একবারই আপডেট করে? GROUP BY ছাড়া সংস্করণ লিখে দুটি no-show দিয়ে টেস্ট করো।\n4. **No-show চার্জ:** নন-রিফান্ডেবল বুকিং no-show হলে প্রথম রাতের চার্জ পোস্ট (ফোলিও খুলে)।\n5. **Out of order:** রুম OOO করলে `inventory_night.out_of_order + 1`; ইতিমধ্যে বিক্রি পূর্ণ থাকলে কী হবে? (CHECK ব্যর্থ — সতর্কবার্তা দাও)\n6. **Outbox worker:** প্রতি ২ সেকেন্ডে `published_at IS NULL` সারি পড়ে কনসোলে প্রিন্ট, তারপর `published_at = now()`। `FOR UPDATE SKIP LOCKED` দিয়ে একাধিক worker।\n7. **ট্যাক্স টেবিল ব্যবহার:** night audit-এ হার্ডকোড ১০%/১৫% সরিয়ে `tax` টেবিল থেকে।\n8. **Split folio:** একটি রিজার্ভেশনে দুটি ফোলিও (রুম → কোম্পানি, বাকি → গেস্ট) ও routing রুল।\n9. **টেন্যান্ট আইসোলেশন:** `property_id` দিয়ে Row Level Security চালু করো (ডক ১৩ §৩, ১৪)।\n10. **ফ্রন্টএন্ড:** একটি রুম র‍্যাক পেজ (রুম × তারিখ গ্রিড) — React/Vue যেকোনো কিছু।\n11. **রিপোর্ট:** ডক ২০ §১১-এর `otb_snapshot` যোগ করে night audit-এ স্ন্যাপশট নাও, pickup রিপোর্ট বানাও।\n12. **টেস্ট:** ডক ২৩-এর property-based টেস্ট এই প্রকল্পে চালাও।\n", "title_en": "25 — Hands-on Lab: Build a Mini PMS", "md_en": "# 25 — Hands-on Lab: Build a Mini PMS\n\n> Goal: move from reading to building. A small but **correct** PMS core in PostgreSQL + Node.js — rooms, rates, inventory, bookings, check-in, folios, payments, night audit, reports, outbox.\n> All SQL and code in this lab was run and verified on PostgreSQL 16 and Node 22 (in a test of 100 parallel bookings exactly 1 succeeded). This is learning code — production needs the auth, tenancy and audit from docs 11–14.\n\n---\n\n## Lab 0 — Setup\n\n```bash\nmkdir mini-pms && cd mini-pms\n# PostgreSQL (Docker)\ndocker run -d --name pms-db -e POSTGRES_PASSWORD=pms -p 5432:5432 postgres:16\nexport DATABASE_URL=postgres://postgres:pms@localhost:5432/postgres\n\nnpm init -y && npm i pg express\n# files: schema.sql, seed.sql, functions.sql, server.mjs, race-test.mjs\npsql \"$DATABASE_URL\" -f schema.sql -f seed.sql -f functions.sql\nnode server.mjs\n```\n\nProject structure:\n```\nmini-pms/\n├── schema.sql        Labs 1–2: tables and constraints\n├── seed.sql          demo hotel: 10 rooms, 2 types, 2 rate plans, 90 days\n├── functions.sql     Labs 3–7: quote, booking, check-in/out, payment, night audit\n├── reports.sql       Lab 8\n├── server.mjs        Lab 9: REST API\n└── race-test.mjs     Lab 10: concurrency test\n```\n\n```mermaid\nflowchart LR\n    API[server.mjs<br/>Express] -->|SQL function call| DB[(PostgreSQL)]\n    DB --> INV[inventory_night<br/>CHECK sold ≤ total]\n    DB --> OCC[room_occupancy<br/>EXCLUDE overlap]\n    DB --> FL[folio_line<br/>UNIQUE source_ref]\n    DB --> OB[outbox<br/>events]\n    OB -.->|a worker publishes| WH[Webhook / CM / SMS]\n```\n\n**Design decision:** business rules live in PostgreSQL functions so the lab stays small and the transactions are easy to follow. In real projects they usually live in the application layer (services), but **keep the constraints (CHECK, EXCLUDE, UNIQUE) in the DB** — they are the last line of defence.\n\n---\n\n## Lab 1 — Schema\n\nKey ideas marked:\n- `inventory_night` — one row per room type per night; `CHECK (sold + out_of_order <= total)` → overselling is impossible in the DB\n- `reservation_night` — stores the price at booking time (rate snapshot, doc 04 §4)\n- `room_occupancy` + `EXCLUDE USING gist` — date overlaps in the same room are impossible (Lab 2)\n- `folio_line` + `UNIQUE (folio_id, source_ref)` — the same charge/payment cannot be posted twice (idempotency)\n- `outbox` — events written in the same transaction (doc 11 §6)\n\n```sql\nCREATE EXTENSION IF NOT EXISTS btree_gist;\n\nCREATE TABLE property (\n  id            serial PRIMARY KEY,\n  name          text NOT NULL,\n  tz            text NOT NULL DEFAULT 'Asia/Dhaka',\n  currency      char(3) NOT NULL DEFAULT 'BDT',\n  business_date date NOT NULL\n);\n\nCREATE TABLE room_type (\n  id          serial PRIMARY KEY,\n  property_id int NOT NULL REFERENCES property(id),\n  code        text NOT NULL,\n  name        text NOT NULL,\n  max_adults  int  NOT NULL DEFAULT 2,\n  UNIQUE (property_id, code)\n);\n\nCREATE TABLE room (\n  id           serial PRIMARY KEY,\n  property_id  int  NOT NULL REFERENCES property(id),\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  number       text NOT NULL,\n  hk_status    text NOT NULL DEFAULT 'clean'\n               CHECK (hk_status IN ('dirty','clean','inspected','out_of_order')),\n  UNIQUE (property_id, number)\n);\n\nCREATE TABLE rate_plan (\n  id          serial PRIMARY KEY,\n  property_id int  NOT NULL REFERENCES property(id),\n  code        text NOT NULL,\n  refundable  boolean NOT NULL DEFAULT true,\n  UNIQUE (property_id, code)\n);\n\nCREATE TABLE rate (\n  rate_plan_id int  NOT NULL REFERENCES rate_plan(id),\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  stay_date    date NOT NULL,\n  amount       numeric(12,2) NOT NULL CHECK (amount >= 0),\n  PRIMARY KEY (rate_plan_id, room_type_id, stay_date)\n);\n\n-- taxes applied in order (lower seq first); compound = applied on the price including earlier taxes\nCREATE TABLE tax (\n  property_id int  NOT NULL REFERENCES property(id),\n  code        text NOT NULL,\n  pct         numeric(5,2) NOT NULL,\n  seq         int  NOT NULL,\n  compound    boolean NOT NULL DEFAULT false,\n  PRIMARY KEY (property_id, code)\n);\n\nCREATE TABLE inventory_night (\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  stay_date    date NOT NULL,\n  total        int  NOT NULL,\n  sold         int  NOT NULL DEFAULT 0,\n  out_of_order int  NOT NULL DEFAULT 0,\n  PRIMARY KEY (room_type_id, stay_date),\n  CHECK (sold >= 0 AND sold + out_of_order <= total)\n);\n\nCREATE TABLE guest (\n  id         serial PRIMARY KEY,\n  first_name text NOT NULL,\n  last_name  text,\n  phone      text\n);\n\nCREATE SEQUENCE confirmation_seq;\n\nCREATE TABLE reservation (\n  id           serial PRIMARY KEY,\n  property_id  int  NOT NULL REFERENCES property(id),\n  confirmation text NOT NULL UNIQUE,\n  guest_id     int  NOT NULL REFERENCES guest(id),\n  room_type_id int  NOT NULL REFERENCES room_type(id),\n  rate_plan_id int  NOT NULL REFERENCES rate_plan(id),\n  arrival      date NOT NULL,\n  departure    date NOT NULL,\n  adults       int  NOT NULL DEFAULT 1,\n  status       text NOT NULL DEFAULT 'confirmed'\n               CHECK (status IN ('confirmed','in_house','checked_out','cancelled','no_show')),\n  room_id      int REFERENCES room(id),\n  segment_code text NOT NULL DEFAULT 'TRN-DIRECT',\n  created_at   timestamptz NOT NULL DEFAULT now(),\n  CHECK (departure > arrival)\n);\n\n-- rate snapshot: the price at booking time, stored per night (doc 04 §4)\nCREATE TABLE reservation_night (\n  reservation_id int  NOT NULL REFERENCES reservation(id),\n  stay_date      date NOT NULL,\n  room_type_id   int  NOT NULL REFERENCES room_type(id),\n  amount         numeric(12,2) NOT NULL,\n  PRIMARY KEY (reservation_id, stay_date)\n);\n\n-- the same room can never go to two guests on the same night — the DB itself blocks it\nCREATE TABLE room_occupancy (\n  room_id        int NOT NULL REFERENCES room(id),\n  reservation_id int NOT NULL REFERENCES reservation(id),\n  stay           daterange NOT NULL,\n  EXCLUDE USING gist (room_id WITH =, stay WITH &&)\n);\n\nCREATE TABLE folio (\n  id             serial PRIMARY KEY,\n  reservation_id int NOT NULL REFERENCES reservation(id),\n  status         text NOT NULL DEFAULT 'open' CHECK (status IN ('open','closed'))\n);\n\n-- append-only ledger; unique source_ref = double posting impossible (idempotent)\nCREATE TABLE folio_line (\n  id            bigserial PRIMARY KEY,\n  folio_id      int  NOT NULL REFERENCES folio(id),\n  business_date date NOT NULL,\n  code          text NOT NULL,          -- RM, VAT, SC, FB, CASH, BKASH ...\n  description   text,\n  amount        numeric(12,2) NOT NULL, -- charges positive, payments negative\n  source_ref    text NOT NULL,\n  created_at    timestamptz NOT NULL DEFAULT now(),\n  UNIQUE (folio_id, source_ref)\n);\n\nCREATE TABLE outbox (\n  id           bigserial PRIMARY KEY,\n  topic        text  NOT NULL,\n  payload      jsonb NOT NULL,\n  created_at   timestamptz NOT NULL DEFAULT now(),\n  published_at timestamptz\n);\nCREATE INDEX outbox_unpublished ON outbox (id) WHERE published_at IS NULL;\n\n-- ===== seed.sql =====\nINSERT INTO property (name, business_date) VALUES ('Demo Inn, Cox''s Bazar', '2026-12-18');\nINSERT INTO room_type (property_id, code, name, max_adults) VALUES\n  (1,'STD','Standard Twin',2), (1,'DLX','Deluxe King',2);\nINSERT INTO room (property_id, room_type_id, number)\nSELECT 1, 1, (100+g)::text FROM generate_series(1,6) g\nUNION ALL\nSELECT 1, 2, (200+g)::text FROM generate_series(1,4) g;\nINSERT INTO rate_plan (property_id, code, refundable) VALUES (1,'BAR',true),(1,'NRF',false);\n-- 90 days of rates: Friday/Saturday higher\nINSERT INTO rate (rate_plan_id, room_type_id, stay_date, amount)\nSELECT rp.id, rt.id, d::date,\n       (CASE rt.code WHEN 'STD' THEN 4000 ELSE 6000 END)\n     * (CASE WHEN extract(isodow FROM d) IN (5,6) THEN 1.25 ELSE 1 END)\n     * (CASE rp.code WHEN 'NRF' THEN 0.9 ELSE 1 END)\nFROM rate_plan rp CROSS JOIN room_type rt\nCROSS JOIN generate_series('2026-12-18'::date, '2027-03-17'::date, interval '1 day') d;\n-- inventory: number of rooms per room type\nINSERT INTO inventory_night (room_type_id, stay_date, total)\nSELECT rt.id, d::date, (SELECT count(*) FROM room r WHERE r.room_type_id = rt.id)\nFROM room_type rt CROSS JOIN generate_series('2026-12-18'::date, '2027-03-17'::date, interval '1 day') d;\nINSERT INTO tax (property_id, code, pct, seq, compound) VALUES\n  (1,'SC',10,1,false), (1,'VAT',15,2,true);   -- example rates; verify real rates (docs 06, 16)\n```\n\n---\n\n## Lab 2 — Double room assignment is impossible (exclusion constraint)\n\n`daterange(arrival, departure, '[)')` means the arrival day is included and the departure day is not — so one guest's check-out and another's check-in on the same day do not overlap.\n\n```sql\n-- room 1 is occupied 18–20 December; assigning 19–20:\nINSERT INTO room_occupancy VALUES (1, 2, daterange('2026-12-19','2026-12-20'));\n-- ERROR: conflicting key value violates exclusion constraint ...  (SQLSTATE 23P01)\n\n-- 20–22 is fine (the 20th is the previous guest's departure day)\n```\n**Exercise:** for a room move, shorten the old row's range (`upper = today`) and add a new row for the new room — in one transaction.\n\n---\n\n## Lab 3 — Availability\n\n```sql\n-- how many rooms are free on every night from 20 to 23 December (3 nights) per room type\nSELECT rt.code,\n       min(i.total - i.sold - i.out_of_order) AS available_all_nights\nFROM inventory_night i JOIN room_type rt ON rt.id = i.room_type_id\nWHERE rt.property_id = 1\n  AND i.stay_date >= DATE '2026-12-20' AND i.stay_date < DATE '2026-12-23'\nGROUP BY rt.code\nHAVING count(*) = (DATE '2026-12-23' - DATE '2026-12-20');  -- skip types with a missing night row\n```\nResult (empty hotel): `DLX 4`, `STD 6`. **Why `min`?** — if any night of the stay is zero, the whole stay is impossible.\n\n---\n\n## Lab 4 — Booking (the most important part)\n\nSteps: 1) **lock the nights in date order** (`FOR UPDATE ... ORDER BY stay_date`) → 2) count whether every night is free → 3) `sold + 1` → 4) reservation and rate snapshot → 5) outbox event. All in one transaction; if any step fails, everything rolls back.\n\n> **Why lock in date order?** If two bookings lock nights in different orders (A: 20→21, B: 21→20) they wait for each other and deadlock. Always the same order = no deadlock.\n\n```sql\n-- Lab 4: booking function (one transaction)\nCREATE OR REPLACE FUNCTION create_booking(\n  p_property int, p_guest int, p_room_type int, p_rate_plan int,\n  p_arrival date, p_departure date, p_adults int DEFAULT 2)\nRETURNS int LANGUAGE plpgsql AS $$\nDECLARE\n  v_nights int := p_departure - p_arrival;\n  v_locked int;\n  v_res_id int;\nBEGIN\n  -- 1) lock the nights in date order (always the same order to avoid deadlocks)\n  SELECT count(*) INTO v_locked FROM (\n    SELECT 1 FROM inventory_night\n    WHERE room_type_id = p_room_type AND stay_date >= p_arrival AND stay_date < p_departure\n      AND sold + out_of_order < total\n    ORDER BY stay_date\n    FOR UPDATE\n  ) x;\n  IF v_locked <> v_nights THEN\n    RAISE EXCEPTION 'NO_AVAILABILITY' USING ERRCODE = 'P0001';\n  END IF;\n\n  -- 2) decrement inventory\n  UPDATE inventory_night SET sold = sold + 1\n  WHERE room_type_id = p_room_type AND stay_date >= p_arrival AND stay_date < p_departure;\n\n  -- 3) reservation + rate snapshot\n  INSERT INTO reservation (property_id, confirmation, guest_id, room_type_id, rate_plan_id,\n                           arrival, departure, adults)\n  VALUES (p_property, 'DI' || to_char(now(),'YYMMDD') || '-' || lpad(nextval('confirmation_seq')::text, 5, '0'),\n          p_guest, p_room_type, p_rate_plan, p_arrival, p_departure, p_adults)\n  RETURNING id INTO v_res_id;\n\n  INSERT INTO reservation_night (reservation_id, stay_date, room_type_id, amount)\n  SELECT v_res_id, stay_date, room_type_id, amount FROM rate\n  WHERE rate_plan_id = p_rate_plan AND room_type_id = p_room_type\n    AND stay_date >= p_arrival AND stay_date < p_departure;\n  IF NOT FOUND THEN RAISE EXCEPTION 'RATE_MISSING'; END IF;\n\n  -- 4) event (same transaction — outbox pattern, doc 11 §6)\n  INSERT INTO outbox (topic, payload)\n  VALUES ('reservation.created', jsonb_build_object('reservation_id', v_res_id,\n          'room_type_id', p_room_type, 'arrival', p_arrival, 'departure', p_departure));\n  RETURN v_res_id;\nEND $$;\n```\n\n---\n\n## Lab 5 — Rate quote (with tax)\n\nIn the example SC is 10% (on the base price), then VAT 15% (on the price including SC, `compound = true`). **These are example rates for learning** — check real rates and order in docs 06 and 16 and with a VAT consultant.\n\n```sql\n-- Lab 5: rate quote (with tax)\nCREATE OR REPLACE FUNCTION quote_stay(p_rate_plan int, p_room_type int, p_arrival date, p_departure date)\nRETURNS TABLE (room_total numeric, sc numeric, vat numeric, grand_total numeric)\nLANGUAGE plpgsql AS $$\nDECLARE\n  v_nights int := p_departure - p_arrival;\n  v_found  int;\n  v_base   numeric;\n  v_running numeric;\n  v_tax    record;\nBEGIN\n  SELECT count(*), sum(amount) INTO v_found, v_base\n  FROM rate WHERE rate_plan_id = p_rate_plan AND room_type_id = p_room_type\n    AND stay_date >= p_arrival AND stay_date < p_departure;\n  IF v_found <> v_nights THEN RAISE EXCEPTION 'RATE_MISSING'; END IF;\n  room_total := v_base; v_running := v_base; sc := 0; vat := 0;\n  FOR v_tax IN SELECT t.* FROM tax t JOIN rate_plan rp ON rp.property_id = t.property_id\n               WHERE rp.id = p_rate_plan ORDER BY seq LOOP\n    IF v_tax.code = 'SC'  THEN sc  := round((CASE WHEN v_tax.compound THEN v_running ELSE v_base END) * v_tax.pct/100, 2); v_running := v_running + sc; END IF;\n    IF v_tax.code = 'VAT' THEN vat := round((CASE WHEN v_tax.compound THEN v_running ELSE v_base END) * v_tax.pct/100, 2); v_running := v_running + vat; END IF;\n  END LOOP;\n  grand_total := v_running;\n  RETURN NEXT;\nEND $$;\n\nSELECT * FROM quote_stay(1, 2, '2026-12-24', '2026-12-27');\n-- Deluxe, 24–27 December (Thu 6,000 + Fri 7,500 + Sat 7,500)\n-- room_total 21000.00 | sc 2100.00 | vat 3465.00 | grand_total 26565.00\n```\n\n---\n\n## Lab 6 — Check-in, payment, check-out\n\n```sql\n-- Lab 6a: check-in\nCREATE OR REPLACE FUNCTION check_in(p_res int, p_room int) RETURNS int\nLANGUAGE plpgsql AS $$\nDECLARE r reservation; v_bd date; v_folio int; v_room room;\nBEGIN\n  SELECT * INTO r FROM reservation WHERE id = p_res FOR UPDATE;\n  SELECT business_date INTO v_bd FROM property WHERE id = r.property_id;\n  IF r.status <> 'confirmed' THEN RAISE EXCEPTION 'INVALID_STATUS %', r.status; END IF;\n  IF r.arrival <> v_bd THEN RAISE EXCEPTION 'NOT_ARRIVAL_DAY'; END IF;\n  SELECT * INTO v_room FROM room WHERE id = p_room FOR UPDATE;\n  IF v_room.room_type_id <> r.room_type_id THEN RAISE EXCEPTION 'ROOM_TYPE_MISMATCH'; END IF;\n  IF v_room.hk_status NOT IN ('clean','inspected') THEN RAISE EXCEPTION 'ROOM_NOT_READY'; END IF;\n  -- the exclusion constraint raises an error on overlap by itself\n  INSERT INTO room_occupancy (room_id, reservation_id, stay)\n  VALUES (p_room, p_res, daterange(r.arrival, r.departure, '[)'));\n  UPDATE reservation SET status = 'in_house', room_id = p_room WHERE id = p_res;\n  INSERT INTO folio (reservation_id) VALUES (p_res) RETURNING id INTO v_folio;\n  INSERT INTO outbox (topic, payload) VALUES ('stay.checked_in',\n    jsonb_build_object('reservation_id', p_res, 'room', v_room.number));\n  RETURN v_folio;\nEND $$;\n\n-- Lab 6b: post a payment (idempotency key = source_ref)\nCREATE OR REPLACE FUNCTION post_payment(p_folio int, p_method text, p_amount numeric, p_key text)\nRETURNS void LANGUAGE plpgsql AS $$\nDECLARE v_bd date;\nBEGIN\n  SELECT p.business_date INTO v_bd FROM folio f JOIN reservation r ON r.id = f.reservation_id\n  JOIN property p ON p.id = r.property_id WHERE f.id = p_folio AND f.status = 'open';\n  IF v_bd IS NULL THEN RAISE EXCEPTION 'FOLIO_NOT_OPEN'; END IF;\n  INSERT INTO folio_line (folio_id, business_date, code, description, amount, source_ref)\n  VALUES (p_folio, v_bd, p_method, 'Payment', -abs(p_amount), 'PAY:' || p_key)\n  ON CONFLICT (folio_id, source_ref) DO NOTHING;\nEND $$;\n\n-- Lab 6c: check-out (balance must be zero)\nCREATE OR REPLACE FUNCTION check_out(p_res int) RETURNS void\nLANGUAGE plpgsql AS $$\nDECLARE r reservation; v_bal numeric; v_folio int;\nBEGIN\n  SELECT * INTO r FROM reservation WHERE id = p_res FOR UPDATE;\n  IF r.status <> 'in_house' THEN RAISE EXCEPTION 'INVALID_STATUS %', r.status; END IF;\n  SELECT f.id, coalesce(sum(fl.amount),0) INTO v_folio, v_bal\n  FROM folio f LEFT JOIN folio_line fl ON fl.folio_id = f.id\n  WHERE f.reservation_id = p_res AND f.status = 'open' GROUP BY f.id;\n  IF v_bal <> 0 THEN RAISE EXCEPTION 'BALANCE_NOT_ZERO %', v_bal; END IF;\n  UPDATE folio SET status = 'closed' WHERE id = v_folio;\n  UPDATE reservation SET status = 'checked_out' WHERE id = p_res;\n  UPDATE room SET hk_status = 'dirty' WHERE id = r.room_id;\n  INSERT INTO outbox (topic, payload) VALUES ('stay.checked_out', jsonb_build_object('reservation_id', p_res));\nEND $$;\n```\n\n**Notice:** calling `post_payment` twice with the same `p_key` does nothing the second time (`ON CONFLICT DO NOTHING`). The gateway transaction id or the client's `Idempotency-Key` header goes here.\n\n---\n\n## Lab 7 — Night audit\n\nSteps: lock the property → post today's room charge + tax for in-house guests (idempotent) → mark no-shows and release later nights' inventory → advance the business date → event.\n\n```sql\n-- Lab 7: Night audit (idempotent, one at a time per property)\nCREATE OR REPLACE FUNCTION run_night_audit(p_property int) RETURNS date\nLANGUAGE plpgsql AS $$\nDECLARE\n  v_bd date;\n  v_res record;\n  v_folio int;\n  v_base numeric; v_sc numeric; v_vat numeric;\nBEGIN\n  -- 1) lock the property: two parallel audits impossible\n  SELECT business_date INTO v_bd FROM property WHERE id = p_property FOR UPDATE;\n\n  -- 2) post today's room charge + tax (unique source_ref → once even if run twice)\n  FOR v_res IN\n    SELECT r.id, rn.amount FROM reservation r\n    JOIN reservation_night rn ON rn.reservation_id = r.id AND rn.stay_date = v_bd\n    WHERE r.property_id = p_property AND r.status = 'in_house'\n  LOOP\n    SELECT id INTO v_folio FROM folio WHERE reservation_id = v_res.id AND status = 'open';\n    v_base := v_res.amount;\n    v_sc   := round(v_base * 0.10, 2);           -- hard-coded for simplicity; really from the tax table\n    v_vat  := round((v_base + v_sc) * 0.15, 2);\n    INSERT INTO folio_line (folio_id, business_date, code, description, amount, source_ref) VALUES\n      (v_folio, v_bd, 'RM',  'Room charge',     v_base, 'RM:'  || v_res.id || ':' || v_bd),\n      (v_folio, v_bd, 'SC',  'Service charge',  v_sc,   'SC:'  || v_res.id || ':' || v_bd),\n      (v_folio, v_bd, 'VAT', 'VAT',             v_vat,  'VAT:' || v_res.id || ':' || v_bd)\n    ON CONFLICT (folio_id, source_ref) DO NOTHING;\n  END LOOP;\n\n  -- 3) No-show: due today, did not arrive → release inventory for later nights\n  -- (warning: in UPDATE ... FROM a target row matched several times is updated only once,\n  --  so we count with GROUP BY first)\n  UPDATE inventory_night i SET sold = i.sold - x.cnt\n  FROM (\n    SELECT r.room_type_id, rn.stay_date, count(*) AS cnt\n    FROM reservation r JOIN reservation_night rn ON rn.reservation_id = r.id\n    WHERE r.property_id = p_property AND r.status = 'confirmed' AND r.arrival = v_bd\n      AND rn.stay_date > v_bd\n    GROUP BY r.room_type_id, rn.stay_date\n  ) x\n  WHERE i.room_type_id = x.room_type_id AND i.stay_date = x.stay_date;\n  UPDATE reservation SET status = 'no_show'\n  WHERE property_id = p_property AND status = 'confirmed' AND arrival = v_bd;\n\n  -- 4) advance the business date\n  UPDATE property SET business_date = v_bd + 1 WHERE id = p_property;\n  INSERT INTO outbox (topic, payload) VALUES ('night_audit.completed',\n    jsonb_build_object('property_id', p_property, 'business_date', v_bd));\n  RETURN v_bd + 1;\nEND $$;\n```\n\n> **Why is the arrival night's inventory not released?** That night has passed — it can no longer be sold. A no-show charge (first night) can be posted in a separate step per policy (exercise 4).\n> **What about a crash?** The whole function is one transaction — if it fails halfway nothing changes; just run it again. In large hotels, if steps run in separate transactions, each step must be idempotent and record which steps are done (docs 09, 19 case 7).\n\n---\n\n## Lab 8 — Reports\n\n```sql\n-- Lab 8: daily KPIs (for one night)\nWITH n AS (SELECT DATE '2026-12-19' AS d),\ncap AS (SELECT sum(total - out_of_order) AS rooms_available FROM inventory_night, n WHERE stay_date = n.d),\nsold AS (\n  SELECT count(*) AS rooms_sold, coalesce(sum(rn.amount),0) AS room_revenue\n  FROM reservation_night rn JOIN reservation r ON r.id = rn.reservation_id, n\n  WHERE rn.stay_date = n.d AND r.status IN ('confirmed','in_house','checked_out'))\nSELECT rooms_available, rooms_sold,\n       round(100.0 * rooms_sold / rooms_available, 1)       AS occupancy_pct,\n       round(room_revenue / nullif(rooms_sold,0), 2)         AS adr,\n       round(room_revenue / rooms_available, 2)              AS revpar\nFROM cap, sold;\n-- result (example data): rooms_available 10 | rooms_sold 1 | occupancy_pct 10.0 | adr 5000.00 | revpar 500.00\n```\n\n---\n\n## Lab 9 — REST API (Node.js)\n\n```js\n// server.mjs — Mini PMS API (Node 20+, Express, pg)\nimport express from 'express';\nimport pg from 'pg';\n\nconst pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });\nconst app = express();\napp.use(express.json());\n\n// DB error → HTTP status\nconst ERR = { NO_AVAILABILITY: 409, RATE_MISSING: 422, ROOM_NOT_READY: 409,\n              BALANCE_NOT_ZERO: 409, INVALID_STATUS: 409, NOT_ARRIVAL_DAY: 409 };\nfunction fail(res, e) {\n  if (e.code === '23P01') return res.status(409).json({ error: 'ROOM_ALREADY_OCCUPIED' }); // exclusion\n  const key = Object.keys(ERR).find(k => e.message?.startsWith(k));\n  if (key) return res.status(ERR[key]).json({ error: key, detail: e.message });\n  console.error(e); res.status(500).json({ error: 'INTERNAL' });\n}\n\napp.get('/v1/availability', async (req, res) => {\n  const { property, arrival, departure } = req.query;\n  try {\n    const { rows } = await pool.query(`\n      SELECT rt.code, min(i.total - i.sold - i.out_of_order) AS available\n      FROM inventory_night i JOIN room_type rt ON rt.id = i.room_type_id\n      WHERE rt.property_id = $1 AND i.stay_date >= $2 AND i.stay_date < $3\n      GROUP BY rt.code HAVING count(*) = ($3::date - $2::date)`, [property, arrival, departure]);\n    res.json(rows);\n  } catch (e) { fail(res, e); }\n});\n\napp.post('/v1/reservations', async (req, res) => {\n  const { propertyId, guestId, roomTypeId, ratePlanId, arrival,
